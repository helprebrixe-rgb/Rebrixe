        }

        }

            font-weight: 700;

            text-transform: uppercase;

            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .platform-btn:hover {
            border-color: rgba(255, 20, 147, 0.4);

        }

        .platform-btn.active {

        }

            resize: none;
            overflow: hidden;

            line-height: 1.4;
            box-sizing: border-box;
            display: block;
        }

            border-color: #ff1493;
        }

            color: rgba(255,255,255,0.18);
        }

        }

            border-radius: 12px;
            font-family: 'Outfit';
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.1);
            min-width: 220px;
            position: relative;
            overflow: hidden;
        }

        .btn-forge:hover:not(:disabled) {
            background: #ff1493;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.4);
            transform: translateY(-2px);
        }

        .btn-forge:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-forge .btn-text { display: inline-block; }
        .btn-forge .btn-loading { display: none; }

        .btn-forge.generating .btn-text { display: none; }
        .btn-forge.generating .btn-loading { display: inline-block; }

        /* LOADING DOTS */
        .dot-pulse {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }
        .dot-pulse span {
            width: 6px; height: 6px;
            background: #ff1493;
            border-radius: 50%;
            display: inline-block;
            animation: dp 1.2s ease-in-out infinite;
        }
        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dp {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* JOURNEY TRACK */
        .story-track {
            max-width: 700px;
            margin: 50px auto 100px auto;
            position: relative;
            padding: 0 20px;
        }

        .story-track::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 30px;
            width: 1px;
            background: linear-gradient(to bottom, #ff1493 0%, rgba(255,20,147,0.15) 80%, transparent 100%);
            transform: translateX(-50%);
            pointer-events: none;
        }

            justify-content: space-between;

            padding: 14px 24px;
            background: rgba(255, 20, 147, 0.05);
            border: 1px solid rgba(255, 20, 147, 0.15);

            flex-wrap: wrap;

            color: #64748b;

            opacity: 0;
            transform: translateY(30px);

            gap: 10px;

            bottom: 30px;
            left: 50%;

        // ─────────────────────────────────────────────
        // STATE
        // ─────────────────────────────────────────────
        let currentPlatform = 'general';
        let currentStageData = []; // stores { stageIndex, optionIndex }

        // ─────────────────────────────────────────────
        // PLATFORM SELECTION
        // ─────────────────────────────────────────────
        function selectPlatform(btn) {
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPlatform = btn.dataset.platform;
        }

        // ─────────────────────────────────────────────
        // TEXTAREA AUTO-EXPAND
        // ─────────────────────────────────────────────
        const textarea = document.getElementById('storyTopic');
        textarea.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateJourney();
            }
        });

        // ─────────────────────────────────────────────
        // GENERATE JOURNEY
        // ─────────────────────────────────────────────
        function generateJourney() {
            const topic = textarea.value.trim();

            if (!topic) {
                const hint = document.getElementById('inputHint');
                hint.classList.add('visible');
                textarea.focus();
                setTimeout(() => hint.classList.remove('visible'), 2500);
                return;
            }

            const btn = document.getElementById('forgeBtn');
            btn.classList.add('generating');
            btn.disabled = true;

            const stages = db[currentPlatform];
            const container = document.getElementById('journeyTrack');
            container.innerHTML = '';
            document.getElementById('actionBar').classList.remove('visible');

            currentStageData = stages.map((stage, i) => ({
                stageIndex: i,
                optionIndex: Math.floor(Math.random() * stage.options.length)
            }));

            // Render cards immediately (empty), then typewrite content
            currentStageData.forEach(({ stageIndex, optionIndex }, cardIndex) => {
                const stage = stages[stageIndex];
                const rawText = stage.options[optionIndex].replace(/\[TOPIC\]/g, topic);

                const step = document.createElement('div');
                step.className = 'story-step';
                step.dataset.stageIndex = stageIndex;
                step.dataset.optionIndex = optionIndex;
                step.innerHTML = buildStepHTML(stage.label, '', stageIndex);
                container.appendChild(step);

                // Staggered reveal
                setTimeout(() => {
                    step.classList.add('visible');
                    const contentEl = step.querySelector('.step-content');
                    typewrite(contentEl, rawText, () => {
                        updateStepWordCount(step, rawText);
                        // After all steps done, show action bar
                        if (cardIndex === currentStageData.length - 1) {
                            updateActionBar();
                            document.getElementById('actionBar').classList.add('visible');
                            btn.classList.remove('generating');
                            btn.disabled = false;
                        }
                    });
                }, cardIndex * 180);
            });

            // Smooth scroll
            setTimeout(() => {
                document.getElementById('actionBar').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

        // ─────────────────────────────────────────────
        // BUILD STEP HTML
        // ─────────────────────────────────────────────
        function buildStepHTML(label, content, stageIndex) {
            return `
                <div class="step-card">
                    <div class="step-card-top">
                        <span class="step-badge">${label}</span>
                    </div>
                    <div class="step-content">${content}</div>
                    <div class="step-footer">
                        <span class="step-word-count"></span>
                        <div class="step-btn-group">
                            <button class="btn-step-action" onclick="regenStep(this, ${stageIndex})">↺ Regenerate</button>
                            <button class="btn-step-action" onclick="copyStep(this)">Copy</button>
                        </div>
                    </div>
                </div>`;
        }

        // ─────────────────────────────────────────────
        // TYPEWRITER EFFECT (AI Illusion)
        // ─────────────────────────────────────────────
        function typewrite(el, text, onDone) {
            el.innerHTML = '<span class="cursor"></span>';
            let i = 0;
            const cursor = el.querySelector('.cursor');
            const speed = Math.max(8, Math.min(22, Math.round(2200 / text.length)));

            const tick = () => {
                if (i < text.length) {
                    cursor.insertAdjacentText('beforebegin', text[i]);
                    i++;
                    setTimeout(tick, speed);
                } else {
                    cursor.remove();
                    if (onDone) onDone();
                }
            };
            tick();
        }

        // ─────────────────────────────────────────────
        // REGENERATE A SINGLE STEP
        // ─────────────────────────────────────────────
        function regenStep(btn, stageIndex) {
            const topic = textarea.value.trim();
            if (!topic) return;

            const stages = db[currentPlatform];
            const stage = stages[stageIndex];

            // Pick a different option
            let newOptionIndex;
            const oldOptionIndex = currentStageData[stageIndex].optionIndex;
            do {
                newOptionIndex = Math.floor(Math.random() * stage.options.length);
            } while (newOptionIndex === oldOptionIndex && stage.options.length > 1);

            currentStageData[stageIndex].optionIndex = newOptionIndex;

            const step = btn.closest('.story-step');
            const contentEl = step.querySelector('.step-content');
            const newText = stage.options[newOptionIndex].replace(/\[TOPIC\]/g, topic);

            btn.disabled = true;
            btn.textContent = '...';

            contentEl.innerHTML = '';
            typewrite(contentEl, newText, () => {
                updateStepWordCount(step, newText);
                updateActionBar();
                btn.disabled = false;
                btn.textContent = '↺ Regenerate';
            });
        }

        // ─────────────────────────────────────────────
        // COPY SINGLE STEP
        // ─────────────────────────────────────────────
        function copyStep(btn) {
            const text = btn.closest('.step-card').querySelector('.step-content').innerText.trim();
            navigator.clipboard.writeText(text).then(() => {
                btn.classList.add('copied');
                btn.textContent = 'Copied ✓';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = 'Copy';
                }, 1500);
            });
        }

        // ─────────────────────────────────────────────
        // COPY ALL STEPS
        // ─────────────────────────────────────────────
        function copyAll() {
            const stages = db[currentPlatform];
            const steps = document.querySelectorAll('.story-step');
            const lines = [];

            steps.forEach((step, i) => {
                const label = step.querySelector('.step-badge').innerText;
                const content = step.querySelector('.step-content').innerText.trim();
                lines.push(`${label}\n${content}`);
            });

            const fullText = lines.join('\n\n---\n\n');
            navigator.clipboard.writeText(fullText).then(() => showToast('Full narrative copied!'));
        }

        // ─────────────────────────────────────────────
        // WORD COUNT HELPERS
        // ─────────────────────────────────────────────
        function countWords(text) {
            return text.trim().split(/\s+/).filter(Boolean).length;
        }

        function updateStepWordCount(step, text) {
            const wc = countWords(text);
            const cc = text.length;
            step.querySelector('.step-word-count').textContent = `${wc}w · ${cc}c`;
        }

        function updateActionBar() {
            const steps = document.querySelectorAll('.step-content');
            let totalW = 0, totalC = 0;
            steps.forEach(el => {
                const t = el.innerText.trim();
                totalW += countWords(t);
                totalC += t.length;
            });
            document.getElementById('totalWords').textContent = totalW;
            document.getElementById('totalChars').textContent = totalC;
        }

        // ─────────────────────────────────────────────
        // TOAST
        // ─────────────────────────────────────────────
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }
    </script>
    <script src="../nav.js"></script>
</body>
