<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Text Generator | Rebrixe</title>
    <meta name="description" content="Instantly convert any text into 15+ viral Gen Z aesthetic fonts — bold, script, gothic, bubble, flipped & more. One-click copy. Free & instant.">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/main-style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <style>
        * { box-sizing: border-box; }

        /* ── Input area ── */
        .input-wrapper {
            width: 100%;
            max-width: 660px;
            margin: 0 auto 14px auto;
            position: relative;
        }
        #userInput {
            width: 100%;
            background: var(--glass);
            border: 2px solid var(--border);
            color: white;
            padding: 20px 56px 20px 22px;
            border-radius: 15px;
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            caret-color: var(--primary);
        }
        #userInput::placeholder { color: #4a5568; }
        #userInput:focus {
            border-color: var(--primary);
            box-shadow: 0 0 22px rgba(255, 0, 127, 0.18);
        }
        .clear-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #4a5568;
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            padding: 4px;
            transition: color 0.2s;
            display: none;
        }
        .clear-btn:hover { color: #a0aec0; }
        .clear-btn.visible { display: block; }

        /* ── Filter bar ── */
        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 660px;
            margin: 0 auto 32px auto;
        }
        .filter-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: #64748b;
            padding: 6px 16px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 0.03em;
        }
        .filter-btn:hover { border-color: #475569; color: #cbd5e1; }
        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* ── Grid ── */
        .vibe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* ── Card ── */
        .vibe-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .vibe-card:hover {
            border-color: var(--primary);
            background: rgba(255,255,255,0.025);
        }
        .vibe-card:active { transform: scale(0.98); }
        .vibe-card.copied {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.04);
        }

        /* Fav star */
        .fav-star {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 0.85rem;
            color: #2d3748;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            z-index: 2;
            background: none;
            border: none;
            padding: 2px;
            line-height: 1;
        }
        .fav-star:hover { color: #f59e0b; transform: scale(1.2); }
        .fav-star.active { color: #f59e0b; }

        .vibe-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.7rem;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 22px;
        }
        .vibe-label .tag {
            font-size: 0.6rem;
            background: rgba(255, 0, 127, 0.12);
            color: var(--primary);
            border-radius: 4px;
            padding: 1px 5px;
        }

        .vibe-output {
            font-size: 1.3rem;
            color: white;
            min-height: 1.6em;
            line-height: 1.5;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* Copy flash */
        .copy-flash {
            position: absolute;
            inset: 0;
            background: rgba(34, 197, 94, 0.08);
            border-radius: 16px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .vibe-card.copied .copy-flash { opacity: 1; }

        /* Copy pill that appears on hover */
        .copy-hint {
            position: absolute;
            bottom: 14px;
            right: 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: #64748b;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .vibe-card:hover .copy-hint { opacity: 1; }
        .vibe-card.copied .copy-hint {
            opacity: 1;
            color: #22c55e;
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.08);
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            color: #4a5568;
            padding: 40px 20px;
            grid-column: 1/-1;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }

        /* ── Toolbar (copy all / count) ── */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 660px;
            margin: 0 auto 20px auto;
            gap: 12px;
            flex-wrap: wrap;
        }
        .result-count {
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            color: #4a5568;
        }
        .result-count span { color: #94a3b8; }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            padding: 10px 22px;
            border-radius: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 9999;
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 540px) {
            .vibe-grid { grid-template-columns: 1fr; }
            .vibe-output { font-size: 1.15rem; }
            .toolbar { justify-content: center; }
        }
    </style>
</head>
<body data-theme="growth">
    <nav class="nav-container"></nav>

    <div class="container">
        <a href="visual-layout.html" class="back-btn">← Back to tools</a>

        <section class="tool-card">
            <h1>Vibe Text Generator</h1>
            <p>Type anything — get 15+ viral fonts instantly. Tap any card to copy.</p>

            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="type something..." oninput="onInput()" maxlength="200" autocomplete="off" spellcheck="false">
                <button class="clear-btn" id="clearBtn" onclick="clearInput()" title="Clear">✕</button>
            </div>

            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
                <button class="filter-btn" data-filter="math" onclick="setFilter('math', this)">Math Fonts</button>
                <button class="filter-btn" data-filter="special" onclick="setFilter('special', this)">Special</button>
                <button class="filter-btn" data-filter="fun" onclick="setFilter('fun', this)">Fun</button>
                <button class="filter-btn" data-filter="fav" onclick="setFilter('fav', this)">★ Favorites</button>
            </div>

            <div class="toolbar">
                <div class="result-count" id="resultCount"><span>0</span> styles</div>
            </div>

            <div class="vibe-grid" id="vibeGrid"></div>
        </section>
    </div>

    <div id="toast"></div>

    <script>
    // ── Unicode offset map ──────────────────────────────────────────────────
    const OFFSETS = {
        "Bold Serif":        { upper: 0x1D400, lower: 0x1D41A },
        "Italic Serif":      { upper: 0x1D434, lower: 0x1D44E },
        "Bold Italic Serif": { upper: 0x1D468, lower: 0x1D482 },
        "Bold Sans":         { upper: 0x1D5D4, lower: 0x1D5EE },
        "Italic Sans":       { upper: 0x1D608, lower: 0x1D622 },
        "Bold Italic Sans":  { upper: 0x1D63C, lower: 0x1D656 },
        "Gothic":            { upper: 0x1D504, lower: 0x1D51E },
        "Bold Gothic":       { upper: 0x1D56C, lower: 0x1D586 },
        "Double Struck":     { upper: 0x1D538, lower: 0x1D552 },
        "Mono":              { upper: 0x1D670, lower: 0x1D68A },
        "Script":            { upper: 0x1D49C, lower: 0x1D4B6 },
        "Bold Script":       { upper: 0x1D4D0, lower: 0x1D4EA },
    };

    // Script exceptions (letterlike symbols block fills the gaps)
    const SCRIPT_UPPER_EX = { B:0x212C, E:0x2130, F:0x2131, H:0x210B, I:0x2110, L:0x2112, M:0x2133, R:0x211B };
    const SCRIPT_LOWER_EX = { e:0x212F, g:0x210A, o:0x2134 };
    // Gothic exceptions
    const GOTHIC_UPPER_EX = { C:'C', H:0x210C, I:0x2111, R:0x211C, Z:0x2128 };

    // Small caps map
    const SMALL_CAPS = {a:'ᴀ',b:'ʙ',c:'ᴄ',d:'ᴅ',e:'ᴇ',f:'ꜰ',g:'ɢ',h:'ʜ',i:'ɪ',j:'ᴊ',k:'ᴋ',l:'ʟ',m:'ᴍ',n:'ɴ',o:'ᴏ',p:'ᴘ',q:'q',r:'ʀ',s:'ꜱ',t:'ᴛ',u:'ᴜ',v:'ᴠ',w:'ᴡ',x:'x',y:'ʏ',z:'ᴢ'};

    // Superscript map
    const SUPERSCRIPT = {a:'ᵃ',b:'ᵇ',c:'ᶜ',d:'ᵈ',e:'ᵉ',f:'ᶠ',g:'ᵍ',h:'ʰ',i:'ⁱ',j:'ʲ',k:'ᵏ',l:'ˡ',m:'ᵐ',n:'ⁿ',o:'ᵒ',p:'ᵖ',q:'q',r:'ʳ',s:'ˢ',t:'ᵗ',u:'ᵘ',v:'ᵛ',w:'ʷ',x:'ˣ',y:'ʸ',z:'ᶻ'};

    // Flip / upside-down map
    const FLIP = {
        a:'ɐ',b:'q',c:'ɔ',d:'p',e:'ǝ',f:'ɟ',g:'ƃ',h:'ɥ',i:'ᴉ',j:'ɾ',k:'ʞ',l:'l',
        m:'ɯ',n:'u',o:'o',p:'d',q:'b',r:'ɹ',s:'s',t:'ʇ',u:'n',v:'ʌ',w:'ʍ',x:'x',y:'ʎ',z:'z',
        A:'∀',B:'ᗺ',C:'Ɔ',D:'ᗡ',E:'Ǝ',F:'Ⅎ',G:'⅁',H:'H',I:'I',J:'ſ',K:'ʞ',L:'⅂',M:'W',
        N:'N',O:'O',P:'Ԁ',Q:'Q',R:'ᴚ',S:'S',T:'⊥',U:'∩',V:'Λ',W:'M',X:'X',Y:'⅄',Z:'Z',
        '0':'0','1':'Ɩ','2':'ᄅ','3':'Ɛ','4':'ᔭ','5':'ϛ','6':'9','7':'ʌ','8':'8','9':'6',
        ',':'\'','.':'˙','?':'¿','!':'¡'
    };

    // Zalgo accent chars (kept light/readable)
    const Z_UP   = ['\u0300','\u0301','\u0302','\u0303','\u0308','\u030A'];
    const Z_DOWN  = ['\u0332','\u0323','\u0325','\u0327'];

    // ── Style definitions ──────────────────────────────────────────────────
    const STYLES = [
        // Math Fonts
        { id: 'bold-serif',        label: 'Bold Serif',        category: 'math', fn: t => mathFont(t, 'Bold Serif') },
        { id: 'italic-serif',      label: 'Italic Serif',      category: 'math', fn: t => mathFont(t, 'Italic Serif') },
        { id: 'bold-italic-serif', label: 'Bold Italic Serif', category: 'math', fn: t => mathFont(t, 'Bold Italic Serif') },
        { id: 'bold-sans',         label: 'Bold Sans',         category: 'math', fn: t => mathFont(t, 'Bold Sans') },
        { id: 'italic-sans',       label: 'Italic Sans',       category: 'math', fn: t => mathFont(t, 'Italic Sans') },
        { id: 'bold-italic-sans',  label: 'Bold Italic Sans',  category: 'math', fn: t => mathFont(t, 'Bold Italic Sans') },
        { id: 'gothic',            label: 'Gothic',            category: 'math', fn: t => gothicFont(t) },
        { id: 'bold-gothic',       label: 'Bold Gothic',       category: 'math', fn: t => mathFont(t, 'Bold Gothic') },
        { id: 'double-struck',     label: 'Double Struck',     category: 'math', fn: t => mathFont(t, 'Double Struck') },
        { id: 'mono',              label: 'Monospace',         category: 'math', fn: t => mathFont(t, 'Mono') },
        { id: 'script',            label: 'Cursive Script',    category: 'math', fn: t => scriptFont(t) },
        { id: 'bold-script',       label: 'Bold Script',       category: 'math', fn: t => mathFont(t, 'Bold Script') },
        // Special
        { id: 'small-caps',    label: 'Small Caps',       category: 'special', tag: 'clean', fn: t => smallCaps(t) },
        { id: 'superscript',   label: 'Superscript',      category: 'special', fn: t => superscript(t) },
        { id: 'fullwidth',     label: 'Fullwidth / Wide', category: 'special', tag: 'vaporwave', fn: t => fullwidth(t) },
        { id: 'bubble',        label: 'Bubble / Circled', category: 'special', fn: t => bubble(t) },
        { id: 'neg-squared',   label: 'Negative Squared', category: 'special', tag: 'bold', fn: t => negSquared(t) },
        // Fun
        { id: 'strikethrough', label: 'Strikethrough',    category: 'fun', fn: t => combining(t, '\u0336') },
        { id: 'underline',     label: 'Underline',        category: 'fun', fn: t => combining(t, '\u0332') },
        { id: 'double-under',  label: 'Double Underline', category: 'fun', fn: t => combining(t, '\u0333') },
        { id: 'spaced',        label: 'Spaced Out',       category: 'fun', fn: t => t.split('').join('  ') },
        { id: 'dot-spaced',    label: 'Dot Spaced',       category: 'fun', tag: 'aesthetic', fn: t => t.split('').join(' · ') },
        { id: 'upside-down',   label: 'Upside Down',      category: 'fun', fn: t => upsideDown(t) },
        { id: 'zalgo',         label: 'Glitch / Zalgo',   category: 'fun', tag: 'creepy', fn: t => zalgo(t) },
    ];

    // ── Converters ────────────────────────────────────────────────────────
    function mathFont(text, style) {
        const { upper, lower } = OFFSETS[style];
        return text.split('').map(ch => {
            const c = ch.charCodeAt(0);
            if (c >= 65 && c <= 90) return String.fromCodePoint(upper + c - 65);
            if (c >= 97 && c <= 122) return String.fromCodePoint(lower + c - 97);
            return ch;
        }).join('');
    }

    function scriptFont(text) {
        const { upper, lower } = OFFSETS['Script'];
        return text.split('').map(ch => {
            const c = ch.charCodeAt(0);
            if (c >= 65 && c <= 90) {
                return SCRIPT_UPPER_EX[ch] ? String.fromCodePoint(SCRIPT_UPPER_EX[ch]) : String.fromCodePoint(upper + c - 65);
            }
            if (c >= 97 && c <= 122) {
                return SCRIPT_LOWER_EX[ch] ? String.fromCodePoint(SCRIPT_LOWER_EX[ch]) : String.fromCodePoint(lower + c - 97);
            }
            return ch;
        }).join('');
    }

    function gothicFont(text) {
        const { upper, lower } = OFFSETS['Gothic'];
        return text.split('').map(ch => {
            const c = ch.charCodeAt(0);
            if (c >= 65 && c <= 90) {
                const ex = GOTHIC_UPPER_EX[ch];
                if (ex === null || ex === ch) return ch; // unassigned C fallback
                if (typeof ex === 'number') return String.fromCodePoint(ex);
                return String.fromCodePoint(upper + c - 65);
            }
            if (c >= 97 && c <= 122) return String.fromCodePoint(lower + c - 97);
            return ch;
        }).join('');
    }

    function smallCaps(text) {
        return text.toLowerCase().split('').map(ch => SMALL_CAPS[ch] || ch).join('');
    }

    function superscript(text) {
        return text.toLowerCase().split('').map(ch => SUPERSCRIPT[ch] || ch).join('');
    }

    function fullwidth(text) {
        return text.split('').map(ch => {
            const c = ch.charCodeAt(0);
            if (c === 32) return '\u3000';
            if (c >= 33 && c <= 126) return String.fromCodePoint(c + 0xFEE0);
            return ch;
        }).join('');
    }

    function bubble(text) {
        return text.split('').map(ch => {
            const c = ch.charCodeAt(0);
            if (c >= 65 && c <= 90) return String.fromCodePoint(0x24B6 + c - 65);
            if (c >= 97 && c <= 122) return String.fromCodePoint(0x24D0 + c - 97);
            if (c >= 49 && c <= 57) return String.fromCodePoint(0x2460 + c - 49);
            if (c === 48) return '\u24EA';
            return ch;
        }).join('');
    }

    function negSquared(text) {
        return text.toUpperCase().split('').map(ch => {
            const c = ch.charCodeAt(0);
            if (c >= 65 && c <= 90) return String.fromCodePoint(0x1F170 + c - 65);
            return ch;
        }).join('');
    }

    function combining(text, mark) {
        return text.split('').map(ch => ch === ' ' ? ch : ch + mark).join('');
    }

    function upsideDown(text) {
        return text.split('').map(ch => FLIP[ch] || ch).reverse().join('');
    }

    function zalgo(text) {
        return text.split('').map(ch => {
            if (ch === ' ') return ch;
            return ch + Z_UP[Math.floor(Math.random() * Z_UP.length)]
                       + Z_DOWN[Math.floor(Math.random() * Z_DOWN.length)];
        }).join('');
    }

    // ── State ─────────────────────────────────────────────────────────────
    let currentFilter = 'all';
    let favorites = [];

    try { favorites = JSON.parse(localStorage.getItem('Rebrixe_fav_styles') || '[]'); } catch(e){}

    function saveFavorites() {
        try { localStorage.setItem('Rebrixe_fav_styles', JSON.stringify(favorites)); } catch(e){}
    }

    // ── UI helpers ────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
    }

    function onInput() {
        const val = document.getElementById('userInput').value;
        document.getElementById('clearBtn').classList.toggle('visible', val.length > 0);
        renderGrid();
    }

    function clearInput() {
        document.getElementById('userInput').value = '';
        document.getElementById('clearBtn').classList.remove('visible');
        renderGrid();
        document.getElementById('userInput').focus();
    }

    function toggleFav(id, starEl) {
        const idx = favorites.indexOf(id);
        if (idx === -1) {
            favorites.push(id);
            starEl.classList.add('active');
            starEl.title = 'Remove from favorites';
        } else {
            favorites.splice(idx, 1);
            starEl.classList.remove('active');
            starEl.title = 'Add to favorites';
        }
        saveFavorites();
        // If we're on the fav filter, re-render
        if (currentFilter === 'fav') renderGrid();
    }

    // ── Core render ───────────────────────────────────────────────────────
    function renderGrid() {
        const raw   = document.getElementById('userInput').value.trim();
        const input = raw || 'aesthetic';
        const grid  = document.getElementById('vibeGrid');

        const visible = STYLES.filter(s => {
            if (currentFilter === 'all')    return true;
            if (currentFilter === 'fav')    return favorites.includes(s.id);
            return s.category === currentFilter;
        });

        document.getElementById('resultCount').innerHTML =
            `<span>${visible.length}</span> style${visible.length !== 1 ? 's' : ''}`;

        if (visible.length === 0) {
            grid.innerHTML = '<div class="empty-state">No styles here yet — tap ★ on any card to save favorites.</div>';
            return;
        }

        // Build all cards, reuse existing DOM nodes where possible
        const fragment = document.createDocumentFragment();

        visible.forEach(style => {
            const outputText = style.fn(input);
            const isFav = favorites.includes(style.id);

            const card = document.createElement('div');
            card.className = 'vibe-card';
            card.dataset.id = style.id;

            const labelHTML = style.tag
                ? `${style.label} <span class="tag">${style.tag}</span>`
                : style.label;

            card.innerHTML = `
                <div class="copy-flash"></div>
                <button class="fav-star${isFav ? ' active' : ''}" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}" aria-label="Favorite">★</button>
                <div class="vibe-label">${labelHTML}</div>
                <div class="vibe-output">${escapeHTML(outputText)}</div>
                <div class="copy-hint">click to copy</div>
            `;

            const starBtn = card.querySelector('.fav-star');
            starBtn.addEventListener('click', e => {
                e.stopPropagation();
                toggleFav(style.id, starBtn);
            });

            card.addEventListener('click', () => copyStyle(card, outputText, style.label));

            fragment.appendChild(card);
        });

        grid.innerHTML = '';
        grid.appendChild(fragment);
    }

    function copyStyle(cardEl, text, label) {
        navigator.clipboard.writeText(text).then(() => {
            cardEl.classList.add('copied');
            const hint = cardEl.querySelector('.copy-hint');
            if (hint) hint.textContent = '✓ copied!';
            showToast('✓ Copied ' + label);
            setTimeout(() => {
                cardEl.classList.remove('copied');
                if (hint) hint.textContent = 'click to copy';
            }, 1400);
        }).catch(() => {
            // Fallback for older Safari
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try { document.execCommand('copy'); showToast('✓ Copied ' + label); } catch(e){}
            document.body.removeChild(ta);
        });
    }

    function escapeHTML(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Init ──────────────────────────────────────────────────────────────
    renderGrid();
