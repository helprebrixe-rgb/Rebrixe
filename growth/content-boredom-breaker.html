        /* ── SLOT MACHINE WRAPPER ── */
        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 40px 0 28px;
        }

        .reel-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .reel-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* ── WINDOW / VIEWPORT ── */
        .reel-container {
            width: 100%;
            height: 90px;
            overflow: hidden;
            background: var(--glass);
            border: 2px solid var(--border);
            border-radius: 14px;
            position: relative;
        }

        /* top + bottom fade masks */
        .reel-container::before,
        .reel-container::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 28px;
            z-index: 2;
            pointer-events: none;
        }
        .reel-container::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(10,10,20,0.85), transparent);
            border-radius: 12px 12px 0 0;
        }
        .reel-container::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(10,10,20,0.85), transparent);
            border-radius: 0 0 12px 12px;
        }

        /* highlight line in the center */
        .reel-container .center-line {
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            transform: translateY(-50%);
            height: 2px;
            background: var(--primary);
            opacity: 0.35;
            z-index: 3;
            pointer-events: none;
        }

        /* ── THE SCROLLING STRIP ── */
        .reel-strip {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .reel-strip.spinning .slot-item {
            filter: blur(3px);
        }

        .slot-item {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 0.78rem;
            color: #fff;
            text-transform: uppercase;
            line-height: 1.2;
            transition: filter 0.3s ease;
            user-select: none;
        }

        /* ── BUTTONS ROW ── */
        .btn-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .generator-btn {
            width: 100%;
            max-width: 400px;
            display: block;
            background: linear-gradient(45deg, var(--primary), #ff00ff);
            color: white;
            border: none;
            padding: 18px 28px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 30px var(--glow);
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2.5s infinite;
            transition: opacity 0.2s, transform 0.1s;
            font-family: 'Outfit', sans-serif;
        }
        .generator-btn:active { transform: scale(0.97); }
        .generator-btn:disabled { opacity: 0.55; cursor: not-allowed; animation: none; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 30px var(--glow); }
            60%       { transform: scale(1.018); box-shadow: 0 0 28px var(--primary); }
        }

        /* ── PLATFORM PILLS ── */
        .platform-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 0 0 32px;
        }
        .platform-pill {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 6px 16px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .platform-pill.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 14px var(--glow);
        }

        /* ── IDEA CARD ── */
        .idea-card {
            background: rgba(255,255,255,0.03);
            border: 1px dashed var(--border);
            border-radius: 20px;

            cta:       "Ask for one action only: save, share, or comment a keyword.",
            repurpose: "Turn this into a carousel + a short-form clip + a thread."
        },
        youtube: {
            thumbnail: "Face + emotion + bright background. A/B test 2 thumbnails in the first 48 hrs.",
            hook:      "First 30 seconds must deliver or tease the core promise — no intros.",
            cta:       "Ask viewers to 'comment your biggest struggle with [topic]' to boost engagement.",
            repurpose: "Pull a 60-second clip for Shorts. Take the transcript and turn it into a blog."
        },
        instagram: {
            thumbnail: "Reels cover: bold font, face reaction or before/after still frame.",
            hook:      "Caption first line must stop the scroll — use a number or bold claim.",
            cta:       "Add 'Save this for later' in the caption + story polls to amplify reach.",
            repurpose: "Post as a Carousel, then Stories with sticker polls, then a Reel summary."
        },
        linkedin: {
            thumbnail: "Native documents (carousels) outperform images 3x — lead with slide 1 as a hook.",
            hook:      "Start your post with a contrarian single-line statement. No preamble.",
            cta:       "End with: 'Agree or disagree? I'll reply to every comment today.'",
            repurpose: "Turn the post into a LinkedIn Newsletter article for evergreen reach."
        },
        tiktok: {
            thumbnail: "Use text overlay in first frame. Hook word in bold uppercase.",
            hook:      "Speak or show the punchline in the FIRST second. No build-up.",
            cta:       "Reply to top comment with a follow-up video — algorithm loves video replies.",
            repurpose: "Cross-post to Instagram Reels and YouTube Shorts within 24 hours."
        },
        twitter: {
            thumbnail: "If using an image, make it landscape with bold text — no stock photos.",
            hook:      "First tweet must be a standalone atomic insight. The thread expands it.",
            cta:       "End thread with: 'RT the first tweet if this was useful' — works better than 'Follow me'.",
            repurpose: "Turn the thread into a LinkedIn post, a newsletter section, or a Notion template."
        }
    };

    /* ═══════════════════════════════════════════════════════
       STATE
    ═══════════════════════════════════════════════════════ */
    let isSpinning   = false;
    let spinCount    = 0;
    let activePlatform = 'all';
    let savedIdeas   = [];
    let lastResult   = null;

    /* ═══════════════════════════════════════════════════════
       PLATFORM PILLS
    ═══════════════════════════════════════════════════════ */
    document.getElementById('platformRow').addEventListener('click', e => {
        const pill = e.target.closest('.platform-pill');
        if (!pill) return;
        document.querySelectorAll('.platform-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        activePlatform = pill.dataset.platform;
    });

    /* ═══════════════════════════════════════════════════════
       CORE SPIN LOGIC
    ═══════════════════════════════════════════════════════ */
    function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function spinIt() {
        if (isSpinning) return;
        isSpinning = true;
        spinCount++;

        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        btn.textContent = 'Spinning…';

        // Hide card immediately
        const card = document.getElementById('ideaCard');
        card.classList.remove('visible');

        // Pre-pick final values BEFORE animation
        const finalFormat = pick(db.formats);
        const finalTopic  = pick(db.topics);
        const finalAngle  = pick(db.angles);

        // Build and animate each strip
        buildStrip('reel1-strip', db.formats, finalFormat);
        buildStrip('reel2-strip', db.topics,  finalTopic);
        buildStrip('reel3-strip', db.angles,  finalAngle);

        setTimeout(() => {
            renderResult(finalFormat, finalTopic, finalAngle);
            btn.disabled = false;
            btn.textContent = 'Spin Again ⚡';
            isSpinning = false;

            const counter = document.getElementById('spinCounter');
            counter.style.display = 'block';
            document.getElementById('spinNum').textContent = spinCount;
        }, 1700);
    }

    function buildStrip(stripId, items, finalValue) {
        const strip = document.getElementById(stripId);

        // Reset without transition
        strip.style.transition = 'none';
        strip.style.transform  = 'translateY(0)';
        strip.classList.add('spinning');
        void strip.offsetWidth; // force reflow

        // Build STRIP_LENGTH random items + the final one at the end
        let html = '';
        for (let i = 0; i < STRIP_LENGTH; i++) {
            html += `<div class="slot-item">${pick(items)}</div>`;
        }
        // The landing item — at index STRIP_LENGTH (0-based)
        html += `<div class="slot-item landing">${finalValue}</div>`;
        strip.innerHTML = html;

        // Animate: translate so the LANDING item centres in the 90px window
        // Each item = ITEM_HEIGHT px. Landing item is at index STRIP_LENGTH.
        // translateY = -(STRIP_LENGTH * ITEM_HEIGHT) centres it exactly.
        const targetY = STRIP_LENGTH * ITEM_HEIGHT;

        // Force another reflow before enabling transition
        void strip.offsetWidth;

        strip.style.transition = 'transform 1.6s cubic-bezier(0.12, 0.8, 0.25, 1.02)';
        strip.style.transform  = `translateY(-${targetY}px)`;

        setTimeout(() => strip.classList.remove('spinning'), 1600);
    }

    /* ═══════════════════════════════════════════════════════
       RENDER RESULT CARD
    ═══════════════════════════════════════════════════════ */
    function renderResult(format, topic, angle) {
        lastResult = { format, topic, angle };

        document.getElementById('finalIdea').innerHTML = `
            <div style="font-size:0.65rem;color:var(--primary);font-weight:800;letter-spacing:2px;margin-bottom:10px;font-family:'Outfit';">YOUR VIRAL BLUEPRINT</div>
            <span style="-webkit-text-fill-color:#fff;">${format}</span>
            <span style="-webkit-text-fill-color:#64748b;"> of </span>
            <span style="-webkit-text-fill-color:var(--primary);">${topic}</span>
            <br><span style="font-size:0.7em;-webkit-text-fill-color:#64748b;">${angle}</span>
        `;

        const tips = platformTips[activePlatform] || platformTips.all;

        document.getElementById('execGrid').innerHTML = `
            <div class="exec-step">
                <strong>🎨 Thumbnail / Cover</strong>
                ${tips.thumbnail}
            </div>
            <div class="exec-step">
                <strong>⚡ Hook Strategy</strong>
                ${tips.hook}
            </div>
            <div class="exec-step">
                <strong>📣 Call to Action</strong>
                ${tips.cta}
            </div>
            <div class="exec-step">
                <strong>♻️ Repurpose It</strong>
                ${tips.repurpose}
            </div>
        `;

        document.getElementById('copyBtn').textContent = '📋 Copy Idea';
        document.getElementById('copyBtn').classList.remove('copied');

        const card = document.getElementById('ideaCard');
        // Small delay so the hide transition finishes first
        setTimeout(() => card.classList.add('visible'), 80);
    }

    /* ═══════════════════════════════════════════════════════
       COPY & SAVE
    ═══════════════════════════════════════════════════════ */
    function copyIdea() {
        if (!lastResult) return;
        const text = `Content Idea: ${lastResult.format} of ${lastResult.topic} ${lastResult.angle}`;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.textContent = '✅ Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = '📋 Copy Idea';
                btn.classList.remove('copied');
            }, 2000);
        });
    }

    function saveIdea() {
        if (!lastResult) return;
        const idea = { ...lastResult, platform: activePlatform, ts: Date.now() };
        savedIdeas.unshift(idea);
        if (savedIdeas.length > 8) savedIdeas.pop();
        renderHistory();

        const btn = document.getElementById('saveBtn');
        btn.textContent = '✅ Saved!';
        setTimeout(() => btn.textContent = '🔖 Save to History', 1500);
    }

    function renderHistory() {
        const section = document.getElementById('historySection');
        const list    = document.getElementById('historyList');

        if (!savedIdeas.length) {
            section.classList.remove('visible');
            return;
        }

        section.classList.add('visible');
        list.innerHTML = savedIdeas.map((idea, i) => `
            <div class="history-item" onclick="restoreIdea(${i})">
                <span>${idea.format} · ${idea.topic} · <em>${idea.angle}</em></span>
                <span class="hist-tag">${idea.platform.toUpperCase()}</span>
            </div>
        `).join('');
    }

    function restoreIdea(index) {
        const idea = savedIdeas[index];
        if (!idea) return;
        renderResult(idea.format, idea.topic, idea.angle);
    }

    /* ═══════════════════════════════════════════════════════
       INIT — populate reels with placeholders on load
    ═══════════════════════════════════════════════════════ */
    (function initReels() {
        ['reel1-strip', 'reel2-strip', 'reel3-strip'].forEach((id, i) => {
            const labels = ['FORMAT', 'TOPIC', 'ANGLE'];
            document.getElementById(id).innerHTML =
                `<div class="slot-item" style="opacity:0.4;">${labels[i]}</div>`;
        });
    })();

    </script>
    <script src="../nav.js"></script>
</body>
</html>
