<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fancy Border-Radius Visualizer | 8-Point CSS Shape Generator | Rebrixe</title>
    <meta name="description" content="Generate organic, fluid CSS border-radius shapes with 8-point control. Create blobs, squircles, and custom rounded shapes — copy ready CSS instantly.">
    <link rel="stylesheet" href="/main-style.css">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <style>
        /* ── Tool-specific only ── */
        .tool-header { text-align: center; margin-bottom: 8px; }
        .tool-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #a78bfa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 6px;
        }
        .tool-sub { opacity: 0.5; font-size: 0.85rem; font-weight: 500; margin: 0 0 24px; }

        /* ── Layout ── */
        .workspace {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            align-items: start;
        }

        /* ── Panel card ── */
        .panel {
            background: rgba(15,23,42,0.65);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px;
            backdrop-filter: blur(12px);
        }

        .panel-label {
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #a78bfa;
            margin: 0 0 14px;
        }

        /* ── Presets ── */
        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 20px;
        }
        .preset-btn {
            padding: 6px 13px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.18s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }
        .preset-btn:hover, .preset-btn.active {
            background: rgba(167,139,250,0.15);
            border-color: rgba(167,139,250,0.5);
            color: #a78bfa;
        }

        /* ── Corner sections ── */
        .corners-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .corner-block {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .corner-name {
            font-size: 0.6rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .corner-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #a78bfa;
            flex-shrink: 0;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px;
        }
        .slider-row:last-child { margin-bottom: 0; }
        .axis-tag {
            font-size: 0.58rem;
            font-weight: 800;
            color: #475569;
            width: 10px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px; height: 13px;
            border-radius: 50%;
            background: #a78bfa;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 0 0 3px rgba(167,139,250,0.2);
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        .val-badge {
            font-size: 0.6rem;
            font-weight: 800;
            color: #94a3b8;
            width: 24px;
            text-align: right;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        /* ── Extra controls ── */
        .extra-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }
        .ctrl-group label {
            display: block;
            font-size: 0.58rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .ctrl-group select, .ctrl-group input[type="color"] {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            color: white;
            font-size: 0.78rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .ctrl-group input[type="color"] {
            height: 36px;
            padding: 3px 6px;
            cursor: pointer;
        }

        /* ── Action buttons ── */
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 9px 16px;
            border-radius: 9px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.18s;
            letter-spacing: 0.5px;
        }
        .btn-primary { background: #a78bfa; color: #000; flex: 1; }
        .btn-ghost { background: rgba(255,255,255,0.07); color: #fff; border: 1px solid var(--border); }
        .btn:hover { opacity: 0.82; transform: translateY(-1px); }
        .btn.success { background: #34d399; color: #000; }

        /* ── Right: Preview ── */
        .preview-panel { position: sticky; top: 20px; }

        .shape-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 340px;
            background: rgba(0,0,0,0.4);
            border-radius: 18px;
            border: 1px solid var(--border);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        /* subtle grid bg */
        .shape-stage::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
        }

        #shapePreview {
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, #a78bfa, #34d399);
            position: relative;
            z-index: 1;
            transition: border-radius 0.25s cubic-bezier(0.34,1.56,0.64,1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
            user-select: none;
        }
        #shapePreview.animating {
            animation: wobble 2.5s ease-in-out infinite;
        }
        @keyframes wobble {
            0%,100% { border-radius: var(--br-start); }
            50%      { border-radius: var(--br-end); }
        }

        /* ── Output ── */
        .output-box {
            margin-top: 14px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            position: relative;
        }
        #cssOutput {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.78rem;
            color: #a78bfa;
            white-space: pre;
            overflow-x: auto;
            line-height: 1.7;
            margin: 0;
        }
        #cssOutput .prop  { color: #94a3b8; }
        #cssOutput .val   { color: #34d399; }
        #cssOutput .semi  { color: #475569; }

        /* ── Size display ── */
        .size-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .info-chip {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(167,139,250,0.1);
            border: 1px solid rgba(167,139,250,0.2);
            color: #a78bfa;
            font-variant-numeric: tabular-nums;
        }

        /* ── Animate toggle ── */
        .anim-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }
        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-track {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid var(--border);
        }
        .toggle-track::after {
            content: '';
            position: absolute;
            left: 3px; top: 3px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #64748b;
            transition: 0.2s;
        }
        .toggle-switch input:checked + .toggle-track { background: rgba(167,139,250,0.3); border-color: #a78bfa; }
        .toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: #a78bfa; }
        .anim-label { font-size: 0.68rem; color: #64748b; font-weight: 600; }

        @media (max-width: 780px) {
            .workspace { grid-template-columns: 1fr; }
            .preview-panel { position: static; }
            .tool-title { font-size: 2rem; }
        }
    </style>

<body data-theme="technical">

<header class="nav-container"></header>

<main class="container">
    <a href="frontend-math" class="back-btn">← Back to Tools</a>

    <div class="tool-header">
        <h1 class="tool-title">Border-Radius Visualizer</h1>
        <p class="tool-sub">8-point control · organic shapes · copy-ready CSS</p>
    </div>

    <div class="workspace">

        <!-- ── LEFT: Controls ── -->
        <div>
            <div class="panel" style="margin-bottom:14px;">
                <div class="panel-label">Quick Presets</div>
                <div class="presets" id="presetsRow"></div>
            </div>

            <div class="panel" style="margin-bottom:14px;">
                <div class="panel-label">Corner Controls</div>
                <div class="corners-grid" id="cornersGrid"></div>

                <div class="extra-controls">
                    <div class="ctrl-group">
                        <label>Size</label>
                        <select id="sizeSelect" onchange="applySize()">
                            <option value="160">Small (160px)</option>
                            <option value="220" selected>Medium (220px)</option>
                            <option value="300">Large (300px)</option>
                        </select>
                    </div>
                    <div class="ctrl-group">
                        <label>Fill</label>
                        <input type="color" id="fillColor" value="#a78bfa" onchange="applyColor()">
                    </div>
                </div>

                <div class="anim-row">
                    <label class="toggle-switch">
                        <input type="checkbox" id="animToggle" onchange="toggleAnim()">
                        <div class="toggle-track"></div>
                    </label>
                    <span class="anim-label">Animate shape (CSS keyframe preview)</span>
                </div>

                <div class="action-row">
                    <button class="btn btn-ghost" onclick="randomize()">🎲 Random</button>
                    <button class="btn btn-ghost" onclick="resetAll()">↺ Reset</button>
                    <button class="btn btn-primary" id="copyBtn" onclick="copyCSS()">COPY CSS</button>
                </div>
            </div>
        </div>

        <!-- ── RIGHT: Preview ── -->
        <div class="preview-panel">
            <div class="panel">
                <div class="panel-label">Live Preview <span style="color:#475569;font-weight:400;font-size:0.55rem;">— click shape to randomize</span></div>
                <div class="shape-stage">
                    <div id="shapePreview" onclick="randomize()">click to random</div>
                </div>

                <div class="size-row" id="infoChips"></div>

                <div class="output-box">
                    <code id="cssOutput"></code>
                </div>
            </div>
        </div>

    </div>
</main>

<footer></footer>
<script src="/nav.js"></script>

<script>
/* ── Data ── */
const CORNERS = ['top-left','top-right','bottom-right','bottom-left'];
const CORNER_ABBR = ['TL','TR','BR','BL'];

const state = {
    tl:[50,50], tr:[50,50], br:[50,50], bl:[50,50],
    size: 220,
    color: '#a78bfa',
    animating: false,
};

const PRESETS = [
    { name:'Circle',      v:[[50,50],[50,50],[50,50],[50,50]] },
    { name:'Squircle',    v:[[40,40],[40,40],[40,40],[40,40]] },
    { name:'Blob A',      v:[[69,30],[30,69],[69,30],[30,69]] },
    { name:'Blob B',      v:[[30,69],[69,30],[30,69],[69,30]] },
    { name:'Leaf',        v:[[100,0],[0,100],[100,0],[0,100]] },
    { name:'Egg',         v:[[50,40],[50,40],[50,60],[50,60]] },
    { name:'Diamond',     v:[[0,0],[0,0],[0,0],[0,0]] },
    { name:'Fluid',       v:[[58,42],[42,58],[58,42],[42,58]] },
    { name:'Pebble',      v:[[76,35],[35,76],[65,50],[50,65]] },
    { name:'Organic',     v:[[40,70],[70,40],[50,80],[80,50]] },
];

function getKeys() { return ['tl','tr','br','bl']; }

/* ── Build corner sliders ── */
function buildUI() {
    const grid = document.getElementById('cornersGrid');
    grid.innerHTML = '';
    getKeys().forEach((k, i) => {
        const block = document.createElement('div');
        block.className = 'corner-block';
        block.innerHTML = `
            <div class="corner-name"><div class="corner-dot"></div>${CORNERS[i].replace('-',' ').toUpperCase()}</div>
            <div class="slider-row">
                <span class="axis-tag">X</span>
                <input type="range" min="0" max="100" value="${state[k][0]}" id="sl_${k}_x" oninput="onSlider('${k}',0,this.value)">
                <span class="val-badge" id="vb_${k}_x">${state[k][0]}</span>
            </div>
            <div class="slider-row">
                <span class="axis-tag">Y</span>
                <input type="range" min="0" max="100" value="${state[k][1]}" id="sl_${k}_y" oninput="onSlider('${k}',1,this.value)">
                <span class="val-badge" id="vb_${k}_y">${state[k][1]}</span>
            </div>`;
        grid.appendChild(block);
    });

    // presets
    const row = document.getElementById('presetsRow');
    row.innerHTML = '';
    PRESETS.forEach((p,i) => {
        const b = document.createElement('button');
        b.className = 'preset-btn';
        b.textContent = p.name;
        b.onclick = () => applyPreset(i);
        row.appendChild(b);
    });
}

function onSlider(key, axis, val) {
    state[key][axis] = parseInt(val);
    document.getElementById(`vb_${key}_${axis===0?'x':'y'}`).textContent = val;
    render();
}

/* ── Compute CSS value ── */
function computeBR() {
    const { tl, tr, br, bl } = state;
    // border-radius: TL-x TL-y  TR-x TR-y  BR-x BR-y  BL-x BL-y
    // CSS shorthand: h-radii / v-radii
    const h = `${tl[0]}% ${tr[0]}% ${br[0]}% ${bl[0]}%`;
    const v = `${tl[1]}% ${tr[1]}% ${br[1]}% ${bl[1]}%`;
    return `${h} / ${v}`;
}

/* ── Render ── */
function render() {
    const br = computeBR();
    const shape = document.getElementById('shapePreview');

    if (state.animating) {
        // store current as start, generate a subtle variation as end
        document.documentElement.style.setProperty('--br-start', br);
        const end = randomVariant();
        document.documentElement.style.setProperty('--br-end', end);
    } else {
        shape.style.borderRadius = br;
    }

    // CSS output
    const out = document.getElementById('cssOutput');
    out.innerHTML =
        `<span class="prop">border-radius</span><span class="semi">:</span> <span class="val">${br}</span><span class="semi">;</span>`;

    // info chips
    const chips = document.getElementById('infoChips');
    chips.innerHTML = `
        <span class="info-chip">${state.size}×${state.size}px</span>
        <span class="info-chip">8-point</span>
        <span class="info-chip">${isSymmetric() ? 'Symmetric' : 'Asymmetric'}</span>`;
}

function isSymmetric() {
    const { tl, tr, br, bl } = state;
    return tl[0]===tl[1] && tr[0]===tr[1] && br[0]===br[1] && bl[0]===bl[1];
}

/* ── Presets ── */
function applyPreset(i) {
    const p = PRESETS[i];
    const keys = getKeys();
    keys.forEach((k, j) => {
        state[k] = [...p.v[j]];
        document.getElementById(`sl_${k}_x`).value = state[k][0];
        document.getElementById(`sl_${k}_y`).value = state[k][1];
        document.getElementById(`vb_${k}_x`).textContent = state[k][0];
        document.getElementById(`vb_${k}_y`).textContent = state[k][1];
    });
    document.querySelectorAll('.preset-btn').forEach((b,j) => b.classList.toggle('active', j===i));
    render();
}

/* ── Randomize ── */
function randomize() {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    getKeys().forEach(k => {
        state[k] = [rn(), rn()];
        document.getElementById(`sl_${k}_x`).value = state[k][0];
        document.getElementById(`sl_${k}_y`).value = state[k][1];
        document.getElementById(`vb_${k}_x`).textContent = state[k][0];
        document.getElementById(`vb_${k}_y`).textContent = state[k][1];
    });
    render();
}
function rn(min=20, max=80) { return Math.floor(Math.random()*(max-min+1))+min; }

function randomVariant() {
    const jitter = () => Math.floor(Math.random()*30)-15;
    const clamp = v => Math.min(100, Math.max(0, v));
    const { tl, tr, br, bl } = state;
    const h = `${clamp(tl[0]+jitter())}% ${clamp(tr[0]+jitter())}% ${clamp(br[0]+jitter())}% ${clamp(bl[0]+jitter())}%`;
    const v = `${clamp(tl[1]+jitter())}% ${clamp(tr[1]+jitter())}% ${clamp(br[1]+jitter())}% ${clamp(bl[1]+jitter())}%`;
    return `${h} / ${v}`;
}

/* ── Reset ── */
function resetAll() {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    getKeys().forEach(k => {
        state[k] = [50,50];
        document.getElementById(`sl_${k}_x`).value = 50;
        document.getElementById(`sl_${k}_y`).value = 50;
        document.getElementById(`vb_${k}_x`).textContent = 50;
        document.getElementById(`vb_${k}_y`).textContent = 50;
    });
    render();
}

/* ── Size / Color ── */
function applySize() {
    state.size = parseInt(document.getElementById('sizeSelect').value);
    const s = document.getElementById('shapePreview');
    s.style.width = state.size + 'px';
    s.style.height = state.size + 'px';
    render();
}

function applyColor() {
    state.color = document.getElementById('fillColor').value;
    document.getElementById('shapePreview').style.background = state.color;
}

/* ── Animate ── */
function toggleAnim() {
    state.animating = document.getElementById('animToggle').checked;
    const shape = document.getElementById('shapePreview');
    if (state.animating) {
        shape.classList.add('animating');
        shape.innerText = '';
    } else {
        shape.classList.remove('animating');
        shape.innerText = 'click to random';
        shape.style.borderRadius = computeBR();
    }
    render();
}

/* ── Copy ── */
async function copyCSS() {
    const br = computeBR();
    const full = `border-radius: ${br};`;
    await navigator.clipboard.writeText(full);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ COPIED';
    btn.classList.add('success');
    setTimeout(() => { btn.textContent = 'COPY CSS'; btn.classList.remove('success'); }, 1600);
}

/* ── Init ── */
buildUI();
render();
</script>
