<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tailwind CSS Class Explainer | Instant CSS Translation | Rebrixe</title>
    <meta name="description" content="Type any Tailwind CSS class and instantly see its raw CSS output. Supports responsive prefixes, dark mode, hover/focus states, arbitrary values, and bulk lookup. Zero bloat, lightning fast.">
    <link rel="stylesheet" href="/main-style.css">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <style>
        /* ── Tool-specific styles only ── */
        .tool-header { text-align: center; margin-bottom: 32px; }
        .tool-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px;
        }
        .tool-sub { opacity: 0.55; font-size: 0.9rem; font-weight: 500; }

        /* ── Search bar ── */
        .search-wrap {
            position: relative;
            max-width: 680px;
            margin: 0 auto 12px;
        }
        .search-wrap input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 16px 54px 16px 20px;
            color: #fff;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-wrap input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
        }
        .search-wrap input::placeholder { color: #475569; font-family: 'Fira Code', monospace; }
        .clear-btn {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #64748b; cursor: pointer;
            font-size: 1.2rem; line-height: 1; padding: 4px; display: none;
        }
        .clear-btn:hover { color: #94a3b8; }

        /* ── Mode pills ── */
        .mode-toggle {
            display: inline-flex;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 28px;
        }
        .mode-btn {
            padding: 7px 20px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: #64748b;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.4px;
        }
        .mode-btn.active { background: #818cf8; color: #fff; }

        /* ── Result card ── */
        .result-card {
            background: rgba(15,23,42,0.7);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 26px;
            backdrop-filter: blur(12px);
            text-align: left;
            margin-bottom: 16px;
            animation: fadeUp 0.18s ease;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        .result-class {
            font-family: 'Fira Code', monospace;
            font-size: 1.05rem;
            color: #818cf8;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .result-class .prefix-tag {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 5px;
            letter-spacing: 0.5px;
            font-family: 'Inter', sans-serif;
        }
        .tag-resp  { background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.25); }
        .tag-dark  { background: rgba(99,102,241,0.15);  color: #818cf8; border: 1px solid rgba(99,102,241,0.25); }
        .tag-state { background: rgba(52,211,153,0.15);  color: #34d399; border: 1px solid rgba(52,211,153,0.25); }
        .tag-arb   { background: rgba(251,146,60,0.15);  color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }

        .css-block {
            background: #000;
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 14px 16px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.82rem;
            color: #7dd3fc;
            line-height: 1.8;
            white-space: pre;
            overflow-x: auto;
            margin-bottom: 12px;
        }
        .css-prop  { color: #94a3b8; }
        .css-val   { color: #7dd3fc; }
        .css-wrap  { color: #64748b; }

        .result-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .meta-pill {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 5px;
            letter-spacing: 0.4px;
            background: rgba(255,255,255,0.05);
            color: #64748b;
            border: 1px solid rgba(255,255,255,0.07);
        }
        .copy-css {
            margin-left: auto;
            padding: 5px 14px;
            border-radius: 7px;
            border: 1px solid rgba(129,140,248,0.3);
            background: rgba(129,140,248,0.08);
            color: #818cf8;
            font-size: 0.68rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.4px;
        }
        .copy-css:hover { background: rgba(129,140,248,0.18); }
        .copy-css.done  { background: rgba(52,211,153,0.15); color: #34d399; border-color: rgba(52,211,153,0.3); }

        /* ── Not found ── */
        .not-found {
            text-align: center;
            padding: 40px 20px;
            color: #475569;
        }
        .not-found .big { font-size: 2rem; margin-bottom: 8px; }
        .not-found p { font-size: 0.85rem; line-height: 1.7; }
        .not-found code { color: #818cf8; background: rgba(129,140,248,0.1); padding: 1px 6px; border-radius: 4px; }

        /* ── Bulk mode ── */
        .bulk-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: left;
        }
        .panel-card {
            background: rgba(15,23,42,0.7);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px 24px;
            backdrop-filter: blur(12px);
        }
        .panel-label {
            font-size: 0.62rem;
            font-weight: 800;
            color: #818cf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-family: 'Fira Code', monospace;
            font-size: 0.82rem;
            line-height: 1.8;
            min-height: 280px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #818cf8; }
        .bulk-output {
            background: #000;
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 14px;
            font-family: 'Fira Code', monospace;
            font-size: 0.78rem;
            color: #7dd3fc;
            line-height: 1.9;
            min-height: 280px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .action-row {
            display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap;
        }
        .btn {
            padding: 8px 18px; border-radius: 9px; border: none;
            font-family: 'Inter', sans-serif; font-size: 0.72rem;
            font-weight: 800; cursor: pointer; transition: 0.15s; letter-spacing: 0.5px;
        }
        .btn-primary { background: #818cf8; color: #fff; }
        .btn-ghost   { background: rgba(255,255,255,0.07); color: #fff; border: 1px solid var(--border); }
        .btn:hover   { opacity: 0.82; }
        .btn.done    { background: #34d399; color: #000; }

        /* ── Suggestions ── */
        .suggestions {
            display: flex; gap: 7px; flex-wrap: wrap;
            max-width: 680px; margin: 0 auto 24px;
        }
        .sug-chip {
            font-family: 'Fira Code', monospace;
            font-size: 0.72rem;
            padding: 4px 11px;
            border-radius: 7px;
            background: rgba(129,140,248,0.08);
            color: #818cf8;
            border: 1px solid rgba(129,140,248,0.2);
            cursor: pointer;
            transition: 0.15s;
        }
        .sug-chip:hover { background: rgba(129,140,248,0.18); }

        /* ── Counts ── */
        .result-count {
            font-size: 0.72rem;
            color: #475569;
            text-align: center;
            margin-bottom: 16px;
        }

        #singleMode, #bulkMode { display: none; }

        @media (max-width: 700px) {
            .tool-title { font-size: 2rem; }
            .bulk-grid  { grid-template-columns: 1fr; }
        }
    </style>

<script>
/* ═══════════════════════════════════════════════════════════
   TAILWIND CLASS DATABASE
   Covers: layout, flexbox, grid, spacing, sizing, typography,
   backgrounds, borders, effects, transitions, transforms,
   interactivity, filters — plus arbitrary value support.
═══════════════════════════════════════════════════════════ */

// Base spacing scale (Tailwind default: 1 unit = 0.25rem)
function spacing(n) {
    if (n === 'px') return '1px';
    if (n === 'auto') return 'auto';
    if (n === 'full') return '100%';
    if (n === '1/2') return '50%';
    if (n === '1/3') return '33.333333%';
    if (n === '2/3') return '66.666667%';
    if (n === '1/4') return '25%';
    if (n === '3/4') return '75%';
    if (n === 'screen') return '100vw';
    if (n === 'svh') return '100svh';
    if (n === 'dvh') return '100dvh';
    const num = parseFloat(n);
    if (!isNaN(num)) return (num * 0.25) + 'rem';
    return n;
}

// Color palette (common Tailwind colors)
const colors = {
    'inherit':'inherit','current':'currentColor','transparent':'transparent',
    'black':'#000000','white':'#ffffff',
    'slate-50':'#f8fafc','slate-100':'#f1f5f9','slate-200':'#e2e8f0','slate-300':'#cbd5e1',
    'slate-400':'#94a3b8','slate-500':'#64748b','slate-600':'#475569','slate-700':'#334155',
    'slate-800':'#1e293b','slate-900':'#0f172a','slate-950':'#020617',
    'gray-50':'#f9fafb','gray-100':'#f3f4f6','gray-200':'#e5e7eb','gray-300':'#d1d5db',
    'gray-400':'#9ca3af','gray-500':'#6b7280','gray-600':'#4b5563','gray-700':'#374151',
    'gray-800':'#1f2937','gray-900':'#111827','gray-950':'#030712',
    'zinc-500':'#71717a','zinc-700':'#3f3f46','zinc-900':'#18181b',
    'red-50':'#fef2f2','red-100':'#fee2e2','red-200':'#fecaca','red-300':'#fca5a5',
    'red-400':'#f87171','red-500':'#ef4444','red-600':'#dc2626','red-700':'#b91c1c',
    'red-800':'#991b1b','red-900':'#7f1d1d',
    'orange-400':'#fb923c','orange-500':'#f97316','orange-600':'#ea580c',
    'amber-400':'#fbbf24','amber-500':'#f59e0b','amber-600':'#d97706',
    'yellow-400':'#facc15','yellow-500':'#eab308','yellow-300':'#fde047',
    'green-50':'#f0fdf4','green-100':'#dcfce7','green-400':'#4ade80','green-500':'#22c55e',
    'green-600':'#16a34a','green-700':'#15803d','green-800':'#166534','green-900':'#14532d',
    'emerald-400':'#34d399','emerald-500':'#10b981','emerald-600':'#059669',
    'teal-400':'#2dd4bf','teal-500':'#14b8a6',
    'cyan-400':'#22d3ee','cyan-500':'#06b6d4',
    'sky-400':'#38bdf8','sky-500':'#0ea5e9','sky-600':'#0284c7',
    'blue-50':'#eff6ff','blue-100':'#dbeafe','blue-400':'#60a5fa','blue-500':'#3b82f6',
    'blue-600':'#2563eb','blue-700':'#1d4ed8','blue-800':'#1e40af','blue-900':'#1e3a8a',
    'indigo-400':'#818cf8','indigo-500':'#6366f1','indigo-600':'#4f46e5',
    'violet-400':'#a78bfa','violet-500':'#8b5cf6','violet-600':'#7c3aed',
    'purple-400':'#c084fc','purple-500':'#a855f7','purple-600':'#9333ea',
    'fuchsia-500':'#d946ef','pink-500':'#ec4899','rose-500':'#f43f5e',
};

function resolveColor(c) {
    if (colors[c]) return colors[c];
    if (c.startsWith('opacity-')) return null; // handled elsewhere
    return null;
}

// ── Main resolver ──
function resolveClass(raw) {
    const original = raw.trim();
    if (!original) return null;

    let cls = original;
    let prefixes = [];

    // Strip known prefixes
    const responsivePfx = ['sm','md','lg','xl','2xl'];
    const statePfx = ['hover','focus','active','focus-within','focus-visible','disabled','checked','placeholder','first','last','odd','even','group-hover','peer-hover','peer-focus','aria-checked','aria-selected','visited'];
    const darkPfx = ['dark'];

    let foundResp = null, foundDark = false, foundState = [];
    const parts = cls.split(':');
    const basePart = parts[parts.length - 1];
    const pfxParts = parts.slice(0, -1);

    for (const p of pfxParts) {
        if (responsivePfx.includes(p)) { foundResp = p; prefixes.push({type:'resp', val:p}); }
        else if (darkPfx.includes(p))  { foundDark = true; prefixes.push({type:'dark', val:p}); }
        else if (statePfx.includes(p)) { foundState.push(p); prefixes.push({type:'state', val:p}); }
        else { prefixes.push({type:'unknown', val:p}); }
    }

    cls = basePart;

    // Arbitrary value: class-[value]
    const arbMatch = cls.match(/^(.+?)-\[(.+)\]$/);
    let isArbitrary = false, arbVal = null;
    if (arbMatch) {
        isArbitrary = true;
        cls = arbMatch[1] + '-ARB';
        arbVal = arbMatch[2].replace(/_/g, ' ');
    }

    const av = isArbitrary ? arbVal : null;
    const result = resolveCSSProps(cls, av, original);
    if (!result) return null;

    return { original, css: result, prefixes, isArbitrary, arbVal, foundResp, foundDark, foundState };
}

function resolveCSSProps(cls, arbVal, original) {
    const v = arbVal; // shorthand — null if not arbitrary

    // Helper to get spacing
    const sp = (suffix) => {
        if (v) return v;
        return spacing(suffix);
    };

    // ── LAYOUT ──
    if (cls === 'block')         return { 'display': 'block' };
    if (cls === 'inline-block')  return { 'display': 'inline-block' };
    if (cls === 'inline')        return { 'display': 'inline' };
    if (cls === 'hidden')        return { 'display': 'none' };
    if (cls === 'flex')          return { 'display': 'flex' };
    if (cls === 'inline-flex')   return { 'display': 'inline-flex' };
    if (cls === 'grid')          return { 'display': 'grid' };
    if (cls === 'inline-grid')   return { 'display': 'inline-grid' };
    if (cls === 'table')         return { 'display': 'table' };
    if (cls === 'contents')      return { 'display': 'contents' };
    if (cls === 'flow-root')     return { 'display': 'flow-root' };
    if (cls === 'list-item')     return { 'display': 'list-item' };

    if (cls === 'static')        return { 'position': 'static' };
    if (cls === 'fixed')         return { 'position': 'fixed' };
    if (cls === 'absolute')      return { 'position': 'absolute' };
    if (cls === 'relative')      return { 'position': 'relative' };
    if (cls === 'sticky')        return { 'position': 'sticky' };

    if (cls === 'visible')       return { 'visibility': 'visible' };
    if (cls === 'invisible')     return { 'visibility': 'hidden' };
    if (cls === 'collapse')      return { 'visibility': 'collapse' };

    if (cls === 'float-left')    return { 'float': 'left' };
    if (cls === 'float-right')   return { 'float': 'right' };
    if (cls === 'float-none')    return { 'float': 'none' };
    if (cls === 'clear-left')    return { 'clear': 'left' };
    if (cls === 'clear-right')   return { 'clear': 'right' };
    if (cls === 'clear-both')    return { 'clear': 'both' };

    if (cls === 'container')     return { 'width': '100%', '/* + max-width per breakpoint */': '' };
    if (cls === 'box-border')    return { 'box-sizing': 'border-box' };
    if (cls === 'box-content')   return { 'box-sizing': 'content-box' };

    if (cls === 'isolate')       return { 'isolation': 'isolate' };
    if (cls === 'isolation-auto')return { 'isolation': 'auto' };

    if (cls === 'overflow-auto')    return { 'overflow': 'auto' };
    if (cls === 'overflow-hidden')  return { 'overflow': 'hidden' };
    if (cls === 'overflow-clip')    return { 'overflow': 'clip' };
    if (cls === 'overflow-visible') return { 'overflow': 'visible' };
    if (cls === 'overflow-scroll')  return { 'overflow': 'scroll' };
    if (cls === 'overflow-x-auto')  return { 'overflow-x': 'auto' };
    if (cls === 'overflow-x-hidden')return { 'overflow-x': 'hidden' };
    if (cls === 'overflow-y-auto')  return { 'overflow-y': 'auto' };
    if (cls === 'overflow-y-hidden')return { 'overflow-y': 'hidden' };
    if (cls === 'overflow-y-scroll')return { 'overflow-y': 'scroll' };

    if (cls === 'truncate')      return { 'overflow': 'hidden', 'text-overflow': 'ellipsis', 'white-space': 'nowrap' };
    if (cls === 'text-ellipsis') return { 'text-overflow': 'ellipsis' };
    if (cls === 'text-clip')     return { 'text-overflow': 'clip' };

    if (cls === 'whitespace-normal')  return { 'white-space': 'normal' };
    if (cls === 'whitespace-nowrap')  return { 'white-space': 'nowrap' };
    if (cls === 'whitespace-pre')     return { 'white-space': 'pre' };
    if (cls === 'whitespace-pre-line')return { 'white-space': 'pre-line' };
    if (cls === 'whitespace-pre-wrap')return { 'white-space': 'pre-wrap' };
    if (cls === 'whitespace-break-spaces')return { 'white-space': 'break-spaces' };

    if (cls === 'break-normal')  return { 'overflow-wrap': 'normal', 'word-break': 'normal' };
    if (cls === 'break-words')   return { 'overflow-wrap': 'break-word' };
    if (cls === 'break-all')     return { 'word-break': 'break-all' };
    if (cls === 'break-keep')    return { 'word-break': 'keep-all' };

    // ── FLEXBOX ──
    if (cls === 'flex-row')         return { 'flex-direction': 'row' };
    if (cls === 'flex-row-reverse') return { 'flex-direction': 'row-reverse' };
    if (cls === 'flex-col')         return { 'flex-direction': 'column' };
    if (cls === 'flex-col-reverse') return { 'flex-direction': 'column-reverse' };
    if (cls === 'flex-wrap')        return { 'flex-wrap': 'wrap' };
    if (cls === 'flex-wrap-reverse')return { 'flex-wrap': 'wrap-reverse' };
    if (cls === 'flex-nowrap')      return { 'flex-wrap': 'nowrap' };
    if (cls === 'flex-1')           return { 'flex': '1 1 0%' };
    if (cls === 'flex-auto')        return { 'flex': '1 1 auto' };
    if (cls === 'flex-initial')     return { 'flex': '0 1 auto' };
    if (cls === 'flex-none')        return { 'flex': 'none' };
    if (cls === 'flex-ARB')         return { 'flex': v };
    if (cls === 'grow')             return { 'flex-grow': '1' };
    if (cls === 'grow-0')           return { 'flex-grow': '0' };
    if (cls === 'shrink')           return { 'flex-shrink': '1' };
    if (cls === 'shrink-0')         return { 'flex-shrink': '0' };
    if (cls === 'basis-ARB')        return { 'flex-basis': v };
    const basisMatch = cls.match(/^basis-(.+)$/);
    if (basisMatch)                 return { 'flex-basis': spacing(basisMatch[1]) };

    if (cls === 'justify-normal')  return { 'justify-content': 'normal' };
    if (cls === 'justify-start')   return { 'justify-content': 'flex-start' };

/* ═══ FORMAT OUTPUT ═══ */
function cssToString(cssObj) {
    return Object.entries(cssObj)
        .filter(([k,val])=>val!=='')
        .map(([k,val])=>`  ${k}: ${val};`)
        .join('\n');
}

function renderResult(resolved) {
    if (!resolved) return null;
    const { original, css, prefixes, isArbitrary, foundResp, foundDark, foundState } = resolved;

    const wrapper = foundResp ? `@media (min-width: ${{sm:'640px',md:'768px',lg:'1024px',xl:'1280px','2xl':'1536px'}[foundResp]})` : null;
    const stateSelectors = foundState.length ? foundState.map(s=>{
        const sMap = {hover:':hover',focus:':focus',active:':active','focus-within':':focus-within','focus-visible':':focus-visible',disabled:':disabled',checked:':checked',first:':first-child',last:':last-child',odd:':nth-child(odd)',even:':nth-child(even)','group-hover':'.group:hover ','peer-hover':'.peer:hover ~ ','peer-focus':'.peer:focus ~ ','aria-checked':'[aria-checked="true"]','aria-selected':'[aria-selected="true"]',visited:':visited'};
        return sMap[s]||`:${s}`;
    }).join('') : '';

    const selector = `.${escapeCss(original)}${stateSelectors}`;
    const inner = `.${escapeCss(original)}${stateSelectors} {\n${cssToString(css)}\n}`;
    const full = wrapper ? `${wrapper} {\n  ${inner.replace(/\n/g,'\n  ')}\n}` : inner;

    // Tags
    const tags = [];
    prefixes.forEach(p => {
        if (p.type==='resp')  tags.push(`<span class="prefix-tag tag-resp">${p.val}:</span>`);
        if (p.type==='dark')  tags.push(`<span class="prefix-tag tag-dark">dark:</span>`);
        if (p.type==='state') tags.push(`<span class="prefix-tag tag-state">${p.val}:</span>`);
    });
    if (isArbitrary) tags.push(`<span class="prefix-tag tag-arb">arbitrary</span>`);

    // Meta
    const propCount = Object.keys(css).filter(k=>!k.startsWith('/*')).length;
    const metaPills = `<span class="meta-pill">${propCount} propert${propCount!==1?'ies':'y'}</span>`;

    return `
    <div class="result-card">
        <div class="result-class">${tags.join('')}<span>.${original}</span></div>
        <div class="css-block">${escapeHtml(full)}</div>
        <div class="result-meta">
            ${metaPills}
            <button class="copy-css" onclick="copyCss(this, ${JSON.stringify(full).replace(/"/g,'&quot;')})">COPY CSS</button>
        </div>
    </div>`;
}

function escapeCss(cls) {
    return cls.replace(/[[\]:./]/g, '\\$&').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}
function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ═══ COPY ═══ */
function copyCss(btn, code) {
    navigator.clipboard.writeText(code);
    btn.innerText = '✓ COPIED';
    btn.classList.add('done');
    setTimeout(()=>{ btn.innerText='COPY CSS'; btn.classList.remove('done'); }, 1400);
}

/* ═══ SEARCH ═══ */
let debounceTimer;
function onSearch() {
    const val = document.getElementById('searchInput').value;
    document.getElementById('clearBtn').style.display = val ? 'block' : 'none';
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderResults, 60);
}

function renderResults() {
    const raw = document.getElementById('searchInput').value.trim();
    const out  = document.getElementById('results');
    const countEl = document.getElementById('resultCount');

    if (!raw) { out.innerHTML = ''; countEl.textContent = ''; return; }

    // Support space-separated multiple classes in single box
    const classes = raw.split(/\s+/).filter(Boolean);
    const results = classes.map(c => resolveClass(c)).filter(Boolean);
    const invalid = classes.filter(c => !resolveClass(c));

    if (results.length === 0) {
        const suggestions = getDidYouMean(raw);
        out.innerHTML = `<div class="not-found">
            <div class="big">🤔</div>
            <p><code>${escapeHtml(raw)}</code> isn't a recognized Tailwind class.<br>
            ${suggestions.length ? 'Did you mean: ' + suggestions.map(s=>`<code onclick="document.getElementById('searchInput').value='${s}';onSearch();" style="cursor:pointer">${s}</code>`).join(', ') + '?' : 'Try removing a prefix, or check spelling.'}</p>
        </div>`;
        countEl.textContent = '';
        return;
    }

    out.innerHTML = results.map(r => renderResult(r)).join('');
    countEl.textContent = results.length > 1 ? `${results.length} classes • ${invalid.length ? invalid.length + ' unrecognized' : ''}` : '';
}

function getDidYouMean(raw) {
    const common = ['flex','block','grid','hidden','p-4','m-4','text-sm','font-bold','bg-white','rounded-lg','border','shadow-md','opacity-50','transition','cursor-pointer'];
    const base = raw.split(':').pop();
    return common.filter(c => c.startsWith(base[0]) && c !== base).slice(0, 3);
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearBtn').style.display = 'none';
    document.getElementById('results').innerHTML = '';
    document.getElementById('resultCount').textContent = '';
    document.getElementById('searchInput').focus();
}

/* ═══ SUGGESTIONS ═══ */
const POPULAR = ['flex','items-center','justify-between','gap-4','p-4','px-6','py-3','mt-8','mb-4','w-full','h-screen','max-w-xl','text-xl','font-semibold','text-gray-500','bg-indigo-500','rounded-2xl','border','shadow-lg','opacity-75','transition','duration-300','hover:scale-105','md:grid-cols-3','dark:bg-gray-900','truncate','z-10','cursor-pointer','sr-only','aspect-video'];

function buildSuggestions() {
    const el = document.getElementById('suggestions');
    el.innerHTML = POPULAR.map(c => `<span class="sug-chip" onclick="useSuggestion('${c}')">${c}</span>`).join('');
}

function useSuggestion(cls) {
    document.getElementById('searchInput').value = cls;
    document.getElementById('clearBtn').style.display = 'block';
    renderResults();
    document.getElementById('searchInput').focus();
}

/* ═══ BULK MODE ═══ */
function bulkExplain() {
    const raw = document.getElementById('bulkInput').value;
    const out  = document.getElementById('bulkOutput');
    const classes = raw.split(/[\s\n]+/).filter(Boolean);
    if (!classes.length) { out.textContent = 'Paste classes on the left →'; return; }

    const lines = [];
    for (const cls of classes) {
        const resolved = resolveClass(cls);
        if (!resolved) {
            lines.push(`/* ❌ unrecognized: ${cls} */`);
            continue;
        }
        const { original, css, prefixes, foundResp } = resolved;
        const stateSelectors = prefixes.filter(p=>p.type==='state').map(p=>{
            const sMap={hover:':hover',focus:':focus',active:':active',disabled:':disabled',checked:':checked',first:':first-child',last:':last-child',odd:':nth-child(odd)',even:':nth-child(even)'};
            return sMap[p.val]||`:${p.val}`;
        }).join('');
        const inner = `.${escapeCss(original)}${stateSelectors} {\n${cssToString(css)}\n}`;
        const full = foundResp ? `@media (min-width: ${{sm:'640px',md:'768px',lg:'1024px',xl:'1280px','2xl':'1536px'}[foundResp]}) {\n  ${inner.replace(/\n/g,'\n  ')}\n}` : inner;
        lines.push(full);
    }

    out.textContent = lines.join('\n\n');
}

async function copyBulk() {
    const btn = document.getElementById('bulkCopyBtn');
    await navigator.clipboard.writeText(document.getElementById('bulkOutput').textContent);
    btn.innerText = '✓ COPIED'; btn.classList.add('done');
    setTimeout(()=>{ btn.innerText='COPY CSS'; btn.classList.remove('done'); }, 1400);
}

function downloadBulk() {
    const code = document.getElementById('bulkOutput').textContent;
    if (!code || code === 'Paste classes on the left →') return;
    const blob = new Blob([code], {type:'text/css'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tailwind-expanded.css';
    a.click();
}

/* ═══ MODE SWITCH ═══ */
function switchMode(mode) {
    document.getElementById('singleMode').style.display = mode==='single'?'block':'none';
    document.getElementById('bulkMode').style.display   = mode==='bulk'?'block':'none';
    document.querySelectorAll('.mode-btn').forEach((b,i) => {
        b.classList.toggle('active', (i===0&&mode==='single')||(i===1&&mode==='bulk'));
    });
}

/* ═══ INIT ═══ */
buildSuggestions();
switchMode('single');
document.getElementById('searchInput').focus();

// Keyboard shortcut: Escape to clear
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') clearSearch();
    if ((e.ctrlKey||e.metaKey) && e.key==='k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
});
</script>
</body>
