                    </div>

    <script>
        let direction = 'add';

        // ── HELPERS ──────────────────────────────────────────────────────────────

        /**
         * FIX (BUG 3): toISOString() converts to UTC before formatting, which means
         * in UTC+ timezones (e.g. IST UTC+5:30) a date created at midnight local time
         * can roll back to the previous day. This helper formats using LOCAL date parts.
         */
        function localISOString(d) {
            const y  = d.getFullYear();
            const m  = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${dd}`;
        }

        /**
         * FIX (BUG 4): Original used getTime() + ms arithmetic which miscounts across
         * DST boundaries (a DST day is 23 or 25 hours, not 24). setDate() is DST-aware
         * and always moves by calendar days regardless of clock changes.
         */
        function addCalendarDays(dateObj, n) {
            const d = new Date(dateObj);  // clone — never mutate the input
            d.setDate(d.getDate() + n);
            return d;
        }

        /**
         * FIX (BUG 1 & BUG 2): Original workingDays() counted both endpoints (<=end),
         * making it (daysVal + 1) days long. Then weekendDays = daysVal - wdays produced
         * NEGATIVE values for short spans (e.g. Mon+2=Wed → wdays=3, weekendDays=-1).
         *
         * Correct logic: count only the days being traversed — exclusive of base,
         * inclusive of result. This matches exactly what daysVal represents.
         * weekendDays = daysVal - workingDaysBetween (always 0 ≤ weekendDays ≤ daysVal).
         */
        function workingDaysBetween(from, to) {
            // Always iterate from the earlier date toward the later date,
            // starting the day AFTER 'from' (exclusive base, inclusive result).
            let count = 0;
            const step  = to >= from ? 1 : -1;
            const cur   = new Date(from);
            cur.setDate(cur.getDate() + step); // skip the base date itself

            const limit = new Date(to);

            // Use getTime() comparisons to avoid infinite loops on equal dates
            while (
                (step === 1  && cur.getTime() <= limit.getTime()) ||
                (step === -1 && cur.getTime() >= limit.getTime())
            ) {
                const day = cur.getDay();
                if (day !== 0 && day !== 6) count++;
                cur.setDate(cur.getDate() + step);
            }
            return count;
        }

        function ordinal(n) {
            const s = ['th','st','nd','rd'], v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

        // Holds last computed result for the copy action (FIX BUG 5)
        let lastResult = null;

        // ── INIT ─────────────────────────────────────────────────────────────────

        // FIX (BUG 3): Use localISOString() — NOT toISOString() — for today's date.
        (function init() {
            document.getElementById('baseDate').value = localISOString(new Date());
            calculate();
        })();

        // ── CONTROLS ─────────────────────────────────────────────────────────────

        function setDir(d) {
            direction = d;
            document.getElementById('btnAdd').classList.toggle('active', d === 'add');
            document.getElementById('btnSub').classList.toggle('active', d === 'sub');
            calculate();
        }

        function setPreset(days, dir) {
            document.getElementById('daysInput').value = days;
            setDir(dir);
        }

        // ── CALCULATE ────────────────────────────────────────────────────────────

        function calculate() {
            const baseVal = document.getElementById('baseDate').value;
            const daysVal = parseInt(document.getElementById('daysInput').value, 10);
            const panel   = document.getElementById('resultPanel');
            const hint    = document.getElementById('emptyHint');

            if (!baseVal || isNaN(daysVal) || daysVal < 0) {
                panel.classList.remove('visible');
                hint.style.display = 'block';
                return;
            }

            // Parse as local date parts — avoids any UTC shift on input value
            const [y, m, d]  = baseVal.split('-').map(Number);
            const base        = new Date(y, m - 1, d);

            // FIX (BUG 4): DST-safe date arithmetic via setDate()
            const delta  = direction === 'add' ? daysVal : -daysVal;
            const result = addCalendarDays(base, delta);

            const dayName    = DAYS[result.getDay()];
            const isWeekend  = result.getDay() === 0 || result.getDay() === 6;
            const resultStr  = `${ordinal(result.getDate())} ${MONTHS[result.getMonth()]} ${result.getFullYear()}`;
            const isoResult  = localISOString(result);   // FIX (BUG 3) here too

            const weeks      = Math.floor(daysVal / 7);
            const remDays    = daysVal % 7;

            // FIX (BUG 1 & 2): Use corrected exclusive-base counting
            const wdays       = workingDaysBetween(base, result);
            const weekendDays = daysVal - wdays;         // now always ≥ 0

            const dirWord        = direction === 'add' ? 'after' : 'before';
            const baseFormatted  = `${ordinal(base.getDate())} ${MONTHS[base.getMonth()]} ${base.getFullYear()}`;

            // FIX (BUG 5): Store result data in a plain JS object instead of
            // embedding raw strings into onclick attributes (fragile / injection-prone).
            lastResult = { resultStr, dayName, daysVal, dirWord, baseFormatted, isoResult };

            panel.innerHTML = `
                <div class="result-hero">
                    <div class="result-date">${resultStr}</div>
                    <div class="result-weekday">${dayName}</div>
                    <div class="result-sentence">
                        <strong>${daysVal.toLocaleString()} day${daysVal !== 1 ? 's' : ''} ${dirWord}</strong> ${baseFormatted}
                    </div>
                    <div class="weekend-badge ${isWeekend ? 'is-weekend' : 'is-weekday'}">
                        ${isWeekend ? '🛌 Falls on a Weekend' : '💼 Falls on a Weekday'}
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-cell">
                        <div class="stat-num">${daysVal.toLocaleString()}</div>
                        <div class="stat-lbl">Total Days</div>
                    </div>
                    <div class="stat-cell">
                        <div class="stat-num">${weeks}</div>
                        <div class="stat-lbl">Full Weeks</div>
                    </div>
                    <div class="stat-cell">
                        <div class="stat-num">${remDays}</div>
                        <div class="stat-lbl">Extra Days</div>
                    </div>
                    <div class="stat-cell">
                        <div class="stat-num">${(daysVal * 24).toLocaleString()}</div>
                        <div class="stat-lbl">Total Hours</div>
                    </div>
                </div>

                <div class="info-row">
                    <div class="info-cell">
                        <span class="ic-lbl">⚙️ Working Days</span>
                        <span class="ic-val">${wdays.toLocaleString()}</span>
                    </div>
                    <div class="info-cell">
                        <span class="ic-lbl">🛌 Weekend Days</span>
                        <span class="ic-val">${weekendDays.toLocaleString()}</span>
                    </div>
                    <div class="info-cell">
                        <span class="ic-lbl">📅 Base Date</span>
                        <span class="ic-val">${baseFormatted}</span>
                    </div>
                    <div class="info-cell">
                        <span class="ic-lbl">🎯 Result Date (ISO)</span>
                        <span class="ic-val">${isoResult}</span>
                    </div>
                </div>

                <div class="action-row">
                    <button class="btn-action primary" id="btnCopy" onclick="copyResult()">Copy Result</button>
                    <button class="btn-action" onclick="useResultAsBase('${isoResult}')">Use Result as Base</button>
                    <button class="btn-action" onclick="resetTool()">✕ Reset</button>
                </div>
            `;

            panel.classList.add('visible');
            hint.style.display = 'none';
        }

        // ── ACTIONS ──────────────────────────────────────────────────────────────

        function useResultAsBase(iso) {
            document.getElementById('baseDate').value = iso;
            calculate();
        }

        function resetTool() {
            // FIX (BUG 3): Use localISOString() — NOT toISOString() — so IST/UTC+ users
            // don't get yesterday's date on reset.
            document.getElementById('baseDate').value = localISOString(new Date());
            document.getElementById('daysInput').value = 30;
            direction = 'add';
            document.getElementById('btnAdd').classList.add('active');
            document.getElementById('btnSub').classList.remove('active');
            calculate();
        }

        // FIX (BUG 5): No data embedded in onclick. Reads from the lastResult object.
        function copyResult() {
            if (!lastResult) return;
            const { resultStr, dayName, daysVal, dirWord, baseFormatted } = lastResult;
            const text = `${daysVal} days ${dirWord} ${baseFormatted} = ${resultStr} (${dayName})`;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('btnCopy');
                if (btn) {
                    btn.innerText = '✓ Copied!';
                    setTimeout(() => { if (btn) btn.innerText = 'Copy Result'; }, 2000);
                }
            }).catch(() => {
                // Fallback for browsers/contexts where clipboard API is unavailable
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity  = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                const btn = document.getElementById('btnCopy');
                if (btn) {
                    btn.innerText = '✓ Copied!';
                    setTimeout(() => { if (btn) btn.innerText = 'Copy Result'; }, 2000);
                }
            });
        }
    </script>
