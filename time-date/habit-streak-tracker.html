    <script>
    /* ============================================================
       CONSTANTS
    ============================================================ */
    const STORAGE_KEY = 'Rebrixe_habits_v3';
    const EMOJIS = ['💪','💧','📚','🏃','🧘','🥗','😴','🎯','✍️','💊','🚶','🎸','🧠','💻','🌱','☀️','🍎','🏋️','🚴','🧹','🎨','💰','🎤','🫁','🤸','🦷','🛌','📱','🍵','🧃'];
    const MILESTONES = [
        { days: 7,   icon: '🔥', label: '7d'            },
        { days: 21,  icon: '⚡', label: '21d'           },
        { days: 30,  icon: '🏆', label: '30d', big: true },
        { days: 66,  icon: '🌟', label: '66d', big: true },
        { days: 100, icon: '💎', label: '100d', big: true},
    ];

    /* ============================================================
       DATE UTILITIES
       All date logic uses LOCAL calendar date strings (YYYY-MM-DD).
       We NEVER call new Date(dateString) for arithmetic — that
       parses as UTC midnight and breaks for users with UTC offsets.
       Instead all arithmetic works on integer day-serials.
    ============================================================ */

    /**
     * Returns today's local date as "YYYY-MM-DD".
     * Uses local year/month/day — never UTC methods.
     */
    function todayStr() {
        const d = new Date();
        return localStr(d.getFullYear(), d.getMonth() + 1, d.getDate());
    }

    /**
     * Pads a number to 2 digits.
     */
    function pad2(n) {
        return n < 10 ? '0' + n : '' + n;
    }

    /**
     * Builds a YYYY-MM-DD string from parts.
     */
    function localStr(y, m, d) {
        return y + '-' + pad2(m) + '-' + pad2(d);
    }

    /**
     * Returns the local date N days ago as "YYYY-MM-DD".
     * Uses setDate arithmetic — handles month/year rollover correctly.
     */
    function daysAgoStr(n) {
        const d = new Date();
        d.setDate(d.getDate() - n);
        return localStr(d.getFullYear(), d.getMonth() + 1, d.getDate());
    }

    /**
     * Converts a "YYYY-MM-DD" string to an integer day-serial
     * (days since a fixed epoch). Used ONLY for day-difference
     * arithmetic — no timezone issues because we parse the parts
     * ourselves.
     */
    function dateSerial(str) {
        const parts = str.split('-');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        const d = parseInt(parts[2], 10);
        // Zeller-style epoch: count days from 2000-01-01 using
        // a pure integer algorithm (no Date object).
        // Days in each month (non-leap, then leap adjustment below).
        const daysInMonth = [0,31,28,31,30,31,30,31,31,30,31,30,31];
        let total = (y - 2000) * 365;
        // Add leap-year days for full years between 2000 and y-1.
        const ly = y - 1;
        total += Math.floor(ly / 4) - Math.floor(ly / 100) + Math.floor(ly / 400);
        // Subtract the same for 1999 base.
        total -= (Math.floor(1999 / 4) - Math.floor(1999 / 100) + Math.floor(1999 / 400));
        // Add days for full months in this year.
        for (let i = 1; i < m; i++) {
            total += daysInMonth[i];
            // Add Feb leap day if this year is a leap year and we've passed Feb.
            if (i === 2 && isLeapYear(y)) total += 1;
        }
        total += d;
        return total;
    }

    function isLeapYear(y) {
        return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
    }

    /**
     * Returns the absolute difference in days between two
     * YYYY-MM-DD strings. Pure integer arithmetic, timezone-safe.
     */
    function dayDiff(strA, strB) {
        return Math.abs(dateSerial(strA) - dateSerial(strB));
    }

    /* ============================================================
       STORAGE
       Safe wrappers — never crash the page on QuotaExceededError
       or when localStorage is unavailable (private browsing).
    ============================================================ */
    let storageAvailable = false;

    function checkStorage() {
        try {
            const test = '__Rebrixe_test__';
            localStorage.setItem(test, '1');
            localStorage.removeItem(test);
            storageAvailable = true;
        } catch (e) {
            storageAvailable = false;
            document.getElementById('storageWarn').classList.add('visible');
        }
    }

    function loadHabits() {
        if (!storageAvailable) return [];
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            // Validate basic shape — must be an array.
            if (!Array.isArray(parsed)) return [];
            // Validate each habit has required fields; drop malformed entries.
            return parsed.filter(h =>
                h &&
                typeof h.id === 'string' &&
                typeof h.name === 'string' &&
                typeof h.emoji === 'string' &&
                typeof h.sinceSerial === 'number' &&
                Array.isArray(h.completions)
            );
        } catch (e) {
            return [];
        }
    }

    function saveHabits() {
        if (!storageAvailable) return;
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
        } catch (e) {
            // Storage full or unavailable — show warning, don't crash.
            document.getElementById('storageWarn').classList.add('visible');
            document.getElementById('storageWarn').textContent =
                '⚠️ Storage is full. Some habits may not be saved. Consider deleting old habits.';
        }
    }

    /* ============================================================
       STREAK ENGINE
       All correct, all timezone-safe, all pure integer arithmetic.

       A habit's completions are stored as YYYY-MM-DD strings.
       We convert to day-serials for all comparisons.

       Definitions:
         currentStreak — unbroken consecutive days ending on today
                         OR yesterday (so you have until EOD to check in).
         bestStreak    — longest ever unbroken run (including current).
         needsAction   — streak is alive (last done = yesterday) but
                         today is not yet marked. Show orange border.
    ============================================================ */
    function streakInfo(completions) {
        if (!completions.length) {
            return { current: 0, best: 0, needsAction: false, doneToday: false };
        }

        const todayS = todayStr();
        const todayN = dateSerial(todayS);
        const yesterdayN = todayN - 1;

        // Build a Set of day-serials for O(1) lookup.
        const serialSet = new Set();
        for (let i = 0; i < completions.length; i++) {
            serialSet.add(dateSerial(completions[i]));
        }

        const doneToday = serialSet.has(todayN);

        // ── Current streak ──────────────────────────────────────
        // Walk backwards from today. If today is done, walk from today.
        // If today is not done but yesterday is done, walk from yesterday
        // (streak is still alive, user has until EOD).
        // If neither today nor yesterday is done, streak = 0.
        let current = 0;
        let startN = null;

        if (doneToday) {
            startN = todayN;
        } else if (serialSet.has(yesterdayN)) {
            startN = yesterdayN;
        }

        if (startN !== null) {
            let n = startN;
            while (serialSet.has(n)) {
                current++;
                n--;
            }
        }

        const needsAction = !doneToday && serialSet.has(yesterdayN);

        // ── Best streak ─────────────────────────────────────────
        // Sort all serials ascending, then do a single linear scan.
        const sorted = Array.from(serialSet).sort(function(a, b) { return a - b; });
        let best = 0;
        let run = 0;
        let prevN = null;
        for (let i = 0; i < sorted.length; i++) {
            const n = sorted[i];
            if (prevN === null || n === prevN + 1) {
                run++;
            } else {
                run = 1;
            }
            if (run > best) best = run;
            prevN = n;
        }
        // best is always at least current (handles in-progress streak).
        if (current > best) best = current;

        return { current: current, best: best, needsAction: needsAction, doneToday: doneToday };
    }

    /* ============================================================
       COMPLETION RATE
       Integer-only: number of days since habit was started (inclusive)
       vs number of completions. We use day-serials so no float
       arithmetic, no DST artifacts, no rounding surprises.
       Clamped to [0, 100].
    ============================================================ */
    function completionRate(sinceSerial, completions) {
        const todayN = dateSerial(todayStr());
        // Age = today - sinceSerial + 1 (the start day counts as day 1).
        const ageDays = todayN - sinceSerial + 1;
        if (ageDays <= 0) return 0;
        const rate = Math.round((completions.length / ageDays) * 100);
        // Clamp: can't exceed 100 (e.g. if completions were manually duplicated).
        return Math.min(rate, 100);
    }

    /* ============================================================
       EMOJI TRAY
    ============================================================ */
    let pickedEmoji = '💪';

    function buildTray() {
        document.getElementById('emojiTray').innerHTML =
            EMOJIS.map(function(e) {
                return '<span class="e-opt" onclick="pickEmoji(\'' + e + '\')">' + e + '</span>';
            }).join('');
    }

    function toggleTray() {
        document.getElementById('emojiTray').classList.toggle('open');
    }

    function pickEmoji(e) {
        pickedEmoji = e;
        document.getElementById('emojiPickBtn').textContent = e;
        document.getElementById('emojiTray').classList.remove('open');
    }

    /* ============================================================
       CRUD
    ============================================================ */
    function addHabit() {
        const inp = document.getElementById('habitInput');
        const name = inp.value.trim();
        if (!name) { inp.focus(); return; }

        // Generate a collision-resistant ID.
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const todayN = dateSerial(todayStr());

        habits.unshift({
            id: id,
            name: name,
            emoji: pickedEmoji,
            sinceSerial: todayN,     // store as integer, timezone-safe
            sinceDisplay: todayStr(), // human-readable label only
            completions: []
        });

        saveHabits();
        inp.value = '';
        render();
    }

    function toggleToday(id) {
        const h = habits.find(function(x) { return x.id === id; });
        if (!h) return;

        const t = todayStr();
        const idx = h.completions.indexOf(t);
        if (idx === -1) {
            h.completions.push(t);
        } else {
            h.completions.splice(idx, 1);
        }

        saveHabits();
        render();
    }

    function deleteHabit(id) {
        if (!confirm('Delete this habit and all its history?')) return;
        habits = habits.filter(function(h) { return h.id !== id; });
        saveHabits();
        render();
    }

    /* ============================================================
       XSS ESCAPE
       Covers all HTML special chars that matter for innerHTML injection.
    ============================================================ */
    function esc(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    /* ============================================================
       RENDER
    ============================================================ */
    function render() {
        const todayS = todayStr();

        // ── Overview stats ──────────────────────────────────────
        const doneCount = habits.filter(function(h) {
            return h.completions.indexOf(todayS) !== -1;
        }).length;

        const globalBest = habits.reduce(function(max, h) {
            return Math.max(max, streakInfo(h.completions).best);
        }, 0);

        const ovDone = document.getElementById('ovDone');
        ovDone.textContent = habits.length ? doneCount + '/' + habits.length : '—';

        document.getElementById('ovBest').textContent  = globalBest;
        document.getElementById('ovTotal').textContent = habits.length;

        // ── Habit list ──────────────────────────────────────────
        const list = document.getElementById('habitsList');

        if (!habits.length) {
            list.innerHTML =
                '<div class="empty-habits">' +
                '  <div class="e-icon">🌱</div>' +
                '  <p>No habits yet.<br>Add your first above — your streak starts today.</p>' +
                '</div>';
            return;
        }

        list.innerHTML = habits.map(function(h) {
            const info = streakInfo(h.completions);
            const hot  = info.current >= 3;

            // ── 14-day dot strip ──────────────────────────────
            // Day 0 = today (rightmost), day 13 = 13 days ago (leftmost).
            var dots = '';
            for (var i = 13; i >= 0; i--) {
                var ds      = daysAgoStr(i);
                var isToday = (ds === todayS);
                var lit     = h.completions.indexOf(ds) !== -1;
                var cls     = 'dot';
                if (lit)     cls += ' lit';
                if (isToday) cls += ' is-today';
                dots += '<div class="' + cls + '" title="' + ds + '"></div>';
            }

            // ── Completion rate ───────────────────────────────
            var rate = completionRate(h.sinceSerial, h.completions);

            // ── Milestone badges ──────────────────────────────
            var badges = MILESTONES.map(function(m) {
                var hit = info.best >= m.days;
                var cls = 'ms' + (hit ? ' hit' + (m.big ? ' big' : '') : '');
                return '<span class="' + cls + '">' + m.icon + ' ' + m.label + '</span>';
            }).join('');

            // ── Keep-alive notice (correct logic) ────────────
            // Only show when: streak is alive (yesterday done) AND today not yet marked.
            var notice = info.needsAction
                ? '<span class="alive-notice">↑ mark today to keep it going</span>'
                : '';

            // ── Card classes ─────────────────────────────────
            var cardCls = 'h-card';
            if (info.doneToday)    cardCls += ' done';
            if (info.needsAction)  cardCls += ' needs-action';

            return '<div class="' + cardCls + '">' +
                '<div class="h-top">' +
                '  <div class="h-emoji">' + h.emoji + '</div>' +
                '  <div>' +
                '    <div class="h-name">' + esc(h.name) + '</div>' +
                '    <div class="h-meta"><b>Best:</b> ' + info.best + 'd &nbsp;·&nbsp; ' + rate + '% done &nbsp;·&nbsp; since ' + h.sinceDisplay + ' ' + notice + '</div>' +
                '  </div>' +
                '  <div class="streak-pill' + (hot ? ' hot' : '') + '">' +
                '    <span class="streak-icon">' + (hot ? '🔥' : '◦') + '</span>' +
                '    <span class="streak-val">' + info.current + '</span>' +
                '  </div>' +
                '  <button class="check-btn' + (info.doneToday ? ' ticked' : '') + '" ' +
                '          onclick="toggleToday(\'' + h.id + '\')" ' +
                '          title="' + (info.doneToday ? 'Unmark today' : 'Mark done today') + '">' +
                '    ' + (info.doneToday ? '✓' : '○') +
                '  </button>' +
                '</div>' +
                '<div class="dot-row">' + dots + '<span class="dot-tag">← 14 days</span></div>' +
                '<div class="h-bottom">' +
                '  <div class="milestones">' + badges + '</div>' +
                '  <button class="btn-del" onclick="deleteHabit(\'' + h.id + '\')">✕ delete</button>' +
                '</div>' +
                '</div>';
        }).join('');
    }

    /* ============================================================
       MIGRATION
       If the user has v2 data (old format), convert it to v3 so
       existing habits and history are preserved.
    ============================================================ */
    function migrateFromV2() {
        try {
            const raw = localStorage.getItem('Rebrixe_habits_v2');
            if (!raw) return;
            const old = JSON.parse(raw);
            if (!Array.isArray(old) || !old.length) return;
            // Only migrate if v3 is empty.
            if (localStorage.getItem(STORAGE_KEY)) return;

            const migrated = old.map(function(h) {
                if (!h || typeof h.id !== 'string') return null;
                var sinceStr = (typeof h.since === 'string') ? h.since : todayStr();
                return {
                    id: h.id,
                    name: h.name || 'Unnamed habit',
                    emoji: h.emoji || '💪',
                    sinceSerial: dateSerial(sinceStr),
                    sinceDisplay: sinceStr,
                    completions: Array.isArray(h.completions) ? h.completions : []
                };
            }).filter(Boolean);

            if (migrated.length) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            }
        } catch (e) {
            // Migration failure is non-fatal.
        }
    }

    /* ============================================================
       INIT
    ============================================================ */
    var habits = [];

    checkStorage();

    if (storageAvailable) {
        migrateFromV2();
    }

    habits = loadHabits();
    buildTray();

    document.getElementById('todayLabel').textContent =
        new Date().toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

    render();
    </script>
    <script src="../nav.js"></script>
</body>
