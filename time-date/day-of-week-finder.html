    (function () {
        // ─── CONSTANTS ────────────────────────────────────────────────────────────
        var DAYS    = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        var DAYS_SH = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        var MONTHS  = ['January','February','March','April','May','June',
                       'July','August','September','October','November','December'];
        var MONTHS_SH = ['Jan','Feb','Mar','Apr','May','Jun',
                         'Jul','Aug','Sep','Oct','Nov','Dec'];

        var DAY_FACTS = {
            0: "Sunday is named after the Sun. In many cultures it's the day of rest — and statistically, the most popular day for sleeping in.",
            1: "Monday comes from 'Moon's day'. Studies show Monday has the highest rate of workplace stress globally. You're not imagining it.",
            2: "Tuesday is named after Tiw, the Norse god of war. In many countries, elections are held on Tuesdays by tradition.",
            3: "Wednesday is 'Woden's day' — Woden being the chief Norse god (Odin). It's also called 'hump day' — the week's midpoint.",
            4: "Thursday is Thor's day — the Norse god of thunder. In many cultures, Thursday is considered a lucky day for new ventures.",
            5: "Friday is named after Frigg (or Freya), the Norse goddess of love. Black Friday gets its name from retailers going 'into the black' (profit).",
            6: "Saturday comes from Saturn, the Roman god of time. It's the only day of the week that kept its Roman name in English."
        };

        // ─── ZODIAC ───────────────────────────────────────────────────────────────
        // Each entry: [startMonth(1-based), startDay, endMonth, endDay, sign, emoji]
        // Months are 1-based. Ranges are inclusive.
        // Capricorn wraps around the year-end; handled explicitly below.
        var ZODIAC_RANGES = [
            [1,20,  2,18,  'Aquarius',    '♒'],
            [2,19,  3,20,  'Pisces',      '♓'],
            [3,21,  4,19,  'Aries',       '♈'],
            [4,20,  5,20,  'Taurus',      '♉'],
            [5,21,  6,20,  'Gemini',      '♊'],
            [6,21,  7,22,  'Cancer',      '♋'],
            [7,23,  8,22,  'Leo',         '♌'],
            [8,23,  9,22,  'Virgo',       '♍'],
            [9,23, 10,22,  'Libra',       '♎'],
            [10,23,11,21,  'Scorpio',     '♏'],
            [11,22,12,21,  'Sagittarius', '♐']
            // Capricorn: Dec 22 – Jan 19 (handled below)
        ];

        function getZodiac(month, day) {
            // month and day are both 1-based integers — no float risk
            // Capricorn spans Dec 22 → Jan 19 (crosses year boundary)
            if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) {
                return { sign: 'Capricorn', emoji: '♑' };
            }
            for (var i = 0; i < ZODIAC_RANGES.length; i++) {
                var r = ZODIAC_RANGES[i];
                var sm = r[0], sd = r[1], em = r[2], ed = r[3];
                // All non-Capricorn ranges are within a single calendar year
                // and never cross year boundaries, so a simple comparison works.
                if (
                    (month === sm && day >= sd) ||
                    (month === em && day <= ed) ||
                    (month > sm && month < em)
                ) {
                    return { sign: r[4], emoji: r[5] };
                }
            }
            // Should never reach here for valid dates
            return { sign: 'Capricorn', emoji: '♑' };
        }

        // ─── LEAP YEAR ────────────────────────────────────────────────────────────
        function isLeapYear(y) {
            return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
        }

        // ─── DAYS IN MONTH ────────────────────────────────────────────────────────
        // Uses the JS trick: day 0 of next month = last day of current month.
        // month is 1-based.
        function getDaysInMonth(y, month) {
            return new Date(y, month, 0).getDate();
        }

        // ─── DAY OF YEAR — pure integer arithmetic, no DST risk ──────────────────
        // Returns 1 for Jan 1, 365/366 for Dec 31.
        function getDayOfYear(y, month, day) {
            // Days elapsed before each month in a non-leap year
            var DAYS_BEFORE = [0,31,59,90,120,151,181,212,243,273,304,334];
            var doy = DAYS_BEFORE[month - 1] + day;
            // Add leap-day if month is after February in a leap year
            if (month > 2 && isLeapYear(y)) {
                doy += 1;
            }
            return doy;
        }

        // ─── ISO WEEK NUMBER ──────────────────────────────────────────────────────
        // Returns { week: Number, year: Number }
        // The ISO year can differ from the calendar year for dates in early Jan
        // or late Dec. We return both so the UI can show the correct context.
        function getISOWeek(y, month, day) {
            // Work in UTC to avoid any local timezone effect on day boundaries
            var d = new Date(Date.UTC(y, month - 1, day));
            // ISO weeks start on Monday; find the nearest Thursday
            var dayOfWeek = d.getUTCDay() || 7; // convert Sun=0 to 7
            d.setUTCDate(d.getUTCDate() + 4 - dayOfWeek);
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return { week: weekNo, year: d.getUTCFullYear() };
        }

        // ─── RELATIVE LABEL ───────────────────────────────────────────────────────
        // Compute diff using integer arithmetic on year/month/day — no DST risk.
        // Returns the difference in whole days (positive = future, negative = past).
        function dayDiff(y1, m1, d1, y2, m2, d2) {
            // Julian Day Number formula — works for any Gregorian date
            function jdn(y, m, d) {
                var a = Math.floor((14 - m) / 12);
                var yr = y + 4800 - a;
                var mo = m + 12 * a - 3;
                return d + Math.floor((153 * mo + 2) / 5) +
                       365 * yr + Math.floor(yr / 4) -
                       Math.floor(yr / 100) + Math.floor(yr / 400) - 32045;
            }
            return jdn(y1, m1, d1) - jdn(y2, m2, d2);
        }

        // ─── ISO DATE STRING ──────────────────────────────────────────────────────
        function fmtISO(date) {
            var y  = date.getFullYear();
            var mo = String(date.getMonth() + 1).padStart(2, '0');
            var d  = String(date.getDate()).padStart(2, '0');
            return y + '-' + mo + '-' + d;
        }

            return day + ' ' + MONTHS[month - 1] + ' ' + y;
        }

        // ─── QUARTER ──────────────────────────────────────────────────────────────
        function getQuarter(month) {
            return Math.ceil(month / 3);
        }

                var cellParts = jdnToDate(dateToJDN(y, month, day) + cellDiff);
                var cellY = cellParts[0], cellM = cellParts[1], cellD = cellParts[2];
                var isActive = (cellY === y && cellM === month && cellD === day);

                // Show month abbreviation only when the day is not in the same month as the input
                var moNote = (cellM !== month) ? '<span class="ws-mo">' + MONTHS_SH[cellM - 1] + '</span>' : '';

                stripHTML += '<div class="ws-day' + (isActive ? ' active' : '') + '">' +
                    stripLabels[i] +
                    '<span class="ws-num">' + cellD + '</span>' +
                    moNote +
                '</div>';
            }

            panel.innerHTML =
                '<div class="day-hero">' +
                    '<div class="direction-badge ' + badgeClass + '">' + badgeText + '</div>' +
                    '<div class="day-name">' + DAYS[dow] + '</div>' +
                    '<div class="day-full-date"><strong>' + fmtDisplay(y, month, day) + '</strong>' +
                    ' &nbsp;·&nbsp; ' + relLabel + '</div>' +
                '</div>' +

                '<div class="week-strip">' + stripHTML + '</div>' +

                '<div class="stats-grid">' +
                    '<div class="stat-cell">' +
                        '<div class="sc-num">' + doy + '</div>' +
                        '<div class="sc-label">Day of Year</div>' +
                    '</div>' +
                    '<div class="stat-cell">' +
                        '<div class="sc-num" style="font-size:' + (isoWeek.year !== y ? '1.1rem' : '1.5rem') + '">' + weekLabel + '</div>' +
                        '<div class="sc-label">ISO Week</div>' +
                    '</div>' +
                    '<div class="stat-cell">' +
                        '<div class="sc-num">Q' + quarter + '</div>' +
                        '<div class="sc-label">Quarter</div>' +
                    '</div>' +
                '</div>' +

                '<div class="extras-grid">' +
                    '<div class="extra-item">' +
                        '<span class="ei-label">☀️ Weekday or Weekend?</span>' +
                        '<span class="ei-val">' + (isWeekend ? '🛌 Weekend' : '💼 Weekday') + '</span>' +
                    '</div>' +
                    '<div class="extra-item">' +
                        '<span class="ei-label">' + zodiac.emoji + ' Zodiac Sign</span>' +
                        '<span class="ei-val">' + zodiac.sign + '</span>' +
                    '</div>' +
                    '<div class="extra-item">' +
                        '<span class="ei-label">📅 Days in ' + MONTHS[month - 1] + '</span>' +
                        '<span class="ei-val">' + dimCount + ' days</span>' +
                    '</div>' +
                    '<div class="extra-item">' +
                        '<span class="ei-label">🗓️ Leap Year?</span>' +
                        '<span class="ei-val">' + (leap ? '✅ Yes' : '❌ No') + '</span>' +
                    '</div>' +
                    '<div class="extra-item">' +
                        '<span class="ei-label">📆 Days Left in Year</span>' +
                        '<span class="ei-val">' + daysLeft + '</span>' +
                    '</div>' +
                    '<div class="extra-item">' +
                        '<span class="ei-label">🔢 Days Elapsed in Year</span>' +
                        '<span class="ei-val">' + doy + '</span>' +
                    '</div>' +
                '</div>' +

                '<div class="fun-fact">💡 <span>About ' + DAYS[dow] + 's:</span> ' + DAY_FACTS[dow] + '</div>' +

                '<div class="action-row">' +
                    '<button class="btn-action primary" onclick="copyResult(\'' +
                        DAYS[dow] + '\', \'' + fmtDisplay(y, month, day) + '\', \'' + relLabel + '\')">' +
                        'Copy Result' +
                    '</button>' +
                    '<button class="btn-action" onclick="resetTool()">✕ Reset</button>' +
                '</div>';

            panel.classList.add('visible');
        };

        // ─── COPY RESULT ──────────────────────────────────────────────────────────
        window.copyResult = function (dayName, dateStr, rel) {
            var text = dateStr + ' was a ' + dayName + ' (' + rel + ')';
            navigator.clipboard.writeText(text).then(function () {
                var btn = document.querySelector('.btn-action.primary');
                if (btn) {
                    btn.innerText = '✓ Copied!';
                    setTimeout(function () { btn.innerText = 'Copy Result'; }, 2000);
                }
            });
        };

        // ─── RESET ────────────────────────────────────────────────────────────────
        window.resetTool = function () {
            document.getElementById('mainDate').value = '';
            document.getElementById('resultPanel').classList.remove('visible');
        };

        // ─── JULIAN DAY NUMBER HELPERS ────────────────────────────────────────────
        // Used for DST-safe integer date arithmetic.
        // Converts a Gregorian date to a Julian Day Number (integer).
        function dateToJDN(y, m, d) {
            var a = Math.floor((14 - m) / 12);
            var yr = y + 4800 - a;
            var mo = m + 12 * a - 3;
            return d + Math.floor((153 * mo + 2) / 5) +
                   365 * yr + Math.floor(yr / 4) -
                   Math.floor(yr / 100) + Math.floor(yr / 400) - 32045;
        }

        // Converts a Julian Day Number back to [year, month, day] (Gregorian).
        function jdnToDate(jdn) {
            var a = jdn + 32044;
            var b = Math.floor((4 * a + 3) / 146097);
            var c = a - Math.floor(146097 * b / 4);
            var d = Math.floor((4 * c + 3) / 1461);
            var e = c - Math.floor(1461 * d / 4);
            var mo = Math.floor((5 * e + 2) / 153);
            var day   = e - Math.floor((153 * mo + 2) / 5) + 1;
            var month = mo + 3 - 12 * Math.floor(mo / 10);
            var year  = 100 * b + d - 4800 + Math.floor(mo / 10);
            return [year, month, day];
        }

        // ─── INIT: DEFAULT TO TODAY ───────────────────────────────────────────────
        document.getElementById('mainDate').value = fmtISO(new Date());
        findDay();

    })();
    </script>
