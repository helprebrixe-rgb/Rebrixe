<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printable Monthly Calendar | Rebrixe</title>
    <meta name="description" content="Free printable monthly calendar for any month and year. Add custom notes per day, choose layout, and print clean — no ads, no signup.">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/main-style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <style>
        /* ── Tool wrap ── */
        .tool-wrap { max-width: 960px; margin: 40px auto; }

        .tool-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 32px;
        }

        /* ── Controls bar ── */
        .ctrl-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .ctrl-group { display: flex; align-items: center; gap: 8px; }

        .ctrl-label {
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: #64748b;
            white-space: nowrap;
        }

        select {
            background: #000;
            border: 2px solid var(--border);
            border-radius: 12px;
            color: #fff;
            padding: 9px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: border-color .2s;
        }
        select:focus { border-color: var(--primary); }

        input[type="number"] {
            background: #000;
            border: 2px solid var(--border);
            border-radius: 12px;
            color: #fff;
            padding: 9px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            width: 84px;
            transition: border-color .2s;
        }
        input[type="number"]:focus { border-color: var(--primary); }
        input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }

        .nav-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            color: #94a3b8;
            width: 34px; height: 34px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: border-color .2s, color .2s;
            flex-shrink: 0;
        }
        .nav-btn:hover { border-color: var(--primary); color: #fff; }

        .spacer { flex: 1; }

        /* ── Option pills ── */
        .opt-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .opt-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.72rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: #94a3b8;
            cursor: pointer;
            transition: border-color .2s, color .2s, background .2s;
            user-select: none;
        }
        .opt-pill input[type="checkbox"] {
            accent-color: var(--primary);
            cursor: pointer;
        }
        .opt-pill:hover { border-color: var(--primary); color: #fff; }
        .opt-pill.active { border-color: var(--primary); color: #fff; background: rgba(120,129,132,0.1); }

        /* Title input */
        .title-input {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            padding: 9px 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            outline: none;
            width: 200px;
            transition: border-color .2s;
        }
        .title-input:focus { border-color: var(--primary); }
        .title-input::placeholder { color: #475569; }

        /* ── Calendar wrap ── */
        #calWrap {
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        /* ── Calendar header ── */
        .cal-head {
            background: #111;
            padding: 20px 24px 16px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }
        .cal-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
        }
        .cal-subtitle {
            font-size: 0.72rem;
            color: #475569;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── Day-of-week row ── */
        .cal-dow {
            display: grid;
            background: #1a1a1a;
        }
        .cal-dow.cols-7  { grid-template-columns: repeat(7, 1fr); }
        .cal-dow.cols-8  { grid-template-columns: 40px repeat(7, 1fr); }

        .dow-cell {
            text-align: center;
            padding: 8px 4px;
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #475569;
            font-family: 'Outfit', sans-serif;
        }
        .dow-cell.is-weekend { color: var(--primary, #94a3b8); }
        .dow-cell.wkn-spacer { background: #111; }

        /* ── Calendar grid ── */
        .cal-grid {
            display: grid;
            border-left: 1px solid #e5e7eb;
            border-top: 1px solid #e5e7eb;
        }
        .cal-grid.cols-7 { grid-template-columns: repeat(7, 1fr); }
        .cal-grid.cols-8 { grid-template-columns: 40px repeat(7, 1fr); }

        /* Week number cells */
        .wk-num-cell {
            background: #f8fafc;
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.58rem;
            font-weight: 800;
            color: #94a3b8;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.5px;
        }

        /* ── Day cells ── */
        .day-cell {
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            min-height: 90px;
            padding: 8px 8px 6px;
            background: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* States */
        .day-cell.is-empty         { background: #f8fafc; }
        .day-cell.is-other-month   { background: #f8fafc; }
        .day-cell.is-weekend       { background: #fafafa; }
        .day-cell.is-today         { background: #fffbf0; }

        .day-num {
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: #1e293b;
            line-height: 1;
            margin-bottom: 5px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
        }
        .day-cell.is-weekend .day-num { color: #94a3b8; }
        .day-cell.is-other-month .day-num { color: #c5ccd4; }

        /* Today badge */
        .today-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary, #334155);
            color: #fff;
            border-radius: 999px;
            width: 24px; height: 24px;
            font-size: 0.85rem;
            font-weight: 900;
        }

        /* Note area — contenteditable div, not textarea */
        .day-note {
            flex: 1;
            outline: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            color: #475569;
            line-height: 1.5;
            min-height: 36px;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        .day-note:empty::before {
            content: attr(data-placeholder);
            color: #d1d5db;
            pointer-events: none;
        }

        /* ── Tip bar ── */
        .tip-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 16px;
            font-size: 0.75rem;
            color: #475569;
        }
        .tip-bar strong { color: var(--primary); font-weight: 700; }

        /* ── Action row ── */
        .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-action {
            flex: 1;
            min-width: 100px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background .2s, border-color .2s, transform .15s;
            white-space: nowrap;
        }
        .btn-action:hover {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
            transform: translateY(-2px);
        }
        .btn-action:active { transform: translateY(0); }
        .btn-action.primary {
            background: linear-gradient(135deg, #616768, #c0cbcc);
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(145,152,155,0.25);
        }
        .btn-action.primary:hover { opacity: 0.92; }
        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: #1e293b;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid #334155;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 9999;
            white-space: nowrap;
        }
        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── PRINT STYLES ── */
        @media print {
            /* Hide everything except the calendar */
            body > *:not(#printAnchor) { display: none !important; }
            #printAnchor {
                display: block !important;
                position: fixed;
                inset: 0;
                z-index: 99999;
            }
            #printAnchor .cal-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #printAnchor .cal-dow  { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #printAnchor .day-cell.is-today { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #printAnchor .today-badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #printAnchor {
                background: #fff;
                border-radius: 0;
            }
            .day-cell { min-height: 80px; page-break-inside: avoid; }
            .day-note { font-size: 0.6rem; }
        }

        /* Hidden print clone */
        #printAnchor { display: none; }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .tool-card { padding: 20px 16px; }
            .ctrl-bar  { gap: 8px; }
            .spacer    { display: none; }
            .title-input { width: 100%; }
            .day-cell  { min-height: 64px; padding: 6px 5px 4px; }
            .day-note  { font-size: 0.58rem; min-height: 28px; }
            .btn-action { font-size: 0.7rem; padding: 10px 10px; }
        }
    </style>
</head>
<body data-theme="time-date">
    <nav class="nav-container"></nav>

    <!-- Hidden print-only clone rendered here at body level -->
    <div id="printAnchor" aria-hidden="true"></div>

    <div class="container">
        <a href="calendar-schedule-tools.html" class="back-btn">← back to tools</a>

        <header style="text-align:center; margin-bottom:40px;">
            <h1 style="font-family:'Outfit',sans-serif; font-size:clamp(1.9rem,6vw,3.2rem); font-weight:900; letter-spacing:-2px; margin-bottom:10px;">
                Printable Monthly Calendar
            </h1>
            <p style="color:#64748b; font-size:0.95rem;">
                Any month, any year. Add notes per day, then print clean — no ads, no clutter.
            </p>
        </header>

        <div class="tool-wrap">
            <div class="tool-card">

                <!-- Controls -->
                <div class="ctrl-bar">
                    <button class="nav-btn" id="btnPrev" title="Previous month" aria-label="Previous month">‹</button>

                    <div class="ctrl-group">
                        <span class="ctrl-label">Month</span>
                        <select id="selMonth" aria-label="Select month">
                            <option value="0">January</option>
                            <option value="1">February</option>
                            <option value="2">March</option>
                            <option value="3">April</option>
                            <option value="4">May</option>
                            <option value="5">June</option>
                            <option value="6">July</option>
                            <option value="7">August</option>
                            <option value="8">September</option>
                            <option value="9">October</option>
                            <option value="10">November</option>
                            <option value="11">December</option>
                        </select>
                    </div>

                    <div class="ctrl-group">
                        <span class="ctrl-label">Year</span>
                        <input type="number" id="selYear" min="1900" max="2100" aria-label="Year">
                    </div>

                    <button class="nav-btn" id="btnNext" title="Next month" aria-label="Next month">›</button>

                    <div class="spacer"></div>

                    <input
                        class="title-input"
                        id="calCustomTitle"
                        type="text"
                        maxlength="60"
                        placeholder="Custom title (optional)"
                        aria-label="Custom calendar title"
                    >
                </div>

                <!-- Options -->
                <div class="opt-bar" role="group" aria-label="Calendar options">
                    <label class="opt-pill" id="pillWeeknum">
                        <input type="checkbox" id="optWeeknum" role="switch"> Week #s
                    </label>
                    <label class="opt-pill active" id="pillToday">
                        <input type="checkbox" id="optToday" checked role="switch"> Highlight Today
                    </label>
                    <label class="opt-pill active" id="pillWeekend">
                        <input type="checkbox" id="optWeekend" checked role="switch"> Shade Weekends
                    </label>
                    <label class="opt-pill" id="pillMondayFirst">
                        <input type="checkbox" id="optMondayFirst" role="switch"> Start Monday
                    </label>
                    <label class="opt-pill" id="pillPrevNext">
                        <input type="checkbox" id="optPrevNext" role="switch"> Show Prev/Next Days
                    </label>
                </div>

                <div class="tip-bar" role="note">
                    💡 <strong>Tip:</strong> Click any day cell to add notes. Notes persist while you navigate months. Print anytime — notes render as clean text.
                </div>

                <!-- Calendar renders here -->
                <div id="calWrap" role="grid" aria-label="Monthly calendar"></div>

                <!-- Actions -->
                <div class="action-row">

            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer></footer>

    <script>
    /* =================================================================
       PRINTABLE MONTHLY CALENDAR — Bulletproof v2
       All state is managed in JS. DOM is derived from state.
       No inline event handlers. No double-binding. No innerHTML hacks.
    ================================================================= */

    // ── Constants ─────────────────────────────────────────────────────
    const MONTHS = [
        'January','February','March','April','May','June',
        'July','August','September','October','November','December'
    ];
    const DOW_SUN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const DOW_MON = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    // Weekend column indices in display order
    const WKND_SUN = new Set([0, 6]); // Sun=0, Sat=6
    const WKND_MON = new Set([5, 6]); // Sat=5, Sun=6

    const YEAR_MIN = 1900;
    const YEAR_MAX = 2100;

    // ── Application State ──────────────────────────────────────────────
    const state = {
        month: 0,       // 0–11
        year:  2025,
        opts: {
            weeknum:     false,
            today:       true,
            weekend:     true,
            mondayFirst: false,
            prevNext:    false
        },
        // notes keyed by "YYYY-MM-DD" (zero-padded, unambiguous)
        notes: {}
    };

    // ── DOM Refs ───────────────────────────────────────────────────────
    const selMonth       = document.getElementById('selMonth');
    const selYear        = document.getElementById('selYear');
    const calWrap        = document.getElementById('calWrap');
    const printAnchor    = document.getElementById('printAnchor');
    const calCustomTitle = document.getElementById('calCustomTitle');
    const toast          = document.getElementById('toast');

    // ── Helpers ────────────────────────────────────────────────────────

    /** Zero-pad to 2 digits */
    function pad2(n) { return String(n).padStart(2, '0'); }

    /** Canonical note key: YYYY-MM-DD (always 1-indexed month) */
    function noteKey(y, m, d) {
        return `${y}-${pad2(m + 1)}-${pad2(d)}`;
    }

    /** ISO week number (correct per ISO 8601) */
    function isoWeekNum(y, m, d) {
        const date = new Date(Date.UTC(y, m, d));
        date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
        const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
        return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    /** Show a temporary toast message */
    let toastTimer = null;
    function showToast(msg, duration = 2200) {
        toast.textContent = msg;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('visible'), duration);
    }

    /** Clamp year to valid range */
    function clampYear(y) {
        return Math.max(YEAR_MIN, Math.min(YEAR_MAX, y));
    }

    /** Read current month/year from UI selects into state */
    function syncStateFromUI() {
        const m = parseInt(selMonth.value, 10);
        const y = parseInt(selYear.value,  10);
        if (!isNaN(m) && m >= 0 && m <= 11) state.month = m;
        if (!isNaN(y)) state.year = clampYear(y);
    }

    /** Write state month/year back to UI inputs */
    function syncUIFromState() {
        selMonth.value = state.month;
        selYear.value  = state.year;
    }

    // ── Save note from contenteditable ──────────────────────────────────
    function handleNoteInput(el) {
        const key = el.dataset.key;
        if (!key) return;
        const text = el.innerText; // innerText preserves line breaks cleanly
        if (text.trim() === '') {
            delete state.notes[key];
        } else {
            state.notes[key] = text;
        }
    }

    // ── Build calendar DOM (no innerHTML, all createElement) ────────────
    function buildCalendar() {
        const { month: m, year: y, opts } = state;
        const today = new Date();
        const todayY = today.getFullYear();
        const todayM = today.getMonth();
        const todayD = today.getDate();

        const monFirst   = opts.mondayFirst;
        const showWkn    = opts.weeknum;
        const showPrev   = opts.prevNext;
        const hlToday    = opts.today;
        const shadeWknd  = opts.weekend;

        const dowLabels  = monFirst ? DOW_MON : DOW_SUN;
        const wkndSet    = monFirst ? WKND_MON : WKND_SUN;

        const firstDay      = new Date(y, m, 1).getDay();     // 0=Sun
        const daysInMonth   = new Date(y, m + 1, 0).getDate();
        const daysInPrev    = new Date(y, m, 0).getDate();

        // How many blank cells before day 1
        let startOffset = monFirst
            ? (firstDay === 0 ? 6 : firstDay - 1)
            : firstDay;

        const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
        const colClass   = showWkn ? 'cols-8' : 'cols-7';

        // Fragment to batch DOM operations
        const frag = document.createDocumentFragment();

        // ── Header ────────────────────────────────────────────────────
        const head = document.createElement('div');
        head.className = 'cal-head';

        const titleEl = document.createElement('div');
        titleEl.className = 'cal-title';
        const customTitle = calCustomTitle.value.trim();
        titleEl.textContent = customTitle || `${MONTHS[m]} ${y}`;

        const sub = document.createElement('div');
        sub.className = 'cal-subtitle';
        sub.textContent = 'Rebrixe.com';

        head.appendChild(titleEl);
        head.appendChild(sub);
        frag.appendChild(head);

        // ── Day-of-week row ────────────────────────────────────────────
        const dowRow = document.createElement('div');
        dowRow.className = `cal-dow ${colClass}`;

        if (showWkn) {
            const spacer = document.createElement('div');
            spacer.className = 'dow-cell wkn-spacer';
            dowRow.appendChild(spacer);
        }

        dowLabels.forEach((label, i) => {
            const cell = document.createElement('div');
            cell.className = 'dow-cell' + (wkndSet.has(i) ? ' is-weekend' : '');
            cell.textContent = label;
            dowRow.appendChild(cell);
        });

        frag.appendChild(dowRow);

        // ── Grid ───────────────────────────────────────────────────────
        const grid = document.createElement('div');
        grid.className = `cal-grid ${colClass}`;

        for (let i = 0; i < totalCells; i++) {
            const col = i % 7;

            // Inject week-number cell at start of each row
            if (col === 0 && showWkn) {
                let refDay = i - startOffset + 1;
                let refM = m, refY = y;
                if (refDay < 1) {
                    refDay = daysInPrev + refDay;
                    refM = m - 1;
                    if (refM < 0) { refM = 11; refY = y - 1; }
                } else if (refDay > daysInMonth) {
                    refDay = refDay - daysInMonth;
                    refM = m + 1;
                    if (refM > 11) { refM = 0; refY = y + 1; }
                }
                const wn = isoWeekNum(refY, refM, refDay);
                const wkCell = document.createElement('div');
                wkCell.className = 'wk-num-cell';
                wkCell.textContent = `W${wn}`;
                grid.appendChild(wkCell);
            }

            // Determine day type and number
            const dayIdx = i - startOffset + 1;
            let type, dayNum, cellY, cellM;

            if (dayIdx < 1) {
                type = 'prev';
                dayNum = daysInPrev + dayIdx;
                cellM = m - 1 < 0 ? 11 : m - 1;
                cellY = m - 1 < 0 ? y - 1 : y;
            } else if (dayIdx > daysInMonth) {
                type = 'next';
                dayNum = dayIdx - daysInMonth;
                cellM = m + 1 > 11 ? 0 : m + 1;
                cellY = m + 1 > 11 ? y + 1 : y;
            } else {
                type = 'cur';
                dayNum = dayIdx;
                cellM = m;
                cellY = y;
            }

            const isCur     = type === 'cur';
            const isOther   = !isCur;
            const isWknd    = wkndSet.has(col);
            const isToday   = hlToday && isCur &&
                              dayNum === todayD && m === todayM && y === todayY;

            // Build cell classes
            const classes = ['day-cell'];
            if (!showPrev && isOther) classes.push('is-empty');
            else if (isOther)         classes.push('is-other-month');
            if (isWknd && shadeWknd)  classes.push('is-weekend');
            if (isToday)              classes.push('is-today');

            const cell = document.createElement('div');
            cell.className = classes.join(' ');

            // Day number
            if (isCur || showPrev) {
                const numEl = document.createElement('div');
                numEl.className = 'day-num';

                if (isToday) {
                    const badge = document.createElement('span');
                    badge.className = 'today-badge';
                    badge.textContent = dayNum;
                    numEl.appendChild(badge);
                } else {
                    numEl.textContent = dayNum;
                }
                cell.appendChild(numEl);
            } else {
                // Empty placeholder to maintain grid structure
                const placeholder = document.createElement('div');
                placeholder.className = 'day-num';
                cell.appendChild(placeholder);
            }

            // Note area (contenteditable — prints reliably, no textarea quirks)
            if (isCur) {
                const key = noteKey(y, m, dayNum);
                const noteEl = document.createElement('div');
                noteEl.className = 'day-note';
                noteEl.contentEditable = 'true';
                noteEl.dataset.key = key;
                noteEl.dataset.placeholder = 'notes…';
                noteEl.setAttribute('role', 'textbox');
                noteEl.setAttribute('aria-label', `Notes for ${MONTHS[m]} ${dayNum}`);
                noteEl.setAttribute('aria-multiline', 'true');
                noteEl.spellcheck = false;

                // Restore saved note (use innerText for clean line-break handling)
                if (state.notes[key]) {
                    noteEl.innerText = state.notes[key];
                }

                // Single event listener, attached once here — no duplicate bindings
                noteEl.addEventListener('input', function() {
                    handleNoteInput(this);
                });

                // Prevent Enter from creating <div> or <br> tags — keep plain text
                noteEl.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        // Insert a real newline into the text node
                        const sel = window.getSelection();
                        const range = sel.getRangeAt(0);
                        range.deleteContents();
                        const br = document.createTextNode('\n');
                        range.insertNode(br);
                        range.setStartAfter(br);
                        range.setEndAfter(br);
                        sel.removeAllRanges();
                        sel.addRange(range);
                        handleNoteInput(this);
                    }
                });

                cell.appendChild(noteEl);
            }

            grid.appendChild(cell);
        }

        frag.appendChild(grid);

        // ── Commit to DOM in one operation ─────────────────────────────
        calWrap.replaceChildren(frag);
    }

    // ── Render entry point ─────────────────────────────────────────────
    function render() {
        syncStateFromUI();
        syncUIFromState(); // ensures year clamping is reflected
        buildCalendar();
    }

    // ── Print ──────────────────────────────────────────────────────────
    function printCal() {
        // Clone the rendered calendar into the print anchor (body level)
        // so print CSS can isolate it from the rest of the page cleanly
        printAnchor.replaceChildren(calWrap.cloneNode(true));

        // Convert all contenteditable note divs in clone to static divs
        // (some browsers don't print contenteditable content)
        printAnchor.querySelectorAll('[contenteditable]').forEach(el => {
            el.removeAttribute('contenteditable');
        });

        window.print();

        // Clean up after print dialog closes
        // Use matchMedia to detect end of print
        const mq = window.matchMedia('print');
        const cleanup = (e) => {
            if (!e.matches) {
                printAnchor.replaceChildren();
                mq.removeEventListener('change', cleanup);
            }
        };
        mq.addEventListener('change', cleanup);
    }

    // ── Clear current month's notes ────────────────────────────────────
    function clearNotes() {
        const { month: m, year: y } = state;
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        let cleared = false;
        for (let d = 1; d <= daysInMonth; d++) {
            const key = noteKey(y, m, d);
            if (state.notes[key]) { delete state.notes[key]; cleared = true; }
        }
        // Update live DOM without full re-render
        calWrap.querySelectorAll('.day-note').forEach(el => {
            el.innerText = '';
        });
        showToast(cleared ? '✓ Notes cleared' : 'No notes to clear');
    }

    // ── Copy notes as plain text ───────────────────────────────────────
    function copyNotes() {
        const { month: m, year: y } = state;
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const lines = [`${MONTHS[m]} ${y} — Notes`, '─'.repeat(28)];
        let hasAny = false;

        for (let d = 1; d <= daysInMonth; d++) {
            const key = noteKey(y, m, d);
            const note = (state.notes[key] || '').trim();
            if (note) {
                lines.push(`\nDay ${d}: ${note}`);
                hasAny = true;
            }
        }
        if (!hasAny) lines.push('\n(No notes added this month)');

        const text = lines.join('\n');

        // Robust copy: try Clipboard API, fall back to execCommand
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(() => showToast('📋 Notes copied to clipboard'))
                .catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(ok ? '📋 Notes copied' : '⚠ Copy not supported in this browser');
        } catch {
            showToast('⚠ Could not copy — please copy manually');
        }
    }

    // ── Go to current month ────────────────────────────────────────────
    function goToday() {
        const now = new Date();
        state.month = now.getMonth();
        state.year  = now.getFullYear();
        syncUIFromState();
        buildCalendar();
        showToast('📅 Showing current month');
    }

    // ── Month navigation ───────────────────────────────────────────────
    function shiftMonth(dir) {
        syncStateFromUI();
        state.month += dir;
        if (state.month > 11) { state.month = 0;  state.year++; }
        if (state.month < 0)  { state.month = 11; state.year--; }
        state.year = clampYear(state.year);
        syncUIFromState();
        buildCalendar();
    }

    // ── Toggle option pill ─────────────────────────────────────────────
    function toggleOpt(key, checkbox, pill) {
        state.opts[key] = checkbox.checked;
        pill.classList.toggle('active', checkbox.checked);
        buildCalendar(); // no full render needed — state already synced
    }

    // ── Year input debounce ────────────────────────────────────────────
    // Prevents rebuilding calendar on every keystroke while typing a year
    let yearDebounceTimer = null;
    function onYearInput() {
        clearTimeout(yearDebounceTimer);
        yearDebounceTimer = setTimeout(render, 400);
    }

    // ── Wire up all event listeners ────────────────────────────────────
    function attachEvents() {
        document.getElementById('btnPrev').addEventListener('click', () => shiftMonth(-1));
        document.getElementById('btnNext').addEventListener('click', () => shiftMonth(1));
        document.getElementById('btnPrint').addEventListener('click', printCal);
        document.getElementById('btnClear').addEventListener('click', clearNotes);
        document.getElementById('btnToday').addEventListener('click', goToday);
        document.getElementById('btnCopy').addEventListener('click', copyNotes);

        selMonth.addEventListener('change', render);
        selYear.addEventListener('input', onYearInput);
        // Also handle blur to catch paste/click-spin changes
        selYear.addEventListener('change', render);

        // Custom title: re-render on input (debounced to avoid mid-word flicker)
        let titleTimer = null;
        calCustomTitle.addEventListener('input', () => {
            clearTimeout(titleTimer);
            titleTimer = setTimeout(() => {
                // Only update the title element, not the full calendar
                const titleEl = calWrap.querySelector('.cal-title');
                if (titleEl) {
                    const v = calCustomTitle.value.trim();
                    titleEl.textContent = v || `${MONTHS[state.month]} ${state.year}`;
                }
            }, 150);
        });

        // Option pills
        const pillMap = [
            ['weeknum',     'optWeeknum',     'pillWeeknum'    ],
            ['today',       'optToday',       'pillToday'      ],
            ['weekend',     'optWeekend',     'pillWeekend'    ],
            ['mondayFirst', 'optMondayFirst', 'pillMondayFirst'],
            ['prevNext',    'optPrevNext',    'pillPrevNext'   ]
        ];
        pillMap.forEach(([key, cbId, pillId]) => {
            const cb   = document.getElementById(cbId);
            const pill = document.getElementById(pillId);
            cb.addEventListener('change', () => toggleOpt(key, cb, pill));
        });
    }

    // ── Init ───────────────────────────────────────────────────────────
    (function init() {
        const now = new Date();
        state.month = now.getMonth();
        state.year  = now.getFullYear();

        // Sync initial option checkboxes to state
        state.opts.today   = document.getElementById('optToday').checked;
        state.opts.weekend = document.getElementById('optWeekend').checked;

        syncUIFromState();
        attachEvents();
        buildCalendar();
    })();
    </script>
    <script src="../nav.js"></script>
</body>
</html>
