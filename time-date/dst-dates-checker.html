/*
 * ═══════════════════════════════════════════════════════════════════
 *  DST DATABASE
 *
 *  RELIABILITY POLICY:
 *  A country is only included if its DST rule can be expressed as a
 *  fixed Nth-occurrence-of-a-weekday-in-a-Gregorian-month rule that
 *  has been stable and is not subject to annual government override
 *  or non-Gregorian calendar alignment.
 *
 *  REMOVED for reliability:
 *  - Iran:    follows Solar Hijri calendar; Gregorian mapping drifts
 *             by days each year. Cannot be expressed as a fixed rule.
 *  - Israel:  DST dates are set by government decree each year and
 *             are not determined by a fixed algorithmic rule.
 *  - Chile:   Uses Saturday midnight transitions; the Saturday-rule
 *             interacts poorly with the standard Nth-weekday algorithm
 *             and the end date wraps to the following year in a way
 *             that requires separate validation data each year.
 *  - Morocco: DST is suspended annually during Ramadan, making the
 *             effective DST period non-contiguous and unpredictable
 *             from a static rule alone.
 *
 *  isSouth: true — Southern Hemisphere. DST season spans the calendar
 *  year boundary (starts in the local spring, ends in the local autumn
 *  of the FOLLOWING calendar year). The endDate is always fetched from
 *  year+1. dstDays is the calendar-day span between start and end.
 *
 *  Rule fields:
 *    month  : 1–12
 *    week   : 1–5, or -1 for "last occurrence"
 *    dow    : 0 = Sunday … 6 = Saturday
 *    hour   : local clock hour at which the transition occurs
 *    label  : human-readable rule description
 * ═══════════════════════════════════════════════════════════════════
 */

/* ═══════════════════════════════════════════════════════
   CORE DST CALCULATION
   getNthDow — returns the correct calendar date for the
   Nth occurrence of a given weekday in a given month/year.
   week = -1 → last occurrence.
═══════════════════════════════════════════════════════ */
function getNthDow(year, month, week, dow) {
    if (week === -1) {
        /* Last occurrence: start from the last day and walk back */
        const lastDay = new Date(year, month, 0).getDate(); /* 0 = day before month+1 = last day of month */
        let d = lastDay;
        while (new Date(year, month - 1, d).getDay() !== dow) d--;
        return new Date(year, month - 1, d);
    }
    /* First find the 1st occurrence of `dow` in the month */
    let d = 1;
    while (new Date(year, month - 1, d).getDay() !== dow) d++;
    /* Then advance by (week-1) full weeks */
    d += (week - 1) * 7;
    return new Date(year, month - 1, d);
}

/* ── Date formatting helpers ─────────────────────────────────────── */
function fmtShort(d) {
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function fmtWeekday(d) {
    return d.toLocaleDateString('en-GB', { weekday:'long' });
}
function fmtLong(d) {
    return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

/* ── Fraction of year a date represents (for timeline bar) ───────── */
function yearFrac(d, year) {
    const start = new Date(year, 0, 1).getTime();
    const end   = new Date(year + 1, 0, 1).getTime();
    return (d.getTime() - start) / (end - start);
}

/* ═══════════════════════════════════════════════════════
   CURRENTLY IN DST — computed independently of display year.

   This checks whether the country is in DST RIGHT NOW
   (using UTC midnight today as reference, which avoids
   browser-timezone skew around midnight transitions).

   For Northern Hemisphere: DST window is startDate..endDate
   within the same calendar year.

   For Southern Hemisphere: DST window spans year boundary.
   We check two possible seasons:
     Season A: startDate from thisYear, endDate from thisYear+1
     Season B: startDate from thisYear-1, endDate from thisYear
   Today is in DST if it falls within either season.
═══════════════════════════════════════════════════════ */
function isCurrentlyInDST(c) {
    if (!c.hasDST) return false;
    /* Use UTC midnight today to avoid local timezone influence */
    const now = new Date();
    const todayUTC = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
    const ty = now.getUTCFullYear();

    if (!c.isSouth) {
        const s = getNthDow(ty, c.start.month, c.start.week, c.start.dow);
        const e = getNthDow(ty, c.end.month,   c.end.week,   c.end.dow);
        return todayUTC >= s && todayUTC < e;
    } else {
        /* Check season A (ty → ty+1) and season B (ty-1 → ty) */
        const sA = getNthDow(ty,     c.start.month, c.start.week, c.start.dow);
        const eA = getNthDow(ty + 1, c.end.month,   c.end.week,   c.end.dow);
        const sB = getNthDow(ty - 1, c.start.month, c.start.week, c.start.dow);
        const eB = getNthDow(ty,     c.end.month,   c.end.week,   c.end.dow);
        return (todayUTC >= sA && todayUTC < eA) || (todayUTC >= sB && todayUTC < eB);
    }
}

/* ═══════════════════════════════════════════════════════
   DAYS UNTIL helper — positive = future, negative = past
═══════════════════════════════════════════════════════ */
function daysUntil(target) {
    const now = new Date();
    const todayUTC = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
    const tUTC     = new Date(Date.UTC(target.getFullYear(), target.getMonth(), target.getDate()));
    return Math.round((tUTC - todayUTC) / 86400000);
}

function daysLabel(n, eventName) {
    if (n === 0) return 'Today';
    if (n > 0)  return `in ${n}d`;
    return `${Math.abs(n)}d ago`;
}

/* ═══════════════════════════════════════════════════════
   TIMELINE BUILDER
   Northern hemisphere: single DST band between sFrac and eFrac.
   Southern hemisphere: two bands — one from sFrac to year-end,
   one from year-start to eFrac.  eFrac is clamped to [0,1] and
   represents the end date within the *display* year (which,
   for SH, is year+1 expressed as a fraction of year+1).
═══════════════════════════════════════════════════════ */
function buildTimeline(c, startDate, endDate, displayYear) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let dstSegments = '';

    if (!c.isSouth) {
        const sf = (yearFrac(startDate, displayYear) * 100).toFixed(2);
        const ef = (yearFrac(endDate,   displayYear) * 100).toFixed(2);
        const w  = (ef - sf).toFixed(2);
        dstSegments = `
            <div class="tl-dst" style="left:${sf}%;width:${w}%"></div>
            <div class="tl-label" style="left:calc(${sf}% + 6px)">☀ DST</div>`;
    } else {
        /* Band 1: startDate → Dec 31 of displayYear */
        const sf  = (yearFrac(startDate, displayYear) * 100).toFixed(2);
        const w1  = (100 - parseFloat(sf)).toFixed(2);
        /* Band 2: Jan 1 → endDate, expressed within displayYear axis.
           endDate is in year+1, so we express it as a fraction of displayYear
           by computing (endDate - Jan1(displayYear+1)) / yearLen(displayYear+1)
           then mapping that fraction back to the bar's coordinate space as a
           proportion of the display year axis. We take the simpler approach:
           use the numeric day-of-year of endDate within its own year.        */
        const endInNextYear = endDate; /* always year+1 for SH */
        const doyEnd = Math.round((endInNextYear - new Date(endInNextYear.getFullYear(), 0, 1)) / 86400000);
        const daysInNextYear = (endInNextYear.getFullYear() % 4 === 0 &&
            (endInNextYear.getFullYear() % 100 !== 0 || endInNextYear.getFullYear() % 400 === 0)) ? 366 : 365;
        /* Scale doyEnd to 0–100 on the bar */
        const w2 = ((doyEnd / daysInNextYear) * 100).toFixed(2);
        dstSegments = `
            <div class="tl-dst" style="left:${sf}%;width:${w1}%"></div>
            <div class="tl-dst" style="left:0%;width:${w2}%"></div>
            <div class="tl-label" style="left:6px">☀ Jan–Apr ${displayYear + 1}</div>
            <div class="tl-label" style="left:calc(${sf}% + 6px)">☀ DST starts</div>`;
    }

    return `
        <div class="timeline-wrap">
            <div class="section-label">DST window — calendar year ${displayYear}</div>
            <div class="timeline-bar">
                <div class="tl-base"></div>
                ${dstSegments}
            </div>
            <div class="tl-months">${months.map(m =>
                `<div class="tl-month">${m}</div>`).join('')}
            </div>
        </div>`;
}

/* ═══════════════════════════════════════════════════════
   MAIN CHECK
═══════════════════════════════════════════════════════ */
function runCheck() {
    if (!selectedCountry) return;
    const c    = selectedCountry;
    const year = parseInt(document.getElementById('yearSel').value, 10);

    document.getElementById('emptyHint').style.display = 'none';
    const panel = document.getElementById('resultPanel');
    panel.style.display = 'block';

    drawMap(c);
    updateMapOverlay(c);

    /* Summary bar — common to both DST and no-DST */
    const summaryHTML = `
        <div class="summary-bar">
            <div class="country-flag-big">${c.flag}</div>
            <div class="summary-info">
                <div class="summary-country">${c.name}</div>
                <div class="summary-tz">Standard: ${c.std}${c.dst ? ' · DST: ' + c.dst : ''}</div>
            </div>
            ${c.hasDST
                ? `<span class="dst-status-badge badge-observes">✓ Observes DST</span>`
                : `<span class="dst-status-badge badge-no-dst">✗ No DST</span>`}
        </div>`;

    if (!c.hasDST) {
        panel.innerHTML = summaryHTML + `
            <div class="no-dst-panel">
                <div class="no-dst-icon">🌍</div>
                <div class="no-dst-title">${c.name} does not observe DST</div>
                <div class="no-dst-sub">
                    ${c.note || 'Clocks remain at the same UTC offset year-round.'}
                    <br><br>
                    <strong style="color:#fff">Standard offset:</strong> ${c.std}
                </div>
            </div>`;
        return;
    }

    /*
     * Compute transition dates.
     *
     * Northern Hemisphere: both dates from `year`.
     * Southern Hemisphere: start from `year`, end from `year+1`
     * because the DST season spans the calendar year boundary.
     */
    const startDate = getNthDow(year,                    c.start.month, c.start.week, c.start.dow);
    const endDate   = getNthDow(c.isSouth ? year + 1 : year, c.end.month,   c.end.week,   c.end.dow);

    /* Sanity check — endDate must be after startDate */
    if (endDate <= startDate) {
        panel.innerHTML = summaryHTML + `
            <div class="no-dst-panel">
                <div class="no-dst-icon">⚠️</div>
                <div class="no-dst-title">Calculation error for ${year}</div>
                <div class="no-dst-sub">An unexpected date ordering occurred. Please try a different year.</div>
            </div>`;
        return;
    }

    const dstDays = Math.round((endDate - startDate) / 86400000);
    const stdDays = 365 - dstDays; /* approximate; does not adjust for leap years */

    /* Days until each transition */
    const dToStart = daysUntil(startDate);
    const dToEnd   = daysUntil(endDate);

    function statDays(n) {
        if (n === 0) return 'Today!';
        if (n > 0)  return `+${n}d`;
        return `${Math.abs(n)}d ago`;
    }

    /* Currently in DST — always based on real today, not display year */
    const inDST = isCurrentlyInDST(c);
    const dstNowHTML = `
        <div class="dst-now-bar ${inDST ? 'in-dst' : 'not-dst'}">
            ${inDST
                ? `☀ ${c.name} is <strong>currently in DST</strong> — offset is ${c.dst}`
                : `🌙 ${c.name} is currently on <strong>standard time</strong> — offset is ${c.std}`}
        </div>`;

    panel.innerHTML = summaryHTML + dstNowHTML + `
        <div class="dst-hero">
            <div class="dst-card start">
                <div class="dst-card-label">⬆ DST Starts — Clocks Forward</div>
                <div class="dst-card-date">${fmtShort(startDate)}</div>
                <div class="dst-card-day">${fmtWeekday(startDate)}</div>
                <div class="clock-change"><span class="arrow">↑</span> ${c.start.label} · ${c.start.hour}:00 local</div>
            </div>
            <div class="dst-card end">
                <div class="dst-card-label">⬇ DST Ends — Clocks Back</div>
                <div class="dst-card-date">${fmtShort(endDate)}</div>
                <div class="dst-card-day">${fmtWeekday(endDate)}</div>
                <div class="clock-change"><span class="arrow">↓</span> ${c.end.label} · ${c.end.hour}:00 local</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-num">${dstDays}</div>
                <div class="stat-label">DST Days</div>
            </div>
            <div class="stat-item">
                <div class="stat-num">${stdDays}</div>
                <div class="stat-label">Std. Time Days</div>
            </div>
            <div class="stat-item">
                <div class="stat-num">${statDays(dToStart)}</div>
                <div class="stat-label">DST Start</div>
            </div>
            <div class="stat-item">
                <div class="stat-num">${statDays(dToEnd)}</div>
                <div class="stat-label">DST End</div>
            </div>
        </div>

        ${buildTimeline(c, startDate, endDate, year)}

        ${c.note ? `<div class="note-box">💡 ${c.note}</div>` : ''}

        <div class="action-row">
            <button class="btn-action primary" onclick="copyDST()">Copy DST Dates</button>
            <button class="btn-action" onclick="stepYear(1)">Next Year →</button>
            <button class="btn-action" onclick="stepYear(-1)">← Prev Year</button>
        </div>`;
}

function stepYear(delta) {
    const sel = document.getElementById('yearSel');
    const min = parseInt(sel.options[sel.options.length - 1].value, 10);
    const max = parseInt(sel.options[0].value, 10);
    const next = parseInt(sel.value, 10) + delta;
    if (next >= min && next <= max) { sel.value = next; runCheck(); }
}

function copyDST() {
    if (!selectedCountry) return;
    const c    = selectedCountry;
    const year = parseInt(document.getElementById('yearSel').value, 10);
    let text;
    if (!c.hasDST) {
        text = `DST Dates — ${c.name} (${year})\n${c.name} does not observe Daylight Saving Time.\nStandard Time: ${c.std}`;
    } else {
        const s = getNthDow(year,                        c.start.month, c.start.week, c.start.dow);
        const e = getNthDow(c.isSouth ? year + 1 : year, c.end.month,   c.end.week,   c.end.dow);
        text = `DST Dates — ${c.name} (${year})\nDST Starts: ${fmtLong(s)}\nDST Ends:   ${fmtLong(e)}\nDST offset: ${c.dst}  ·  Standard: ${c.std}`;
    }
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.btn-action.primary');
        const orig = btn.innerText;
        btn.innerText = '✓ Copied!';
        setTimeout(() => { btn.innerText = orig; }, 2000);
    }).catch(() => {
        /* Clipboard API not available (non-HTTPS etc.) — silent fail */
    });
}

/* ═══════════════════════════════════════════════════════
   WORLD MAP — deterministic dot-grid canvas renderer.

   Land dots are rendered with a seeded LCG pseudo-random
   function keyed on (lon, lat) so the map never flickers
   or changes on resize/redraw.  No Math.random() is used
   in the render path.
═══════════════════════════════════════════════════════ */
const canvas = document.getElementById('worldMap');
const ctx    = canvas.getContext('2d');

/* Simple LCG seeded with an integer — deterministic jitter */
function lcg(seed) {
    let s = (seed >>> 0) ^ 0x1234ABCD;
    return function() {
        s = Math.imul(1664525, s) + 1013904223 >>> 0;
        return s / 0xFFFFFFFF;
    };
}

function lonToX(lon, W) { return (lon + 180) / 360 * W; }
function latToY(lat, H) { return (90 - lat) / 180 * H; }

/* Land bounding boxes: [minLon, maxLon, minLat, maxLat, step] */
const LANDS = [
    [-168, -50,  10,  75, 0.07], /* North America      */
    [ -95, -75,   8,  20, 0.10], /* Central America    */
    [ -85, -35, -60,  15, 0.06], /* South America      */
    [ -12,  40,  35,  72, 0.07], /* Europe             */
    [ -18,  52, -38,  38, 0.05], /* Africa             */
    [  35,  80,  10,  55, 0.05], /* West Asia          */
    [  80, 145, -10,  60, 0.05], /* East & SE Asia     */
    [ 113, 154, -40, -10, 0.07], /* Australia          */
    [ 125, 146,  30,  46, 0.10], /* Japan / Korea      */
    [ -10,   2,  50,  62, 0.12], /* UK / Ireland       */
    [ -60, -20,  60,  85, 0.05], /* Greenland          */
    [  95, 141, -10,   6, 0.08], /* Indonesia          */
    [ 165, 178, -48, -34, 0.10], /* New Zealand        */
];

function drawLandDots(W, H) {
    ctx.fillStyle = 'rgba(148,163,184,0.18)';
    LANDS.forEach(([minLon, maxLon, minLat, maxLat, step]) => {
        const lonRange = maxLon - minLon;
        const latRange = maxLat - minLat;
        const lonStep  = step * lonRange;
        const latStep  = step * latRange;
        for (let lon = minLon; lon < maxLon; lon += lonStep) {
            for (let lat = minLat; lat < maxLat; lat += latStep) {
                /* Seed based on grid position — deterministic every render */
                const seed = ((lon + 180) * 100 | 0) * 10000 + ((lat + 90) * 100 | 0);
                const rng  = lcg(seed);
                const jLon = lon + (rng() - 0.5) * lonStep * 0.5;
                const jLat = lat + (rng() - 0.5) * latStep * 0.5;
                const x    = lonToX(jLon, W);
                const y    = latToY(jLat, H);
                ctx.beginPath();
                ctx.arc(x, y, 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    });
}

function drawMap(highlight) {
    const W = canvas.offsetWidth  || canvas.parentElement.offsetWidth;
    const H = canvas.offsetHeight || 260;
    canvas.width  = W;
    canvas.height = H;
    ctx.clearRect(0, 0, W, H);

    /* Grid lines */
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth   = 0.5;
    for (let lon = -180; lon <= 180; lon += 30) {
        const x = lonToX(lon, W);
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let lat = -90; lat <= 90; lat += 30) {
        const y = latToY(lat, H);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    drawLandDots(W, H);

    /* Small dots for all countries except highlighted */
    DST_DB.forEach(c => {
        if (highlight && c.name === highlight.name) return;
        const x = lonToX(c.lng, W);
        const y = latToY(c.lat, H);
        ctx.fillStyle = c.hasDST ? 'rgba(34,197,94,0.45)' : 'rgba(100,116,139,0.25)';
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    });

    /* Highlighted country */
    if (highlight) {
        const x = lonToX(highlight.lng, W);
        const y = latToY(highlight.lat, H);

        /* Glow ring — flat radial gradient */
        const grd = ctx.createRadialGradient(x, y, 0, x, y, 28);
        grd.addColorStop(0, highlight.hasDST ? 'rgba(34,197,94,0.35)' : 'rgba(100,116,139,0.35)');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(x, y, 28, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = highlight.hasDST ? '#22c55e' : '#64748b';
        ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();

        /* Country label */
        const labelRight = x > W * 0.75;
        ctx.font      = 'bold 11px Inter, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.textAlign = labelRight ? 'right' : 'left';
        const lx = labelRight ? x - 14 : x + 14;
        ctx.fillText(`${highlight.flag} ${highlight.name}`, lx, y - 10);

        ctx.font      = '9px Inter, sans-serif';
        ctx.fillStyle = 'rgba(148,163,184,0.8)';
        ctx.fillText(highlight.std, lx, y + 4);
        ctx.textAlign = 'left';
    }
}

function updateMapOverlay(c) {
    document.getElementById('mapOverlay').innerHTML = `
        <div class="map-badge">${c.flag} <span>${c.name}</span></div>
        <div class="map-badge">Lat <span>${c.lat}°</span> Lon <span>${c.lng}°</span></div>
        <div class="map-badge">${c.hasDST
            ? `<span style="color:#22c55e">✓ DST</span>`
            : `<span style="color:#64748b">✗ No DST</span>`}</div>`;
}

function resizeCanvas() {
    drawMap(selectedCountry);
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);
</script>
<script src="../nav.js"></script>
</body>
