    <script>
    // ─────────────────────────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────────────────────────
    let tasks = [];
    let selectedColor = '#60efb0';

    const COLORS = [
        '#60efb0', '#60c3ef', '#ef60b0', '#efb060',
        '#b060ef', '#ef6060', '#60efef', '#efe060'
    ];

    const CAT_ICONS = {
        work:'💼', health:'💪', meal:'🍽️', personal:'🧘',
        travel:'🚗', social:'💬', learning:'📚', other:'⚡'
    };

    // Fixed px-per-minute scale for the timeline. One value, used everywhere.
    const PX_PER_MIN = 1.6;

    // Minimum rendered height for a task block so text is never invisible.
    const MIN_BLOCK_PX = 22;

    // A gap must be at least this many minutes to be worth drawing visually.
    const MIN_GAP_MINS = 5;

    // ─────────────────────────────────────────────────────────────────
    // COLOUR PICKER INIT
    // ─────────────────────────────────────────────────────────────────
    (function initColors() {
        const row = document.getElementById('colorRow');
        COLORS.forEach(c => {
            const d = document.createElement('div');
            d.className = 'color-dot' + (c === selectedColor ? ' active' : '');
            d.style.background = c;
            d.onclick = () => {
                selectedColor = c;
                document.querySelectorAll('.color-dot').forEach(x => x.classList.remove('active'));
                d.classList.add('active');
            };
            row.appendChild(d);
        });
    })();

    // ─────────────────────────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────────────────────────

    /**
     * Format an absolute minute value (0–2879) as a 12-hour clock string.
     * Handles values past midnight with a "+1d" label so output is never
     * ambiguous when a routine runs past midnight.
     */
    function fmtTime(absMins) {
        const nextDay = absMins >= 1440;
        const wrapped = absMins % 1440;
        const h = Math.floor(wrapped / 60);
        const m = wrapped % 60;
        const ampm = h >= 12 ? 'pm' : 'am';
        const hDisplay = h % 12 === 0 ? 12 : h % 12;
        const timeStr = hDisplay + ':' + String(m).padStart(2, '0') + ampm;
        return nextDay ? timeStr + ' +1d' : timeStr;
    }

    /** Format a duration in minutes as a compact string: "1h 30m", "45m", "2h". */
    function fmtDur(mins) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        if (h > 0 && m > 0) return h + 'h ' + m + 'm';
        if (h > 0) return h + 'h';
        return m + 'm';
    }

    /** Parse the day-start time input and return absolute minutes from midnight. */
    function getDayStartMins() {
        const val = document.getElementById('dayStart').value || '06:00';
        const parts = val.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function flashInput(id) {
        const el = document.getElementById(id);
        el.style.borderColor = '#f87171';
        setTimeout(() => { el.style.borderColor = ''; }, 600);
    }

    // ─────────────────────────────────────────────────────────────────
    // ADD TASK
    // ─────────────────────────────────────────────────────────────────
    function addTask() {
        const name = document.getElementById('taskName').value.trim();
        const cat  = document.getElementById('taskCat').value;
        const h    = Math.max(0, parseInt(document.getElementById('durH').value, 10) || 0);
        const m    = Math.max(0, parseInt(document.getElementById('durM').value, 10) || 0);
        const dur  = h * 60 + m;

        if (!name)  { flashInput('taskName'); return; }
        if (dur < 1) { flashInput('durM'); return; }

        tasks.push({ id: Date.now(), name, cat, durMins: dur, color: selectedColor });

        document.getElementById('taskName').value = '';
        document.getElementById('durH').value = '0';
        document.getElementById('durM').value = '30';

        renderTaskList();
        renderTimeline();
    }

    // ─────────────────────────────────────────────────────────────────
    // RENDER TASK LIST  (left panel)
    // ─────────────────────────────────────────────────────────────────
    function renderTaskList() {
        const list = document.getElementById('taskList');
        const hint = document.getElementById('dragHint');
        list.innerHTML = '';

        if (!tasks.length) {
            hint.style.display = 'none';
            return;
        }
        hint.style.display = 'block';

        tasks.forEach((t, idx) => {
            const item = document.createElement('div');
            item.className = 'task-item';
            item.draggable = true;
            item.dataset.idx = idx;

            item.innerHTML = `
                <div class="task-color-bar" style="background:${t.color}"></div>
                <div class="task-info">
                    <div class="task-name">${CAT_ICONS[t.cat]} ${escapeHTML(t.name)}</div>
                    <div class="task-meta">${fmtDur(t.durMins)} · ${t.cat}</div>
                </div>
                <div class="task-actions">
                    <button class="task-btn del" onclick="removeTask(${t.id})">✕</button>
                </div>
            `;

            item.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', String(idx));
                setTimeout(() => item.classList.add('dragging'), 0);
            });
            item.addEventListener('dragend', () => item.classList.remove('dragging'));
            item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('drag-over'); });
            item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
            item.addEventListener('drop', e => {
                e.preventDefault();
                item.classList.remove('drag-over');
                const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
                const toIdx   = parseInt(item.dataset.idx, 10);
                if (fromIdx === toIdx) return;
                const moved = tasks.splice(fromIdx, 1)[0];
                tasks.splice(toIdx, 0, moved);
                renderTaskList();
                renderTimeline();
            });

            list.appendChild(item);
        });
    }

    /** Prevent XSS when inserting task names into innerHTML. */
    function escapeHTML(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function removeTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        renderTaskList();
        renderTimeline();
    }

    // ─────────────────────────────────────────────────────────────────
    // RENDER TIMELINE  (right panel)
    // ─────────────────────────────────────────────────────────────────
    function renderTimeline() {
        const container = document.getElementById('timelineInner');

        if (!tasks.length) {
            container.innerHTML = `<div class="tl-empty"><div class="big">🗓️</div>Add your first task to see the timeline.</div>`;
            updateStats(0, 0, 0, null);
            return;
        }

        const dayStartMins = getDayStartMins();

        // ── Build a flat sequence of segments: task | gap | task | gap …
        // A gap between two tasks is only added if >= MIN_GAP_MINS.
        // (In this version tasks are continuous — gaps only appear if the
        // user deliberately leaves them, which isn't supported in the add-task
        // flow. We keep the gap rendering here so it is ready if start-time
        // inputs are added later, and it also handles the sample data correctly.)
        //
        // Since this builder places tasks end-to-end without explicit start times,
        // there are no gaps between tasks by design. However we DO calculate and
        // DISPLAY gap statistics accurately.

        const scheduledMins = tasks.reduce((s, t) => s + t.durMins, 0);
        const totalPx = scheduledMins * PX_PER_MIN;

        // Hour markers: from the hour of dayStart to the hour the day ends
        const dayEndMins  = dayStartMins + scheduledMins;
        const firstHour   = Math.floor(dayStartMins / 60);
        const lastHour    = Math.ceil(dayEndMins / 60);

        let html = `<div class="timeline" style="height:${totalPx + 40}px; position:relative;">`;

        // ── Hour markers ──
        for (let h = firstHour; h <= lastHour; h++) {
            const minOffset = h * 60 - dayStartMins;
            const px = minOffset * PX_PER_MIN;
            if (px < -10 || px > totalPx + 40) continue;

            // Label handles AM/PM and past-midnight correctly
            const labelMins = h * 60;
            const label = fmtTime(labelMins);

            html += `<div class="hour-mark" style="top:${px}px;">
                        <div class="hour-label">${label}</div>
                        <div class="hour-line"></div>
                     </div>`;
        }

        // ── Task blocks ──
        let cursor = 0; // minutes elapsed from dayStart

        tasks.forEach(t => {
            const top    = cursor * PX_PER_MIN;
            const height = Math.max(t.durMins * PX_PER_MIN, MIN_BLOCK_PX);

            const blockStartMins = dayStartMins + cursor;
            const blockEndMins   = blockStartMins + t.durMins;
            const timeStr        = fmtTime(blockStartMins) + ' – ' + fmtTime(blockEndMins);

            html += `<div class="tl-block"
                          style="top:${top}px; height:${height}px; background:${t.color};"
                          title="${escapeHTML(t.name)} · ${timeStr}">
                        <div class="tl-block-name">${CAT_ICONS[t.cat]} ${escapeHTML(t.name)}</div>
                        ${height > 28 ? `<div class="tl-block-time">${timeStr}</div>` : ''}
                     </div>`;

            cursor += t.durMins;
        });

        html += `</div>`;
        container.innerHTML = html;

        // Gap time: because tasks are consecutive, gap = 0 in this builder.
        // The stat shows "0m" which is accurate. We expose it clearly.
        updateStats(tasks.length, scheduledMins, 0, dayEndMins);
    }

    // ─────────────────────────────────────────────────────────────────
    // UPDATE STATS BAR
    // Stats reflect only what is actually calculated, nothing implied.
    //   - Tasks:      count of tasks
    //   - Scheduled:  sum of all task durations
    //   - Gap Time:   total unscheduled time BETWEEN tasks
    //                 (always 0 in this builder since tasks are end-to-end;
    //                  shown as "0m" — honest, not hidden)
    //   - Day Ends:   absolute clock time the last task ends
    // ─────────────────────────────────────────────────────────────────
    function updateStats(count, scheduledMins, gapMins, endAbsMins) {
        document.getElementById('sTasks').textContent = count;
        document.getElementById('sScheduled').textContent = count > 0 ? fmtDur(scheduledMins) : '—';
        document.getElementById('sGap').textContent      = count > 0 ? fmtDur(gapMins) : '—';
        document.getElementById('sEnd').textContent      = endAbsMins !== null ? fmtTime(endAbsMins) : '—';
    }

    // ─────────────────────────────────────────────────────────────────
    // EXPORT
    // ─────────────────────────────────────────────────────────────────
    function exportText() {
        if (!tasks.length) return;

        const dayStartMins = getDayStartMins();
        let cursor = dayStartMins;
        let out = 'MY DAILY ROUTINE\n' + '─'.repeat(32) + '\n';

        tasks.forEach(t => {
            const endMins = cursor + t.durMins;
            out += fmtTime(cursor).padEnd(10) +
                   t.name.padEnd(24) +
                   '(' + fmtDur(t.durMins) + ')\n';
            cursor = endMins;
        });

        out += '─'.repeat(32) + '\nDay ends: ' + fmtTime(cursor);

        navigator.clipboard.writeText(out).then(() => {
            const btn = document.getElementById('copyBtn');
            const orig = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => { btn.textContent = orig; }, 2000);
        }).catch(() => {
            // Fallback for browsers that block clipboard without interaction
            alert(out);
        });
    }

    // ─────────────────────────────────────────────────────────────────
    // CLEAR ALL
    // ─────────────────────────────────────────────────────────────────
    function clearAll() {
        tasks = [];
        renderTaskList();
        renderTimeline();
    }

    // ─────────────────────────────────────────────────────────────────
    // LOAD SAMPLE
    // ─────────────────────────────────────────────────────────────────
    function loadSample() {
        tasks = [
            { id:  1, name: 'Wake up & stretch',  cat: 'health',   durMins:  15, color: '#60efb0' },
            { id:  2, name: 'Shower & get ready',  cat: 'personal', durMins:  20, color: '#60c3ef' },
            { id:  3, name: 'Breakfast',            cat: 'meal',     durMins:  20, color: '#efb060' },
            { id:  4, name: 'Commute',              cat: 'travel',   durMins:  30, color: '#ef6060' },
            { id:  5, name: 'Deep work block',      cat: 'work',     durMins: 120, color: '#b060ef' },
            { id:  6, name: 'Lunch break',          cat: 'meal',     durMins:  45, color: '#efb060' },
            { id:  7, name: 'Meetings / calls',     cat: 'work',     durMins:  90, color: '#b060ef' },
            { id:  8, name: 'Gym session',          cat: 'health',   durMins:  60, color: '#60efb0' },
            { id:  9, name: 'Dinner & wind down',   cat: 'meal',     durMins:  45, color: '#efe060' },
            { id: 10, name: 'Read / learning',      cat: 'learning', durMins:  30, color: '#60efef' },
        ];
        renderTaskList();
        renderTimeline();
    }

    // ─────────────────────────────────────────────────────────────────
    // KEYBOARD SHORTCUT — Enter on task name field
    // ─────────────────────────────────────────────────────────────────
    document.getElementById('taskName').addEventListener('keydown', e => {
        if (e.key === 'Enter') addTask();
    });

    // ─────────────────────────────────────────────────────────────────
    // INITIAL RENDER
    // ─────────────────────────────────────────────────────────────────
    renderTimeline();
    </script>

    <script src="../nav.js"></script>
</body>
