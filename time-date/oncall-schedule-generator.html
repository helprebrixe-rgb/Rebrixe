    <script>
    /* ═══════════════════════════════════════════════════════════════
       ON-CALL SCHEDULE GENERATOR — v2.0  (bulletproof rewrite)
       Fixes: weighted pool desync, back-to-back logic, date timezone,
              export button feedback, validation, handoff removal.
    ═══════════════════════════════════════════════════════════════ */

    // ── State ─────────────────────────────────────────────────────
    let scheduleData  = [];   // final schedule rows
    let lastPeople    = [];   // people snapshot used for last generate
    let lastCounts    = {};   // primary shift counts

    // ── Init ──────────────────────────────────────────────────────
    (function init() {
        // Snap start date to nearest upcoming Monday (local time, no timezone shift)
        const today = localToday();
        const dow   = today.getDay();                       // 0=Sun
        const daysUntilMon = dow === 1 ? 0 : (8 - dow) % 7 || 7;
        const nextMon = addDays(today, daysUntilMon);
        document.getElementById('startDate').value = isoDate(nextMon);

        ['Alice', 'Bob', 'Carlos', 'Dana', 'Eve'].forEach(n => addPerson(n));
    })();

    // ── Date helpers (all local-time, no UTC drift) ────────────────
    function localToday() {
        const d = new Date();
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function parseLocalDate(str) {
        // 'YYYY-MM-DD' → local midnight (avoids UTC-to-local shift)
        const [y, m, d] = str.split('-').map(Number);
        return new Date(y, m - 1, d);
    }

    function addDays(date, n) {
        const d = new Date(date);
        d.setDate(d.getDate() + n);
        return d;
    }

    function isoDate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${dd}`;
    }

    function displayDate(d) {
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    // ── People management ─────────────────────────────────────────
    function addPerson(name = '') {
        const list = document.getElementById('peopleList');
        const row  = document.createElement('div');
        row.className = 'person-row';
        row.innerHTML = `
            <input class="person-input" type="text"
                   placeholder="Name or handle"
                   value="${escapeAttr(name)}"
                   maxlength="32"
                   aria-label="Team member name">
            <input class="person-weight" type="number"
                   value="1" min="1" max="10"
                   aria-label="Shift weight"
                   title="Shift weight (higher = more shifts)">
            <span class="person-badge" aria-hidden="true">weight</span>
            <button class="btn-remove" onclick="removePerson(this)"
                    aria-label="Remove person" title="Remove">×</button>
        `;
        list.appendChild(row);
    }

    function removePerson(btn) {
        const list = document.getElementById('peopleList');
        if (list.children.length <= 2) {
            showError('You need at least 2 people to generate a schedule.');
            return;
        }
        btn.closest('.person-row').remove();
        clearError();
    }

    function getPeople() {
        const rows   = document.querySelectorAll('.person-row');
        const result = [];
        rows.forEach(r => {
            const name   = r.querySelector('.person-input').value.trim();
            const weight = Math.max(1, Math.min(10, parseInt(r.querySelector('.person-weight').value) || 1));
            if (name) result.push({ name, weight });
        });
        return result;
    }

    // ── Error display ─────────────────────────────────────────────
    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.classList.add('visible');
    }
    function clearError() {
        document.getElementById('errorMsg').classList.remove('visible');
    }

    // ── Validation ────────────────────────────────────────────────
    function validate(people, numPeriods, startDateStr) {
        if (people.length < 2)          return 'Add at least 2 people with names.';
        if (!startDateStr)              return 'Please set a start date.';
        if (isNaN(numPeriods) || numPeriods < 1)
                                        return 'Periods must be at least 1.';
        if (numPeriods > 104)           return 'Maximum 104 periods to keep the schedule readable.';
        // Check for duplicate names
        const names = people.map(p => p.name.toLowerCase());
        if (new Set(names).size !== names.length)
                                        return 'Each team member must have a unique name.';
        return null; // valid
    }

    // ── Core: fair weighted round-robin pool ──────────────────────
    /**
     * Build a balanced weighted sequence for `totalSlots` picks.
     *
     * Strategy: true round-robin over an expanded pool.
     * - Expand each person by their weight into a pool.
     * - Optionally shuffle the pool once (for randomised starting order).
     * - Cycle through the pool with a single pointer; never advance it
     *   inside backup selection — backup uses its own independent pointer.
     *
     * This guarantees:
     *   - Primary counts exactly match weights over full cycles.
     *   - Backup never desynchronises the primary pointer.
     *   - No-back-to-back works without breaking fairness.
     */
    function buildSequence(people, totalSlots, noBack2Back, wantBackup, doShuffle) {
        // Expand pool by weight
        let pool = [];
        people.forEach(p => {
            for (let w = 0; w < p.weight; w++) pool.push(p.name);
        });
        if (doShuffle) pool = fisherYates([...pool]);

        const counts    = {};
        people.forEach(p => { counts[p.name] = 0; });

        const slots = [];
        let primaryPtr = 0;
        let backupPtr  = 1;   // starts offset; independent of primary

        for (let i = 0; i < totalSlots; i++) {
            // ── Pick primary ──
            let primary = pool[primaryPtr % pool.length];

            // No back-to-back: scan forward until we find a different person
            // Hard limit: scan at most pool.length steps to avoid infinite loop
            if (noBack2Back && i > 0 && people.length > 1) {
                let safety = 0;
                while (primary === slots[i - 1].primary && safety < pool.length) {
                    primaryPtr++;
                    safety++;
                    primary = pool[primaryPtr % pool.length];
                }
            }
            counts[primary]++;
            primaryPtr++;

            // ── Pick backup (independent pointer, never touches primaryPtr) ──
            let backup = null;
            if (wantBackup && people.length > 1) {
                // Ensure backupPtr is always ahead of primaryPtr conceptually
                // but fully independent — just needs to avoid same person as primary
                let safety = 0;
                backup = pool[backupPtr % pool.length];
                while (backup === primary && safety < pool.length) {
                    backupPtr++;
                    safety++;
                    backup = pool[backupPtr % pool.length];
                }
                backupPtr++;
            }

            slots.push({ primary, backup });
        }

        return { slots, counts };
    }

    function fisherYates(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ── Main generate ─────────────────────────────────────────────
    function generate() {
        clearError();

        const people       = getPeople();
        const numPeriods   = parseInt(document.getElementById('numPeriods').value);
        const shiftType    = document.getElementById('shiftType').value;
        const startDateStr = document.getElementById('startDate').value;
        const wantBackup   = document.getElementById('optBackup').checked;
        const noBack2Back  = document.getElementById('optNoBack2Back').checked;
        const doShuffle    = document.getElementById('optShuffle').checked;

        const validErr = validate(people, numPeriods, startDateStr);
        if (validErr) { showError(validErr); return; }

        const startDate = parseLocalDate(startDateStr);
        const shiftDays = { weekly: 7, daily: 1, biweekly: 14 }[shiftType];
        const totalSlots = numPeriods;

        const { slots, counts } = buildSequence(people, totalSlots, noBack2Back, wantBackup, doShuffle);

        // Build display rows
        scheduleData = slots.map((s, i) => {
            const slotStart = addDays(startDate, i * shiftDays);
            const slotEnd   = addDays(slotStart, shiftDays - 1);

            const slotLabel = {
                daily:    `Day ${i + 1}`,
                biweekly: `Sprint ${i + 1}`,
                weekly:   `Week ${i + 1}`,
            }[shiftType];

            return {
                slot:      i + 1,
                label:     slotLabel,
                startDate: slotStart,
                endDate:   slotEnd,
                primary:   s.primary,
                backup:    s.backup,
            };
        });

        lastPeople = people;
        lastCounts = counts;

        renderResults(people, counts, shiftType, wantBackup);
    }

    // ── Render ────────────────────────────────────────────────────
    function renderResults(people, counts, shiftType, wantBackup) {
        document.getElementById('resultArea').classList.add('visible');

        // ── Stats ──
        const total     = scheduleData.length;
        const vals      = Object.values(counts);
        const maxShifts = Math.max(...vals);
        const minShifts = Math.min(...vals);
        // Fairness: 100% if perfectly even; lower the bigger the gap relative to max
        const fairScore = maxShifts === minShifts
            ? '100%'
            : Math.round((1 - (maxShifts - minShifts) / maxShifts) * 100) + '%';
        const slotLabel = { daily: 'Days', biweekly: 'Sprints', weekly: 'Weeks' }[shiftType];

        document.getElementById('statsStrip').innerHTML = `
            <div class="stat-cell">
                <div class="stat-num">${people.length}</div>
                <div class="stat-lbl">People</div>
            </div>
            <div class="stat-cell">
                <div class="stat-num">${total}</div>
                <div class="stat-lbl">${slotLabel} Covered</div>
            </div>
            <div class="stat-cell">
                <div class="stat-num">${fairScore}</div>
                <div class="stat-lbl">Fairness Score</div>
            </div>
            <div class="stat-cell">
                <div class="stat-num">${maxShifts - minShifts}</div>
                <div class="stat-lbl">Max Shift Gap</div>
            </div>
        `;

        // ── Table ──
        document.getElementById('schedHead').innerHTML = `
            <tr>
                <th>${slotLabel.slice(0, -1)}</th>
                <th>Dates</th>
                <th>Primary On-Call</th>
                ${wantBackup ? '<th>Backup</th>' : ''}
            </tr>`;

        document.getElementById('schedBody').innerHTML = scheduleData.map(s => `
            <tr>
                <td class="td-slot">${escapeHTML(s.label)}</td>
                <td class="td-dates">${displayDate(s.startDate)} – ${displayDate(s.endDate)}</td>
                <td><span class="person-tag primary-tag">${escapeHTML(s.primary)}</span></td>
                ${wantBackup ? `<td><span class="person-tag backup-tag">${escapeHTML(s.backup || '—')}</span></td>` : ''}
            </tr>`
        ).join('');

        // ── Fairness bars ──
        document.getElementById('fairnessWrap').innerHTML = people.map(p => `
            <div class="fairness-row">
                <div class="f-name" title="${escapeAttr(p.name)}">${escapeHTML(p.name)}</div>
                <div class="f-bar-wrap">
                    <div class="f-bar" style="width:${Math.round((counts[p.name] || 0) / maxShifts * 100)}%"></div>
                </div>
                <div class="f-count">${counts[p.name] || 0} shift${counts[p.name] !== 1 ? 's' : ''}</div>
            </div>`
        ).join('');

        document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── Exports ───────────────────────────────────────────────────
    function exportSlack() {
        if (!scheduleData.length) return;
        const wantBackup = document.getElementById('optBackup').checked;
        const lines = ['*🚨 On-Call Schedule*', ''];
        scheduleData.forEach(s => {
            let line = `*${s.label}* (${displayDate(s.startDate)} – ${displayDate(s.endDate)}): @${s.primary}`;
            if (wantBackup && s.backup) line += `  _(backup: @${s.backup})_`;
            lines.push(line);
        });
        copyToClipboard(lines.join('\n'), 'btnSlack', 'Copied!');
    }

    function exportCSV() {
        if (!scheduleData.length) return;
        const wantBackup = document.getElementById('optBackup').checked;
        const cols = ['Slot', 'Start Date', 'End Date', 'Primary'];
        if (wantBackup) cols.push('Backup');
        const rows = scheduleData.map(s => {
            const base = [s.label, isoDate(s.startDate), isoDate(s.endDate), s.primary];
            if (wantBackup) base.push(s.backup || '');
            return base.map(csvCell).join(',');
        });
        const csvContent = [cols.join(','), ...rows].join('\n');

        try {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url  = URL.createObjectURL(blob);
            const a    = Object.assign(document.createElement('a'), {
                href:     url,
                download: 'oncall-schedule.csv',
            });
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            flashButton('btnCSV', 'Downloaded!');
        } catch (e) {
            showError('CSV download failed. Try copying for Slack or Notion instead.');
        }
    }

    function exportNotion() {
        if (!scheduleData.length) return;
        const wantBackup = document.getElementById('optBackup').checked;
        const header = wantBackup
            ? '| Slot | Dates | Primary | Backup |\n|------|-------|---------|--------|'
            : '| Slot | Dates | Primary |\n|------|-------|---------|';
        const rows = scheduleData.map(s => {
            const dates = `${displayDate(s.startDate)} – ${displayDate(s.endDate)}`;
            const base  = `| ${s.label} | ${dates} | ${s.primary} |`;
            return wantBackup ? `${base} ${s.backup || '—'} |` : base;
        });
        copyToClipboard([header, ...rows].join('\n'), 'btnNotion', 'Copied!');
    }

    // ── Clipboard helper ──────────────────────────────────────────
    function copyToClipboard(text, btnId, successLabel) {
        if (!navigator.clipboard) {
            // Fallback for HTTP or older browsers
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                flashButton(btnId, successLabel);
            } catch (e) {
                showError('Could not copy to clipboard. Please copy the text manually.');
            }
            return;
        }
        navigator.clipboard.writeText(text)
            .then(() => flashButton(btnId, successLabel))
            .catch(() => showError('Clipboard access denied. Please copy manually.'));
    }

    function flashButton(btnId, label) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        const orig = btn.textContent;
        btn.textContent = '✓ ' + label;
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = orig;
            btn.classList.remove('copied');
        }, 2000);
    }

    // ── Reset ─────────────────────────────────────────────────────
    function resetAll() {
        scheduleData = [];
        lastPeople   = [];
        lastCounts   = {};
        document.getElementById('resultArea').classList.remove('visible');
        clearError();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── Safety: escape helpers ────────────────────────────────────
    function escapeHTML(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    function escapeAttr(str) {
        return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function csvCell(val) {
        const s = String(val);
        return /[,"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }
