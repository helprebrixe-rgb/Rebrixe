                year:      'numeric',
                month:     '2-digit',
                day:       '2-digit',
                hour:      '2-digit',
                minute:    '2-digit',
                second:    '2-digit',
                hour12:    false,
            });
            const parts = fmt.formatToParts(utcDate);
            const p = {};
            parts.forEach(({ type, value }) => { p[type] = value; });

            // Handle hour24 edge: "24" → treat as next midnight (rare but handle it)
            let h = parseInt(p.hour, 10);
            if (h === 24) h = 0;

            const localMs = Date.UTC(
                parseInt(p.year,   10),
                parseInt(p.month,  10) - 1,
                parseInt(p.day,    10),
                h,
                parseInt(p.minute, 10),
                parseInt(p.second, 10)
            );
            return Math.round((localMs - now) / 60000);
        } catch {
            return 0;
        }
    }

    /**
     * Convert a UTC hour (0-47) to local fractional hour for a timezone.
     * Returns a float so 5:30 offset gives correct decimals.
     * We use 0-47 range internally to detect next-day wrapping.
     */
    function utcToLocalMinutes(utcHour, iana) {
        const offsetMin = getOffsetMinutes(iana);
        // work in minutes to avoid float issues
        return ((utcHour * 60 + offsetMin) % (24 * 60) + 24 * 60) % (24 * 60);
    }

    /** Return the wall-clock hour (0-23) for a given UTC hour in a timezone */
    function utcToLocalHour(utcHour, iana) {
        return Math.floor(utcToLocalMinutes(utcHour, iana) / 60);
    }

    /**
     * Format an integer UTC hour as a local time string for a timezone.
     * e.g. 14 in Asia/Kolkata → "7:30 PM"
     */
    function fmtUtcHourInTz(utcHour, iana) {
        const totalMin = utcToLocalMinutes(utcHour, iana);
        const h = Math.floor(totalMin / 60) % 24;
        const m = Math.round(totalMin % 60);
        const period = h >= 12 ? 'PM' : 'AM';
        const h12    = h % 12 || 12;
        return m === 0
            ? `${h12}:00 ${period}`
            : `${h12}:${String(m).padStart(2,'0')} ${period}`;
    }

    /** Format a plain integer hour (0-24) as 12h AM/PM */
    function fmtHour(h) {
        h = ((h % 24) + 24) % 24;
        const period = h >= 12 ? 'PM' : 'AM';
        const h12    = h % 12 || 12;
        return `${h12}:00 ${period}`;
    }

    /** Get UTC offset label e.g. "UTC+5:30" */
    function getOffsetLabel(iana) {
        const offsetMin = getOffsetMinutes(iana);
        const sign = offsetMin >= 0 ? '+' : '-';
        const abs  = Math.abs(offsetMin);
        const h    = Math.floor(abs / 60);
        const m    = abs % 60;
        return m === 0
            ? `UTC${sign}${h}`
            : `UTC${sign}${h}:${String(m).padStart(2,'0')}`;
    }

    /** Get current local time string for a timezone */
    function getLocalTimeStr(iana) {
        try {
            return new Date().toLocaleTimeString('en-US', {
                timeZone: iana,
                hour:     '2-digit',
                minute:   '2-digit',
                hour12:   true,
            });
        } catch {
            return '--:--';
        }
    }

    /* =========================================================
       CORE OVERLAP CALCULATION
       Operates entirely in UTC minutes (0–1439) for precision.
       Returns { blocks, validCities, wsH, weH }
    ========================================================= */
    function calcOverlap(validCities, wsH, weH) {
        // For each UTC minute (granularity: 1 min, but we check per hour slot)
        // Check: is this UTC hour within business hours for ALL cities?
        // We use per-minute offsets, checking the full hour slot [utcH, utcH+1).

        // Actually we iterate UTC hours 0-23 and check if the
        // local wall-clock time falls within [wsH, weH) for every city.
        // Using minute-precise offsets handles half-hour timezones.

        const overlapHours = []; // list of UTC hours (0-23) that are overlap

        for (let utcH = 0; utcH < 24; utcH++) {
            const allInWindow = validCities.every(city => {
                const totalLocalMin = utcToLocalMinutes(utcH, TZ_DB[city].iana);
                const localH = totalLocalMin / 60; // float
                // The hour slot [localH, localH+1) must be fully within [wsH, weH)
                return localH >= wsH && (localH + 1) <= weH;
            });
            if (allInWindow) overlapHours.push(utcH);
        }

        // Build contiguous blocks. Since hours are 0-23, we don't wrap midnight
        // (global teams rarely have overlap spanning midnight UTC).
        const blocks = [];
        if (overlapHours.length === 0) return { blocks, validCities, wsH, weH };

        let start = overlapHours[0];
        let prev  = overlapHours[0];
        for (let i = 1; i <= overlapHours.length; i++) {
            const cur = overlapHours[i];
            if (cur !== prev + 1) {
                blocks.push({ start, end: prev + 1, duration: prev + 1 - start });
                if (cur !== undefined) { start = cur; }
            }
            prev = cur;
        }

        // Sort by duration descending (longest = best)
        blocks.sort((a, b) => b.duration - a.duration);

        return { blocks, overlapHours, validCities, wsH, weH };
    }

    /* =========================================================
       RENDER CITIES GRID
    ========================================================= */
    function renderCities() {
        const grid = document.getElementById('citiesGrid');
        grid.innerHTML = cities.map((c, i) => {
            const tz = TZ_DB[c];
            return `
            <div class="city-row" id="crow-${i}">
                <span class="city-num">${i + 1}</span>
                <div class="city-wrap">
                    <input
                        class="city-input"
                        id="ci-${i}"
                        value="${escHtml(c)}"
                        placeholder="City name…"
                        autocomplete="off"
                        spellcheck="false"
                        data-idx="${i}"
                    >
                    <div class="suggestions" id="sugg-${i}" role="listbox" hidden></div>
                </div>
                <span class="city-tz-badge" id="badge-${i}">${tz ? tz.abbr : ''}</span>
                ${cities.length > 2
                    ? `<button class="city-remove" data-remove="${i}" aria-label="Remove ${escHtml(c)}">✕</button>`
                    : ''}
            </div>`;
        }).join('');

        document.getElementById('addCityBtn').disabled = cities.length >= 5;

        // Attach events after DOM insertion
        cities.forEach((_, i) => {
            const input = document.getElementById(`ci-${i}`);
            input.addEventListener('input',   () => handleInput(i));
            input.addEventListener('focus',   () => handleInput(i));
            input.addEventListener('blur',    () => handleBlur(i));
            input.addEventListener('keydown', (e) => handleKey(e, i));
        });

        // Remove buttons
        grid.querySelectorAll('[data-remove]').forEach(btn => {
            btn.addEventListener('click', () => {
                cities.splice(parseInt(btn.dataset.remove, 10), 1);
                renderCities();
            });
        });
    }

    /* =========================================================
       AUTOCOMPLETE
    ========================================================= */
    let activeSuggIdx = -1;
    let blurTimeout   = null;

    function handleInput(i) {
        const val  = document.getElementById(`ci-${i}`).value.trim().toLowerCase();
        const sugg = document.getElementById(`sugg-${i}`);
        activeSuggIdx = -1;

        if (!val) { sugg.hidden = true; return; }

        const matches = CITY_NAMES
            .filter(c => c.toLowerCase().includes(val))
            .slice(0, 8);

        if (!matches.length) { sugg.hidden = true; return; }

        sugg.innerHTML = matches.map((c, idx) =>
            `<div class="sugg-item" role="option" data-city="${escHtml(c)}" data-idx="${idx}">
                <span>${escHtml(c)}</span>
                <span class="sugg-tz">${TZ_DB[c].abbr}</span>
            </div>`
        ).join('');

        sugg.querySelectorAll('.sugg-item').forEach(item => {
            item.addEventListener('mousedown', (e) => {
                e.preventDefault(); // prevent blur from firing before mousedown
                selectCity(i, item.dataset.city);
            });
        });

        sugg.hidden = false;
    }

    function handleBlur(i) {
        // Delay so mousedown on sugg-item fires first
        blurTimeout = setTimeout(() => {
            const sugg = document.getElementById(`sugg-${i}`);
            if (sugg) sugg.hidden = true;
            // Commit typed value if it matches a known city (case-insensitive)
            const val = document.getElementById(`ci-${i}`)?.value.trim();
            if (val) {
                const match = CITY_NAMES.find(c => c.toLowerCase() === val.toLowerCase());
                cities[i] = match || val;
                const badge = document.getElementById(`badge-${i}`);
                if (badge) badge.textContent = match ? TZ_DB[match].abbr : '';
            }
        }, 160);
    }

    function handleKey(e, i) {
        const sugg  = document.getElementById(`sugg-${i}`);
        const items = sugg?.querySelectorAll('.sugg-item');
        if (!items?.length || sugg.hidden) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeSuggIdx = Math.min(activeSuggIdx + 1, items.length - 1);
            highlightSugg(items);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeSuggIdx = Math.max(activeSuggIdx - 1, 0);
            highlightSugg(items);
        } else if (e.key === 'Enter' && activeSuggIdx >= 0) {
            e.preventDefault();
            selectCity(i, items[activeSuggIdx].dataset.city);
        } else if (e.key === 'Escape') {
            sugg.hidden = true;
        }
    }

    function highlightSugg(items) {
        items.forEach((el, j) => {
            el.classList.toggle('active', j === activeSuggIdx);
        });
    }

    function selectCity(i, name) {
        cities[i] = name;
        const input = document.getElementById(`ci-${i}`);
        const badge = document.getElementById(`badge-${i}`);
        const sugg  = document.getElementById(`sugg-${i}`);
        if (input) input.value = name;
        if (badge) badge.textContent = TZ_DB[name]?.abbr || '';
        if (sugg)  sugg.hidden = true;
        if (blurTimeout) { clearTimeout(blurTimeout); blurTimeout = null; }
    }

    /* =========================================================
       PRESETS
    ========================================================= */
    function loadPreset(key) {
        cities = [...PRESETS[key]];
        renderCities();
        findOverlap();
    }

    /* =========================================================
       MAIN: FIND OVERLAP
    ========================================================= */
    function findOverlap() {
        // Sync any manually typed values
        cities.forEach((_, i) => {
            const el = document.getElementById(`ci-${i}`);
            if (!el) return;
            const val = el.value.trim();
            const match = CITY_NAMES.find(c => c.toLowerCase() === val.toLowerCase());
            cities[i] = match || val;
        });

        const validCities = cities.filter(c => TZ_DB[c]);
        const panel = document.getElementById('resultPanel');
        const hint  = document.getElementById('statusHint');

        if (validCities.length < 2) {
            panel.classList.remove('visible');
            panel.innerHTML = '';
            hint.style.display = 'block';
            hint.innerHTML = cities.filter(Boolean).length > 0
                ? '<span class="status-error">No recognised cities found. Try "New York", "London", or "Mumbai".</span>'
                : 'Add at least 2 cities above and click Find Overlap ↑';
            lastResult = null;
            return;
        }

        const wsH = parseInt(document.getElementById('workStart').value, 10);
        const weH = parseInt(document.getElementById('workEnd').value,   10);

        if (wsH >= weH) {
            hint.style.display = 'block';
            hint.innerHTML = '<span class="status-error">Work end time must be after start time.</span>';
            return;
        }

        const result = calcOverlap(validCities, wsH, weH);
        lastResult = result;

        const { blocks, overlapHours } = result;

        // Gather city display data
        const now = new Date();
        const cityData = validCities.map(city => ({
            city,
            iana:       TZ_DB[city].iana,
            abbr:       TZ_DB[city].abbr,
            localTime:  getLocalTimeStr(TZ_DB[city].iana),
            offsetLabel: getOffsetLabel(TZ_DB[city].iana),
        }));

        let html = '';

        /* ── Current local times ── */
        html += `<div class="section-label">Current Local Times</div>`;
        html += `<div class="city-times-grid">`;
        cityData.forEach(d => {
            html += `
            <div class="ct-card">
                <div class="ct-city">${escHtml(d.city)}</div>
                <div class="ct-time">${d.localTime}</div>
                <div class="ct-tz">${d.abbr}</div>
                <div class="ct-offset">${d.offsetLabel}</div>
            </div>`;
        });
        html += `</div>`;

        /* ── Timeline ── */
        html += `<div class="section-label">24-Hour Work Window</div>`;
        html += buildTimeline(cityData, wsH, weH, overlapHours || []);

        /* ── Overlap windows ── */
        if (blocks.length === 0) {
            html += `
            <div class="no-overlap">
                <strong>No Overlap Found</strong>
                These cities have no shared business hours with the current settings.
                Try widening the work window or removing the most distant city.
            </div>`;
        } else {
            html += `<div class="section-label">Overlap Windows (UTC)</div>`;
            html += `<div class="overlap-slots">`;
            blocks.forEach((b, idx) => {
                const isBest = idx === 0;
                html += `
                <div class="slot-pill${isBest ? ' best' : ''}">
                    ${isBest ? '<span class="slot-badge">Best</span>' : ''}
                    <div class="slot-time">${fmtHour(b.start)} – ${fmtHour(b.end)} UTC</div>
                    <div class="slot-duration">${b.duration}h window</div>
                </div>`;
            });
            html += `</div>`;

            /* ── Best window local breakdown ── */
            const best = blocks[0];
            html += `<div class="section-label">Best Window — Local Times</div>`;
            html += `<div class="city-times-grid">`;
            cityData.forEach(d => {
                const startStr = fmtUtcHourInTz(best.start, d.iana);
                const endStr   = fmtUtcHourInTz(best.end,   d.iana);
                html += `
                <div class="ct-card" style="border-color:var(--primary);">
                    <div class="ct-city">${escHtml(d.city)}</div>
                    <div class="ct-time" style="font-size:1rem;">${startStr} – ${endStr}</div>
                    <div class="ct-tz">${d.abbr} · ${best.duration}h</div>
                </div>`;
            });
            html += `</div>`;
        }

        /* ── Actions ── */
        html += `
        <div class="action-row">
            <button class="btn-action primary" id="copyBtn">Copy Best Window</button>
            <button class="btn-action" id="resetBtn">✕ Reset</button>
        </div>`;

        panel.innerHTML = html;
        panel.classList.add('visible');
        hint.style.display = 'none';

        // Bind action buttons
        document.getElementById('copyBtn')?.addEventListener('click', copyResult);
        document.getElementById('resetBtn')?.addEventListener('click', resetAll);
    }

    /* =========================================================
       TIMELINE BUILDER
       Renders a per-city 24h bar with work window and overlap.
       All positions are in LOCAL time space (0-24h = 0-100%).
    ========================================================= */
    function buildTimeline(cityData, wsH, weH, overlapHours) {
        let html = `<div class="timeline-wrap">`;

        // Hour labels: 12A, 3A, 6A, 9A, 12P, 3P, 6P, 9P, 12A
        const hourLabels = ['12A','3A','6A','9A','12P','3P','6P','9P','12A'];
        html += `
        <div class="timeline-header">
            <div></div>
            <div class="hour-labels">
                ${hourLabels.map(l => `<span>${l}</span>`).join('')}
            </div>
        </div>`;

        cityData.forEach(d => {
            html += `<div class="tl-row">
                <div>
                    <div class="tl-city-name">${escHtml(d.city)}</div>
                    <div class="tl-city-time">${d.localTime}</div>
                </div>
                <div class="tl-bar-wrap">`;

            // Work window segment — in LOCAL time space
            const wLeft  = (wsH / 24 * 100).toFixed(3);
            const wWidth = ((weH - wsH) / 24 * 100).toFixed(3);
            html += `<div class="tl-segment seg-work" style="left:${wLeft}%;width:${wWidth}%"></div>`;

            // Overlap segments — convert each UTC overlap hour to local position
            overlapHours.forEach(utcH => {
                const localMin = utcToLocalMinutes(utcH, d.iana);
                const left  = (localMin / (24 * 60) * 100).toFixed(3);
                const width = (60 / (24 * 60) * 100).toFixed(3); // 1 hour = 1/24 = ~4.167%
                html += `<div class="tl-segment seg-overlap" style="left:${left}%;width:${width}%"></div>`;
            });

            html += `</div></div>`;
        });

        html += `</div>`;
        return html;
    }

    /* =========================================================
       COPY RESULT
    ========================================================= */
    function copyResult() {
        if (!lastResult || lastResult.blocks.length === 0) {
            copyToClipboard('No overlapping business hours found.');
            return;
        }
        const { blocks, validCities } = lastResult;
        const best = blocks[0];
        const lines = validCities.map(c => {
            const startStr = fmtUtcHourInTz(best.start, TZ_DB[c].iana);
            const endStr   = fmtUtcHourInTz(best.end,   TZ_DB[c].iana);
            return `  ${c}: ${startStr} – ${endStr}`;
        });
        const text = `Best Meeting Window (${best.duration}h):\n${lines.join('\n')}\n\nFound at Rebrixe.co`;
        copyToClipboard(text, 'copyBtn', 'Copy Best Window');
    }

    function copyToClipboard(text, btnId, originalLabel) {
        if (!navigator.clipboard) {
            // Fallback for non-secure contexts
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity  = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            } catch { /* silent */ }
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            if (!btnId) return;
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.textContent = '✓ Copied!';
            setTimeout(() => { btn.textContent = originalLabel; }, 2000);
        }).catch(() => { /* silent */ });
    }

    /* =========================================================
       RESET
    ========================================================= */
    function resetAll() {
        cities = ["New York", "London", "Mumbai"];
        document.getElementById('workStart').value = '9';
        document.getElementById('workEnd').value   = '18';
        lastResult = null;
        renderCities();
        const panel = document.getElementById('resultPanel');
        panel.classList.remove('visible');
        panel.innerHTML = '';
        const hint = document.getElementById('statusHint');
        hint.style.display = 'block';
        hint.innerHTML = 'Add your cities above and click Find Overlap ↑';
    }

    /* =========================================================
       UTILITY: HTML ESCAPE
    ========================================================= */
    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    /* =========================================================
       INIT
    ========================================================= */
    (function init() {
        // Read URL params (shared links)
        const params = new URLSearchParams(window.location.search);
        const urlCitiesRaw = params.get('cities');
        if (urlCitiesRaw) {
            const urlCities = urlCitiesRaw.split(',').map(s => s.trim()).filter(c => TZ_DB[c]);
            if (urlCities.length >= 2) cities = urlCities;
        }
        const ws = params.get('ws');
        const we = params.get('we');
        if (ws && ['7','8','9','10'].includes(ws)) {
            document.getElementById('workStart').value = ws;
        }
        if (we && ['16','17','18','19','20'].includes(we)) {
            document.getElementById('workEnd').value = we;
        }

        renderCities();

        // Only auto-run if we have valid cities
        if (cities.filter(c => TZ_DB[c]).length >= 2) {
            findOverlap();
        }

        // Wire up buttons that live outside the dynamic result panel
        document.getElementById('findBtn').addEventListener('click', findOverlap);
        document.getElementById('addCityBtn').addEventListener('click', () => {
            if (cities.length < 5) {
                cities.push('');
                renderCities();
                setTimeout(() => document.getElementById(`ci-${cities.length - 1}`)?.focus(), 50);
            }
        });

        // Preset pills
        document.querySelectorAll('[data-preset]').forEach(pill => {
            pill.addEventListener('click', () => loadPreset(pill.dataset.preset));
        });

        // Work hour selects: auto re-run on change
        document.getElementById('workStart').addEventListener('change', findOverlap);
        document.getElementById('workEnd').addEventListener('change', findOverlap);
    })();
    </script>
    <script src="../nav.js"></script>
</body>
