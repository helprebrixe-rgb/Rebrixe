    <script>
    (() => {
        'use strict';

        /* ── Presets ── */
        const PRESETS = {
            fulltime:  { h: 8,  d: 5, w: 52 },
            parttime:  { h: 4,  d: 5, w: 52 },
            '3day':    { h: 8,  d: 3, w: 52 },
            freelance: { h: 8,  d: 5, w: 50 },
            contract:  { h: 8,  d: 5, w: 48 },
        };

        /* ── DOM refs ── */
        const $ = id => document.getElementById(id);

        const salaryAmountEl = $('salaryAmount');
        const salaryPeriodEl = $('salaryPeriod');
        const hoursDayEl     = $('hoursDay');
        const daysWeekEl     = $('daysWeek');
        const weeksYearEl    = $('weeksYear');
        const taxToggleEl    = $('taxToggle');
        const taxRowEl       = $('taxRow');
        const taxRateEl      = $('taxRate');
        const resultPanelEl  = $('resultPanel');
        const emptyHintEl    = $('emptyHint');

        /* ── Formatters ── */
        const fmtDec  = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fmtInt  = n => n.toLocaleString('en-US', { minimumFractionDigits: 0,  maximumFractionDigits: 0  });

        /* ── Validation helpers ── */
        function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

        function validateFields() {
            let valid = true;

            // Salary amount
            const rawAmt = parseFloat(salaryAmountEl.value);
            if (salaryAmountEl.value === '' || isNaN(rawAmt) || rawAmt <= 0) {
                // silent if empty; only flag if user typed something invalid
                if (salaryAmountEl.value !== '' && !isNaN(rawAmt) && rawAmt <= 0) {
                    showFieldError('salaryAmount', 'salaryError', 'Must be greater than 0');
                } else {
                    clearFieldError('salaryAmount', 'salaryError');
                }
                valid = false;
            } else {
                clearFieldError('salaryAmount', 'salaryError');
            }

            // Hours/day: 0.5–24
            const hd = parseFloat(hoursDayEl.value);
            if (isNaN(hd) || hd < 0.5 || hd > 24) {
                showFieldError('hoursDay', 'hoursDayError', 'Between 0.5 and 24');
                valid = false;
            } else {
                clearFieldError('hoursDay', 'hoursDayError');
            }

            // Days/week: 1–7 (integers only)
            const dw = parseInt(daysWeekEl.value, 10);
            if (isNaN(dw) || dw < 1 || dw > 7) {
                showFieldError('daysWeek', 'daysWeekError', 'Between 1 and 7');
                valid = false;
            } else {
                clearFieldError('daysWeek', 'daysWeekError');
                daysWeekEl.value = dw; // snap to integer
            }

            // Weeks/year: 1–52 (integers only)
            const wy = parseInt(weeksYearEl.value, 10);
            if (isNaN(wy) || wy < 1 || wy > 52) {
                showFieldError('weeksYear', 'weeksYearError', 'Between 1 and 52');
                valid = false;
            } else {
                clearFieldError('weeksYear', 'weeksYearError');
                weeksYearEl.value = wy;
            }

            // Tax rate: 0–99 (only checked if toggle on)
            if (taxToggleEl.checked) {
                const tx = parseFloat(taxRateEl.value);
                if (isNaN(tx) || tx < 0 || tx > 99) {
                    taxRateEl.classList.add('field-error');
                    valid = false;
                } else {
                    taxRateEl.classList.remove('field-error');
                    taxRateEl.value = clamp(tx, 0, 99);
                }
            }

            return valid;
        }

        function showFieldError(inputId, errorId, msg) {
            $(inputId).classList.add('field-error');
            $(errorId).textContent = msg;
        }

        function clearFieldError(inputId, errorId) {
            $(inputId).classList.remove('field-error');
            $(errorId).textContent = '';
        }

        /* ── Main calculation ── */
        function calculate() {
            if (!validateFields()) {
                resultPanelEl.classList.remove('visible');
                emptyHintEl.style.display = '';
                return;
            }

            const amount = parseFloat(salaryAmountEl.value);
            const period = salaryPeriodEl.value;
            const hd     = parseFloat(hoursDayEl.value);
            const dw     = parseInt(daysWeekEl.value, 10);
            const wy     = parseInt(weeksYearEl.value, 10);

            const totalHoursYear = hd * dw * wy;
            const totalDaysYear  = dw * wy;

            // Guard against division by zero (shouldn't happen after validation, but belt-and-suspenders)
            if (totalHoursYear <= 0) return;

            // Normalise to annual
            let annual;
            switch (period) {
                case 'annual':  annual = amount; break;
                case 'monthly': annual = amount * 12; break;
                case 'weekly':  annual = amount * wy; break;
                case 'daily':   annual = amount * totalDaysYear; break;
                default:        annual = amount;
            }

            const hourly  = annual / totalHoursYear;
            const daily   = annual / totalDaysYear;
            const weekly  = annual / wy;
            const monthly = annual / 12;

            // Tax
            const useTax  = taxToggleEl.checked;
            const taxPct  = useTax ? clamp(parseFloat(taxRateEl.value) || 0, 0, 99) : 0;
            const taxMult = 1 - taxPct / 100;

            renderResult({ annual, hourly, daily, weekly, monthly, hd, dw, wy, totalHoursYear, useTax, taxPct, taxMult });

            resultPanelEl.classList.add('visible');
            emptyHintEl.style.display = 'none';
        }

        /* ── Render ── */
        function renderResult({ annual, hourly, daily, weekly, monthly, hd, dw, wy, totalHoursYear, useTax, taxPct, taxMult }) {
            const schedSummary = `${hd}h/day · ${dw} day${dw !== 1 ? 's' : ''}/week · ${wy} weeks/year = ${fmtInt(totalHoursYear)} hrs/year`;

            const taxHTML = useTax ? `
                <div class="section-label">Gross vs. Take-Home</div>
                <div class="tax-compare">
                    <div class="tc-cell">
                        <div class="tc-label">Gross Hourly</div>
                        <div class="tc-val">$${fmtDec(hourly)}</div>
                    </div>
                    <div class="tc-cell">
                        <div class="tc-label">After ${taxPct}% Tax</div>
                        <div class="tc-val deducted">$${fmtDec(hourly * taxMult)}</div>
                    </div>
                    <div class="tc-cell">
                        <div class="tc-label">Gross Annual</div>
                        <div class="tc-val">$${fmtInt(annual)}</div>
                    </div>
                    <div class="tc-cell">
                        <div class="tc-label">Take-Home Annual</div>
                        <div class="tc-val deducted">$${fmtInt(annual * taxMult)}</div>
                    </div>
                </div>` : '';

            const insights = [
                { label: '30-Min Task',           value: hourly * 0.5 },
                { label: '1-Hour Block',           value: hourly },
                { label: '1 Full Work Day',        value: daily },
                { label: '1 Week of Work',         value: weekly },
                { label: '1 Month of Work',        value: monthly },
            ];

            const insightChips = insights.map(i =>
                `<div class="insight-chip"><strong>$${fmtDec(i.value)}</strong>${i.label}</div>`
            ).join('');

            resultPanelEl.innerHTML = `
                <div class="rate-hero">
                    <div class="rate-label">Your Hourly Rate</div>
                    <div class="rate-value">$${fmtDec(hourly)}</div>
                    <div class="rate-sub">${schedSummary}</div>
                </div>

                <div class="section-label">Full Breakdown</div>
                <div class="breakdown-grid">
                    <div class="bd-cell">
                        <div class="bd-num" data-key="hourly">$${fmtDec(hourly)}</div>
                        <div class="bd-unit">Per Hour</div>
                    </div>
                    <div class="bd-cell">
                        <div class="bd-num" data-key="daily">$${fmtDec(daily)}</div>
                        <div class="bd-unit">Per Day</div>
                    </div>
                    <div class="bd-cell">
                        <div class="bd-num" data-key="weekly">$${fmtDec(weekly)}</div>
                        <div class="bd-unit">Per Week</div>
                    </div>
                    <div class="bd-cell">
                        <div class="bd-num" data-key="monthly">$${fmtDec(monthly)}</div>
                        <div class="bd-unit">Per Month</div>
                    </div>
                </div>

                ${taxHTML}

                <div class="insight-bar">
                    <div class="insight-title">⏱ What Is Your Time Worth?</div>
                    <div class="insight-items">${insightChips}</div>
                </div>

                <div class="action-row">
                    <button class="btn-action primary" id="copyBtn" type="button">Copy Result</button>
                    <button class="btn-action" id="resetBtn" type="button">✕ Reset</button>
                </div>
            `;

            $('copyBtn').addEventListener('click', () => copyResult({ annual, hourly, daily, weekly, monthly }));
            $('resetBtn').addEventListener('click', resetTool);
        }

        /* ── Copy ── */
        function copyResult({ annual, hourly, daily, weekly, monthly }) {
            const text = [
                `Salary to Hourly — ${salaryPeriodEl.options[salaryPeriodEl.selectedIndex].text}: $${fmtInt(parseFloat(salaryAmountEl.value))}`,
                '',
                `  Hourly:  $${fmtDec(hourly)}`,
                `  Daily:   $${fmtDec(daily)}`,
                `  Weekly:  $${fmtDec(weekly)}`,
                `  Monthly: $${fmtDec(monthly)}`,
                `  Annual:  $${fmtInt(annual)}`,
                '',
                'Calculated at Rebrixe.com',
            ].join('\n');

            if (!navigator.clipboard) {
                // Fallback: execCommand
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity  = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch(e) {}
                document.body.removeChild(ta);
                flashCopyBtn();
                return;
            }

            navigator.clipboard.writeText(text).then(flashCopyBtn).catch(() => {
                // clipboard write denied silently
            });
        }

        function flashCopyBtn() {
            const btn = $('copyBtn');
            if (!btn) return;
            btn.textContent = '✓ Copied!';
            btn.disabled = true;
            setTimeout(() => {
                btn.textContent = 'Copy Result';
                btn.disabled = false;
            }, 2000);
        }

        /* ── Reset ── */
        function resetTool() {
            salaryAmountEl.value  = '';
            salaryPeriodEl.value  = 'annual';
            hoursDayEl.value      = '8';
            daysWeekEl.value      = '5';
            weeksYearEl.value     = '52';
            taxToggleEl.checked   = false;
            taxRateEl.value       = '25';
            taxRowEl.classList.remove('visible');

            // Clear all errors
            ['salaryAmount','hoursDay','daysWeek','weeksYear'].forEach(id => $(id).classList.remove('field-error'));
            ['salaryError','hoursDayError','daysWeekError','weeksYearError'].forEach(id => $(id).textContent = '');
            taxRateEl.classList.remove('field-error');

            // Clear preset pills
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));

            resultPanelEl.classList.remove('visible');
            resultPanelEl.innerHTML = '';
            emptyHintEl.style.display = '';
        }

        /* ── Preset handler ── */
        function applyPreset(key) {
            const p = PRESETS[key];
            if (!p) return;
            hoursDayEl.value  = p.h;
            daysWeekEl.value  = p.d;
            weeksYearEl.value = p.w;
            document.querySelectorAll('.pill').forEach(pill => {
                pill.classList.toggle('active', pill.dataset.preset === key);
            });
            calculate();
        }

        /* ── Clear preset active when user edits schedule manually ── */
        [hoursDayEl, daysWeekEl, weeksYearEl].forEach(el => {
            el.addEventListener('input', () => {
                document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            });
        });

        /* ── Event wiring ── */
        salaryAmountEl.addEventListener('input', calculate);
        salaryPeriodEl.addEventListener('change', calculate);
        hoursDayEl.addEventListener('input', calculate);
        daysWeekEl.addEventListener('input', calculate);
        weeksYearEl.addEventListener('input', calculate);
        taxRateEl.addEventListener('input', calculate);

        taxToggleEl.addEventListener('change', () => {
            taxRowEl.classList.toggle('visible', taxToggleEl.checked);
            calculate();
        });

        document.querySelectorAll('.pill').forEach(pill => {
            pill.addEventListener('click', () => applyPreset(pill.dataset.preset));
        });
    })();
    </script>
    <script src="../nav.js"></script>
</body>
</html>
