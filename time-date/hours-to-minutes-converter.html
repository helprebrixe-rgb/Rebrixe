    <script>
    'use strict';

    let currentMode = 'decimal';

    /*
     * Safe integer minutes — the single source of truth for all calculations.
     * All display and billing is derived from this integer, eliminating
     * float-precision artifacts entirely.
     */
    let totalMinutesExact = 0; // integer, always

    const PRESETS = {
        decimal: [
            { label: '0.5 hr',  val: 0.5 },
            { label: '1 hr',    val: 1   },
            { label: '1.5 hr',  val: 1.5 },
            { label: '2 hr',    val: 2   },
            { label: '4.5 hr',  val: 4.5 },
            { label: '7.5 hr',  val: 7.5 },
            { label: '8 hr',    val: 8   },
        ],
        hhmm: [
            { label: '0:30', h: 0, m: 30 },
            { label: '1:00', h: 1, m: 0  },
            { label: '1:30', h: 1, m: 30 },
            { label: '2:45', h: 2, m: 45 },
            { label: '4:00', h: 4, m: 0  },
            { label: '7:30', h: 7, m: 30 },
            { label: '8:00', h: 8, m: 0  },
        ],
        reverse: [
            { label: '30 min',  val: 30  },
            { label: '60 min',  val: 60  },
            { label: '90 min',  val: 90  },
            { label: '120 min', val: 120 },
            { label: '270 min', val: 270 },
            { label: '480 min', val: 480 },
            { label: '525 min', val: 525 },
        ],
    };

    /* ── helpers ─────────────────────────────────────────── */

    /**
     * Convert decimal hours to an exact integer number of minutes.
     * Multiplies by 600 (hours × 60 × 10) then divides by 10 to avoid
     * the classic 0.1 × 60 = 6.0000000001 float artifact.
     */
    function decimalHoursToMinutes(h) {
        return Math.round(h * 600) / 10;
    }

    /**
     * Format a positive integer minutes value as "Xh Ym".
     * Never produces "1h 60m" because we operate on clean integers.
     */
    function formatHHMM(totalMins) {
        const h = Math.floor(totalMins / 60);
        const m = totalMins % 60;
        return h + 'h ' + m + 'm';
    }

    /**
     * Format a decimal number, stripping unnecessary trailing zeros.
     * e.g. 1.50 → "1.5", 2.00 → "2", 1.6667 → "1.6667"
     */
    function fmtDecimal(n, decimals) {
        return parseFloat(n.toFixed(decimals)).toString();
    }

    function showError(id, msg) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.classList.add('visible');
    }
    function clearError(id) {
        const el = document.getElementById(id);
        el.textContent = '';
        el.classList.remove('visible');
    }

    /* ── mode switching ──────────────────────────────────── */

    function setMode(mode) {
        currentMode = mode;
        ['decimal', 'hhmm', 'reverse'].forEach(m => {
            document.getElementById('mode-' + m).style.display = m === mode ? '' : 'none';
            document.getElementById('tab-' + m).classList.toggle('active', m === mode);
        });
        renderPresets();
        clearAll();
    }

    function renderPresets() {
        const pills = document.getElementById('presetPills');
        pills.innerHTML = '';
        PRESETS[currentMode].forEach(p => {
            const span = document.createElement('span');
            span.className = 'pill';
            span.textContent = p.label;
            span.onclick = () => applyPreset(p);
            pills.appendChild(span);
        });
    }

    function applyPreset(p) {
        if (currentMode === 'decimal') {
            document.getElementById('decInput').value = p.val;
        } else if (currentMode === 'hhmm') {
            document.getElementById('hhInput').value = p.h;
            document.getElementById('mmInput').value = p.m;
        } else {
            document.getElementById('minInput').value = p.val;
        }
        calculate();
    }

    /* ── main calculation ────────────────────────────────── */

    function calculate() {
        let totalMins = null; // integer or null
        let srcLabel  = '';
        let valid     = false;

        /* clear all errors first */
        ['decError', 'hhError', 'mmError', 'minError'].forEach(clearError);
        ['decInput', 'hhInput', 'mmInput', 'minInput'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.remove('input-error');
        });

        /* ── decimal mode ── */
        if (currentMode === 'decimal') {
            const raw = document.getElementById('decInput').value.trim();
            if (raw === '') { hide(); return; }

            const v = parseFloat(raw);

            if (isNaN(v)) {
                showError('decError', 'Please enter a valid number.');
                document.getElementById('decInput').classList.add('input-error');
                hide(); return;
            }
            if (v < 0) {
                showError('decError', 'Hours cannot be negative.');
                document.getElementById('decInput').classList.add('input-error');
                hide(); return;
            }
            if (v > 100000) {
                showError('decError', 'Value too large. Enter hours up to 100,000.');
                document.getElementById('decInput').classList.add('input-error');
                hide(); return;
            }

            totalMins = decimalHoursToMinutes(v);
            srcLabel  = fmtDecimal(v, 4) + ' hour' + (v !== 1 ? 's' : '');
            valid     = true;
        }

        /* ── hh:mm mode ── */
        else if (currentMode === 'hhmm') {
            const rawH = document.getElementById('hhInput').value.trim();
            const rawM = document.getElementById('mmInput').value.trim();

            if (rawH === '' && rawM === '') { hide(); return; }

            let hasError = false;

            const h = rawH === '' ? 0 : parseInt(rawH, 10);
            const m = rawM === '' ? 0 : parseInt(rawM, 10);

            if (rawH !== '' && (isNaN(h) || !Number.isInteger(h) || h < 0)) {
                showError('hhError', 'Hours must be a whole number ≥ 0.');
                document.getElementById('hhInput').classList.add('input-error');
                hasError = true;
            } else if (rawH !== '' && h > 100000) {
                showError('hhError', 'Value too large. Enter hours up to 100,000.');
                document.getElementById('hhInput').classList.add('input-error');
                hasError = true;
            }

            if (rawM !== '' && (isNaN(m) || !Number.isInteger(m))) {
                showError('mmError', 'Minutes must be a whole number.');
                document.getElementById('mmInput').classList.add('input-error');
                hasError = true;
            } else if (rawM !== '' && (m < 0 || m > 59)) {
                showError('mmError', 'Minutes must be between 0 and 59.');
                document.getElementById('mmInput').classList.add('input-error');
                hasError = true;
            }

            if (hasError) { hide(); return; }

            totalMins = h * 60 + m;
            srcLabel  = h + 'h ' + m + 'm';
            valid     = true;
        }

        /* ── reverse mode ── */
        else {
            const raw = document.getElementById('minInput').value.trim();
            if (raw === '') { hide(); return; }

            const v = parseInt(raw, 10);

            if (isNaN(v) || !Number.isInteger(v)) {
                showError('minError', 'Please enter a whole number of minutes.');
                document.getElementById('minInput').classList.add('input-error');
                hide(); return;
            }
            if (v < 0) {
                showError('minError', 'Minutes cannot be negative.');
                document.getElementById('minInput').classList.add('input-error');
                hide(); return;
            }
            if (v > 6000000) {
                showError('minError', 'Value too large. Enter minutes up to 6,000,000.');
                document.getElementById('minInput').classList.add('input-error');
                hide(); return;
            }

            totalMins = v;
            srcLabel  = v.toLocaleString() + ' minute' + (v !== 1 ? 's' : '');
            valid     = true;
        }

        if (!valid || totalMins === null) { hide(); return; }

        /* ── guaranteed clean integer from here down ── */
        totalMinutesExact = totalMins;

        const wholeHrs = Math.floor(totalMins / 60);
        const remMins  = totalMins % 60; // safe: integer modulo, never 60
        const totalSecs = totalMins * 60;

        /* hero display */
        const resultArea = document.getElementById('resultArea');
        const hint       = document.getElementById('emptyHint');
        resultArea.classList.add('visible');
        hint.style.display = 'none';

        document.getElementById('resEq').textContent = srcLabel + '  =';

        if (currentMode === 'reverse') {
            const decHours = totalMins / 60;
            document.getElementById('resMain').textContent = fmtDecimal(decHours, 4);
            document.getElementById('resUnit').textContent = 'Hours';
            document.getElementById('resSrc').innerHTML =
                '<strong>' + totalMins.toLocaleString() + '</strong> minutes = <strong>' + formatHHMM(totalMins) + '</strong>';
        } else {
            document.getElementById('resMain').textContent = totalMins.toLocaleString();
            document.getElementById('resUnit').textContent = 'Minutes';
            document.getElementById('resSrc').innerHTML =
                '<strong>' + srcLabel + '</strong> = <strong>' + formatHHMM(totalMins) + '</strong>';
        }

        /* extras grid */
        const decHoursDisplay = fmtDecimal(totalMins / 60, 4);

        const extras = currentMode === 'reverse'
            ? [
                { num: totalMins.toLocaleString(),    lbl: 'Total Minutes' },
                { num: formatHHMM(totalMins),          lbl: 'HH : MM' },
                { num: totalSecs.toLocaleString(),     lbl: 'Seconds' },
              ]
            : [
                { num: decHoursDisplay,                lbl: 'Decimal Hours' },
                { num: formatHHMM(totalMins),          lbl: 'HH : MM' },
                { num: totalSecs.toLocaleString(),     lbl: 'Seconds' },
              ];

        document.getElementById('extrasGrid').innerHTML = extras.map(e =>
            '<div class="extra-cell">' +
                '<div class="extra-num">' + e.num + '</div>' +
                '<div class="extra-lbl">' + e.lbl + '</div>' +
            '</div>'
        ).join('');

        updateBilling();
    }

    /* ── billing ─────────────────────────────────────────── */

    function updateBilling() {
        const rateEl  = document.getElementById('rateInput');
        const rateRaw = rateEl.value.trim();
        const billingDiv = document.getElementById('billingRows');

        rateEl.classList.remove('rate-error');

        /* validate rate */
        if (rateRaw === '' || isNaN(parseFloat(rateRaw)) || parseFloat(rateRaw) <= 0) {
            rateEl.classList.add('rate-error');
            billingDiv.innerHTML =
                '<div class="billing-notice">Enter a valid hourly rate above to see billing amounts.</div>';
            return;
        }

        const rate = parseFloat(rateRaw);

        /*
         * All arithmetic uses the clean integer totalMinutesExact.
         * Multiply to cents (integer) first, then format — avoids float
         * rounding producing $0.30000000000000004 style artifacts.
         */
        const totalHrs      = totalMinutesExact / 60;
        const exactCents    = Math.round(totalHrs * rate * 100);
        const exactBillable = exactCents / 100;

        /*
         * 15-minute rounding block: round totalMinutesExact (already integer)
         * up to next 15-minute boundary, then compute billing.
         */
        const rounded15Mins  = Math.ceil(totalMinutesExact / 15) * 15;
        const rounded15Hrs   = rounded15Mins / 60;
        const rounded15Cents = Math.round(rounded15Hrs * rate * 100);
        const rounded15Bill  = rounded15Cents / 100;

        /*
         * Rate per minute: computed from the rate directly, not from
         * division chains that could lose precision.
         * Displayed to 4 decimal places only when meaningful.
         */
        const ratePerMin     = rate / 60;
        const ratePerMinFmt  = ratePerMin < 0.0001
            ? ratePerMin.toExponential(2)
            : fmtDecimal(ratePerMin, 4);

        const fmt = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        billingDiv.innerHTML =
            '<div class="billing-row">' +
                '<span class="billing-key">Exact Billable Amount</span>' +
                '<span class="billing-val accent">$' + fmt(exactBillable) + '</span>' +
            '</div>' +
            '<div class="billing-row">' +
                '<span class="billing-key">Rounded Up to 15-Min Block</span>' +
                '<span class="billing-val">$' + fmt(rounded15Bill) +
                ' <span style="color:#475569;font-size:0.72rem;">(' + rounded15Mins + ' min)</span></span>' +
            '</div>' +
            '<div class="billing-row">' +
                '<span class="billing-key">Rate Per Minute</span>' +
                '<span class="billing-val">$' + ratePerMinFmt + '</span>' +
            '</div>' +
            '<div class="billing-row">' +
                '<span class="billing-key">Daily Earnings (8 hr day)</span>' +
                '<span class="billing-val">$' + fmt(rate * 8) + '</span>' +
            '</div>';
    }

    /* ── utilities ───────────────────────────────────────── */

    function hide() {
        document.getElementById('resultArea').classList.remove('visible');
        document.getElementById('emptyHint').style.display = 'block';
    }

    function clearAll() {
        ['decInput', 'hhInput', 'mmInput', 'minInput'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = '';
        });
        ['decError', 'hhError', 'mmError', 'minError'].forEach(clearError);
        ['decInput', 'hhInput', 'mmInput', 'minInput'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.remove('input-error');
        });
        totalMinutesExact = 0;
        hide();
    }

    /* ── init ────────────────────────────────────────────── */
    renderPresets();
    </script>
    <script src="../nav.js"></script>
</body>
</html>
