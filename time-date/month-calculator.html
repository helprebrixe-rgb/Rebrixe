    <script>
    /* =========================================================
       MONTH CALCULATOR — Bulletproof Edition
       All date arithmetic uses local-safe date parsing.
       No UTC off-by-one, no broken preset logic, full validation.
    ========================================================= */

    const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const MONTHS_FULL  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS_FULL    = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    // ── Date helpers ─────────────────────────────────────────────────────────

    /**
     * Parse a YYYY-MM-DD string as LOCAL midnight — avoids UTC off-by-one.
     * Returns null if the string is invalid or empty.
     */
    function parseLocal(str) {
        if (!str || typeof str !== 'string') return null;
        const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return null;
        const yr = +m[1], mo = +m[2] - 1, dy = +m[3];
        if (yr < 1 || yr > 9999 || mo < 0 || mo > 11 || dy < 1 || dy > 31) return null;
        const d = new Date(yr, mo, dy);
        // Verify no month overflow (e.g. Feb 31)
        if (d.getFullYear() !== yr || d.getMonth() !== mo || d.getDate() !== dy) return null;
        return d;
    }

    /** Today at local midnight */
    function todayLocal() {
        const n = new Date();
        return new Date(n.getFullYear(), n.getMonth(), n.getDate());
    }

    /** Format a Date as YYYY-MM-DD for input[type=date] */
    function toInputVal(d) {
        const yr = d.getFullYear();
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const dy = String(d.getDate()).padStart(2, '0');
        return `${yr}-${mo}-${dy}`;
    }

    /**
     * Add (or subtract) whole months to a local Date.
     * Clamps day-of-month on overflow (Jan 31 + 1 → Feb 28/29).
     */
    function addMonths(d, n) {
        const yr = d.getFullYear();
        const mo = d.getMonth() + n;   // can be negative or > 11, JS handles
        const day = d.getDate();
        const target = new Date(yr, mo, day);
        // If JS overflowed (e.g. day=31 in a 30-day target month), roll back
        if (target.getDate() !== day) {
            // setDate(0) = last day of previous month from the overflowed date
            target.setDate(0);
        }
        return target;
    }

    /**
     * Returns exact { years, months, days } breakdown between two LOCAL dates.
     * Always returns non-negative values; directionality is handled by callers.
     */
    function exactBreakdown(a, b) {
        // Ensure s ≤ e
        const s = a <= b ? a : b;
        const e = a <= b ? b : a;

        let years  = e.getFullYear() - s.getFullYear();
        let months = e.getMonth()    - s.getMonth();
        let days   = e.getDate()     - s.getDate();

        if (days < 0) {
            months--;
            // Days remaining = days in the month of (s + years/months advance)
            const ref = new Date(e.getFullYear(), e.getMonth(), 0); // last day of prev month
            days += ref.getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }
        return { years, months, days };
    }

    /**
     * Fractional months between two dates.
     * Positive = b is after a; negative = b is before a.
     */
    function fracMonths(a, b) {
        const sign = b >= a ? 1 : -1;
        const s = sign === 1 ? a : b;
        const e = sign === 1 ? b : a;

        let whole = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth());
        const dayDiff     = e.getDate() - s.getDate();
        const daysInMonth = new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate();
        const frac        = dayDiff / daysInMonth;

        return sign * (whole + frac);
    }

    /**
     * Total calendar days between two dates, day-boundary safe.
     * Uses integer arithmetic on date components to avoid DST issues.
     */
    function totalDays(a, b) {
        // Convert both to UTC midnight via date parts to eliminate DST
        const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
        const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
        return Math.abs(Math.round((utcB - utcA) / 864e5));
    }

    function quarter(d) {
        return 'Q' + (Math.floor(d.getMonth() / 3) + 1);
    }

    function shortDate(d) {
        return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    }

    function longDate(d) {
        return `${d.getDate()} ${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`;
    }

    function dayName(d) {
        return DAYS_FULL[d.getDay()];
    }

    // ── Timeline builder ─────────────────────────────────────────────────────

    const TIMELINE_MAX = 16;

    function buildTimeline(a, b) {
        const s = a <= b ? a : b;
        const e = a <= b ? b : a;

        const startKey = s.getFullYear() * 12 + s.getMonth();
        const endKey   = e.getFullYear() * 12 + e.getMonth();
        const total    = endKey - startKey + 1;

        const items = [];
        for (let i = 0; i < Math.min(total, TIMELINE_MAX); i++) {
            const abs = startKey + i;
            const yr  = Math.floor(abs / 12);
            const mo  = abs % 12;
            items.push({
                label:   MONTHS_SHORT[mo] + ' \'' + String(yr).slice(-2),
                isStart: i === 0,
                isEnd:   startKey + i === endKey && i < TIMELINE_MAX,
            });
        }
        const more = Math.max(0, total - TIMELINE_MAX);
        return { items, more };
    }

    // ── UI helpers ───────────────────────────────────────────────────────────

    function showError(id, msg) {
        const el = document.getElementById('error-' + id);
        if (!el) return;
        el.textContent = msg;
        el.classList.add('visible');
    }

    function clearError(id) {
        const el = document.getElementById('error-' + id);
        if (!el) return;
        el.textContent = '';
        el.classList.remove('visible');
    }

    function showResult(id, html) {
        const panel = document.getElementById('result-' + id);
        const hint  = document.getElementById('hint-' + id);
        panel.innerHTML = html;
        panel.classList.add('visible');
        hint.style.display = 'none';
    }

    function hideResult(id) {
        const panel = document.getElementById('result-' + id);
        const hint  = document.getElementById('hint-' + id);
        panel.innerHTML = '';
        panel.classList.remove('visible');
        hint.style.display = '';
    }

    function esc(s) {
        // Basic HTML-escape for injected strings
        return String(s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Copy to clipboard ────────────────────────────────────────────────────

    function copyText(text, btnId) {
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            const orig = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => { btn.textContent = orig; }, 2000);
        }).catch(() => {
            // Fallback for environments without clipboard API
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        });
    }

    // ── Mode switching ───────────────────────────────────────────────────────

    function switchMode(mode) {
        const modes = ['between', 'add', 'until'];
        modes.forEach(m => {
            document.getElementById('tab-' + m).classList.toggle('active', m === mode);
            document.getElementById('tab-' + m).setAttribute('aria-selected', m === mode);
            document.getElementById('panel-' + m).classList.toggle('active', m === mode);
        });
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  PANEL 1 — BETWEEN
    // ══════════════════════════════════════════════════════════════════════════

    function bPreset(p) {
        const t  = todayLocal();
        const yr = t.getFullYear();
        let s, e;

        switch (p) {
            case 'ytd':   s = new Date(yr, 0, 1);     e = t;                       break;
            case 'q1':    s = new Date(2025, 0, 1);    e = new Date(2025, 2, 31);   break;
            case 'q2':    s = new Date(2025, 3, 1);    e = new Date(2025, 5, 30);   break;
            case 'fy':    s = new Date(yr, 0, 1);      e = new Date(yr, 11, 31);    break;
            case 'last6': s = addMonths(t, -6);        e = t;                       break;
            case 'last12':s = addMonths(t, -12);       e = t;                       break;
            default: return;
        }

        document.getElementById('b-start').value = toInputVal(s);
        document.getElementById('b-end').value   = toInputVal(e);
        calcBetween();
    }

    function calcBetween() {
        const sv = document.getElementById('b-start').value;
        const ev = document.getElementById('b-end').value;

        clearError('between');

        if (!sv || !ev) {
            hideResult('between');
            return;
        }

        const s = parseLocal(sv);
        const e = parseLocal(ev);

        if (!s || !e) {
            showError('between', 'One or both dates are invalid. Please check your input.');
            hideResult('between');
            return;
        }

        if (s.getTime() === e.getTime()) {
            showError('between', 'Start and end dates are the same — the gap is 0 months.');
            hideResult('between');
            return;
        }

        const isFuture   = e > s;
        const mFrac      = Math.abs(fracMonths(s, e));
        const wholeM     = Math.floor(mFrac);
        const bd         = exactBreakdown(s, e);
        const days       = totalDays(s, e);
        const weeks      = (days / 7).toFixed(1);
        const tl         = buildTimeline(s, e);

        // Build breakdown label
        const bdParts = [];
        if (bd.years  > 0) bdParts.push(bd.years  + (bd.years  === 1 ? ' yr'  : ' yrs'));
        if (bd.months > 0) bdParts.push(bd.months + (bd.months === 1 ? ' mo'  : ' mos'));
        if (bd.days   > 0) bdParts.push(bd.days   + (bd.days   === 1 ? ' day' : ' days'));
        const bdStr = bdParts.length ? bdParts.join(' ') : '0 days';

        // Timeline HTML
        const tlHTML = tl.items.map(item => {
            const cls = item.isStart ? 'tl-month is-start' : item.isEnd ? 'tl-month is-end' : 'tl-month';
            return `<span class="${cls}">${esc(item.label)}</span>`;
        }).join('') + (tl.more > 0
            ? `<span class="tl-month is-more">+${tl.more} more…</span>`
            : '');

        const direction = isFuture ? 'ahead' : 'behind';
        const copyId    = 'btn-copy-between';

        const html = `
            <div class="result-hero">
                <div class="result-hero-num">${mFrac.toFixed(1)}</div>
                <div class="result-hero-unit">Months ${isFuture ? 'Forward' : 'Back'}</div>
                <div class="result-sub">
                    Exactly <strong>${esc(bdStr)}</strong>
                    &nbsp;·&nbsp;
                    <strong>${esc(shortDate(s))}</strong> → <strong>${esc(shortDate(e))}</strong>
                </div>
            </div>

            <div class="breakdown-grid">
                <div class="bc-cell">
                    <div class="bc-num">${wholeM.toLocaleString()}</div>
                    <div class="bc-lbl">Whole Months</div>
                </div>
                <div class="bc-cell">
                    <div class="bc-num">${weeks}</div>
                    <div class="bc-lbl">Weeks</div>
                </div>
                <div class="bc-cell">
                    <div class="bc-num">${days.toLocaleString()}</div>
                    <div class="bc-lbl">Days</div>
                </div>
                <div class="bc-cell">
                    <div class="bc-num">${(days * 24).toLocaleString()}</div>
                    <div class="bc-lbl">Hours</div>
                </div>
            </div>

            <div class="timeline-strip">
                <div class="timeline-label">Month by Month</div>
                <div class="tl-months">${tlHTML}</div>
            </div>

            <div class="extras-grid">
                <div class="extra-item">
                    <span class="ei-label">📅 Start Quarter</span>
                    <span class="ei-val">${quarter(s)} ${s.getFullYear()}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📅 End Quarter</span>
                    <span class="ei-val">${quarter(e)} ${e.getFullYear()}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📆 Start Day</span>
                    <span class="ei-val">${dayName(s)}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📆 End Day</span>
                    <span class="ei-val">${dayName(e)}</span>
                </div>
            </div>

            <div class="action-row">
                <button class="btn-action primary" id="${copyId}"
                    onclick="copyText('Months between ${esc(sv)} and ${esc(ev)}:\\n• ${mFrac.toFixed(1)} months\\n• ${days.toLocaleString()} days\\n• ${esc(bdStr)}', '${copyId}')">
                    Copy Result
                </button>
                <button class="btn-action" onclick="resetBetween()">✕ Reset</button>
            </div>
        `;

        showResult('between', html);
    }

    function resetBetween() {
        document.getElementById('b-start').value = '';
        document.getElementById('b-end').value   = '';
        clearError('between');
        hideResult('between');
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  PANEL 2 — ADD / SUBTRACT
    // ══════════════════════════════════════════════════════════════════════════

    let addDir = 'fwd';

    function setDir(d) {
        addDir = d;
        document.getElementById('dir-fwd').classList.toggle('active', d === 'fwd');
        document.getElementById('dir-bwd').classList.toggle('active', d === 'bwd');
        calcAdd();
    }

    function setAddMonths(n) {
        addDir = 'fwd';
        document.getElementById('dir-fwd').classList.add('active');
        document.getElementById('dir-bwd').classList.remove('active');
        document.getElementById('a-months').value = n;
        if (!document.getElementById('a-start').value) {
            document.getElementById('a-start').value = toInputVal(todayLocal());
        }
        calcAdd();
    }

    function calcAdd() {
        const sv = document.getElementById('a-start').value;
        const mv = document.getElementById('a-months').value.trim();

        clearError('add');

        if (!sv || mv === '') {
            hideResult('add');
            return;
        }

        const s = parseLocal(sv);
        if (!s) {
            showError('add', 'Invalid start date.');
            hideResult('add');
            return;
        }

        const raw = parseInt(mv, 10);
        if (isNaN(raw) || raw < 0) {
            showError('add', 'Please enter a positive whole number of months (0–600).');
            hideResult('add');
            return;
        }
        if (raw > 600) {
            showError('add', 'Maximum supported offset is 600 months (50 years).');
            hideResult('add');
            return;
        }

        const signedN = addDir === 'bwd' ? -raw : raw;
        const result  = addMonths(s, signedN);
        const bd      = exactBreakdown(s, result);
        const days    = totalDays(s, result);
        const weeks   = (days / 7).toFixed(1);
        const absN    = raw;

        const daysInResultMonth = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
        const direction  = signedN >= 0 ? 'from' : 'before';
        const arrow      = signedN >= 0 ? '→' : '←';
        const copyId     = 'btn-copy-add';

        const html = `
            <div class="result-hero">
                <div class="result-hero-num">${esc(longDate(result))}</div>
                <div class="result-hero-unit">${absN} month${absN !== 1 ? 's' : ''} ${direction} start</div>
                <div class="result-sub">
                    <strong>${esc(shortDate(s))}</strong> ${arrow} <strong>${esc(shortDate(result))}</strong>
                    &nbsp;·&nbsp; Falls on a <strong>${dayName(result)}</strong>
                </div>
            </div>

            <div class="breakdown-grid">
                <div class="bc-cell">
                    <div class="bc-num">${absN}</div>
                    <div class="bc-lbl">Months</div>
                </div>
                <div class="bc-cell">
                    <div class="bc-num">${bd.years}</div>
                    <div class="bc-lbl">Full Years</div>
                </div>
                <div class="bc-cell">
                    <div class="bc-num">${days.toLocaleString()}</div>
                    <div class="bc-lbl">Days</div>
                </div>
                <div class="bc-cell">
                    <div class="bc-num">${weeks}</div>
                    <div class="bc-lbl">Weeks</div>
                </div>
            </div>

            <div class="extras-grid">
                <div class="extra-item">
                    <span class="ei-label">📅 Result Quarter</span>
                    <span class="ei-val">${quarter(result)} ${result.getFullYear()}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📅 Result Month</span>
                    <span class="ei-val">${MONTHS_FULL[result.getMonth()]} ${result.getFullYear()}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">🗓️ Days in that Month</span>
                    <span class="ei-val">${daysInResultMonth}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📆 Result Day</span>
                    <span class="ei-val">${dayName(result)}</span>
                </div>
            </div>

            <div class="action-row">
                <button class="btn-action primary" id="${copyId}"
                    onclick="copyText('${absN} months ${direction} ${esc(sv)} = ${esc(toInputVal(result))}\\n${esc(longDate(result))} (${dayName(result)})', '${copyId}')">
                    Copy Result
                </button>
                <button class="btn-action" onclick="resetAdd()">✕ Reset</button>
            </div>
        `;

        showResult('add', html);
    }

    function resetAdd() {
        document.getElementById('a-start').value  = '';
        document.getElementById('a-months').value = '';
        addDir = 'fwd';
        document.getElementById('dir-fwd').classList.add('active');
        document.getElementById('dir-bwd').classList.remove('active');
        clearError('add');
        hideResult('add');
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  PANEL 3 — UNTIL EVENT
    // ══════════════════════════════════════════════════════════════════════════

    function uPreset(p) {
        const t  = todayLocal();
        const yr = t.getFullYear();
        let e;

        // All presets use explicit switch for correctness — no chained if/else bugs
        switch (p) {
            case 'newyear':
                e = new Date(yr + 1, 0, 1);
                break;
            case 'summer':
                e = new Date(yr, 5, 21);
                if (e <= t) e = new Date(yr + 1, 5, 21);
                break;
            case 'christmas':
                e = new Date(yr, 11, 25);
                if (e <= t) e = new Date(yr + 1, 11, 25);
                break;
            case 'holi':
                // Holi 2027 (approx Mar 3)
                e = new Date(2027, 2, 3);
                break;
            case 'diwali':
                // Diwali 2026 (approx Oct 19)
                e = new Date(2026, 9, 19);
                break;
            default:
                return;
        }

        document.getElementById('u-target').value = toInputVal(e);
        calcUntil();
    }

    function calcUntil() {
        const ev = document.getElementById('u-target').value;

        clearError('until');

        if (!ev) {
            hideResult('until');
            return;
        }

        const e = parseLocal(ev);
        if (!e) {
            showError('until', 'Invalid date. Please check your input.');
            hideResult('until');
            return;
        }

        const t = todayLocal();

        if (e.getTime() === t.getTime()) {
            showError('until', 'That\'s today! The gap is 0 months.');
            hideResult('until');
            return;
        }

        const isFuture = e > t;
        const mFrac    = Math.abs(fracMonths(t, e));
        const wholeM   = Math.floor(mFrac);
        const bd       = exactBreakdown(t, e);
        const days     = totalDays(t, e);
        const weeks    = (days / 7).toFixed(1);

        const bdParts = [];
        if (bd.years  > 0) bdParts.push(bd.years  + (bd.years  === 1 ? ' yr'  : ' yrs'));
        if (bd.months > 0) bdParts.push(bd.months + (bd.months === 1 ? ' mo'  : ' mos'));
        if (bd.days   > 0) bdParts.push(bd.days   + (bd.days   === 1 ? ' day' : ' days'));
        const bdStr = bdParts.length ? bdParts.join(' ') : '0 days';

        const copyId = 'btn-copy-until';

        const html = `
            <div class="result-hero">
                <div class="result-hero-num">${mFrac.toFixed(1)}</div>
                <div class="result-hero-unit">months ${isFuture ? 'to go' : 'ago'}</div>
                <div class="result-sub">
                    <strong>${esc(bdStr)}</strong>
                    &nbsp;·&nbsp; <strong>${esc(shortDate(e))}</strong> is a <strong>${dayName(e)}</strong>
                </div>
            </div>

            <div class="breakdown-grid">
                <div class="bc-cell">
                    <div class="bc-num">${wholeM.toLocaleString()}</div>
                    <div class="bc-lbl">Whole Months</div>
                </div>
                <div class="bc-cell">
                    <div class="bc-num">${weeks}</div>
                    <div class="bc-lbl">Weeks</div>
                </div>
                <div class="bc-cell">
                    <div class="bc-num">${days.toLocaleString()}</div>
                    <div class="bc-lbl">Days</div>
                </div>
                <div class="bc-cell">
                    <div class="bc-num">${(days * 24).toLocaleString()}</div>
                    <div class="bc-lbl">Hours</div>
                </div>
            </div>

            <div class="extras-grid">
                <div class="extra-item">
                    <span class="ei-label">📅 Target Month</span>
                    <span class="ei-val">${MONTHS_FULL[e.getMonth()]} ${e.getFullYear()}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📅 Target Quarter</span>
                    <span class="ei-val">${quarter(e)} ${e.getFullYear()}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📆 Day of Week</span>
                    <span class="ei-val">${dayName(e)}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📆 Today</span>
                    <span class="ei-val">${esc(shortDate(t))}</span>
                </div>
            </div>

            <div class="action-row">
                <button class="btn-action primary" id="${copyId}"
                    onclick="copyText('${mFrac.toFixed(1)} months (${days.toLocaleString()} days) ${isFuture ? 'until' : 'since'} ${esc(ev)}\\n${esc(longDate(e))} — ${dayName(e)}', '${copyId}')">
                    Copy Result
                </button>
                <button class="btn-action" onclick="resetUntil()">✕ Reset</button>
            </div>
        `;

        showResult('until', html);
    }

    function resetUntil() {
        document.getElementById('u-target').value = '';
        clearError('until');
        hideResult('until');
    }

    // ── Init ─────────────────────────────────────────────────────────────────

    (function init() {
        const t = todayLocal();
        // Default: last 3 months
        const threeMonthsAgo = addMonths(t, -3);
        document.getElementById('b-start').value = toInputVal(threeMonthsAgo);
        document.getElementById('b-end').value   = toInputVal(t);
        document.getElementById('a-start').value = toInputVal(t);
        calcBetween();
    })();

    </script>
    <script src="../nav.js"></script>
</body>
</html>
