    <script>
    (function () {
        'use strict';

        /* ══════════════════════════════════════════
           CONSTANTS
        ══════════════════════════════════════════ */
        const MONTHS = [
            'January','February','March','April',
            'May','June','July','August',
            'September','October','November','December'
        ];

        const DAYS_FROM_SUN = ['Su','Mo','Tu','We','Th','Fr','Sa'];
        const DAYS_FROM_MON = ['Mo','Tu','We','Th','Fr','Sa','Su'];

        /* Fixed US public holidays: key = "M-D" (1-indexed month, no leading zero) */
        const FIXED_HOLIDAYS = {
            '1-1':   "New Year's Day",
            '7-4':   "Independence Day",
            '11-11': "Veterans Day",
            '12-25': "Christmas Day",
        };

        /* ══════════════════════════════════════════
           STATE — single source of truth
        ══════════════════════════════════════════ */
        const state = {
            year:     new Date().getFullYear(),
            view:     'full',           // 'full' or 0-11
            weekStart: 1,               // 0 = Sun, 1 = Mon
            cols:     3,
            layout:   'portrait',       // 'portrait' | 'landscape'
            style:    'minimal',        // 'minimal' | 'grid' | 'boxed'
            today:    false,
            notes:    false,
            holidays: false,
        };

        /* ══════════════════════════════════════════
           HOLIDAY CALCULATOR
        ══════════════════════════════════════════ */

        /**
         * Returns the date of the Nth occurrence of weekday `dow` in
         * month `month` (0-indexed) of `year`.
         * dow: 0=Sun … 6=Sat   n: 1-based
         */
        function nthWeekdayOfMonth(year, month, n, dow) {
            const first = new Date(year, month, 1);
            // Days until first occurrence of dow
            let offset = (dow - first.getDay() + 7) % 7;
            // Add (n-1) weeks
            return 1 + offset + (n - 1) * 7;
        }

        /**
         * Returns the date of the last occurrence of weekday `dow`
         * in month `month` (0-indexed) of `year`.
         */
        function lastWeekdayOfMonth(year, month, dow) {
            const lastDay = new Date(year, month + 1, 0); // last day of month
            let d = lastDay.getDate();
            let dayOfWeek = lastDay.getDay();
            d -= (dayOfWeek - dow + 7) % 7;
            return d;
        }

        function getDynamicHolidays(year) {
            return {
                [`1-${nthWeekdayOfMonth(year, 0, 3, 1)}`]:  'MLK Jr. Day',
                [`2-${nthWeekdayOfMonth(year, 1, 3, 1)}`]:  "Presidents' Day",
                [`5-${lastWeekdayOfMonth(year, 4, 1)}`]:    'Memorial Day',
                [`9-${nthWeekdayOfMonth(year, 8, 1, 1)}`]:  'Labor Day',
                [`11-${nthWeekdayOfMonth(year, 10, 4, 4)}`]: 'Thanksgiving',
            };
        }

        function buildHolidayMap(year) {
            if (!state.holidays) return {};
            return Object.assign({}, FIXED_HOLIDAYS, getDynamicHolidays(year));
        }

        /* ══════════════════════════════════════════
           CALENDAR BUILDER
        ══════════════════════════════════════════ */

        function buildMonthHTML(year, monthIdx, holidayMap) {
            const todayObj  = new Date();
            const weekStart = state.weekStart; // 0 or 1
            const dayNames  = weekStart === 1 ? DAYS_FROM_MON : DAYS_FROM_SUN;

            const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
            const firstDow    = new Date(year, monthIdx, 1).getDay(); // 0=Sun
            const offset      = (firstDow - weekStart + 7) % 7;

            // Build flat cell array
            const cells = [];

            // Empty leading cells
            for (let i = 0; i < offset; i++) {
                cells.push({ num: '', cls: 'empty' });
            }

            // Day cells
            for (let d = 1; d <= daysInMonth; d++) {
                const dow = new Date(year, monthIdx, d).getDay(); // 0=Sun…6=Sat
                const key = `${monthIdx + 1}-${d}`;

                const isToday =
                    state.today &&
                    d === todayObj.getDate() &&
                    monthIdx === todayObj.getMonth() &&
                    year === todayObj.getFullYear();

                const isHoliday = !!holidayMap[key];

                // Priority: today-mark > holiday > weekend colouring
                let cls = '';
                if (isToday) {
                    cls = isHoliday ? 'today-mark holiday' : 'today-mark';
                } else if (isHoliday) {
                    cls = 'holiday';
                } else if (dow === 0) {
                    cls = 'sunday';
                } else if (dow === 6) {
                    cls = 'saturday';
                }

                cells.push({ num: d, cls });
            }

            // Pad to complete last row
            while (cells.length % 7 !== 0) {
                cells.push({ num: '', cls: 'empty' });
            }

            // Build rows HTML
            let rowsHTML = '';
            for (let i = 0; i < cells.length; i += 7) {
                rowsHTML += '<div class="day-row">';
                for (let j = 0; j < 7; j++) {
                    const c = cells[i + j];
                    rowsHTML += `<div class="day-cell ${c.cls}">${c.num}</div>`;
                }
                rowsHTML += '</div>';
            }

            // Header row
            const headerHTML = dayNames
                .map(d => `<div class="day-header">${d}</div>`)
                .join('');

            return `
                <div class="month-block">
                    <div class="month-name">${MONTHS[monthIdx]}</div>
                    <div class="day-row">${headerHTML}</div>
                    ${rowsHTML}
                </div>`;
        }

        function buildHolidayLegendHTML(year) {
            const map = buildHolidayMap(year);
            const entries = Object.entries(map)
                .sort((a, b) => {
                    // Sort by month then day
                    const [am, ad] = a[0].split('-').map(Number);
                    const [bm, bd] = b[0].split('-').map(Number);
                    return am !== bm ? am - bm : ad - bd;
                });

            if (!entries.length) return '';

            const items = entries.map(([key, name]) => {
                const [m, d] = key.split('-');
                const monthAbbr = MONTHS[Number(m) - 1].slice(0, 3);
                return `<div class="holiday-legend-item">${name} <span>${monthAbbr} ${d}</span></div>`;
            }).join('');

            return `<div class="holiday-legend">${items}</div>`;
        }

        function buildNotesStripHTML() {
            const half = (start, end) => MONTHS.slice(start, end).map(m => `
                <div class="note-box">
                    <span class="note-box-label">${m}</span>
                    <div class="note-lines">
                        <div class="note-line"></div>
                        <div class="note-line"></div>
                        <div class="note-line"></div>
                    </div>
                </div>`).join('');

            return `
                <div class="notes-strip">${half(0, 6)}</div>
                <div class="notes-strip">${half(6, 12)}</div>`;
        }

        /* ══════════════════════════════════════════
           RENDER
        ══════════════════════════════════════════ */
        function render() {
            const year     = state.year;
            const view     = state.view;
            const isFullYear = view === 'full';
            const holidayMap = buildHolidayMap(year);

            // Show/hide columns control — irrelevant for single-month view
            document.getElementById('colsGroup').style.opacity = isFullYear ? '1' : '0.4';
            document.getElementById('colsSelect').disabled = !isFullYear;

            let html = `<div class="cal-root style-${state.style}">`;

            if (isFullYear) {
                // Year header
                html += `
                    <div class="cal-year-header">
                        <div class="cal-year-title">${year}</div>
                        <div class="cal-year-sub">Calendar</div>
                    </div>
                    <div class="cal-grid cols-${state.cols}">`;

                for (let m = 0; m < 12; m++) {
                    html += buildMonthHTML(year, m, holidayMap);
                }

                html += '</div>'; // /cal-grid

                // Notes rows (full year only)
                if (state.notes) {
                    html += buildNotesStripHTML();
                }

                // Holiday legend (full year only)
                if (state.holidays) {
                    html += buildHolidayLegendHTML(year);
                }

            } else {
                // Single month
                const mIdx = Number(view);
                html += `
                    <div class="cal-single">
                        <div class="cal-year-header" style="text-align:left; border-bottom:1px solid #e2e8f0; margin-bottom:16px; padding:0 0 14px;">
                            <div style="font-family:'Outfit',sans-serif; font-weight:900; font-size:2rem; letter-spacing:-1px; color:#0f172a;">
                                ${MONTHS[mIdx]} ${year}
                            </div>
                        </div>
                        ${buildMonthHTML(year, mIdx, holidayMap)}
                    </div>`;

                if (state.holidays) {
                    html += buildHolidayLegendHTML(year);
                }
            }

            html += '</div>'; // /cal-root

            document.getElementById('calendarPreview').innerHTML = html;
        }

        /* ══════════════════════════════════════════
           PRINT
        ══════════════════════════════════════════ */
        function doPrint() {
            const content = document.getElementById('calendarPreview').innerHTML;
            const isLandscape = state.layout === 'landscape';

            // Inject or update print-only styles
            let printStyle = document.getElementById('cal-print-style');
            if (!printStyle) {
                printStyle = document.createElement('style');
                printStyle.id = 'cal-print-style';
                document.head.appendChild(printStyle);
            }
            printStyle.textContent = `
                @media print {
                    @page {
                        size: ${isLandscape ? 'A4 landscape' : 'A4 portrait'};
                        margin: 8mm;
                    }
                    body > *:not(#cal-print-zone) { display: none !important; }
                    #cal-print-zone {
                        display: block !important;
                        position: fixed;
                        inset: 0;
                        width: 100%;
                        height: 100%;
                        background: #fff;
                        z-index: 99999;
                        overflow: visible;
                    }
                }
            `;

            // Fill print zone
            const zone = document.getElementById('cal-print-zone');
            zone.innerHTML = content;
            zone.style.display = 'block';

            // Trigger print, then restore
            requestAnimationFrame(() => {
                window.print();
                // Hide print zone after dialog closes
                // Use afterprint event for reliability
                function onAfterPrint() {
                    zone.style.display = 'none';
                    zone.innerHTML = '';
                    window.removeEventListener('afterprint', onAfterPrint);
                }
                window.addEventListener('afterprint', onAfterPrint);
                // Fallback: also hide after 3 seconds in case afterprint doesn't fire
                setTimeout(onAfterPrint, 3000);
            });
        }

        /* ══════════════════════════════════════════
           EVENT WIRING
        ══════════════════════════════════════════ */

        // Year input — validate and clamp
        function handleYearInput() {
            const inp = document.getElementById('yearInput');
            const raw = parseInt(inp.value, 10);
            if (isNaN(raw) || raw < 1900 || raw > 2100) {
                inp.classList.add('invalid');
                return; // Don't re-render on invalid input
            }
            inp.classList.remove('invalid');
            state.year = raw;
            render();
        }

        document.getElementById('yearInput').addEventListener('input', handleYearInput);
        document.getElementById('yearInput').addEventListener('change', function () {
            // On blur/change, clamp to valid range
            let val = parseInt(this.value, 10);
            if (isNaN(val)) val = new Date().getFullYear();
            val = Math.max(1900, Math.min(2100, val));
            this.value = val;
            this.classList.remove('invalid');
            state.year = val;
            render();
        });

        // View select
        document.getElementById('viewSelect').addEventListener('change', function () {
            state.view = this.value === 'full' ? 'full' : parseInt(this.value, 10);
            render();
        });

        // Week start
        document.getElementById('weekStart').addEventListener('change', function () {
            state.weekStart = parseInt(this.value, 10);
            render();
        });

        // Columns
        document.getElementById('colsSelect').addEventListener('change', function () {
            state.cols = parseInt(this.value, 10);
            render();
        });

        // Layout / Style radio pills (single-select per group)
        document.querySelectorAll('.tpill[data-group]').forEach(function (pill) {
            pill.addEventListener('click', function () {
                const group = this.dataset.group;
                document.querySelectorAll(`.tpill[data-group="${group}"]`).forEach(function (p) {
                    p.classList.remove('active');
                });
                this.classList.add('active');
                state[group] = this.dataset.val;
                render();
            });
        });

        // Extra toggle pills (independent on/off)
        document.querySelectorAll('.tpill[data-extra]').forEach(function (pill) {
            pill.addEventListener('click', function () {
                const key = this.dataset.extra;
                state[key] = !state[key];
                this.classList.toggle('active', state[key]);
                render();
            });
        });

        // Prev / Next year
        document.getElementById('btnPrevYear').addEventListener('click', function () {
            const inp = document.getElementById('yearInput');
            const next = Math.max(1900, state.year - 1);
            state.year = next;
            inp.value  = next;
            inp.classList.remove('invalid');
            render();
        });

        document.getElementById('btnNextYear').addEventListener('click', function () {
            const inp = document.getElementById('yearInput');
            const next = Math.min(2100, state.year + 1);
            state.year = next;
            inp.value  = next;
            inp.classList.remove('invalid');
            render();
        });

        // Print button
        document.getElementById('btnPrint').addEventListener('click', doPrint);

        /* ══════════════════════════════════════════
           INITIALISE
        ══════════════════════════════════════════ */
        (function init() {
            // Set year input to current year
            const currentYear = new Date().getFullYear();
            state.year = currentYear;
            document.getElementById('yearInput').value = currentYear;

            // Initial render
            render();
        }());

    }()); // end IIFE
    </script>

    <script src="../nav.js"></script>
</body>
</html>
