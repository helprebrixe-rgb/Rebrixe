    <script>
    // ── State ──────────────────────────────────────────────────────
    let mode = 'lmp';

    // ── Populate cycle selector ────────────────────────────────────
    (function() {
        const s = document.getElementById('cycleLen');
        for (let i = 20; i <= 45; i++) {
            const o = document.createElement('option');
            o.value = i;
            o.textContent = i + ' days' + (i === 28 ? ' (avg)' : '');
            if (i === 28) o.selected = true;
            s.appendChild(o);
        }
    })();

    // ── Mode switch ────────────────────────────────────────────────
    function switchMode(m) {
        mode = m;
        document.getElementById('tab-lmp').classList.toggle('active', m === 'lmp');
        document.getElementById('tab-con').classList.toggle('active', m === 'conception');
        document.getElementById('dateLabel').textContent = m === 'lmp'
            ? 'First Day of Last Period' : 'Estimated Conception Date';
        document.getElementById('cycleBox').style.display = m === 'lmp' ? '' : 'none';
        calculate();
    }

    // ── Utilities ──────────────────────────────────────────────────
    const addDays  = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
    const dayDiff  = (a, b) => Math.round((b.getTime() - a.getTime()) / 86400000);
    const fmtLong  = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'long',  year:'numeric' });
    const fmtShort = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    const fmtMini  = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
    const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    function getZodiac(d) {
        const m = d.getMonth() + 1, day = d.getDate();
        if ((m === 12 && day >= 22) || (m ===  1 && day <= 19)) return { name:'Capricorn',    sym:'♑' };
        if ((m ===  1 && day >= 20) || (m ===  2 && day <= 18)) return { name:'Aquarius',     sym:'♒' };
        if ((m ===  2 && day >= 19) || (m ===  3 && day <= 20)) return { name:'Pisces',       sym:'♓' };
        if ((m ===  3 && day >= 21) || (m ===  4 && day <= 19)) return { name:'Aries',        sym:'♈' };
        if ((m ===  4 && day >= 20) || (m ===  5 && day <= 20)) return { name:'Taurus',       sym:'♉' };
        if ((m ===  5 && day >= 21) || (m ===  6 && day <= 20)) return { name:'Gemini',       sym:'♊' };
        if ((m ===  6 && day >= 21) || (m ===  7 && day <= 22)) return { name:'Cancer',       sym:'♋' };
        if ((m ===  7 && day >= 23) || (m ===  8 && day <= 22)) return { name:'Leo',          sym:'♌' };
        if ((m ===  8 && day >= 23) || (m ===  9 && day <= 22)) return { name:'Virgo',        sym:'♍' };
        if ((m ===  9 && day >= 23) || (m === 10 && day <= 22)) return { name:'Libra',        sym:'♎' };
        if ((m === 10 && day >= 23) || (m === 11 && day <= 21)) return { name:'Scorpio',      sym:'♏' };
        if ((m === 11 && day >= 22) || (m === 12 && day <= 21)) return { name:'Sagittarius',  sym:'♐' };
        return { name:'Capricorn', sym:'♑' };
    }

        8:'a raspberry', 9:'a cherry 🍒', 10:'a strawberry 🍓', 11:'a fig',
        12:'a lime', 13:'a lemon 🍋', 14:'a peach 🍑', 15:'an apple 🍎',
        16:'an avocado 🥑', 17:'a pear 🍐', 18:'a sweet potato', 19:'a mango 🥭',
        20:'a banana 🍌', 21:'a carrot 🥕', 22:'a coconut 🥥', 23:'a large grapefruit',
        24:'an ear of corn 🌽', 25:'a cauliflower', 26:'a scallion', 27:'a head of lettuce 🥬',
        28:'an eggplant 🍆', 29:'a butternut squash', 30:'a cabbage', 31:'a coconut',
        32:'a squash', 33:'a pineapple 🍍', 34:'a cantaloupe', 35:'a honeydew melon',
        36:'a head of romaine', 37:'a bunch of chard', 38:'a leek',

        [ 6, 'Heartbeat on Ultrasound',  '💓'],
        [ 8, 'First Prenatal Visit',     '🏥'],
        [10, 'NIPT / Genetic Testing',   '🧬'],
        [12, 'NT Scan (Nuchal)',         '🔬'],
        [13, '1st Trimester Ends',       '✅'],
        [20, 'Anatomy Scan',             '👶'],
        [24, 'Viability Milestone',      '⭐'],
        [28, '3rd Trimester Begins',     '📅'],
        [37, 'Full Term Reached',        '🎉'],
        [40, 'Due Date',                 '🍼'],
    ];

    // ── Main calculation ───────────────────────────────────────────
    function calculate() {
        const val   = document.getElementById('mainDate').value;
        const panel = document.getElementById('resultPanel');
        const hint  = document.getElementById('emptyHint');
        if (!val) { panel.classList.remove('visible'); hint.style.display = 'block'; return; }

        const cycle = parseInt(document.getElementById('cycleLen').value) || 28;
        const input = new Date(val + 'T12:00:00'); // noon avoids DST edge cases

        // ── Derive LMP and EDD ────────────────────────────────────
        let lmp, edd;
        if (mode === 'lmp') {
            lmp = input;
            edd = addDays(lmp, 280 + (cycle - 28)); // Naegele's Rule + cycle adjustment
        } else {
            lmp = addDays(input, -14);   // conception ≈ LMP + 14 days
            edd = addDays(input, 266);   // 38 weeks from conception = 40 weeks from LMP
        }

        // ── Today + gestational age ───────────────────────────────
        const today    = new Date(); today.setHours(12, 0, 0, 0);
        const gestDays = dayDiff(lmp, today);
        const gestWks  = Math.floor(gestDays / 7);
        const gestRem  = gestDays % 7;
        const toEdd    = dayDiff(today, edd);
        const pct      = Math.max(0, Math.min(100, Math.round(gestDays / 280 * 100)));

        const isActive   = gestDays >= 0 && toEdd >= 0;
        const isFuture   = gestDays < 0;
        const isPast     = toEdd < 0;

        // ── Trimester boundaries ──────────────────────────────────
        // T1: Weeks 1-13 (days 0-90 from LMP)
        // T2: Weeks 14-27 (days 91-188)
        // T3: Weeks 28-40 (days 189+)
        const t1End   = addDays(lmp, 90);
        const t2Start = addDays(lmp, 91);
        const t2End   = addDays(lmp, 188);
        const t3Start = addDays(lmp, 189);

        let curTri = 0;
        if (isActive) {
            if (today <= t1End)      curTri = 1;
            else if (today <= t2End) curTri = 2;
            else                     curTri = 3;
        }

        // ── EDD metadata ─────────────────────────────────────────
        const zod    = getZodiac(edd);
        const eddDay = WEEKDAYS[edd.getDay()];
        const conceptionEst = addDays(lmp, cycle - 14); // ovulation day = cycle - 14

        // ── Milestone dates ───────────────────────────────────────
        const msData = MS.map(([w, label, icon]) => ({
            w, label, icon,
            date: addDays(lmp, w * 7),
            done: gestDays >= w * 7
        }));
        const nextMs = isActive ? msData.find(m => !m.done) : null;

        // ── Baby size ─────────────────────────────────────────────
        const sizeWeek = Math.max(4, Math.min(40, gestWks));
        const sizeStr  = (isActive && gestWks >= 4) ? SIZE[sizeWeek] : null;

        // ── Status badge + text ───────────────────────────────────
        let badge, sTxt;
        if (isFuture) {
            badge = `<span class="s-badge b-planning">📆 Planning Ahead</span>`;
            sTxt  = `Due date would be <strong>${fmtShort(edd)}</strong>`;
        } else if (isPast) {
            badge = `<span class="s-badge b-past">👶 Baby is Here!</span>`;
            sTxt  = `Due date was <strong>${fmtShort(edd)}</strong> — ${Math.abs(toEdd)} day${Math.abs(toEdd) !== 1 ? 's' : ''} ago`;
        } else {
            badge = `<span class="s-badge b-active">✨ Pregnant</span>`;
            const wLeft = Math.floor(toEdd / 7);
            sTxt = `<strong>${toEdd} days</strong> to go — about <strong>${wLeft} week${wLeft !== 1 ? 's' : ''}</strong> remaining`;
        }

        // ── Trimester card builder ────────────────────────────────
        const triCard = (n, range, s, e) => `
            <div class="tri-card${curTri === n ? ' cur' : ''}">
                <div class="tri-n">Trimester ${n}</div>
                <div class="tri-wk">${range}</div>
                <div class="tri-dr">${fmtMini(s)}<br>→ ${fmtMini(e)}</div>
                ${curTri === n ? '<div class="cur-pill">▶ You Are Here</div>' : ''}
            </div>`;

        // ── Render ────────────────────────────────────────────────
        panel.innerHTML = `
            <div class="edd-hero">
                <div class="edd-eyebrow">Estimated Due Date (EDD)</div>
                <div class="edd-date">${fmtLong(edd)}</div>
                <div class="edd-sub">${eddDay} &nbsp;·&nbsp; ${zod.sym} ${zod.name}</div>
                <div class="edd-tags">
                    <span class="edd-tag">${mode === 'lmp' ? cycle + '-day cycle · Naegele\'s Rule' : 'Conception date method'}</span>
                    ${mode === 'lmp' ? `<span class="edd-tag">Ovulation est. ${fmtMini(conceptionEst)}</span>` : ''}
                    <span class="edd-tag">Week 40 of 40</span>
                </div>
            </div>

            <div class="status-bar">
                ${badge}
                <div class="s-text">${sTxt}</div>
            </div>

            ${isActive ? `
            <div class="prog-card">
                <div class="prog-top">
                    <div class="prog-gest">Currently <strong>Week ${gestWks} + ${gestRem} day${gestRem !== 1 ? 's' : ''}</strong></div>
                    <div class="prog-pct">${pct}% complete</div>
                </div>
                <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
                <div class="prog-ticks"><span>Week 1</span><span>T2 · Wk 14</span><span>T3 · Wk 28</span><span>Week 40</span></div>
            </div>` : ''}

            ${sizeStr ? `
            <div class="baby-bar">
                <div class="baby-icon">🤰</div>
                <div class="baby-text">At <strong>Week ${gestWks}</strong>, your baby is about the size of <strong>${sizeStr}</strong></div>
            </div>` : ''}

            ${nextMs ? `
            <div class="next-ms">
                <div class="nm-icon">${nextMs.icon}</div>
                <div class="nm-text"><strong>Next milestone:</strong> ${nextMs.label} — Week ${nextMs.w} &nbsp;·&nbsp; ${fmtShort(nextMs.date)} &nbsp;·&nbsp; ${dayDiff(today, nextMs.date)} days away</div>
            </div>` : ''}

            <div class="sec-label">Trimester Dates</div>
            <div class="tri-grid">
                ${triCard(1, 'Weeks 1–13',  lmp,     t1End)}
                ${triCard(2, 'Weeks 14–27', t2Start, t2End)}
                ${triCard(3, 'Weeks 28–40', t3Start, edd)}
            </div>

            <div class="sec-label">Key Milestones</div>
            <div class="ms-grid">
                ${msData.map(m => `
                    <div class="ms-item${m.done ? ' done' : ''}${nextMs && m.w === nextMs.w && isActive ? ' upcoming' : ''}">
                        <div class="ms-ic">${m.icon}</div>
                        <div class="ms-inf">
                            <div class="ms-lbl">${m.label}</div>
                            <div class="ms-dt">${fmtShort(m.date)}</div>
                        </div>
                        <div class="ms-wk">W${m.w}</div>
                    </div>`).join('')}
            </div>

            <div class="action-row">
                <button class="btn-act primary" onclick="copyResult()">Copy Summary</button>
                <button class="btn-act" onclick="resetTool()">✕ Reset</button>
            </div>
        `;

        panel.classList.add('visible');
        hint.style.display = 'none';
    }

    // ── Reset ──────────────────────────────────────────────────────
    function resetTool() {
        document.getElementById('mainDate').value = '';
        document.getElementById('resultPanel').classList.remove('visible');
        document.getElementById('emptyHint').style.display = 'block';
    }

    // ── Copy ───────────────────────────────────────────────────────
    function copyResult() {
        const eddEl  = document.querySelector('.edd-date');
        const statEl = document.querySelector('.s-text');
        const triEls = document.querySelectorAll('.tri-card');
        if (!eddEl) return;
        const triTxt = [...triEls].map(c => {
            const n  = c.querySelector('.tri-n')?.innerText || '';
            const wk = c.querySelector('.tri-wk')?.innerText || '';
            const dr = c.querySelector('.tri-dr')?.innerText.replace('\n', ' → ') || '';
            return `  ${n} (${wk}): ${dr}`;
        }).join('\n');
        const txt = `Pregnancy Due Date Summary\n\nEDD: ${eddEl.innerText}\nStatus: ${statEl?.innerText || ''}\n\nTrimester Dates:\n${triTxt}\n\nCalculated at Rebrixe.com`;
        navigator.clipboard.writeText(txt).then(() => {
            const btn = document.querySelector('.btn-act.primary');
            if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => btn.textContent = 'Copy Summary', 2000); }
        });
    }
    </script>
    <script src="../nav.js"></script>
</body>
</html>
