    <style>
        .tool-wrap { max-width: 820px; margin: 40px auto; }

        /* ── Card ── */
        .tool-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 36px;
            min-height: 420px;
        }

        /* ── Setup panel ── */
        .setup-section { margin-bottom: 28px; }

        .row-label {
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #475569;
            margin-bottom: 10px;
        }

        /* Duration presets */
        .preset-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .preset-pill {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            color: #94a3b8;
            padding: 8px 18px;
            border-radius: 999px;
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: .2s;
            user-select: none;
        }
        .preset-pill:hover,
        .preset-pill.active { border-color: var(--primary); color: #fff; background: rgba(139,148,152,0.1); }

        /* Custom duration row */
        .dur-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .dur-row input[type="number"] {
            width: 80px;
            background: #000;
            border: 2px solid var(--border);
            border-radius: 12px;
            color: #fff;
            padding: 10px 14px;
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color .2s;
            -moz-appearance: textfield;
        }
        .dur-row input[type="number"]::-webkit-inner-spin-button { display: none; }
        .dur-row input[type="number"]:focus { border-color: var(--primary); }
        .dur-row span { color: #64748b; font-size: 0.85rem; }

        /* Meeting title */
        .title-input {
            width: 100%;
            background: #000;
            border: 2px solid var(--border);
            border-radius: 14px;
            color: #fff;
            padding: 14px 18px;
            font-family: 'Inter';
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color .2s;
            margin-bottom: 20px;
        }
        .title-input:focus { border-color: var(--primary); }
        .title-input::placeholder { color: #334155; }

        /* ── Agenda builder ── */
        .agenda-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .agenda-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            transition: border-color .2s;
        }
        .agenda-item:hover { border-color: #334155; }
        .agenda-item-name {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Inter';
            font-size: 0.88rem;
            outline: none;
        }
        .agenda-item-name::placeholder { color: #334155; }
        .agenda-item-mins {
            width: 54px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            padding: 4px 8px;
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 0.88rem;
            outline: none;
            text-align: center;
            -moz-appearance: textfield;
        }
        .agenda-item-mins::-webkit-inner-spin-button { display: none; }
        .agenda-item-mins:focus { border-color: var(--primary); }
        .seg-min-label { font-size: 0.7rem; color: #475569; white-space: nowrap; }
        .seg-del {
            background: none;
            border: none;
            color: #334155;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 4px;
            transition: color .2s;
            line-height: 1;
        }
        .seg-del:hover { color: #ef4444; }
        .add-seg-btn {
            background: rgba(255,255,255,0.03);
            border: 1px dashed var(--border);
            color: #475569;
            padding: 9px;
            border-radius: 12px;
            font-family: 'Inter';
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            transition: .2s;
            margin-bottom: 22px;
        }
        .add-seg-btn:hover { border-color: var(--primary); color: #fff; }

        /* ── Start button ── */
        .start-btn {
            width: 100%;
            background: linear-gradient(135deg, #616768, #c0cbcc);
            border: none;
            color: #fff;
            padding: 16px;
            border-radius: 16px;
            font-family: 'Outfit';
            font-weight: 900;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 6px 24px rgba(145,152,155,0.25);
        }
        .start-btn:hover { transform: translateY(-2px); letter-spacing: 2.5px; }

        /* Error state */
        .input-error { border-color: #ef4444 !important; }
        .error-msg {
            font-size: 0.78rem;
            color: #ef4444;
            margin-top: -14px;
            margin-bottom: 14px;
            display: none;
        }

        /* ── Timer Panel ── */
        #timerPanel { display: none; }

        .timer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .meeting-title-display {
            font-family: 'Outfit';
            font-weight: 900;
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .meeting-title-display span {
            color: #475569;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter';
            margin-left: 8px;
        }

        /* Ring clock */
        .clock-ring-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }
        .ring-svg { width: 220px; height: 220px; }
        .ring-bg   { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 10; }
        .ring-prog {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 628.318;
            stroke-dashoffset: 628.318;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.4s linear, stroke 0.3s;
        }

        .clock-inner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
        .clock-time {
            font-family: 'Outfit';
            font-weight: 900;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: -2px;
            color: #fff;
            line-height: 1;
        }
        .clock-sub {
            font-size: 0.7rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Status colors */
        .status-ok     { color: var(--primary, #8fadb4); stroke: var(--primary, #8fadb4); }
        .status-warn   { color: #f59e0b; stroke: #f59e0b; }
        .status-over   { color: #ef4444; stroke: #ef4444; }

        /* Elapsed / Remaining */
        .er-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .er-cell {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }
        .er-val {
            font-family: 'Outfit';
            font-weight: 900;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: -1px;
            line-height: 1;
        }
        .er-label {
            font-size: 0.62rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            margin-top: 5px;
        }

        /* Pace bar */
        .pace-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            margin-bottom: 16px;
        }
        .pace-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background .3s;
        }
        .pace-txt { font-size: 0.82rem; font-weight: 600; transition: color .3s; }

        /* Progress bar */
        .prog-bar-wrap { margin-bottom: 16px; }
        .prog-bar-track {
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 999px;
            overflow: hidden;
        }
        .prog-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--primary, #8fadb4);
            transition: width 0.4s linear, background 0.3s;
        }
        .prog-bar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.62rem;
            color: #334155;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Agenda progress */
        .agenda-progress { margin-bottom: 16px; }
        .ag-item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .ag-item-row:last-child { border-bottom: none; }
        .ag-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #1e293b;
            border: 2px solid #334155;
            transition: background .3s, border-color .3s, box-shadow .3s;
        }
        .ag-name { flex: 1; font-size: 0.82rem; color: #94a3b8; transition: color .3s; }
        .ag-dur  { font-size: 0.75rem; color: #334155; font-family: 'Outfit'; font-weight: 700; transition: color .3s; }

        /* Overtime indicator — only on status bar, not whole card */
        @keyframes status-pulse {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.55; }
        }
        .overtime-pulse { animation: status-pulse 1.2s ease-in-out infinite; }

        /* Controls */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .ctrl-btn {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: .2s;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.09); border-color: #fff; }
        .ctrl-btn:active { transform: scale(0.97); }
        .ctrl-btn.primary { background: linear-gradient(135deg, #616768, #c0cbcc); border-color: transparent; }
        .ctrl-btn.primary:hover { transform: translateY(-1px); }
        .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            z-index: 9999;
            transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (max-width: 580px) {
            .tool-card { padding: 22px; }
            .er-row { grid-template-columns: 1fr; }
            .controls-row { flex-wrap: wrap; }
            .ring-svg { width: 180px; height: 180px; }
        }
    </style>

<body data-theme="time-date">
    <nav class="nav-container"></nav>

    <div class="container">
        <a href="timers-focus-tools.html" class="back-btn">← back to tools</a>

        <header style="text-align:center; margin-bottom:44px;">
            <h1 style="font-family:'Outfit'; font-size:clamp(2rem,6vw,3.2rem); font-weight:900; letter-spacing:-2px; margin-bottom:10px;">Meeting Timer</h1>
            <p style="color:#64748b; font-size:0.95rem;">Track time elapsed &amp; remaining — with agenda and pace alerts.</p>
        </header>

        <div class="tool-wrap">
            <div class="tool-card" id="mainCard">

                <!-- ── SETUP PANEL ── -->
                <div id="setupPanel">

                    <div class="setup-section">
                        <div class="row-label">Meeting Name <span style="color:#334155">(optional)</span></div>
                        <input type="text" id="meetingTitle" class="title-input" placeholder="e.g. Weekly Standup, Sprint Planning…" maxlength="60">
                    </div>

                    <div class="setup-section">
                        <div class="row-label">Duration</div>
                        <div class="preset-pills" id="presetPills">
                            <button class="preset-pill" data-mins="15">15 min</button>
                            <button class="preset-pill active" data-mins="30">30 min</button>
                            <button class="preset-pill" data-mins="45">45 min</button>
                            <button class="preset-pill" data-mins="60">1 hr</button>
                            <button class="preset-pill" data-mins="90">90 min</button>
                        </div>
                        <div class="dur-row">
                            <input type="number" id="durHr"  min="0" max="23" value="0" placeholder="0">
                            <span>hr</span>
                            <input type="number" id="durMin" min="0" max="59" value="30" placeholder="30">
                            <span>min</span>
                        </div>
                        <div class="error-msg" id="durError">Please set at least 1 minute.</div>
                    </div>

                    <div class="setup-section">
                        <div class="row-label">Agenda <span style="color:#334155">(optional)</span></div>
                        <div class="agenda-list" id="agendaList"></div>
                        <button class="add-seg-btn" id="addSegBtn">+ Add Agenda Item</button>
                    </div>

                    <button class="start-btn" id="startBtn">▶ Start Meeting</button>
                </div>

                <!-- ── TIMER PANEL ── -->
                <div id="timerPanel">

                    <div class="timer-header">
                        <div class="meeting-title-display" id="displayTitle">Meeting</div>
                    </div>

                    <!-- Ring clock -->
                    <div class="clock-ring-wrap">
                        <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
                            <circle class="ring-bg"   cx="110" cy="110" r="100"/>
                            <circle class="ring-prog" id="ringProg" cx="110" cy="110" r="100"/>
                        </svg>
                        <div class="clock-inner">
                            <div class="clock-time" id="clockDisplay">00:00</div>
                            <div class="clock-sub"  id="clockSub">remaining</div>
                        </div>
                    </div>

                    <!-- Progress bar -->
                    <div class="prog-bar-wrap">
                        <div class="prog-bar-track">
                            <div class="prog-bar-fill" id="progFill" style="width:0%"></div>
                        </div>
                        <div class="prog-bar-labels">
                            <span>0%</span>
                            <span id="progPct">0%</span>
                            <span>100%</span>
                        </div>
                    </div>

                    <!-- Elapsed / Remaining -->
                    <div class="er-row">
                        <div class="er-cell">
                            <div class="er-val" id="elapsedVal">00:00</div>
                            <div class="er-label">Elapsed</div>
                        </div>
                        <div class="er-cell">
                            <div class="er-val" id="remainVal">--:--</div>
                            <div class="er-label">Remaining</div>
                        </div>
                    </div>

                    <!-- Pace indicator -->
                    <div class="pace-bar" id="paceBar">
                        <div class="pace-dot" id="paceDot"></div>
                        <div class="pace-txt" id="paceTxt">Starting…</div>
                    </div>

                    <!-- Agenda progress -->
                    <div class="agenda-progress" id="agendaProgress" style="display:none;">
                        <div class="row-label" style="margin-bottom:8px;">Agenda</div>
                        <div id="agendaTrack"></div>
                    </div>

                    <!-- Controls -->
                    <div class="controls-row">
                        <button class="ctrl-btn primary" id="pauseBtn">⏸ Pause</button>
                        <button class="ctrl-btn" id="restartBtn">↺ Restart</button>
                        <button class="ctrl-btn" id="endBtn">■ End</button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <footer></footer>

    <script>
    (function () {
        'use strict';

        /* ────────────────────────────────────────────────
           CONSTANTS
        ──────────────────────────────────────────────── */
        var RING_RADIUS  = 100;
        var CIRCUMF      = +(2 * Math.PI * RING_RADIUS).toFixed(3); // 628.318

        /* ────────────────────────────────────────────────
           STATE  — all mutable state lives here
        ──────────────────────────────────────────────── */
        var state = {
            totalSecs   : 30 * 60,
            startTime   : 0,       // Date.now() when timer started / last resumed
            pausedAt    : 0,       // elapsed ms accumulated before latest pause
            running     : false,
            paused      : false,
            alarmFired  : false,
            segments    : [],      // [{name:string, mins:number}]
            rafId       : null,
            endingLock  : false    // prevents double-end
        };

        /* ────────────────────────────────────────────────
           DOM REFS — resolved once at boot
        ──────────────────────────────────────────────── */
        var $ = function(id){ return document.getElementById(id); };
        var dom = {
            setupPanel   : $('setupPanel'),
            timerPanel   : $('timerPanel'),
            meetingTitle : $('meetingTitle'),
            durHr        : $('durHr'),
            durMin       : $('durMin'),
            durError     : $('durError'),
            presetPills  : $('presetPills'),
            agendaList   : $('agendaList'),
            startBtn     : $('startBtn'),
            addSegBtn    : $('addSegBtn'),
            // timer
            displayTitle : $('displayTitle'),
            ringProg     : $('ringProg'),
            clockDisplay : $('clockDisplay'),
            clockSub     : $('clockSub'),
            progFill     : $('progFill'),
            progPct      : $('progPct'),
            elapsedVal   : $('elapsedVal'),
            remainVal    : $('remainVal'),
            paceDot      : $('paceDot'),
            paceTxt      : $('paceTxt'),
            agendaProgress:$('agendaProgress'),
            agendaTrack  : $('agendaTrack'),
            pauseBtn     : $('pauseBtn'),
            restartBtn   : $('restartBtn'),
            endBtn       : $('endBtn'),
            toast        : $('toast')
        };

        /* Initialise ring */
        dom.ringProg.style.strokeDasharray  = CIRCUMF;
        dom.ringProg.style.strokeDashoffset = CIRCUMF;

        /* ────────────────────────────────────────────────
           PRESET PILLS
        ──────────────────────────────────────────────── */
        dom.presetPills.addEventListener('click', function(e){
            var pill = e.target.closest('.preset-pill');
            if (!pill) return;
            var mins = parseInt(pill.dataset.mins, 10);
            Array.from(dom.presetPills.children).forEach(function(p){ p.classList.remove('active'); });
            pill.classList.add('active');
            dom.durHr.value  = Math.floor(mins / 60);
            dom.durMin.value = mins % 60;
            hideError();
        });

        /* Typing custom duration clears pill selection */
        dom.durHr.addEventListener('input',  clearPills);
        dom.durMin.addEventListener('input', clearPills);

        function clearPills(){
            Array.from(dom.presetPills.children).forEach(function(p){ p.classList.remove('active'); });
            hideError();
        }

        /* ────────────────────────────────────────────────
           AGENDA BUILDER
        ──────────────────────────────────────────────── */
        dom.addSegBtn.addEventListener('click', function(){ addSegment('', 10); });

        function addSegment(name, mins) {
            var item = document.createElement('div');
            item.className = 'agenda-item';
            item.innerHTML =
                '<input type="text" class="agenda-item-name" placeholder="Topic…" maxlength="40">' +
                '<input type="number" class="agenda-item-mins" min="1" max="180" value="10">' +
                '<span class="seg-min-label">min</span>' +
                '<button class="seg-del" aria-label="Remove item">×</button>';
            item.querySelector('.agenda-item-name').value = name || '';
            item.querySelector('.agenda-item-mins').value = String(mins || 10);
            item.querySelector('.seg-del').addEventListener('click', function(){
                item.remove();
            });
            dom.agendaList.appendChild(item);
        }

        function readSegments() {
            var segs = [];
            Array.from(dom.agendaList.querySelectorAll('.agenda-item')).forEach(function(row){
                var nameEl = row.querySelector('.agenda-item-name');
                var minsEl = row.querySelector('.agenda-item-mins');
                var m = parseInt(minsEl.value, 10);
                if (isNaN(m) || m < 1) m = 1;
                if (m > 180) m = 180;
                segs.push({ name: (nameEl.value.trim() || 'Item'), mins: m });
            });
            return segs;
        }

        /* ────────────────────────────────────────────────
           VALIDATION
        ──────────────────────────────────────────────── */
        function getDurationSecs() {
            var hr  = Math.max(0, parseInt(dom.durHr.value,  10) || 0);
            var min = Math.max(0, parseInt(dom.durMin.value, 10) || 0);
            return hr * 3600 + min * 60;
        }

        function showError(msg) {
            dom.durError.textContent = msg;
            dom.durError.style.display = 'block';
            dom.durHr.classList.add('input-error');
            dom.durMin.classList.add('input-error');
        }
        function hideError() {
            dom.durError.style.display = 'none';
            dom.durHr.classList.remove('input-error');
            dom.durMin.classList.remove('input-error');
        }

        /* ────────────────────────────────────────────────
           START
        ──────────────────────────────────────────────── */
        dom.startBtn.addEventListener('click', startTimer);

        function startTimer() {
            var secs = getDurationSecs();
            if (secs < 60) { showError('Please set at least 1 minute.'); return; }
            hideError();

            state.totalSecs  = secs;
            state.startTime  = Date.now();
            state.pausedAt   = 0;
            state.running    = true;
            state.paused     = false;
            state.alarmFired = false;
            state.endingLock = false;
            state.segments   = readSegments();

            var title    = dom.meetingTitle.value.trim();
            var totalStr = fmtDuration(secs);
            dom.displayTitle.innerHTML =
                (title || 'Meeting') + '<span>' + totalStr + '</span>';

            renderAgendaTrack();

            dom.setupPanel.style.display = 'none';
            dom.timerPanel.style.display = 'block';
            dom.pauseBtn.textContent     = '⏸ Pause';
            dom.pauseBtn.disabled        = false;

            cancelAnimationFrame(state.rafId);
            scheduleFrame();
        }

        /* ────────────────────────────────────────────────
           WALL-CLOCK ELAPSED  (drift-proof)
        ──────────────────────────────────────────────── */
        function getElapsedSecs() {
            if (state.paused) {
                return state.pausedAt / 1000;
            }
            return (state.pausedAt + (Date.now() - state.startTime)) / 1000;
        }

        /* ────────────────────────────────────────────────
           RAF LOOP
        ──────────────────────────────────────────────── */
        function scheduleFrame() {
            state.rafId = requestAnimationFrame(frame);
        }

        function frame() {
            if (!state.running) return;

            var elapsed = getElapsedSecs();

            // Fire alarm once when we cross the boundary
            if (!state.alarmFired && elapsed >= state.totalSecs) {
                state.alarmFired = true;
                fireAlarm();
            }

            renderTimer(elapsed);

            if (!state.paused) scheduleFrame();
        }

        /* ────────────────────────────────────────────────
           RENDER
        ──────────────────────────────────────────────── */
        function renderTimer(elapsed) {
            var total    = state.totalSecs;
            var overtime = elapsed > total;
            var pct      = Math.min(elapsed / total, 1);
            var remaining = Math.max(total - elapsed, 0);

            /* Clock face */
            if (overtime) {
                dom.clockDisplay.textContent = fmtTime(elapsed - total);
                dom.clockDisplay.style.color = '#ef4444';
                dom.clockSub.textContent     = 'overtime';
            } else {
                dom.clockDisplay.textContent = fmtTime(remaining);
                dom.clockDisplay.style.color = '';
                dom.clockSub.textContent     = remaining < 1 ? "time's up" : 'remaining';
            }

            /* Ring — stroke */
            var offset = CIRCUMF * (1 - pct);
            dom.ringProg.style.strokeDashoffset = offset.toFixed(3);
            dom.ringProg.style.stroke = overtime ? '#ef4444' : pct >= 0.85 ? '#f59e0b' : 'var(--primary, #8fadb4)';

            /* Progress bar */
            dom.progFill.style.width      = (pct * 100).toFixed(2) + '%';
            dom.progFill.style.background = overtime ? '#ef4444' : pct >= 0.85 ? '#f59e0b' : '';
            dom.progPct.textContent       = Math.round(pct * 100) + '%';

            /* Elapsed / Remaining cells */
            dom.elapsedVal.textContent = fmtTime(elapsed);
            if (overtime) {
                dom.remainVal.textContent = '+' + fmtTime(elapsed - total);
                dom.remainVal.style.color = '#ef4444';
            } else {
                dom.remainVal.textContent = fmtTime(remaining);
                dom.remainVal.style.color = '';
            }

            /* Pace bar */
            renderPace(overtime, pct, elapsed, total, remaining);

            /* Agenda */
            if (state.segments.length > 0) updateAgendaTrack(elapsed);
        }

        function renderPace(overtime, pct, elapsed, total, remaining) {
            var dot = dom.paceDot;
            var txt = dom.paceTxt;

            if (overtime) {
                dot.style.background = '#ef4444';
                txt.style.color      = '#ef4444';
                txt.textContent      = 'Running ' + fmtTime(elapsed - total) + ' over schedule';
                txt.classList.add('overtime-pulse');
            } else if (pct >= 0.9) {
                dot.style.background = '#f59e0b';
                txt.style.color      = '#f59e0b';
                txt.textContent      = 'Under 10% remaining — wrap up';
                txt.classList.remove('overtime-pulse');
            } else if (pct >= 0.75) {
                dot.style.background = '#f59e0b';
                txt.style.color      = '#f59e0b';
                txt.textContent      = '75% of time used — stay focused';
                txt.classList.remove('overtime-pulse');
            } else {
                dot.style.background = '#4ade80';
                txt.style.color      = '#4ade80';
                txt.textContent      = 'On track — ' + Math.round((1 - pct) * 100) + '% remaining';
                txt.classList.remove('overtime-pulse');
            }
        }

        /* ────────────────────────────────────────────────
           AGENDA TRACK
        ──────────────────────────────────────────────── */
        function renderAgendaTrack() {
            if (!state.segments.length) {
                dom.agendaProgress.style.display = 'none';
                return;
            }
            dom.agendaProgress.style.display = 'block';
            updateAgendaTrack(0);
        }

        /* Uses a document fragment — one DOM write per tick */
        function updateAgendaTrack(elapsedSecs) {
            var frag = document.createDocumentFragment();
            var cumSecs = 0;

            state.segments.forEach(function(seg) {
                var startSec = cumSecs;
                var endSec   = cumSecs + seg.mins * 60;
                var done     = elapsedSecs >= endSec;
                var active   = !done && elapsedSecs >= startSec;
                cumSecs      = endSec;

                var row = document.createElement('div');
                row.className = 'ag-item-row';

                var dot  = document.createElement('div');
                dot.className = 'ag-dot';
                if (done) {
                    dot.style.background = '#4ade80';
                    dot.style.borderColor = '#4ade80';
                } else if (active) {
                    dot.style.background = 'var(--primary, #8fadb4)';
                    dot.style.borderColor = 'var(--primary, #8fadb4)';
                    dot.style.boxShadow = '0 0 6px rgba(143,173,180,0.5)';
                }

                var name = document.createElement('div');
                name.className = 'ag-name';
                name.textContent = seg.name;
                if (done)   { name.style.color = '#334155'; name.style.textDecoration = 'line-through'; }
                else if (active) { name.style.color = '#fff'; name.style.fontWeight = '600'; }

                var dur = document.createElement('div');
                dur.className = 'ag-dur';
                dur.textContent = seg.mins + 'm';
                if (active) dur.style.color = 'var(--primary, #8fadb4)';

                row.appendChild(dot);
                row.appendChild(name);
                row.appendChild(dur);
                frag.appendChild(row);
            });

            dom.agendaTrack.innerHTML = '';
            dom.agendaTrack.appendChild(frag);
        }

        /* ────────────────────────────────────────────────
           ALARM — Web Audio, with resume guard
        ──────────────────────────────────────────────── */
        function fireAlarm() {
            showToast("⏰ Time's up!");
            playBeeps();
        }

        function playBeeps() {
            try {
                var AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                var ctx = new AudioCtx();

                function beep(freq, startDelay) {
                    var osc  = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    var t0 = ctx.currentTime + startDelay;
                    gain.gain.setValueAtTime(0, t0);
                    gain.gain.linearRampToValueAtTime(0.35, t0 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.38);
                    osc.start(t0);
                    osc.stop(t0 + 0.4);
                }

                var resume = ctx.state === 'suspended' ? ctx.resume() : Promise.resolve();
                resume.then(function(){
                    beep(520, 0);
                    beep(640, 0.42);
                    beep(760, 0.84);
                }).catch(function(){
                    /* Audio not available — toast already shown */
                });
            } catch(e) { /* silent fail — toast already shown */ }
        }

        /* ────────────────────────────────────────────────
           CONTROLS
        ──────────────────────────────────────────────── */
        dom.pauseBtn.addEventListener('click', togglePause);
        dom.restartBtn.addEventListener('click', restartTimer);
        dom.endBtn.addEventListener('click', endMeeting);

        function togglePause() {
            if (!state.running) return;

            if (state.paused) {
                /* Resume: record how long we were paused, reset startTime */
                state.startTime = Date.now();
                state.paused    = false;
                dom.pauseBtn.textContent = '⏸ Pause';
                scheduleFrame();
                showToast('Resumed');
            } else {
                /* Pause: snapshot elapsed before stopping */
                state.pausedAt += Date.now() - state.startTime;
                state.paused    = true;
                dom.pauseBtn.textContent = '▶ Resume';
                showToast('Paused');
            }
        }

        function restartTimer() {
            if (!state.running) return;
            cancelAnimationFrame(state.rafId);
            state.startTime  = Date.now();
            state.pausedAt   = 0;
            state.paused     = false;
            state.alarmFired = false;
            state.endingLock = false;
            dom.pauseBtn.textContent = '⏸ Pause';
            dom.pauseBtn.disabled    = false;
            renderTimer(0);
            scheduleFrame();
            showToast('Restarted');
        }

        function endMeeting() {
            if (!state.running || state.endingLock) return;
            state.endingLock = true;
            cancelAnimationFrame(state.rafId);

            var elapsed = getElapsedSecs();
            var pct     = Math.min(elapsed / state.totalSecs, 1);
            var msg     = 'Ended — ' + fmtTime(elapsed) + ' used (' + Math.round(pct * 100) + '%)';
            showToast(msg);

            state.running = false;
            dom.pauseBtn.disabled = true;

            setTimeout(function(){
                resetToSetup();
            }, 2200);
        }

        function resetToSetup() {
            state.running    = false;
            state.paused     = false;
            state.endingLock = false;
            cancelAnimationFrame(state.rafId);

            dom.timerPanel.style.display = 'none';
            dom.setupPanel.style.display = 'block';

            /* Reset ring to empty */
            dom.ringProg.style.strokeDashoffset = CIRCUMF;
            dom.ringProg.style.stroke = 'var(--primary, #8fadb4)';
            dom.progFill.style.width = '0%';
            dom.progFill.style.background = '';
            dom.clockDisplay.textContent = '00:00';
            dom.clockDisplay.style.color = '';
            dom.clockSub.textContent = 'remaining';
            dom.paceTxt.classList.remove('overtime-pulse');
        }

        /* ────────────────────────────────────────────────
           FORMATTING UTILITIES
        ──────────────────────────────────────────────── */
        function fmtTime(secs) {
            secs = Math.max(0, Math.floor(secs));
            var h   = Math.floor(secs / 3600);
            var m   = Math.floor((secs % 3600) / 60);
            var s   = secs % 60;
            if (h > 0) return h + ':' + pad(m) + ':' + pad(s);
            return pad(m) + ':' + pad(s);
        }

        function fmtDuration(secs) {
            var h = Math.floor(secs / 3600);
            var m = Math.floor((secs % 3600) / 60);
            if (h > 0 && m > 0) return h + 'h ' + m + 'm';
            if (h > 0)          return h + 'h';
            return m + ' min';
        }

        function pad(n) { return n < 10 ? '0' + n : String(n); }

        /* ────────────────────────────────────────────────
           TOAST
        ──────────────────────────────────────────────── */
        var toastTimer = null;
        function showToast(msg) {
            dom.toast.textContent = msg;
            dom.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function(){
                dom.toast.classList.remove('show');
            }, 2800);
        }

        /* ────────────────────────────────────────────────
           KEYBOARD SHORTCUTS
        ──────────────────────────────────────────────── */
        document.addEventListener('keydown', function(e) {
            if (!state.running) return;
            var tag = document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                togglePause();
            }
        });

    }());
    </script>
    <script src="../nav.js"></script>
</body>
</html>
