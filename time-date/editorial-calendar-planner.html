<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Calendar Planner | Rebrixe</title>
    <meta name="description" content="Plan a full month of content. Set your content types, posting cadence, and channels — get a ready-to-use editorial calendar grid.">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/main-style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <style>
        /* ── Layout ── */
        .tool-wrap { max-width: 960px; margin: 40px auto; }
        .tool-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 36px;
        }

        /* ── Labels ── */
        .section-label {
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #475569;
            margin-bottom: 10px;
        }

        /* ── Config grid ── */
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .config-box { display: flex; flex-direction: column; gap: 8px; }
        .config-label {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
        }
        .config-select, .config-input {
            width: 100%;
            background: #000;
            border: 2px solid var(--border);
            border-radius: 14px;
            color: #fff;
            padding: 13px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color .2s;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        .config-select:focus, .config-input:focus { border-color: var(--primary); }
        .select-wrap { position: relative; }
        .select-wrap::after {
            content: '▾';
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            color: #475569;
            pointer-events: none;
            font-size: 0.8rem;
        }

        /* ── Goal row ── */
        .goal-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        /* ── Content type chips ── */
        .types-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .type-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            transition: .2s;
            user-select: none;
        }
        .type-chip:hover { border-color: #64748b; }
        .type-chip.active { border-color: var(--primary); background: rgba(139,148,152,0.1); }
        .type-chip span { font-size: 0.75rem; font-family: 'Outfit', sans-serif; font-weight: 700; color: #94a3b8; transition: color .2s; }
        .type-chip.active span { color: var(--primary); }
        .chip-icon { font-size: 0.85rem; }

        /* ── Channel chips ── */
        .channels-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .channel-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: .2s;
            user-select: none;
        }
        .channel-chip:hover { border-color: #64748b; }
        .channel-chip.active { border-color: var(--primary); background: rgba(139,148,152,0.1); }
        .channel-chip span { font-size: 0.75rem; font-family: 'Outfit', sans-serif; font-weight: 700; color: #94a3b8; transition: color .2s; }
        .channel-chip.active span { color: var(--primary); }

        /* ── Generate button ── */
        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #616768, #c0cbcc);
            border: none;
            color: #fff;
            padding: 16px;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 6px 20px rgba(145,152,155,0.25);
        }
        .btn-generate:hover { transform: translateY(-2px); letter-spacing: 2px; }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ── Validation message ── */
        .val-msg {
            display: none;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            padding: 10px 16px;
            color: #f87171;
            font-size: 0.8rem;
            margin-bottom: 14px;
        }
        .val-msg.visible { display: block; }

        /* ── Result panel ── */
        .result-panel { display: none; margin-top: 28px; }
        .result-panel.visible { display: block; }

        /* ── Stats bar ── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-cell {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 12px;
            text-align: center;
        }
        .stat-num {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            letter-spacing: -1px;
        }
        .stat-lbl {
            font-size: 0.58rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            margin-top: 5px;
        }

        /* ── Campaign badge ── */
        .campaign-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(139,148,152,0.12);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.72rem;
            color: var(--primary);
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* ── Calendar header ── */
        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .cal-title { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 800; color: #fff; }
        .view-btns { display: flex; gap: 6px; }
        .view-btn {
            padding: 5px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #64748b;
            font-size: 0.7rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }
        .view-btn.active, .view-btn:hover { border-color: var(--primary); color: #fff; }

        /* ── Week grid ── */
        .week-grid {
            display: grid;
            grid-template-columns: 56px repeat(7, 1fr);
            gap: 1px;
            background: var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .wg-cell { background: #0a0a0a; padding: 8px 6px; min-height: 36px; }
        .wg-day-header { background: rgba(255,255,255,0.04); padding: 10px 6px; text-align: center; }
        .wg-day-name { font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #475569; }
        .wg-week-label { background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center; }
        .wg-week-txt {
            font-size: 0.55rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: #334155;
            writing-mode: vertical-rl; text-orientation: mixed;
        }

        /* ── Post cards ── */
        .post-card {
            background: rgba(255,255,255,0.04);
            border-left: 2px solid #334155;
            border-radius: 6px;
            padding: 5px 7px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: .15s;
        }
        .post-card:hover { background: rgba(255,255,255,0.08); transform: translateX(1px); }
        .post-type-tag { font-size: 0.55rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }
        .post-title { font-size: 0.68rem; color: #94a3b8; line-height: 1.3; }
        .post-channel { font-size: 0.55rem; color: #475569; margin-top: 2px; }

        /* ── Color classes for post cards ── */
        .tc-0 { border-left-color: #f472b6; } .tc-0 .post-type-tag { color: #f472b6; }
        .tc-1 { border-left-color: #60a5fa; } .tc-1 .post-type-tag { color: #60a5fa; }
        .tc-2 { border-left-color: #34d399; } .tc-2 .post-type-tag { color: #34d399; }
        .tc-3 { border-left-color: #fbbf24; } .tc-3 .post-type-tag { color: #fbbf24; }
        .tc-4 { border-left-color: #a78bfa; } .tc-4 .post-type-tag { color: #a78bfa; }
        .tc-5 { border-left-color: #fb923c; } .tc-5 .post-type-tag { color: #fb923c; }
        .tc-6 { border-left-color: #22d3ee; } .tc-6 .post-type-tag { color: #22d3ee; }

        /* ── Grid / List view toggles ── */
        .grid-view-wrap { display: block; }
        .grid-view-wrap.hidden { display: none; }
        .list-view-wrap { display: none; }
        .list-view-wrap.visible { display: block; }

        /* ── List view ── */
        .list-table-wrap {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .list-row {
            display: grid;
            grid-template-columns: 76px 100px 1fr 110px;
            gap: 10px;
            align-items: center;
            padding: 11px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background .15s;
        }
        .list-row:last-child { border-bottom: none; }
        .list-row:hover { background: rgba(255,255,255,0.02); }
        .list-row.hdr {
            background: rgba(255,255,255,0.03);
            border-radius: 14px 14px 0 0;
            border-bottom: 1px solid var(--border);
            cursor: default;
        }
        .lh { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #475569; }
        .lv-date { font-family: 'Outfit', sans-serif; font-weight: 700; color: #cbd5e1; font-size: 0.82rem; }
        .lv-type { font-size: 0.75rem; font-weight: 700; }
        .lv-title { color: #e2e8f0; font-size: 0.82rem; line-height: 1.4; }
        .lv-ch { font-size: 0.75rem; color: #64748b; }

        /* ── Legend ── */
        .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: #64748b; }
        .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

        /* ── Action row ── */
        .action-row { display: flex; gap: 10px; margin-top: 4px; }
        .btn-action {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: .2s;
        }
        .btn-action:hover { background: rgba(255,255,255,0.1); border-color: #fff; transform: translateY(-2px); }
        .btn-action.primary { background: linear-gradient(135deg, #616768, #c0cbcc); border-color: transparent; }

        /* ── Post detail drawer ── */
        .detail-drawer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            align-items: flex-end;
            justify-content: center;
        }
        .detail-drawer.open { display: flex; }
        .drawer-inner {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            padding: 28px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .drawer-handle { width: 40px; height: 4px; background: #334155; border-radius: 2px; margin: 0 auto 20px; }
        .drawer-type { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .drawer-title { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 800; color: #fff; margin-bottom: 16px; line-height: 1.3; }
        .drawer-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .meta-pill {
            padding: 4px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.7rem;
            color: #94a3b8;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
        }
        .drawer-section h4 { font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: #475569; margin-bottom: 8px; }
        .hook-list { list-style: none; padding: 0; margin: 0 0 16px; }
        .hook-list li { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.82rem; color: #94a3b8; line-height: 1.4; }
        .hook-list li::before { content: '→ '; color: #475569; }
        .drawer-close { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: .2s; }
        .drawer-close:hover { background: rgba(255,255,255,0.1); }

        /* ── Today highlight ── */
        .today-cell { outline: 1px solid rgba(139,148,152,0.45); }

        /* ── Responsive ── */
        @media(max-width: 640px) {
            .config-grid { grid-template-columns: 1fr 1fr; }
            .goal-row { grid-template-columns: 1fr; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .week-grid { grid-template-columns: 36px repeat(7, 1fr); font-size: 0.6rem; }
            .list-row { grid-template-columns: 64px 1fr 90px; }
            .list-row .lv-type { display: none; }
            .action-row { flex-direction: column; }
        }
    </style>
</head>

                                <option value="fitness">Fitness / Health</option>
                                <option value="finance">Finance</option>
                                <option value="creator">Creator / Personal Brand</option>
                                <option value="agency">Agency</option>
                                <option value="food">Food &amp; Lifestyle</option>
                                <option value="education">Education</option>
                                <option value="realestate">Real Estate</option>

                        </div>
                    </div>
                    <div class="config-box">
                        <span class="config-label">Week Starts On</span>
                        <div class="select-wrap">

                <div class="section-label">Content Types</div>

                <!-- Result Panel -->
                <div id="resultPanel" class="result-panel">

                    <div class="section-label" style="margin-top:4px;">Content Types</div>
                    <div class="legend" id="legend"></div>

                    <div class="cal-header">
                        <div class="cal-title" id="calTitle"></div>
                        <div class="view-btns">
                            <button class="view-btn active" id="btnGrid" onclick="switchView('grid')">Grid</button>
                            <button class="view-btn" id="btnList" onclick="switchView('list')">List</button>

                    </div>

                    <div class="grid-view-wrap" id="gridView"></div>
                    <div class="list-view-wrap" id="listView"></div>

                    <div class="action-row">
                        <button class="btn-action primary" onclick="exportCSV()">Export CSV</button>
                        <button class="btn-action" id="btnCopy" onclick="copyAll()">Copy Text</button>
                        <button class="btn-action" onclick="generateCalendar()">↺ Regenerate</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

            <div class="drawer-handle"></div>
            <div id="drawerContent"></div>
            <button class="drawer-close" onclick="closeDrawer()">Close</button>
        </div>
    </div>

    function toggleType(id, el) {
        activeTypes.has(id) ? (activeTypes.delete(id), el.classList.remove('active'))
                             : (activeTypes.add(id),    el.classList.add('active'));
    }

    function toggleChannel(id, el) {
        activeChannels.has(id) ? (activeChannels.delete(id), el.classList.remove('active'))
                                : (activeChannels.add(id),    el.classList.add('active'));
    }

    /* ─────────────────────────────────────────────
       PUBLISH DAY SPREAD
       Returns exactly `cadence` distinct day-of-week
       numbers, evenly spread across the 7-day week.
       Uses a fixed stride approach — no rounding bugs.
    ───────────────────────────────────────────── */

    function getPublishDays(cadence, weekStart) {
        if (cadence >= 7) return [0, 1, 2, 3, 4, 5, 6];
        if (cadence === 5) return [1, 2, 3, 4, 5]; // fixed weekdays, independent of weekStart

        // Ordered list of 7 days starting from weekStart
        const ordered = [];
        for (let i = 0; i < 7; i++) ordered.push((weekStart + i) % 7);

        // Pick evenly spaced indices using integer stride — guaranteed unique, exact count
        const stride = 7 / cadence; // e.g. cadence 3 → stride 2.333
        const days = [];
        for (let i = 0; i < cadence; i++) {
            const idx = Math.floor(i * stride); // floor keeps indices strictly increasing
            days.push(ordered[idx]);
        }
        return days; // length === cadence, all unique guaranteed
    }

    /* ─────────────────────────────────────────────
       CHANNEL ASSIGNMENT
       For each post, pick the best matching channel
       from the user's active channels based on the
       content type's preferred channel list.
       Falls back to round-robin only if no match.
    ───────────────────────────────────────────── */

    function assignChannel(typeId, activeChannelList, fallbackIdx) {
        const typeObj  = CONTENT_TYPES.find(t => t.id === typeId);
        const preferred = typeObj ? typeObj.channels : [];

        // Return the first preferred channel the user has active
        for (const pref of preferred) {
            if (activeChannelList.includes(pref)) return pref;
        }

        // No preferred channel is active — fall back to round-robin
        return activeChannelList[fallbackIdx % activeChannelList.length];
    }

    /* ─────────────────────────────────────────────
       FISHER-YATES SHUFFLE — in-place, returns array
    ───────────────────────────────────────────── */

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    /* ─────────────────────────────────────────────
       GENERATE
    ───────────────────────────────────────────── */

    function generateCalendar() {
        // Validation
        const valEl = document.getElementById('valMsg');
        valEl.classList.remove('visible');

        const types    = [...activeTypes];
        const channels = [...activeChannels];

        if (!types.length) {
            valEl.textContent = 'Please select at least one content type before generating.';
            valEl.classList.add('visible');
            return;
        }
        if (!channels.length) {
            valEl.textContent = 'Please select at least one channel before generating.';
            valEl.classList.add('visible');
            return;
        }

        const [year, month] = document.getElementById('planMonth').value.split('-').map(Number);
        const cadence       = parseInt(document.getElementById('cadence').value, 10);
        const niche         = document.getElementById('niche').value;
        const weekStart     = parseInt(document.getElementById('weekStart').value, 10);
        const campaign      = document.getElementById('campaignLabel').value.trim();

        // Build colour map (stable per type id across regenerations)
        typeColorMap = {};
        types.forEach((t, i) => {
            typeColorMap[t] = { color: TYPE_COLORS[i % TYPE_COLORS.length], idx: i };
        });

        // Publish days for this configuration
        const publishDays   = getPublishDays(cadence, weekStart);
        const daysInMonth   = new Date(year, month, 0).getDate();

        // Shuffle a large idea pool so every generation is different.
        // We duplicate the bank enough times to cover even daily for a month (31 posts max).
        const rawIdeas = IDEAS[niche] || IDEAS['marketing'];
        const ideaPool = [];
        while (ideaPool.length < 62) ideaPool.push(...rawIdeas); // at least 2 full copies
        shuffle(ideaPool);

        // Shuffle type and hook sequences per generation
        const shuffledTypes = shuffle([...types]);
        const shuffledHooks = shuffle([...HOOKS]);

        calendarData = [];
        let postCount     = 0;

        for (let d = 1; d <= daysInMonth; d++) {
            const date      = new Date(year, month - 1, d);
            const dayOfWeek = date.getDay();

            if (!publishDays.includes(dayOfWeek)) continue;

            const typeId    = shuffledTypes[postCount % shuffledTypes.length];
            const channelId = assignChannel(typeId, channels, postCount);
            const idea      = ideaPool[postCount]; // never repeats within the month (pool ≥ 62)

            const typeObj    = CONTENT_TYPES.find(t => t.id === typeId);
            const channelObj = CHANNELS.find(c => c.id === channelId);

            // Pull 3 unique hooks for the drawer (rotate through shuffled pool)
            const hookStart = (postCount * 3) % shuffledHooks.length;
            const postHooks = [
                shuffledHooks[hookStart % shuffledHooks.length],
                shuffledHooks[(hookStart + 1) % shuffledHooks.length],
                shuffledHooks[(hookStart + 2) % shuffledHooks.length],
            ];

            calendarData.push({
                date,
                d,
                typeId,
                typeName:    typeObj    ? typeObj.label    : typeId,
                typeIcon:    typeObj    ? typeObj.icon      : '',
                channelId,
                channelName: channelObj ? channelObj.label : channelId,
                idea,
                campaign,
                hooks:       postHooks,
            });

            postCount++;
        }

        renderAll(year, month, daysInMonth, weekStart, campaign);
        document.getElementById('resultPanel').classList.add('visible');
        document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /* ─────────────────────────────────────────────
       RENDER — top-level
    ───────────────────────────────────────────── */

    function renderAll(year, month, daysInMonth, weekStart, campaign) {
        const types       = [...activeTypes];
        const monthName   = new Date(year, month - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        const weeks       = Math.ceil(daysInMonth / 7);
        const total       = calendarData.length;
        const channelCount = [...new Set(calendarData.map(p => p.channelId))].length;
        const typeCount    = [...new Set(calendarData.map(p => p.typeId))].length;

        // Stats
        document.getElementById('statsBar').innerHTML = `
            <div class="stat-cell"><div class="stat-num">${total}</div><div class="stat-lbl">Total Posts</div></div>
            <div class="stat-cell"><div class="stat-num">${(total / weeks).toFixed(1)}</div><div class="stat-lbl">Posts / Week</div></div>
            <div class="stat-cell"><div class="stat-num">${channelCount}</div><div class="stat-lbl">Channels</div></div>
            <div class="stat-cell"><div class="stat-num">${typeCount}</div><div class="stat-lbl">Content Types</div></div>
        `;

        // Campaign badge (only shown when user provided a label)
        const badgeWrap = document.getElementById('campaignBadgeWrap');
        badgeWrap.innerHTML = campaign
            ? `<div class="campaign-badge">🏷 ${escapeHtml(campaign)}</div>`
            : '';

        // Legend
        document.getElementById('legend').innerHTML = types.map(t => {
            const ci  = typeColorMap[t];
            const obj = CONTENT_TYPES.find(x => x.id === t);
            return `<div class="legend-item">
                <div class="legend-dot" style="background:${ci.color}"></div>
                <span>${obj ? obj.label : t}</span>
            </div>`;
        }).join('');

        document.getElementById('calTitle').textContent = monthName;

        renderGridView(year, month, daysInMonth, weekStart);
        renderListView();
        switchView('grid');
    }

    /* ─────────────────────────────────────────────
       GRID VIEW
    ───────────────────────────────────────────── */

    function renderGridView(year, month, daysInMonth, weekStart) {
        const dayNames = weekStart === 1
            ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
            : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        const firstDay    = new Date(year, month - 1, 1).getDay();
        const startOffset = weekStart === 1
            ? (firstDay === 0 ? 6 : firstDay - 1)
            : firstDay;

        const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

        let html = `<div class="week-grid">`;
        // Corner
        html += `<div class="wg-cell wg-day-header"></div>`;
        // Day headers
        dayNames.forEach(d => {
            html += `<div class="wg-cell wg-day-header"><div class="wg-day-name">${d}</div></div>`;
        });

        let dayNum = 1 - startOffset;
        let weekNum = 1;

        for (let cell = 0; cell < totalCells; cell++) {
            if (cell % 7 === 0) {
                html += `<div class="wg-cell wg-week-label"><div class="wg-week-txt">W${weekNum}</div></div>`;
                weekNum++;
            }

            if (dayNum < 1 || dayNum > daysInMonth) {
                html += `<div class="wg-cell" style="background:rgba(0,0,0,0.2)"></div>`;
            } else {
                const posts    = calendarData.filter(p => p.d === dayNum);
                const isToday  = isCurrentDay(year, month, dayNum);
                html += `<div class="wg-cell${isToday ? ' today-cell' : ''}">`;
                html += `<div style="font-size:0.65rem;color:#475569;font-weight:700;margin-bottom:4px;">${dayNum}</div>`;
                posts.forEach(p => {
                    const ci  = typeColorMap[p.typeId] || { color: '#64748b', idx: 0 };
                    const idx = calendarData.indexOf(p);
                    html += `<div class="post-card tc-${ci.idx % 7}" onclick="openDrawer(${idx})">
                        <div class="post-type-tag">${p.typeIcon} ${p.typeName}</div>
                        <div class="post-title">${escapeHtml(truncate(p.idea, 42))}</div>
                        <div class="post-channel">${p.channelName}</div>
                    </div>`;
                });
                html += `</div>`;
            }
            dayNum++;
        }
        html += `</div>`;
        document.getElementById('gridView').innerHTML = html;
    }

    /* ─────────────────────────────────────────────
       LIST VIEW
    ───────────────────────────────────────────── */

    function renderListView() {
        let html = `<div class="list-table-wrap">
            <div class="list-row hdr">
                <span class="lh">Date</span>
                <span class="lh">Type</span>
                <span class="lh">Post Idea</span>
                <span class="lh">Channel</span>
            </div>`;

        calendarData.forEach((p, i) => {
            const ci      = typeColorMap[p.typeId] || { color: '#64748b', idx: 0 };
            const dateStr = p.date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            html += `<div class="list-row" onclick="openDrawer(${i})">
                <span class="lv-date">${dateStr}</span>
                <span class="lv-type" style="color:${ci.color}">${p.typeIcon} ${p.typeName}</span>
                <span class="lv-title">${escapeHtml(p.idea)}</span>
                <span class="lv-ch">${p.channelName}</span>
            </div>`;
        });

        html += `</div>`;
        document.getElementById('listView').innerHTML = html;
    }

    /* ─────────────────────────────────────────────
       VIEW SWITCHER
    ───────────────────────────────────────────── */

    function switchView(v) {
        document.getElementById('gridView').className = v === 'grid' ? 'grid-view-wrap' : 'grid-view-wrap hidden';
        document.getElementById('listView').className = v === 'list' ? 'list-view-wrap visible' : 'list-view-wrap';
        document.getElementById('btnGrid').className  = 'view-btn' + (v === 'grid' ? ' active' : '');
        document.getElementById('btnList').className  = 'view-btn' + (v === 'list' ? ' active' : '');
    }

    /* ─────────────────────────────────────────────
       DRAWER
    ───────────────────────────────────────────── */

    function openDrawer(idx) {
        const p = calendarData[idx];
        if (!p) return;

        const ci      = typeColorMap[p.typeId] || { color: '#64748b' };
        const dateStr = p.date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

        document.getElementById('drawerContent').innerHTML = `
            <div class="drawer-type" style="color:${ci.color}">${p.typeIcon} ${p.typeName}</div>
            <div class="drawer-title">${escapeHtml(p.idea)}</div>
            <div class="drawer-meta">
                <span class="meta-pill">📅 ${dateStr}</span>
                <span class="meta-pill">${p.channelName}</span>
                ${p.campaign ? `<span class="meta-pill">🏷 ${escapeHtml(p.campaign)}</span>` : ''}
            </div>
            <div class="drawer-section">
                <h4>Hook starters — pick one to open with</h4>
                <ul class="hook-list">
                    ${p.hooks.map(h => `<li>${escapeHtml(h)}</li>`).join('')}
                </ul>
                <h4>Content angles to consider</h4>
                <ul class="hook-list">
                    <li>Share a personal story or experience connected to this topic</li>
                    <li>Lead with a surprising data point or counterintuitive stat</li>
                    <li>Frame it as the most common mistake your audience makes</li>
                </ul>
            </div>
        `;

        document.getElementById('detailDrawer').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
        document.getElementById('detailDrawer').classList.remove('open');
        document.body.style.overflow = '';
    }

    function handleDrawerBackdrop(e) {
        if (e.target === document.getElementById('detailDrawer')) closeDrawer();
    }

    /* ─────────────────────────────────────────────
       EXPORT CSV
    ───────────────────────────────────────────── */

    function exportCSV() {
        if (!calendarData.length) return;

        const headers = ['Date','Day','Content Type','Post Idea','Channel','Campaign'];
        const rows    = calendarData.map(p => [
            p.date.toLocaleDateString('en-GB'),
            p.date.toLocaleDateString('en-US', { weekday: 'long' }),
            p.typeName,
            `"${p.idea.replace(/"/g, '""')}"`,
            p.channelName,
            p.campaign ? `"${p.campaign.replace(/"/g, '""')}"` : '',
        ]);

        const csv  = [headers, ...rows].map(r => r.join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a    = document.createElement('a');
        a.href     = URL.createObjectURL(blob);

        const [year, month] = document.getElementById('planMonth').value.split('-');
        a.download = `editorial-calendar-${year}-${month}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    }

    /* ─────────────────────────────────────────────
       COPY TEXT
    ───────────────────────────────────────────── */

    function copyAll() {
        if (!calendarData.length) return;

        const lines    = calendarData.map(p =>
            `${p.date.toLocaleDateString('en-GB')} | ${p.typeName} | ${p.idea} | ${p.channelName}`
        );
        const campaign = calendarData[0].campaign ? `Campaign: ${calendarData[0].campaign}\n` : '';
        const text     = `Editorial Calendar\n${campaign}${'─'.repeat(60)}\n${lines.join('\n')}`;

        navigator.clipboard.writeText(text).then(() => {
            const btn       = document.getElementById('btnCopy');
            const prev      = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => { btn.textContent = prev; }, 2200);
        }).catch(() => {
            // Fallback for older browsers / non-secure contexts
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity  = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        });
    }

    /* ─────────────────────────────────────────────
       HELPERS
    ───────────────────────────────────────────── */

    function truncate(str, n) {
        return str.length > n ? str.slice(0, n) + '…' : str;
    }

    function isCurrentDay(y, m, d) {
        const t = new Date();
        return t.getFullYear() === y && t.getMonth() + 1 === m && t.getDate() === d;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    </script>

    <script src="../nav.js"></script>
</body>
