    <script>
    // ─────────────────────────────────────────────────────────────────────────────
    // CONSTANTS & STATE
    // ─────────────────────────────────────────────────────────────────────────────
    const STORAGE_KEY = 'Rebrixe_focus_sessions';
    const GOAL_KEY    = 'Rebrixe_focus_goal';
    const MIN_SESSION_MS = 5000; // 5 seconds minimum to save

    let timerInterval = null;
    let sessionStartTime = null;   // absolute timestamp when session started
    let activeFilter = 'all';

    // ─────────────────────────────────────────────────────────────────────────────
    // DATE HELPERS — always local time, never UTC conversion
    // ─────────────────────────────────────────────────────────────────────────────

    /**
     * Returns today's date as a YYYY-MM-DD string in the user's LOCAL timezone.
     * Never uses toISOString() which returns UTC and can be a different calendar
     * day for users in UTC-1 through UTC-12.
     */
    function localDateStr(date) {
        const d = date || new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${dd}`;
    }

    /**
     * Returns the Monday of the current week as a YYYY-MM-DD local string.
     * Week is defined as Monday–Sunday.
     */
    function mondayOfCurrentWeek() {
        const d = new Date();
        const day = d.getDay(); // 0=Sun,1=Mon,...,6=Sat
        const diff = (day === 0) ? -6 : 1 - day; // shift to Monday
        d.setDate(d.getDate() + diff);
        return localDateStr(d);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // FORMAT HELPERS
    // ─────────────────────────────────────────────────────────────────────────────
    function pad(n) { return String(n).padStart(2, '0'); }

    function fmtMs(ms) {
        const totalSec = Math.floor(ms / 1000);
        const h   = Math.floor(totalSec / 3600);
        const m   = Math.floor((totalSec % 3600) / 60);
        const sec = totalSec % 60;
        return `${pad(h)}:${pad(m)}:${pad(sec)}`;
    }

    function fmtHM(ms) {
        const totalSec = Math.floor(ms / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        return h ? `${h}h ${m}m` : `${m}m`;
    }

    /** Returns e.g. "47m" or "1h 12m". Never shows "0m" for a saved session
     *  (minimum is 5 sec, rounds up to 1m for display). */
    function fmtShort(ms) {
        const totalMin = Math.ceil(ms / 60000); // ceil: 29s → "1m"
        if (totalMin < 60) return `${totalMin}m`;
        return `${Math.floor(totalMin / 60)}h ${totalMin % 60}m`;
    }

    function fmtTimeOfDay(ts) {
        return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function fmtDateLabel(dateStr) {
        // dateStr is YYYY-MM-DD local. Parse as noon local to avoid DST edge cases.
        const [y, mo, d] = dateStr.split('-').map(Number);
        const date = new Date(y, mo - 1, d, 12, 0, 0);
        return date.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // STORAGE — read / write with full error handling
    // ─────────────────────────────────────────────────────────────────────────────
    function getSessions() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            // Validate it's actually an array; if corrupt, discard
            return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            return [];
        }
    }

    /**
     * Returns true on success, false on failure (quota exceeded, private browsing
     * block, etc.). Caller is responsible for showing feedback.
     */
    function saveSessions(arr) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
            return true;
        } catch (e) {
            return false;
        }
    }

    function getGoalMinutes() {
        const raw = parseInt(localStorage.getItem(GOAL_KEY), 10);
        return (Number.isFinite(raw) && raw > 0) ? raw : 240; // default 4h
    }

    function saveGoal(minutes) {
        try {
            localStorage.setItem(GOAL_KEY, String(minutes));
            return true;
        } catch (e) {
            return false;
        }
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // TOAST NOTIFICATIONS
    // ─────────────────────────────────────────────────────────────────────────────
    let toastTimer = null;

    function showToast(msg, isError) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast show' + (isError ? ' error' : '');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // TIMER
    // ─────────────────────────────────────────────────────────────────────────────
    function startSession() {
        if (timerInterval) return; // already running — no-op

        sessionStartTime = Date.now();
        timerInterval = setInterval(tick, 500);

        document.getElementById('clockDisplay').classList.add('running');
        document.getElementById('clockSub').textContent = 'Session in progress…';
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled  = false;
        document.getElementById('taskInput').disabled  = true;
        document.getElementById('tagSelect').disabled  = true;
        document.getElementById('goalSetBtn').disabled = true;

        tick(); // immediate first render
    }

    function tick() {
        const elapsed = Date.now() - sessionStartTime;
        document.getElementById('clockDisplay').textContent = fmtMs(elapsed);
    }

    function stopSession() {
        if (!timerInterval) return;

        clearInterval(timerInterval);
        timerInterval = null;

        const elapsed = Date.now() - sessionStartTime;

        if (elapsed < MIN_SESSION_MS) {
            // Too short — discard silently and reset
            resetTimer();
            showToast('Session too short — minimum 5 seconds to save.');
            return;
        }

        const task = document.getElementById('taskInput').value.trim() || 'Untitled session';
        const tag  = document.getElementById('tagSelect').value;

        // ID uses timestamp + random suffix to guarantee uniqueness even if two
        // sessions are stopped within the same millisecond.
        const session = {
            id:   `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            task,
            tag,
            date: localDateStr(), // LOCAL date string — never UTC
            ms:   elapsed,
            ts:   Date.now()      // absolute timestamp for display (time of day)
        };

        const all = getSessions();
        all.unshift(session);

        const saved = saveSessions(all);
        if (!saved) {
            showToast('⚠ Storage full — session could not be saved.', true);
        } else {
            showToast(`Saved: ${fmtShort(elapsed)} logged.`);
        }

        resetTimer();
        renderStats();
        renderLog();
    }

    function resetTimer() {
        sessionStartTime = null;

        document.getElementById('clockDisplay').textContent = '00:00:00';
        document.getElementById('clockDisplay').classList.remove('running');
        document.getElementById('clockSub').textContent = 'Ready to focus';
        document.getElementById('btnStart').disabled  = false;
        document.getElementById('btnStop').disabled   = true;
        document.getElementById('taskInput').disabled  = false;
        document.getElementById('tagSelect').disabled  = false;
        document.getElementById('goalSetBtn').disabled = false;
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // PAGE UNLOAD GUARD — warn if session is active
    // ─────────────────────────────────────────────────────────────────────────────
    window.addEventListener('beforeunload', function (e) {
        if (timerInterval) {
            // Standard: set returnValue to trigger browser confirmation dialog
            e.preventDefault();
            e.returnValue = 'You have an active focus session. Leaving will discard it. Continue?';
        }
    });

    // ─────────────────────────────────────────────────────────────────────────────
    // STREAK CALCULATION — correct, timezone-safe
    // ─────────────────────────────────────────────────────────────────────────────
    /**
     * Counts how many consecutive days ending today (or yesterday) have at least
     * one session. Uses local date strings throughout — no Date arithmetic that
     * could cross DST or UTC boundaries.
     *
     * Algorithm:
     *  1. Collect the unique set of session dates.
     *  2. Sort descending.
     *  3. The streak is valid only if it touches today or yesterday; otherwise 0.
     *  4. Walk backwards: each successive date must be exactly one calendar day
     *     before the previous one.
     */
    function calcStreak(sessions) {
        if (!sessions.length) return 0;

        // Unique set of days that have at least one session
        const daySet = new Set(sessions.map(s => s.date));
        const days   = Array.from(daySet).sort().reverse(); // newest first

        const today     = localDateStr();
        const yesterday = localDateStr(new Date(new Date().setDate(new Date().getDate() - 1)));

        // Streak must include today or yesterday
        if (days[0] !== today && days[0] !== yesterday) return 0;

        let streak = 1;
        for (let i = 1; i < days.length; i++) {
            if (oneDayBefore(days[i - 1]) === days[i]) {
                streak++;
            } else {
                break; // gap found
            }
        }
        return streak;
    }

    /**
     * Given a YYYY-MM-DD string, returns the YYYY-MM-DD of the day before it.
     * Parses at noon local time to be immune to DST changes (DST shifts happen
     * at 02:00, never at noon).
     */
    function oneDayBefore(dateStr) {
        const [y, mo, d] = dateStr.split('-').map(Number);
        const date = new Date(y, mo - 1, d, 12, 0, 0);
        date.setDate(date.getDate() - 1);
        return localDateStr(date);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // STATS RENDER
    // ─────────────────────────────────────────────────────────────────────────────
    function renderStats() {
        const all     = getSessions();
        const today   = localDateStr();
        const todaySessions = all.filter(s => s.date === today);
        const totalMs = todaySessions.reduce((sum, s) => sum + s.ms, 0);
        const avgMs   = todaySessions.length ? totalMs / todaySessions.length : 0;

        document.getElementById('statTodayTime').textContent = totalMs ? fmtHM(totalMs) : '0m';
        document.getElementById('statSessions').textContent  = todaySessions.length;
        document.getElementById('statAvgLen').textContent    = avgMs ? fmtShort(avgMs) : '—';
        document.getElementById('statStreak').textContent    = calcStreak(all);

        // Goal bar — capped at 100%
        const goalMins = getGoalMinutes();
        const doneMins = Math.floor(totalMs / 60000);
        const pct      = Math.min(100, Math.round((doneMins / goalMins) * 100));

        document.getElementById('goalBar').style.width = pct + '%';
        const pctEl = document.getElementById('goalPct');
        pctEl.textContent = pct + '%';
        pctEl.className   = 'goal-pct' + (pct >= 100 ? ' done' : '');
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // FILTER
    // ─────────────────────────────────────────────────────────────────────────────
    function setFilter(el, f) {
        activeFilter = f;
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        renderLog();
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // LOG RENDER
    // ─────────────────────────────────────────────────────────────────────────────
    function renderLog() {
        const all  = getSessions();
        const today   = localDateStr();
        const weekMon = mondayOfCurrentWeek();

        let list = all;
        if (activeFilter === 'today') {
            list = all.filter(s => s.date === today);
        } else if (activeFilter === 'week') {
            // Include today and all days from Monday onward
            list = all.filter(s => s.date >= weekMon);
        } else if (['work', 'study', 'personal', 'other'].includes(activeFilter)) {
            list = all.filter(s => s.tag === activeFilter);
        }

        const container = document.getElementById('sessionList');

        if (!list.length) {
            container.innerHTML = '<div class="empty-log">No sessions yet — hit Start to begin! 🎯</div>';
            return;
        }

        // Group by local date
        const groups = {};
        list.forEach(s => {
            if (!groups[s.date]) groups[s.date] = [];
            groups[s.date].push(s);
        });

        // Newest date first
        const sortedDates = Object.keys(groups).sort().reverse();

        container.innerHTML = sortedDates.map(date => {
            const label = date === today ? 'Today' : fmtDateLabel(date);
            const dayMs = groups[date].reduce((sum, s) => sum + s.ms, 0);

            const rows = groups[date].map(s => `
                <div class="session-item">
                    <div class="si-task-wrap">
                        <div class="si-task">${escHtml(s.task)}</div>
                        <div class="si-meta">${fmtTimeOfDay(s.ts)}</div>
                    </div>
                    <span class="si-tag tag-${escHtml(s.tag)}">${tagLabel(s.tag)}</span>
                    <div class="si-dur">${fmtShort(s.ms)}</div>
                    <button class="si-del" onclick="deleteSession('${escHtml(s.id)}')" title="Delete">✕</button>
                </div>
            `).join('');

            return `
                <div class="day-group-label">${label} · <span style="color:#475569">${fmtHM(dayMs)} total</span></div>
                ${rows}
            `;
        }).join('');
    }

    function tagLabel(t) {
        const map = { work: '💼 Work', study: '📚 Study', personal: '🌱 Personal', other: '⚙️ Other' };
        return map[t] || t;
    }

    function escHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // DELETE SESSION
    // ─────────────────────────────────────────────────────────────────────────────
    function deleteSession(id) {
        const all = getSessions().filter(s => s.id !== id);
        const saved = saveSessions(all);
        if (!saved) {
            showToast('Could not update storage.', true);
            return;
        }
        renderStats();
        renderLog();
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // GOAL SETTER
    // ─────────────────────────────────────────────────────────────────────────────
    function setGoal() {
        const current = getGoalMinutes();
        const input = prompt(
            `Set your daily focus goal in minutes.\n` +
            `Current: ${current} min (${Math.round(current / 60 * 10) / 10}h)`
        );
        if (input === null) return; // user cancelled

        const val = parseInt(input, 10);
        if (!Number.isFinite(val) || val < 1 || val > 1440) {
            showToast('Enter a number between 1 and 1440 minutes.', true);
            return;
        }

        const saved = saveGoal(val);
        if (!saved) {
            showToast('Could not save goal to storage.', true);
        } else {
            showToast(`Goal set to ${val} min (${Math.round(val / 60 * 10) / 10}h)`);
        }
        renderStats();
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // EXPORT CSV
    // ─────────────────────────────────────────────────────────────────────────────
    function exportCSV() {
        const all = getSessions();
        if (!all.length) {
            showToast('No sessions to export yet.', true);
            return;
        }

        const rows = [['Date', 'Time', 'Task', 'Tag', 'Duration (min)', 'Duration (hh:mm:ss)']];
        all.forEach(s => {
            rows.push([
                s.date,
                fmtTimeOfDay(s.ts),
                `"${String(s.task).replace(/"/g, '""')}"`, // RFC 4180 escaping
                s.tag,
                Math.max(1, Math.round(s.ms / 60000)), // minimum 1 min displayed
                fmtMs(s.ms)
            ]);
        });

        const csv  = rows.map(r => r.join(',')).join('\r\n'); // CRLF per RFC 4180
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = `focus-sessions-${localDateStr()}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast(`Exported ${all.length} session${all.length !== 1 ? 's' : ''}.`);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // COPY REPORT
    // ─────────────────────────────────────────────────────────────────────────────
    function copyReport() {
        const all   = getSessions();
        const today = localDateStr();
        const todaySessions = all.filter(s => s.date === today);

        if (!todaySessions.length) {
            showToast('No sessions today to report.', true);
            return;
        }

        const totalMs = todaySessions.reduce((sum, s) => sum + s.ms, 0);
        const lines   = [
            `📊 Focus Report — ${today}`,
            `Total: ${fmtHM(totalMs)} across ${todaySessions.length} session${todaySessions.length !== 1 ? 's' : ''}`,
            ''
        ];
        todaySessions.forEach((s, i) => {
            lines.push(`${i + 1}. ${s.task} [${s.tag}] — ${fmtShort(s.ms)}`);
        });

        const text = lines.join('\n');

        // Clipboard API with full error handling
        if (!navigator.clipboard) {
            // Fallback: unsupported (e.g. HTTP non-secure context)
            showToast('Clipboard not available in this browser.', true);
            return;
        }

        navigator.clipboard.writeText(text)
            .then(() => {
                showToast('Report copied to clipboard!');
            })
            .catch(() => {
                showToast('Clipboard permission denied.', true);
            });
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // CLEAR ALL
    // ─────────────────────────────────────────────────────────────────────────────
    function clearAll() {
        if (!confirm('Delete all session history? This cannot be undone.')) return;
        try {
            localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
            showToast('Could not clear storage.', true);
            return;
        }
        renderStats();
        renderLog();
        showToast('All sessions cleared.');
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────────────────────────────────────────
    renderStats();
    renderLog();
    </script>
    <script src="../nav.js"></script>
</body>
</html>
