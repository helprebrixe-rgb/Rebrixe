    <script>
    // ─────────────────────────────────────────────────────────────────────────
    //  COUNTDOWN TIMER  —  bulletproof rewrite
    //
    //  Fixes vs original:
    //    1. Drift-free: tracks wall-clock endTime instead of counting intervals
    //    2. Page-visibility recovery: resync on visibilitychange
    //    3. Correct CIRCUMFERENCE used exclusively in JS (no CSS conflict)
    //    4. Single-source label stored in a JS variable (not re-read from DOM)
    //    5. Fixed double-encode/decode of URL share param
    //    6. Fixed duplicate preset pill
    //    7. Cleared urgent classes fully on restart
    //    8. Pause button disabled in done state
    //    9. AudioContext .close() after alarm to avoid memory leak
    //   10. Input validation with visual feedback before start
    //   11. URL hash parsed safely (strips leading #/? before URLSearchParams)
    //   12. No inline event handlers — all listeners attached in JS
    // ─────────────────────────────────────────────────────────────────────────

    'use strict';

    // ── Constants ─────────────────────────────────────────────────────────────
    const RADIUS       = 105;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS; // 659.7344…

    // ── State ─────────────────────────────────────────────────────────────────
    let totalSecs  = 0;   // duration chosen by user
    let endTime    = 0;   // performance.now() target (drift-free)
    let pausedLeft = 0;   // ms remaining when paused
    let isPaused   = false;
    let isDone     = false;
    let rafId      = null;
    let timerLabel = '';  // captured label at start — never re-read from DOM

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const setupBlock   = document.getElementById('setupBlock');
    const runningBlock = document.getElementById('runningBlock');
    const inputH       = document.getElementById('inputH');
    const inputM       = document.getElementById('inputM');
    const inputS       = document.getElementById('inputS');
    const labelInput   = document.getElementById('timerLabel');
    const ringFg       = document.getElementById('ringFg');
    const ringDigits   = document.getElementById('ringDigits');
    const ringSub      = document.getElementById('ringSub');
    const statusBadge  = document.getElementById('statusBadge');
    const statusText   = document.getElementById('statusText');
    const labelDisplay = document.getElementById('labelDisplay');
    const btnPause     = document.getElementById('btnPause');
    const btnRestart   = document.getElementById('btnRestart');
    const btnReset     = document.getElementById('btnReset');
    const shareLinkBox = document.getElementById('shareLinkBox');
    const btnCopyLink  = document.getElementById('btnCopyLink');
    const btnStart     = document.getElementById('btnStart');

    // Initialise ring (no CSS conflict)
    ringFg.style.strokeDasharray  = CIRCUMFERENCE;
    ringFg.style.strokeDashoffset = 0;

    // ── Event wiring ──────────────────────────────────────────────────────────
    btnStart.addEventListener('click', startTimer);
    btnPause.addEventListener('click', togglePause);
    btnRestart.addEventListener('click', restartTimer);
    btnReset.addEventListener('click', stopTimer);
    btnCopyLink.addEventListener('click', copyShareLink);

    // Preset pills
    document.getElementById('presetsContainer').addEventListener('click', (e) => {
        const pill = e.target.closest('.preset-pill');
        if (!pill) return;
        applyPreset(pill);
    });

    // Sync pill highlight when user types manually
    [inputH, inputM, inputS].forEach(el => el.addEventListener('input', syncPreset));

    // Re-sync on page becoming visible (handles tab-switching drift)
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !isPaused && !isDone && totalSecs > 0) {
            scheduleFrame();
        }
    });

    // ── Preset logic ──────────────────────────────────────────────────────────
    function applyPreset(pill) {
        clearInputErrors();
        document.querySelectorAll('.preset-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        const secs = parseInt(pill.dataset.s, 10);
        inputH.value = Math.floor(secs / 3600);
        inputM.value = Math.floor((secs % 3600) / 60);
        inputS.value = secs % 60;
    }

    function syncPreset() {
        const s = getInputSecs();
        document.querySelectorAll('.preset-pill').forEach(p => {
            p.classList.toggle('active', parseInt(p.dataset.s, 10) === s);
        });
    }

    // Clamp an input to [min, max], return cleaned integer
    function clampInput(el, min, max) {
        let v = parseInt(el.value, 10);
        if (isNaN(v) || v < min) v = min;
        if (v > max)             v = max;
        el.value = v;
        return v;
    }

    function getInputSecs() {
        const h = clampInput(inputH, 0, 99);
        const m = clampInput(inputM, 0, 59);
        const s = clampInput(inputS, 0, 59);
        return h * 3600 + m * 60 + s;
    }

    function clearInputErrors() {
        [inputH, inputM, inputS].forEach(el => el.classList.remove('input-error'));
    }

    // ── Start ─────────────────────────────────────────────────────────────────
    function startTimer() {
        clearInputErrors();
        totalSecs = getInputSecs();

        if (totalSecs <= 0) {
            // Flash error on all three inputs
            [inputH, inputM, inputS].forEach(el => {
                el.classList.add('input-error');
                el.addEventListener('input', () => el.classList.remove('input-error'), { once: true });
            });
            inputM.focus();
            return;
        }

        timerLabel = labelInput.value.trim();
        labelDisplay.textContent = timerLabel;

        isPaused   = false;
        isDone     = false;
        endTime    = performance.now() + totalSecs * 1000;
        pausedLeft = 0;

        setupBlock.style.display   = 'none';
        runningBlock.style.display = 'block';

        buildShareLink(totalSecs, timerLabel);
        setStatus('running');
        cancelAnimationFrame(rafId);
        scheduleFrame();
    }

    // ── Animation loop (RAF-based, drift-free) ────────────────────────────────
    function scheduleFrame() {
        rafId = requestAnimationFrame(frame);
    }

    function frame() {
        if (isPaused || isDone) return;

        const msLeft = endTime - performance.now();

        if (msLeft <= 0) {
            renderRing(0);
            onDone();
            return;
        }

        renderRing(Math.ceil(msLeft / 1000));
        updateTabTitle(Math.ceil(msLeft / 1000));

        // Schedule next frame ~every 250ms for smooth sub-second accuracy
        rafId = setTimeout(scheduleFrame, 250);
    }

    // ── Ring rendering ────────────────────────────────────────────────────────
    function renderRing(secsLeft) {
        const pct    = totalSecs > 0 ? secsLeft / totalSecs : 0;
        const offset = CIRCUMFERENCE * (1 - pct);

        ringFg.style.strokeDashoffset = offset;

        const urgentThreshold = Math.min(10, Math.floor(totalSecs * 0.1));
        const urgent = secsLeft <= urgentThreshold && secsLeft > 0;

        ringFg.classList.toggle('urgent', urgent);
        ringDigits.classList.toggle('urgent', urgent);
        ringDigits.textContent = fmtTime(secsLeft);
    }

    // ── Format helpers ────────────────────────────────────────────────────────
    function fmtTime(s) {
        s = Math.max(0, s);
        const h   = Math.floor(s / 3600);
        const m   = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return h > 0
            ? `${pad(h)}:${pad(m)}:${pad(sec)}`
            : `${pad(m)}:${pad(sec)}`;
    }
    function pad(n) { return String(n).padStart(2, '0'); }

    // ── Status helpers ────────────────────────────────────────────────────────
    function setStatus(state) {
        statusBadge.className = 'status-badge';
        if (state === 'running') {
            statusBadge.classList.add('badge-running');
            statusText.textContent = 'Running';
            btnPause.textContent   = '⏸ Pause';
            btnPause.disabled      = false;
            ringSub.textContent    = 'remaining';
        } else if (state === 'paused') {
            statusBadge.classList.add('badge-paused');
            statusText.textContent = 'Paused';
            btnPause.textContent   = '▶ Resume';
            btnPause.disabled      = false;
            ringSub.textContent    = 'paused';
        } else if (state === 'done') {
            statusBadge.classList.add('badge-done');
            statusText.textContent = 'Done!';
            btnPause.disabled      = true;   // can't pause a finished timer
            ringSub.textContent    = 'complete';
        }
    }

    // ── Tab title ─────────────────────────────────────────────────────────────
    function updateTabTitle(secsLeft) {
        const name = timerLabel || 'Countdown';
        if (isPaused) {
            document.title = `⏸ ${fmtTime(secsLeft)} — ${name}`;
        } else {
            document.title = `⏱ ${fmtTime(secsLeft)} — ${name}`;
        }
    }

    // ── Pause / Resume ────────────────────────────────────────────────────────
    function togglePause() {
        if (isDone) return;

        if (isPaused) {
            // Resume: rebuild endTime from where we left off
            endTime = performance.now() + pausedLeft;
            isPaused = false;
            setStatus('running');
            scheduleFrame();
        } else {
            // Pause: capture how much is left
            pausedLeft = endTime - performance.now();
            if (pausedLeft < 0) pausedLeft = 0;
            isPaused = true;
            cancelAnimationFrame(rafId);
            clearTimeout(rafId);
            setStatus('paused');
            updateTabTitle(Math.ceil(pausedLeft / 1000));
        }
    }

    // ── Restart ───────────────────────────────────────────────────────────────
    function restartTimer() {
        cancelAnimationFrame(rafId);
        clearTimeout(rafId);

        isPaused   = false;
        isDone     = false;
        endTime    = performance.now() + totalSecs * 1000;
        pausedLeft = 0;

        // Clear all state classes
        ringDigits.classList.remove('done-pulse', 'urgent');
        ringFg.classList.remove('urgent');

        setStatus('running');
        scheduleFrame();
    }

    // ── Stop / back to setup ──────────────────────────────────────────────────
    function stopTimer() {
        cancelAnimationFrame(rafId);
        clearTimeout(rafId);
        isDone   = false;
        isPaused = false;
        totalSecs = 0;
        document.title = 'Online Countdown Timer | Rebrixe';
        setupBlock.style.display   = 'block';
        runningBlock.style.display = 'none';
        history.replaceState(null, '', location.pathname);
    }

    // ── Done ──────────────────────────────────────────────────────────────────
    function onDone() {
        isDone = true;
        cancelAnimationFrame(rafId);
        clearTimeout(rafId);

        setStatus('done');
        ringDigits.textContent = fmtTime(0);
        ringDigits.classList.remove('urgent');
        ringDigits.classList.add('done-pulse');
        ringFg.style.strokeDashoffset = CIRCUMFERENCE; // empty ring
        ringFg.classList.remove('urgent');
        document.title = `⏰ Time's Up! | Rebrixe`;
        playAlarm();
    }

    // ── Alarm sound (Web Audio API) ───────────────────────────────────────────
    function playAlarm() {
        let ctx;
        try {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { return; }

        const beepAt = [0, 0.35, 0.7, 1.05, 1.4];
        const t0 = ctx.currentTime;

        beepAt.forEach(delay => {
            const osc  = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, t0 + delay);
            gain.gain.setValueAtTime(0.5, t0 + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + delay + 0.3);
            osc.start(t0 + delay);
            osc.stop(t0  + delay + 0.35);
        });

        // Close context after all beeps finish to free resources
        const totalDuration = (beepAt[beepAt.length - 1] + 0.5) * 1000;
        setTimeout(() => {
            try { ctx.close(); } catch (e) { /* ignore */ }
        }, totalDuration);
    }

    // ── Share link ────────────────────────────────────────────────────────────
    function buildShareLink(secs, label) {
        const params = new URLSearchParams({ s: secs });
        if (label) params.set('l', label); // URLSearchParams encodes automatically
        const hash = params.toString();
        const url  = `${location.origin}${location.pathname}#${hash}`;
        shareLinkBox.textContent = url;
        history.replaceState(null, '', `${location.pathname}#${hash}`);
    }

    function copyShareLink() {
        const url = shareLinkBox.textContent;
        if (!url || url === '—') return;

        navigator.clipboard.writeText(url).then(() => {
            btnCopyLink.textContent = '✓ Copied!';
            setTimeout(() => { btnCopyLink.textContent = 'Copy Link'; }, 2000);
        }).catch(() => {
            // Fallback for browsers without clipboard API
            try {
                const ta = document.createElement('textarea');
                ta.value = url;
                ta.style.position = 'fixed';
                ta.style.opacity  = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btnCopyLink.textContent = '✓ Copied!';
                setTimeout(() => { btnCopyLink.textContent = 'Copy Link'; }, 2000);
            } catch (e) { /* nothing to do */ }
        });
    }

    // ── Init: read URL hash and auto-start if valid ───────────────────────────
    (function init() {
        // Strip leading '#' and any accidental '?'
        const raw = location.hash.replace(/^#\?*/, '');
        if (raw) {
            try {
                const p    = new URLSearchParams(raw);
                const s    = parseInt(p.get('s'), 10);
                const l    = p.get('l') || '';   // already decoded by URLSearchParams
                if (Number.isFinite(s) && s > 0) {
                    inputH.value = Math.floor(s / 3600);
                    inputM.value = Math.floor((s % 3600) / 60);
                    inputS.value = s % 60;
                    labelInput.value = l;
                    startTimer();
                    return;
                }
            } catch (e) { /* malformed hash — fall through to defaults */ }
        }
        // Default: 5 min
        syncPreset();
    })();
    </script>
    <script src="../nav.js"></script>
</body>
