    <script>
    /*
     * ─────────────────────────────────────────────────────────────
     *  SANITISATION LAYER
     *  All input comes through these functions before any math.
     * ─────────────────────────────────────────────────────────────
     */

    /**
     * Parse a raw string from a time field.
     * Rules:
     *   - Empty / whitespace-only → 0  (valid, not an error)
     *   - Contains any non-digit character → NaN  (user typed something invalid)
     *   - Parses as a non-negative integer
     *   - Negative sign produces NaN (caught by non-digit check above)
     *
     * We use a text input (not number) so the browser never mangles
     * the value or allows spinner-drag into negatives/decimals.
     */
    function parseTimeField(raw) {
        const str = (raw || '').trim();
        if (str === '') return 0;
        // Reject anything that isn't purely digits (catches decimals, negatives, letters)
        if (!/^\d+$/.test(str)) return NaN;
        return parseInt(str, 10);
    }

    /**
     * Validate and normalise one entry's three fields.
     * Returns { valid, h, m, s, errorMsg } where h/m/s are safe integers.
     * Carry-over (e.g. 90 minutes → 1h 30m) is intentionally NOT done here;
     * we carry over in the UI helper below so the user sees the correction.
     */
    function validateEntry(hRaw, mRaw, sRaw) {
        const h = parseTimeField(hRaw);
        const m = parseTimeField(mRaw);
        const s = parseTimeField(sRaw);

        if (isNaN(h) || isNaN(m) || isNaN(s)) {
            return { valid: false, h: 0, m: 0, s: 0, errorMsg: 'Use whole numbers only (e.g. 2, 45, 30).' };
        }
        if (m > 59 || s > 59) {
            // We carry over in the UI; this path is hit only if carry didn't
            // run yet (shouldn't happen, but be safe)
            return { valid: false, h, m, s, errorMsg: 'Minutes and seconds must be 0–59.' };
        }
        return { valid: true, h, m, s, errorMsg: '' };
    }

    /*
     * ─────────────────────────────────────────────────────────────
     *  ENTRY MANAGEMENT
     * ─────────────────────────────────────────────────────────────
     */
    let entryCount = 0;

    function getEntryIds() {
        return [...document.querySelectorAll('#entriesList > [data-entry-id]')]
            .map(el => el.getAttribute('data-entry-id'));
    }

    function refreshDeleteButtons() {
        const ids = getEntryIds();
        ids.forEach(id => {
            const btn = document.getElementById(`del-${id}`);
            if (btn) btn.disabled = ids.length <= 1;
        });
    }

    function addEntry(withLabel, h, m, s, sign, label) {
        entryCount++;
        const id = String(entryCount);
        const isFirst = getEntryIds().length === 0;
        const defaultSign = sign || '+';

        const wrapper = document.createElement('div');
        wrapper.setAttribute('data-entry-id', id);

        wrapper.innerHTML = `
            <div class="entry-row" id="row-${id}">
                ${!isFirst
                    ? `<select class="sign-select" id="sign-${id}" onchange="recalc()" title="Add or subtract this entry" aria-label="Operation">
                           <option value="+" ${defaultSign === '+' ? 'selected' : ''}>+</option>
                           <option value="-" ${defaultSign === '-' ? 'selected' : ''}>−</option>
                       </select>`
                    : `<span class="unit-tag" style="color:#475569; min-width:24px; text-align:center;" aria-hidden="true">=</span>`
                }
                <input type="text" id="h-${id}" inputmode="numeric" placeholder="0"
                    value="${h != null ? h : ''}"
                    oninput="onTimeInput(event, '${id}', 'h')"
                    maxlength="4" title="Hours" aria-label="Hours">
                <span class="unit-tag">h</span>
                <input type="text" id="m-${id}" inputmode="numeric" placeholder="0"
                    value="${m != null ? m : ''}"
                    oninput="onTimeInput(event, '${id}', 'm')"
                    maxlength="4" title="Minutes" aria-label="Minutes">
                <span class="unit-tag">m</span>
                <input type="text" id="s-${id}" inputmode="numeric" placeholder="0"
                    value="${s != null ? s : ''}"
                    oninput="onTimeInput(event, '${id}', 's')"
                    maxlength="4" title="Seconds" aria-label="Seconds">
                <span class="unit-tag">s</span>
                <button class="del-btn" id="del-${id}" onclick="removeEntry('${id}')"
                    title="Remove this entry" aria-label="Remove entry">✕</button>
            </div>
            <div class="input-error" id="err-${id}" role="alert" aria-live="polite"></div>
            ${withLabel || label
                ? `<div class="label-row">
                       <input type="text" id="lbl-${id}"
                           placeholder="Label this entry (e.g. Client Call, Design Review…)"
                           value="${label || ''}"
                           oninput="recalc()" maxlength="60" aria-label="Entry label">
                   </div>`
                : ''}
        `;

        document.getElementById('entriesList').appendChild(wrapper);
        refreshDeleteButtons();

        const hInput = document.getElementById(`h-${id}`);
        if (h == null) setTimeout(() => hInput && hInput.focus(), 50);

        recalc();
    }

    function removeEntry(id) {
        // Guard: never remove the last remaining entry
        if (getEntryIds().length <= 1) return;
        const el = document.querySelector(`[data-entry-id="${id}"]`);
        if (el) el.remove();
        refreshDeleteButtons();
        recalc();
    }

    /*
     * ─────────────────────────────────────────────────────────────
     *  INPUT HANDLER  — sanitise, carry over, then recalc
     * ─────────────────────────────────────────────────────────────
     */
    function onTimeInput(event, id, field) {
        const raw = event.target.value;

        // 1. Reject non-digit characters as the user types — strip them immediately
        //    so the cursor behaviour feels natural.
        const digits = raw.replace(/[^\d]/g, '');
        if (digits !== raw) {
            event.target.value = digits;
        }

        // 2. Carry-over for minutes (>59) and seconds (>59)
        const mEl = document.getElementById(`m-${id}`);
        const hEl = document.getElementById(`h-${id}`);
        const sEl = document.getElementById(`s-${id}`);

        if (field === 's') {
            const sVal = parseInt(sEl.value, 10) || 0;
            if (sVal > 59) {
                const carry = Math.floor(sVal / 60);
                const mVal  = parseInt(mEl.value, 10) || 0;
                const newM  = mVal + carry;
                sEl.value   = sVal % 60;
                // Carry minutes into hours if needed
                if (newM > 59) {
                    const hCarry = Math.floor(newM / 60);
                    mEl.value = newM % 60;
                    hEl.value = (parseInt(hEl.value, 10) || 0) + hCarry;
                } else {
                    mEl.value = newM;
                }
            }
        }

        if (field === 'm') {
            const mVal = parseInt(mEl.value, 10) || 0;
            if (mVal > 59) {
                const carry = Math.floor(mVal / 60);
                mEl.value = mVal % 60;
                hEl.value = (parseInt(hEl.value, 10) || 0) + carry;
            }
        }

        recalc();
    }

    /*
     * ─────────────────────────────────────────────────────────────
     *  CORE CALCULATION
     * ─────────────────────────────────────────────────────────────
     */
    function recalc() {
        const ids = getEntryIds();

        if (!ids.length) {
            document.getElementById('resultBlock').classList.remove('visible');
            return;
        }

        let totalSecs  = 0;
        let hasAnyError = false;
        let hasAnyValue = false;
        const details  = [];

        ids.forEach((id, idx) => {
            const hRaw = document.getElementById(`h-${id}`)?.value ?? '';
            const mRaw = document.getElementById(`m-${id}`)?.value ?? '';
            const sRaw = document.getElementById(`s-${id}`)?.value ?? '';
            const errEl = document.getElementById(`err-${id}`);
            const hEl  = document.getElementById(`h-${id}`);
            const mEl  = document.getElementById(`m-${id}`);
            const sEl  = document.getElementById(`s-${id}`);
            const signEl = document.getElementById(`sign-${id}`);
            const lblEl  = document.getElementById(`lbl-${id}`);
            const sign   = signEl ? signEl.value : '+';
            const label  = lblEl ? (lblEl.value.trim() || `Entry ${idx + 1}`) : `Entry ${idx + 1}`;

            const result = validateEntry(hRaw, mRaw, sRaw);

            // Show or clear error
            if (errEl) errEl.textContent = result.errorMsg;
            [hEl, mEl, sEl].forEach(el => {
                if (!el) return;
                el.classList.toggle('invalid', !result.valid);
            });

            if (!result.valid) {
                hasAnyError = true;
                return; // skip this row from totalling
            }

            const { h, m, s } = result;
            const entrySecs = (h * 3600) + (m * 60) + s;

            if (entrySecs > 0) hasAnyValue = true;

            const contribution = sign === '-' ? -entrySecs : entrySecs;
            totalSecs += contribution;

            details.push({ label, h, m, s, sign: idx === 0 ? '+' : sign, contribution });
        });

        // If every row is zero and there are no errors, hide the result — nothing to show
        if (!hasAnyValue && !hasAnyError) {
            document.getElementById('resultBlock').classList.remove('visible');
            return;
        }

        // If there are errors, don't update the result display — leave it as-is
        // (or hidden if it hasn't been shown yet) rather than showing a partial wrong answer
        if (hasAnyError) return;

        // ── Decompose ─────────────────────────────────────────────
        const isNeg  = totalSecs < 0;
        const abs    = Math.abs(totalSecs);
        const tDays  = Math.floor(abs / 86400);
        const tHours = Math.floor((abs % 86400) / 3600);
        const tMins  = Math.floor((abs % 3600) / 60);
        const tSecs  = abs % 60;

        // Build the primary display string
        const parts = [];
        if (tDays)  parts.push(`${tDays}d`);
        parts.push(`${tHours}h`);
        parts.push(`${String(tMins).padStart(2, '0')}m`);
        if (tSecs)  parts.push(`${String(tSecs).padStart(2, '0')}s`);
        const bigStr = (isNeg ? '−' : '') + parts.join(' ');

        document.getElementById('resultBig').textContent  = bigStr;
        document.getElementById('rDays').textContent   = isNeg ? `−${tDays}`  : tDays;
        document.getElementById('rHours').textContent  = isNeg ? `−${tHours}` : tHours;
        document.getElementById('rMins').textContent   = isNeg ? `−${tMins}`  : tMins;
        document.getElementById('rSecs').textContent   = isNeg ? `−${tSecs}`  : tSecs;

        // ── Breakdown rows ────────────────────────────────────────
        const blHTML = details
            .filter(d => d.h || d.m || d.s)   // only rows that have a value
            .map(d => {
                const parts = [`${d.h}h`, `${String(d.m).padStart(2, '0')}m`];
                if (d.s) parts.push(`${String(d.s).padStart(2, '0')}s`);
                const timeStr = parts.join(' ');
                return `<div class="bl-row">
                    <span class="bl-label">${d.sign === '-' ? '−' : '+'} ${d.label}</span>
                    <span class="bl-val ${d.sign === '-' ? 'neg' : ''}">${timeStr}</span>
                </div>`;
            }).join('');

        // ── Derived totals ────────────────────────────────────────
        const totalMinsOnly  = Math.floor(abs / 60);
        const totalHoursDecimal = (abs / 3600).toFixed(2);   // 2dp, never floating artefacts
        const totalSecsOnly  = abs;

        const alsoHTML = `
            <div class="bl-row" style="margin-top:8px; padding-top:12px; border-top:1px solid var(--border);">
                <span class="bl-label">Total in minutes</span>
                <span class="bl-val">${totalMinsOnly.toLocaleString()} min</span>
            </div>
            <div class="bl-row">
                <span class="bl-label">Total in decimal hours</span>
                <span class="bl-val">${totalHoursDecimal} hrs</span>
            </div>
            <div class="bl-row">
                <span class="bl-label">Total in seconds</span>
                <span class="bl-val">${totalSecsOnly.toLocaleString()} sec</span>
            </div>`;

        document.getElementById('breakdownList').innerHTML = blHTML + alsoHTML;
        document.getElementById('resultBlock').classList.add('visible');
    }

    /*
     * ─────────────────────────────────────────────────────────────
     *  PRESETS
     * ─────────────────────────────────────────────────────────────
     */
    function loadPreset(key) {
        document.getElementById('entriesList').innerHTML = '';
        entryCount = 0;

        if (key === 'clear') {
            addEntry(false);
            addEntry(false);
            document.getElementById('resultBlock').classList.remove('visible');
            return;
        }

        if (key === 'freelance') {
            addEntry(true, 3, 30, 0, '+', 'Client Work');
            addEntry(true, 1, 0,  0, '+', 'Emails & Admin');
            addEntry(true, 0, 45, 0, '+', 'Team Call');
            addEntry(true, 2, 15, 0, '+', 'Deep Focus');
        } else if (key === 'standup') {
            for (let i = 1; i <= 5; i++) addEntry(true, 0, 15, 0, '+', `Standup Day ${i}`);
        } else if (key === 'workweek') {
            ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].forEach(d => addEntry(true, 8, 0, 0, '+', `${d} — Work`));
        } else if (key === 'subtract') {
            addEntry(true, 8, 0, 0, '+', 'Total Available');
            addEntry(true, 1, 30, 0, '-', 'Meetings');
            addEntry(true, 0, 45, 0, '-', 'Lunch Break');
        }
    }

    /*
     * ─────────────────────────────────────────────────────────────
     *  COPY RESULT
     * ─────────────────────────────────────────────────────────────
     */
    function copyResult() {
        const text = document.getElementById('resultBig').textContent;
        if (!text || text === '—') return;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            const orig = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => btn.textContent = orig, 2000);
        });
    }

    /*
     * ─────────────────────────────────────────────────────────────
     *  BOOT
     * ─────────────────────────────────────────────────────────────
     */
    addEntry(false);
    addEntry(false);
    </script>
    <script src="../nav.js"></script>
</body>
</html>
