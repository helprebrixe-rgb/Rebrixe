/* ═══════════════════════════════════════════════════════
   TIMEZONE OFFSET — single reliable implementation
   Uses Intl.DateTimeFormat to get the true UTC offset
   for any IANA timezone at this exact moment.
   Returns offset in total minutes (e.g. +330 for IST,
   +345 for NPT, -300 for EST).
═══════════════════════════════════════════════════════ */
function getTzOffsetMinutes(tz) {
    const now = new Date();
    // Format the same UTC instant in both UTC and the target tz
    const fmtOpts = { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit',
                      hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false };
    const fmtUtc  = { timeZone: 'UTC', year:'numeric', month:'2-digit', day:'2-digit',
                      hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false };

    const parse = (parts) => {
        // parts from en-US is "MM/DD/YYYY, HH:MM:SS"
        const [datePart, timePart] = parts.split(', ');
        const [mo, da, yr] = datePart.split('/').map(Number);
        const [hr, mi, se] = timePart.split(':').map(Number);
        return Date.UTC(yr, mo - 1, da, hr === 24 ? 0 : hr, mi, se);
    };

    const tzMs  = parse(new Intl.DateTimeFormat('en-US', fmtOpts).format(now));
    const utcMs = parse(new Intl.DateTimeFormat('en-US', fmtUtc).format(now));
    // difference in minutes
    return Math.round((tzMs - utcMs) / 60000);
}

/* Format offset minutes → "UTC+5:30" or "UTC-4" */
function formatOffset(totalMinutes) {
    const sign = totalMinutes >= 0 ? '+' : '-';
    const abs  = Math.abs(totalMinutes);
    const h    = Math.floor(abs / 60);
    const m    = abs % 60;
    return m === 0 ? `UTC${sign}${h}` : `UTC${sign}${h}:${String(m).padStart(2,'0')}`;
}

/* Format offset difference for detail panel → "+5:30 ahead" */
function formatDiffLabel(diffMinutes) {
    if (diffMinutes === 0) return 'Same as you';
    const sign = diffMinutes > 0 ? '+' : '-';
    const abs  = Math.abs(diffMinutes);
    const h    = Math.floor(abs / 60);
    const m    = abs % 60;
    const hStr = m === 0 ? `${h}h` : `${h}h ${m}m`;
    return `${sign}${hStr} ${diffMinutes > 0 ? 'ahead' : 'behind'}`;
}

/* ═══════════════════════════════════════════════════════
   GET CURRENT TIME IN A TIMEZONE
   Uses Intl.DateTimeFormat to extract the exact
   year/month/day/hour/minute/second in the target zone,
   then constructs a plain Date for formatting only.
   This avoids the double-parse ambiguity entirely.
═══════════════════════════════════════════════════════ */
function getZonedDate(tz) {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
    }).formatToParts(now);

    const get = type => {
        const p = parts.find(p => p.type === type);
        return p ? parseInt(p.value, 10) : 0;
    };

    const yr = get('year'),  mo = get('month'),  da = get('day');
    const hr = get('hour'),  mi = get('minute'), se = get('second');
    // Construct a plain local Date with those values
    // We only use it for formatting fields — never for arithmetic
    const d = new Date(yr, mo - 1, da, hr === 24 ? 0 : hr, mi, se);
    return d;
}

/* ═══════════════════════════════════════════════════════
   FORMATTING HELPERS
═══════════════════════════════════════════════════════ */
function pad(n) { return String(n).padStart(2, '0'); }

function formatTime(d) {
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function formatDate(d) {
    return d.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
}

function shortDate(d) {
    return d.toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric'
    });
}

function getDayNight(h) {
    if (h >= 6  && h < 9)  return { icon: '🌅', label: 'Dawn'    };
    if (h >= 9  && h < 18) return { icon: '☀️', label: 'Day'     };
    if (h >= 18 && h < 20) return { icon: '🌇', label: 'Dusk'    };
    if (h >= 20 && h < 22) return { icon: '🌆', label: 'Evening' };
    return                         { icon: '🌙', label: 'Night'   };
}

/* ═══════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════ */
const POPULAR = ["New York","London","Tokyo","Dubai","Mumbai","Singapore","Sydney","Paris","Los Angeles","São Paulo"];
let pinned       = [];
let homeCity     = null;
let selectedCity = null;
let searchResults = [];
let searchIdx     = -1;

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
function init() {
    // Detect home city via Intl API — most reliable method
    const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

    // Exact match first, then prefix match (e.g. "Asia/Calcutta" → "Asia/Kolkata" won't match but exact will)
    let detected = CITIES.find(c => c.tz === localTz);

    // Fallback: same continent/region prefix
    if (!detected) {
        const region = localTz.split('/')[0];
        detected = CITIES.find(c => c.tz.startsWith(region + '/'));
    }

    // Final fallback: UTC offset match
    if (!detected) {
        const localOffsetMin = getTzOffsetMinutes(localTz);
        detected = CITIES.find(c => getTzOffsetMinutes(c.tz) === localOffsetMin);
    }

    if (!detected) detected = CITIES.find(c => c.name === "London"); // absolute last resort

    homeCity = detected;

    // Default pins
    pinned = [homeCity];
    ["London","Tokyo","Dubai","New York"]
        .filter(n => n !== homeCity.name)
        .forEach(n => {
            const c = CITIES.find(x => x.name === n);
            if (c && !pinned.includes(c)) pinned.push(c);
        });

    // Quick pills
    document.getElementById('quickPills').innerHTML = POPULAR.map(n => {
        const c = CITIES.find(x => x.name === n);
        return c ? `<span class="pill" onclick="selectCity('${n}')">${c.flag} ${n}</span>` : '';
    }).join('');

    startLoop();
    drawMap();
}

/* ═══════════════════════════════════════════════════════
   MAIN LOOP — ticks every second
═══════════════════════════════════════════════════════ */
function startLoop() {
    function tick() {
        renderClocks();
        renderCompare();
        if (selectedCity) renderDetail(selectedCity);
        setTimeout(tick, 1000);
    }
    tick();
    setInterval(drawMap, 60000);
}

/* ═══════════════════════════════════════════════════════
   RENDER PINNED CLOCKS
═══════════════════════════════════════════════════════ */
function renderClocks() {
    const grid = document.getElementById('clocksGrid');
    grid.innerHTML = pinned.map((city, i) => {
        const t      = getZonedDate(city.tz);
        const dn     = getDayNight(t.getHours());
        const isHome = city === homeCity;
        const offset = formatOffset(getTzOffsetMinutes(city.tz));

        return `<div class="clock-card ${isHome ? 'home' : ''}" onclick="selectCity('${city.name}')">
            <div class="cc-top">
                <div>
                    <div class="cc-city">${city.flag} ${city.name}</div>
                    <div class="cc-country">${city.country}</div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                    ${isHome ? '<span class="home-badge">Home</span>' : ''}
                    <button class="cc-remove"
                        onclick="event.stopPropagation();removePin(${i})"
                        title="Remove" ${isHome ? 'disabled style="opacity:0.2;cursor:default"' : ''}>✕</button>
                </div>
            </div>
            <div class="cc-time">${formatTime(t)}</div>
            <div class="cc-date">${shortDate(t)}</div>
            <div class="cc-bar"></div>
            <div class="cc-meta">
                <span class="cc-tz">${offset}</span>
                <span class="cc-daynight" title="${dn.label}">${dn.icon}</span>
            </div>
        </div>`;
    }).join('') +
    `<div class="clock-card" style="border-style:dashed;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#334155;min-height:140px;"
        onclick="document.getElementById('citySearch').focus()">
        <span style="font-size:1.5rem">+</span>
        <span style="font-size:0.75rem;font-family:'Outfit';font-weight:700;text-transform:uppercase;letter-spacing:1px">Add City</span>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   SELECT CITY → show detail
═══════════════════════════════════════════════════════ */
function selectCity(name) {
    const city = CITIES.find(c => c.name === name);
    if (!city) return;
    selectedCity = city;
    const card = document.getElementById('detailCard');
    card.classList.add('visible');
    renderDetail(city);
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    drawMap();
    // Update pin button state
    updatePinButton();
}

function updatePinButton() {
    const btn = document.getElementById('pinBtn');
    if (!btn || !selectedCity) return;
    const alreadyPinned = pinned.some(c => c.name === selectedCity.name);
    btn.textContent  = alreadyPinned ? '✓ Already Pinned' : '📌 Pin This City';
    btn.disabled     = alreadyPinned;
    btn.style.opacity = alreadyPinned ? '0.5' : '1';
}

/* ═══════════════════════════════════════════════════════
   DETAIL PANEL
═══════════════════════════════════════════════════════ */
function renderDetail(city) {
    const t          = getZonedDate(city.tz);
    const dn         = getDayNight(t.getHours());
    const cityOffset = getTzOffsetMinutes(city.tz);
    const homeOffset = getTzOffsetMinutes(homeCity.tz);
    const diffMin    = cityOffset - homeOffset;

    document.getElementById('dcName').textContent = `${city.flag} ${city.name}, ${city.country}`;
    document.getElementById('dcTime').textContent = formatTime(t);
    document.getElementById('dcDate').textContent = formatDate(t);

    document.getElementById('dcGrid').innerHTML = `
        <div class="dg-cell">
            <div class="dg-num">${dn.icon}</div>
            <div class="dg-label">Period</div>
            <div class="dg-sub">${dn.label}</div>
        </div>
        <div class="dg-cell">
            <div class="dg-num" style="font-size:1rem">${formatOffset(cityOffset)}</div>
            <div class="dg-label">UTC Offset</div>
            <div class="dg-sub">${city.tz.split('/').pop().replace(/_/g,' ')}</div>
        </div>
        <div class="dg-cell">
            <div class="dg-num" style="font-size:0.95rem">${formatDiffLabel(diffMin)}</div>
            <div class="dg-label">vs Your Time</div>
            <div class="dg-sub">${homeCity.name}</div>
        </div>`;

    drawAnalog(t);
}

/* ═══════════════════════════════════════════════════════
   ANALOG CLOCK
═══════════════════════════════════════════════════════ */
function drawAnalog(d) {
    const c = document.getElementById('analogClock');
    if (!c) return;
    const ctx = c.getContext('2d');
    const R = 38, cx = 45, cy = 45;
    ctx.clearRect(0, 0, 90, 90);

    // Face
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1.5; ctx.stroke();

    // Hour tick marks
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx + (R - 5) * Math.cos(a), cy + (R - 5) * Math.sin(a));
        ctx.lineTo(cx + (R - 2) * Math.cos(a), cy + (R - 2) * Math.sin(a));
        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();
    }

    const sec = d.getSeconds();
    const min = d.getMinutes();
    const hr  = d.getHours() % 12;

    // Angles — smooth-sweep
    const sA = (sec / 60) * Math.PI * 2 - Math.PI / 2;
    const mA = ((min + sec / 60) / 60) * Math.PI * 2 - Math.PI / 2;
    const hA = ((hr  + min / 60) / 12) * Math.PI * 2 - Math.PI / 2;

    // Hour hand
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * 0.5 * Math.cos(hA), cy + R * 0.5 * Math.sin(hA));
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();

    // Minute hand
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * 0.75 * Math.cos(mA), cy + R * 0.75 * Math.sin(mA));
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

    // Second hand
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * 0.85 * Math.cos(sA), cy + R * 0.85 * Math.sin(sA));
    ctx.strokeStyle = 'rgba(139,148,152,1)'; ctx.lineWidth = 1; ctx.stroke();

    // Centre dot
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'var(--primary, #888)'; ctx.fill();
}

/* ═══════════════════════════════════════════════════════
   COMPARE TABLE
═══════════════════════════════════════════════════════ */
function renderCompare() {
    const homeOffset = getTzOffsetMinutes(homeCity.tz);

    const rows = pinned.map(city => {
        const t          = getZonedDate(city.tz);
        const dn         = getDayNight(t.getHours());
        const cityOffset = getTzOffsetMinutes(city.tz);
        const diffMin    = cityOffset - homeOffset;
        const diffStr    = diffMin === 0 ? 'You'
            : formatDiffLabel(diffMin).replace(' ahead','').replace(' behind', diffMin < 0 ? '▾' : '▴');

        return `<div class="compare-row">
            <span class="cr-flag">${city.flag}</span>
            <span class="cr-city">${city.name}</span>
            <span class="cr-day">${shortDate(t)}</span>
            <span class="cr-daynight">${dn.icon}</span>
            <span class="cr-time">${formatTime(t)}</span>
            <span class="cr-diff">${diffStr}</span>
        </div>`;
    }).join('');

    document.getElementById('compareRows').innerHTML = rows;
}

/* ═══════════════════════════════════════════════════════
   WORLD MAP (Canvas — day/night overlay + city pins)
═══════════════════════════════════════════════════════ */
function drawMap() {
    const canvas = document.getElementById('worldMap');
    const W = canvas.parentElement.offsetWidth || 860;
    const H = 220;
    canvas.width  = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    const now  = new Date();
    const utcH = now.getUTCHours() + now.getUTCMinutes() / 60;

    // Sky background — gradient per longitude
    for (let x = 0; x < W; x += 2) {
        const lon    = (x / W) * 360 - 180;
        const localH = ((utcH + lon / 15) % 24 + 24) % 24;
        ctx.fillStyle = skyColour(localH);
        ctx.fillRect(x, 0, 2, H);
    }

    // Faint grid
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 0.5;
    for (let lat = -60; lat <= 60; lat += 30) {
        const py = latToY(lat, H);
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
    }
    for (let lon = -180; lon <= 180; lon += 30) {
        const px = lonToX(lon, W);
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
    }

    // Equator
    ctx.beginPath(); ctx.moveTo(0, latToY(0, H)); ctx.lineTo(W, latToY(0, H));
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.stroke();

    // UTC label
    ctx.font = '11px Inter, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillText('UTC ' + now.toUTCString().slice(17, 25), 10, H - 10);

    // City pins
    const allPins = selectedCity
        ? [...new Map([...pinned, selectedCity].map(c => [c.name, c])).values()]
        : pinned;

    allPins.forEach(city => {
        const px = lonToX(city.lon, W);
        const py = latToY(city.lat, H);
        const isSelected = city === selectedCity;
        const isHome     = city === homeCity;
        const t          = getZonedDate(city.tz);

        if (isSelected) {
            ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
        }

        ctx.shadowColor = isHome ? '#ff5f5f' : '#fff';
        ctx.shadowBlur  = 8;
        ctx.beginPath(); ctx.arc(px, py, isHome || isSelected ? 6 : 4, 0, Math.PI * 2);
        ctx.fillStyle = isHome ? '#ff5f5f' : isSelected ? '#fff' : 'rgba(255,255,255,0.8)';
        ctx.fill();
        ctx.shadowBlur = 0;

        // Label: city + HH:MM only
        const label = `${city.name} ${pad(t.getHours())}:${pad(t.getMinutes())}`;
        ctx.font = `bold ${isSelected ? 11 : 9}px Outfit, sans-serif`;
        ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3;
        ctx.strokeText(label, px + 8, py + 4);
        ctx.fillStyle = '#fff';
        ctx.fillText(label, px + 8, py + 4);
    });
}

function skyColour(h) {
    if (h >= 6  && h < 8)  return '#1a2a4a';
    if (h >= 8  && h < 18) return '#0d2240';
    if (h >= 18 && h < 20) return '#1a1a3a';
    return '#050b14';
}

function lonToX(lon, W) { return Math.round(((lon + 180) / 360) * W); }
function latToY(lat, H) { return Math.round(((90 - lat) / 170) * H); }

/* ═══════════════════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════════════════ */
function onSearch(val) {
    const q  = val.trim().toLowerCase();
    const dd = document.getElementById('searchDropdown');
    if (!q) { dd.classList.remove('open'); return; }

    searchResults = CITIES.filter(c =>
        c.name.toLowerCase().includes(q) ||
        c.country.toLowerCase().includes(q) ||
        c.tz.toLowerCase().includes(q)
    ).slice(0, 10);

    if (!searchResults.length) { dd.classList.remove('open'); return; }

    searchIdx  = -1;
    dd.innerHTML = searchResults.map((c, i) =>
        `<div class="sd-item" data-i="${i}"
            onmousedown="pickSearch(${i})"
            onmouseover="searchIdx=${i};highlightSearch()">
            <span>${c.flag} ${c.name}, <span style="color:#64748b">${c.country}</span></span>
            <span class="sd-tz">${formatOffset(getTzOffsetMinutes(c.tz))}</span>
        </div>`
    ).join('');
    dd.classList.add('open');
}

function onSearchKey(e) {
    const dd = document.getElementById('searchDropdown');
    if (e.key === 'ArrowDown')  { searchIdx = Math.min(searchIdx + 1, searchResults.length - 1); highlightSearch(); e.preventDefault(); }
    else if (e.key === 'ArrowUp')   { searchIdx = Math.max(searchIdx - 1, 0); highlightSearch(); e.preventDefault(); }
    else if (e.key === 'Enter')     { if (searchIdx >= 0) pickSearch(searchIdx); else if (searchResults[0]) pickSearch(0); }
    else if (e.key === 'Escape')    { dd.classList.remove('open'); }
}

function highlightSearch() {
    document.querySelectorAll('.sd-item').forEach((el, i) =>
        el.classList.toggle('active', i === searchIdx));
}

function pickSearch(i) {
    const city = searchResults[i];
    document.getElementById('citySearch').value = '';
    document.getElementById('searchDropdown').classList.remove('open');
    selectCity(city.name);
}

document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap'))
        document.getElementById('searchDropdown').classList.remove('open');
});

/* ═══════════════════════════════════════════════════════
   PIN / UNPIN
═══════════════════════════════════════════════════════ */
function pinCurrent() {
    if (!selectedCity) return;
    if (pinned.some(c => c.name === selectedCity.name)) return;
    pinned.push(selectedCity);
    updatePinButton();
    renderCompare();
    drawMap();
}

function removePin(i) {
    if (pinned[i] === homeCity) return;
    pinned.splice(i, 1);
    renderCompare();
    drawMap();
}

/* ═══════════════════════════════════════════════════════
   COPY
═══════════════════════════════════════════════════════ */
function copyDetailTime() {
    if (!selectedCity) return;
    const t      = getZonedDate(selectedCity.tz);
    const offset = formatOffset(getTzOffsetMinutes(selectedCity.tz));
    const text   = `Current time in ${selectedCity.name}: ${formatTime(t)} (${offset}) — ${formatDate(t)}`;

    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        const prev = btn.textContent;
        btn.textContent = '✓ Copied!';
        setTimeout(() => { btn.textContent = prev; }, 1800);
    });
}

/* ═══════════════════════════════════════════════════════
   START
═══════════════════════════════════════════════════════ */
init();
</script>
