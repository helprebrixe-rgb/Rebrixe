    <script>
    /*
     * ─── CONFIGURATION ───────────────────────────────────────────────────────────
     *
     * month: 1-based (1 = January)
     * day:   1-based day of month
     * labelStyle:
     *   'cross'  → FY25/26  (start-year / 2-digit end-year)  — US, UK
     *   'endyr'  → FY2026   (4-digit end year)               — Australia
     *   'hyphen' → FY 2025-26                                 — India
     */
    const CONFIGS = {
        US:     { month: 10, day: 1, label: 'US Federal',       labelStyle: 'cross'  },
        UK:     { month: 4,  day: 6, label: 'UK / HMRC',        labelStyle: 'cross'  },
        AU:     { month: 7,  day: 1, label: 'Australian',       labelStyle: 'endyr'  },
        IN:     { month: 4,  day: 1, label: 'Indian',           labelStyle: 'hyphen' },
        CUSTOM: { month: 1,  day: 1, label: 'Custom',           labelStyle: 'cross'  }
    };

    let activeCountry = 'US';

    /* ─── POPULATE CUSTOM DAY PICKER (days 1–28, safe for every month) ─────── */
    (function populateDayPicker() {
        const sel = document.getElementById('customDay');
        const suffix = ['','st','nd','rd'];
        for (let d = 1; d <= 28; d++) {
            const opt = document.createElement('option');
            opt.value = d;
            const s = d <= 3 ? suffix[d] : 'th';
            opt.textContent = d + s;
            sel.appendChild(opt);
        }
    })();

    /* ─── COUNTRY SELECTION ─────────────────────────────────────────────────── */
    function selectCountry(el) {
        document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        activeCountry = el.dataset.country;
        document.getElementById('customRow').classList.toggle('visible', activeCountry === 'CUSTOM');
        calculate();
    }

    function getConfig() {
        if (activeCountry === 'CUSTOM') {
            return {
                month:      parseInt(document.getElementById('customMonth').value, 10),
                day:        parseInt(document.getElementById('customDay').value, 10),
                label:      'Custom',
                labelStyle: 'cross'
            };
        }
        return CONFIGS[activeCountry];
    }

    /* ─── CORE DATE HELPERS ─────────────────────────────────────────────────── */

    /*
     * Build a local Date at noon to avoid DST edge cases.
     * All date objects in this tool are constructed this way.
     */
    function localNoon(year, month1, day) {
        // month1 is 1-based
        return new Date(year, month1 - 1, day, 12, 0, 0, 0);
    }

    /*
     * Return the Date object for midnight local using ISO string parsing trick
     * but normalised to noon so DST shifts never flip the day.
     */
    function parseInputDate(isoStr) {
        const [y, m, d] = isoStr.split('-').map(Number);
        return localNoon(y, m, d);
    }

    /*
     * Given a reference date and config, find the FY start date on or before ref.
     *
     * Rule: FY starts on cfg.month/cfg.day.
     * We first try same calendar year as ref. If that candidate is strictly
     * after ref, we step back one year.
     */
    function getFYStart(ref, cfg) {
        let candidate = localNoon(ref.getFullYear(), cfg.month, cfg.day);
        if (candidate > ref) {
            candidate = localNoon(ref.getFullYear() - 1, cfg.month, cfg.day);
        }
        return candidate;
    }

    /*
     * FY end = one calendar year after start, minus one day.
     *
     * Using month arithmetic: add 12 months then subtract 1 day.
     * This correctly handles leap years — e.g. FY starting Mar 1 2024
     * (leap year): start = 1 Mar 2024, end = 28 Feb 2025 (non-leap end year).
     */
    function getFYEnd(fyStart) {
        // Add exactly 12 months
        const endPlusOne = localNoon(
            fyStart.getFullYear() + 1,
            fyStart.getMonth() + 1,   // getMonth() is 0-based, +1 = same month 1-based
            fyStart.getDate()
        );
        // Subtract 1 day
        return new Date(endPlusOne.getTime() - 864e5);
    }

    /*
     * Count whole days between two Date objects (ignores time component).
     * Uses integer day numbers to avoid any floating-point drift.
     */
    function daysBetween(a, b) {
        // Normalise both to midnight UTC using day-only arithmetic
        const msA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
        const msB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
        return Math.round((msB - msA) / 864e5);
    }

    /* ─── QUARTER LOGIC ─────────────────────────────────────────────────────────
     *
     * Quarters are defined by calendar months, not day counts.
     *   Q1: months 1–3  of the FY
     *   Q2: months 4–6
     *   Q3: months 7–9
     *   Q4: months 10–12
     *
     * Each quarter starts on the same day-of-month as the FY start.
     * The last quarter ends on the day before the next FY starts.
     *
     * This matches how every major accounting system (SAP, Oracle, QuickBooks)
     * defines quarters — by month offset, never by day count.
     */
    function getQuarters(fyStart) {
        const quarters = [];
        for (let q = 0; q < 4; q++) {
            const startMonth1 = fyStart.getMonth() + 1 + q * 3; // 1-based, may exceed 12
            const qStart = localNoon(
                fyStart.getFullYear() + Math.floor((startMonth1 - 1) / 12),
                ((startMonth1 - 1) % 12) + 1,
                fyStart.getDate()
            );
            // End = start of next quarter minus 1 day
            const nextStartMonth1 = startMonth1 + 3;
            const nextQStart = localNoon(
                fyStart.getFullYear() + Math.floor((nextStartMonth1 - 1) / 12),
                ((nextStartMonth1 - 1) % 12) + 1,
                fyStart.getDate()
            );
            const qEnd = new Date(nextQStart.getTime() - 864e5);
            quarters.push({ num: q + 1, start: qStart, end: qEnd });
        }
        return quarters;
    }

    /*
     * Which quarter does `ref` fall in?
     * We compare date-only (year/month/day) to avoid time-of-day noise.
     */
    function getCurrentQuarter(ref, quarters) {
        const refDay = Date.UTC(ref.getFullYear(), ref.getMonth(), ref.getDate());
        for (let i = 0; i < quarters.length; i++) {
            const qS = Date.UTC(quarters[i].start.getFullYear(), quarters[i].start.getMonth(), quarters[i].start.getDate());
            const qE = Date.UTC(quarters[i].end.getFullYear(), quarters[i].end.getMonth(), quarters[i].end.getDate());
            if (refDay >= qS && refDay <= qE) return quarters[i].num;
        }
        return 1; // fallback, should never be reached
    }

    /* ─── LABEL HELPERS ─────────────────────────────────────────────────────── */

    function fyLabel(fyStart, fyEnd, style) {
        const sy = fyStart.getFullYear();
        const ey = fyEnd.getFullYear();
        if (sy === ey) return 'FY' + sy; // same-calendar-year FY
        switch (style) {
            case 'endyr':  return 'FY' + ey;
            case 'hyphen': return 'FY ' + sy + '-' + String(ey).slice(2);
            default:       return 'FY' + String(sy).slice(2) + '/' + String(ey).slice(2);
        }
    }

    function fmtDate(d, includeYear) {
        const opts = includeYear
            ? { day: 'numeric', month: 'short', year: 'numeric' }
            : { day: 'numeric', month: 'short' };
        return d.toLocaleDateString('en-GB', opts);
    }

    function fmtDateFull(d) {
        return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function toISO(d) {
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return d.getFullYear() + '-' + mm + '-' + dd;
    }

    /* ─── WEEK IN FY ────────────────────────────────────────────────────────── */
    function weekInFY(ref, fyStart) {
        const days = daysBetween(fyStart, ref); // 0-based: day 0 = FY start
        return Math.floor(days / 7) + 1;
    }

    /* ─── MAIN CALCULATE ────────────────────────────────────────────────────── */
    function calculate() {
        const val = document.getElementById('refDate').value;
        if (!val) return;

        const ref     = parseInputDate(val);
        const cfg     = getConfig();
        const fyStart = getFYStart(ref, cfg);
        const fyEnd   = getFYEnd(fyStart);

        // Day counts — all via daysBetween to avoid float drift
        const totalDays   = daysBetween(fyStart, fyEnd) + 1; // inclusive
        const elapsed     = daysBetween(fyStart, ref) + 1;   // day 1 = FY start
        const remaining   = daysBetween(ref, fyEnd);          // days left after today

        // Progress — use integer arithmetic: multiply first, then divide
        const pct = Math.floor((elapsed * 100) / totalDays);

        const week     = weekInFY(ref, fyStart);
        const quarters = getQuarters(fyStart);
        const currentQ = getCurrentQuarter(ref, quarters);
        const label    = fyLabel(fyStart, fyEnd, cfg.labelStyle);

        // Q-ends-in: days from ref to end of current quarter (0 = last day of quarter)
        const currentQEnd  = quarters[currentQ - 1].end;
        const qEndsIn      = daysBetween(ref, currentQEnd);

        // Total FY weeks (ceiling)
        const totalWeeks = Math.ceil(totalDays / 7);

        // Prev / next FY — jump to same month+day one year back/forward from fyStart
        const prevFYStart = localNoon(fyStart.getFullYear() - 1, fyStart.getMonth() + 1, fyStart.getDate());
        const nextFYStart = localNoon(fyStart.getFullYear() + 1, fyStart.getMonth() + 1, fyStart.getDate());
        const prevFYEnd   = getFYEnd(prevFYStart);
        const nextFYEnd   = getFYEnd(nextFYStart);
        const prevLabel   = fyLabel(prevFYStart, prevFYEnd, cfg.labelStyle);
        const nextLabel   = fyLabel(nextFYStart, nextFYEnd, cfg.labelStyle);

        const panel = document.getElementById('resultPanel');
        panel.innerHTML = `
            <div class="fy-hero">
                <div class="fy-hero-left">
                    <div class="fy-badge">${cfg.label} Fiscal Year</div>
                    <div class="fy-name">${label}</div>
                    <div class="fy-range">${fmtDate(fyStart, true)} <span>→</span> ${fmtDate(fyEnd, true)}</div>
                </div>
                <div class="fy-hero-right">
                    <div class="fy-progress-label">FY Progress</div>
                    <div class="fy-progress-num">${pct}%</div>
                    <div class="fy-progress-pct">Day ${elapsed} of ${totalDays}</div>
                </div>
            </div>

            <div class="progress-bar-wrap">
                <div class="progress-bar-label">
                    <span>${fmtDate(fyStart, false)}</span>
                    <span>${pct}% elapsed · ${remaining.toLocaleString()} days remaining</span>
                    <span>${fmtDate(fyEnd, false)}</span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" style="width:${pct}%"></div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-cell">
                    <div class="sc-num">Q${currentQ}</div>
                    <div class="sc-label">Current Quarter</div>
                </div>
                <div class="stat-cell">
                    <div class="sc-num">${week}</div>
                    <div class="sc-label">Week in FY</div>
                </div>
                <div class="stat-cell">
                    <div class="sc-num">${remaining.toLocaleString()}</div>
                    <div class="sc-label">Days Left</div>
                </div>
                <div class="stat-cell">
                    <div class="sc-num">${elapsed.toLocaleString()}</div>
                    <div class="sc-label">Days Elapsed</div>
                </div>
            </div>

            <div class="quarter-strip">
                ${quarters.map(q => `
                    <div class="q-cell${q.num === currentQ ? ' current-q' : ''}">
                        <div class="q-name">Q${q.num}</div>
                        <div class="q-dates">${fmtDate(q.start, false)} – ${fmtDate(q.end, false)}</div>
                        ${q.num === currentQ ? '<span class="q-badge">You are here</span>' : ''}
                    </div>
                `).join('')}
            </div>

            <div class="extras-grid">
                <div class="extra-item">
                    <span class="ei-label">📅 FY Start Day</span>
                    <span class="ei-val">${fmtDateFull(fyStart)}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">🏁 FY End Day</span>
                    <span class="ei-val">${fmtDateFull(fyEnd)}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📊 Q${currentQ} Ends In</span>
                    <span class="ei-val">${qEndsIn} day${qEndsIn === 1 ? '' : 's'}</span>
                </div>
                <div class="extra-item">
                    <span class="ei-label">📆 Total FY Weeks</span>
                    <span class="ei-val">${totalWeeks}</span>
                </div>
            </div>

            <div class="fy-nav">
                <button class="fy-nav-btn" onclick="jumpFY(-1)">← Previous FY &nbsp;${prevLabel}</button>
                <button class="fy-nav-btn" onclick="jumpFY(1)">Next FY &nbsp;${nextLabel} →</button>
            </div>

            <div class="action-row">
                <button class="btn-action primary" onclick="copyResult()">Copy Summary</button>
                <button class="btn-action" onclick="setToday()">📅 Jump to Today</button>
            </div>
        `;
        panel.classList.add('visible');
    }

    /* ─── FY NAVIGATION ─────────────────────────────────────────────────────── */
    /*
     * Jump to the start of the previous or next FY.
     * We move from fyStart ±1 year, keeping the same month+day.
     */
    function jumpFY(dir) {
        const val = document.getElementById('refDate').value;
        if (!val) return;
        const ref     = parseInputDate(val);
        const cfg     = getConfig();
        const fyStart = getFYStart(ref, cfg);
        const target  = localNoon(
            fyStart.getFullYear() + dir,
            fyStart.getMonth() + 1,
            fyStart.getDate()
        );
        document.getElementById('refDate').value = toISO(target);
        calculate();
    }

    /* ─── COPY SUMMARY ──────────────────────────────────────────────────────── */
    function copyResult() {
        const val = document.getElementById('refDate').value;
        if (!val) return;

        const ref      = parseInputDate(val);
        const cfg      = getConfig();
        const fyStart  = getFYStart(ref, cfg);
        const fyEnd    = getFYEnd(fyStart);
        const totalDays = daysBetween(fyStart, fyEnd) + 1;
        const elapsed   = daysBetween(fyStart, ref) + 1;
        const remaining = daysBetween(ref, fyEnd);
        const pct       = Math.floor((elapsed * 100) / totalDays);
        const week      = weekInFY(ref, fyStart);
        const quarters  = getQuarters(fyStart);
        const currentQ  = getCurrentQuarter(ref, quarters);
        const label     = fyLabel(fyStart, fyEnd, cfg.labelStyle);

        const text = [
            'Fiscal Year Summary (' + cfg.label + ')',
            'Date checked: ' + val,
            label + ': ' + fmtDate(fyStart, true) + ' → ' + fmtDate(fyEnd, true),
            'Current Quarter: Q' + currentQ + '  |  Week in FY: ' + week,
            'Days elapsed: ' + elapsed + ' (' + pct + '%)  |  Days remaining: ' + remaining
        ].join('\n');

        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.btn-action.primary');
            if (btn) {
                btn.textContent = '✓ Copied!';
                setTimeout(() => { btn.textContent = 'Copy Summary'; }, 2000);
            }
        }).catch(() => {
            // Fallback for environments without clipboard API
            const btn = document.querySelector('.btn-action.primary');
            if (btn) {
                btn.textContent = 'Copy unavailable';
                setTimeout(() => { btn.textContent = 'Copy Summary'; }, 2000);
            }
        });
    }

    /* ─── TODAY HELPERS ─────────────────────────────────────────────────────── */
    function setToday() {
        document.getElementById('refDate').value = toISO(new Date());
        calculate();
    }

    /* ─── INIT ──────────────────────────────────────────────────────────────── */
    setToday();
    </script>
    <script src="../nav.js"></script>
</body>
</html>
