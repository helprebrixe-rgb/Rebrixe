    <header>
        <h1>Break Time Calculator</h1>
        <p>Net hours worked after all breaks — with overtime detection &amp; pay estimate.</p>
    </header>

    <div class="tool-card">

        <!-- SHIFT TIMES -->
        <div class="shift-row">
            <div>
                <label class="field-label" for="shiftStart">Shift Start</label>
                <input type="time" id="shiftStart" value="09:00">
                <div class="field-error" id="err-start"></div>
            </div>
            <div>
                <label class="field-label" for="shiftEnd">Shift End</label>
                <input type="time" id="shiftEnd" value="17:00">
                <div class="field-error" id="err-end"></div>
            </div>
        </div>

        <!-- BREAKS -->
        <div class="section-label">Breaks</div>
        <div class="breaks-list" id="breaksList"></div>
        <button class="btn-add-break" id="btnAddBreak">+ Add another break</button>

        <!-- OPTIONS -->
        <div class="section-label">Options</div>
        <div class="options-row">
            <div>
                <label class="field-label" for="otThreshold">Daily hours target (for overtime)</label>
                <input type="number" id="otThreshold" value="8" min="0.5" max="24" step="0.5" placeholder="e.g. 8">
                <div class="field-error" id="err-ot"></div>
            </div>
            <div>
                <label class="field-label" for="hourlyRate">Hourly rate (optional)</label>
                <input type="number" id="hourlyRate" value="" min="0.01" step="0.01" placeholder="e.g. 15.50">
                <div class="field-error" id="err-rate"></div>
            </div>
        </div>

        <!-- QUICK PRESETS -->
        <div class="quick-label">Quick presets</div>
        <div class="quick-pills">
            <span class="pill" data-preset="9to5">9–5 + Lunch</span>
            <span class="pill" data-preset="nightshift">Night shift 10 pm–6 am</span>
            <span class="pill" data-preset="halfday">Half day 9–1</span>
            <span class="pill" data-preset="retail">Retail 8h + 2 breaks</span>
            <span class="pill" data-preset="reset">✕ Reset</span>
        </div>

        <hr>

        <!-- RESULT -->
        <div id="resultPanel" class="result-panel"></div>

    </div>

<script>
(function () {
    'use strict';

    // ─── State ──────────────────────────────────────────────────────────────
    let breakIdCounter = 0;

    // ─── DOM refs ───────────────────────────────────────────────────────────
    const elStart     = document.getElementById('shiftStart');
    const elEnd       = document.getElementById('shiftEnd');
    const elOT        = document.getElementById('otThreshold');
    const elRate      = document.getElementById('hourlyRate');
    const elBreakList = document.getElementById('breaksList');
    const elPanel     = document.getElementById('resultPanel');

    // ─── Helpers ────────────────────────────────────────────────────────────

    /** Convert "HH:MM" to integer minutes since midnight. Returns null if invalid. */
    function parseTime(str) {
        if (!str || !/^\d{2}:\d{2}$/.test(str)) return null;
        const [h, m] = str.split(':').map(Number);
        if (h > 23 || m > 59) return null;
        return h * 60 + m;
    }

    /** Format integer minutes as "Xh YYm". */
    function fmtHM(totalMins) {
        const abs = Math.abs(totalMins);
        const h   = Math.floor(abs / 60);
        const m   = abs % 60;
        return `${h}h ${String(m).padStart(2, '0')}m`;
    }

    /** Format integer minutes as decimal hours, 2 dp. */
    function fmtDec(totalMins) {
        return (totalMins / 60).toFixed(2);
    }

    /** Show or clear a field-error element. */
    function setErr(id, msg) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = msg || '';
        el.classList.toggle('visible', !!msg);
    }

    /** Mark input border red/normal. */
    function markInput(el, hasError) {
        el.classList.toggle('input-error', hasError);
    }

    // ─── Validation ─────────────────────────────────────────────────────────

    /**
     * Validate all inputs.
     * Returns { valid: bool, errors: string[], data: {...} }
     */
    function validate() {
        let valid = true;
        const errors = [];

        // Clear previous errors
        setErr('err-start', ''); markInput(elStart, false);
        setErr('err-end',   ''); markInput(elEnd,   false);
        setErr('err-ot',    ''); markInput(elOT,    false);
        setErr('err-rate',  ''); markInput(elRate,  false);

        // --- Shift start
        const startMins = parseTime(elStart.value);
        if (startMins === null) {
            setErr('err-start', 'Enter a valid start time.');
            markInput(elStart, true);
            valid = false;
        }

        // --- Shift end
        const endMins = parseTime(elEnd.value);
        if (endMins === null) {
            setErr('err-end', 'Enter a valid end time.');
            markInput(elEnd, true);
            valid = false;
        }

        // --- OT threshold
        const otRaw = parseFloat(elOT.value);
        let otThreshMins = null;
        if (isNaN(otRaw) || otRaw <= 0 || otRaw > 24) {
            setErr('err-ot', 'Enter a value between 0.5 and 24.');
            markInput(elOT, true);
            valid = false;
        } else {
            otThreshMins = Math.round(otRaw * 60); // integer minutes
        }

        // --- Hourly rate (optional — only validate if something was entered)
        let rate = null;
        const rateStr = elRate.value.trim();
        if (rateStr !== '') {
            const rateRaw = parseFloat(rateStr);
            if (isNaN(rateRaw) || rateRaw <= 0) {
                setErr('err-rate', 'Rate must be a number greater than 0.');
                markInput(elRate, true);
                valid = false;
            } else {
                rate = rateRaw;
            }
        }

        // --- Breaks
        let totalBreakMins = 0;
        const breakSummary = [];
        let breakError = false;

        document.querySelectorAll('.break-row').forEach(row => {
            const errEl   = row.querySelector('.break-field-error');
            const nameEl  = row.querySelector('.break-name');
            const minsEl  = row.querySelector('.break-mins');
            const minsRaw = parseInt(minsEl.value, 10);

            // Clear per-row error
            if (errEl) { errEl.textContent = ''; errEl.classList.remove('visible'); }
            minsEl.classList.remove('input-error');

            if (isNaN(minsRaw) || minsRaw <= 0) {
                if (errEl) { errEl.textContent = 'Duration must be at least 1 minute.'; errEl.classList.add('visible'); }
                minsEl.classList.add('input-error');
                valid = false;
                breakError = true;
                return;
            }
            if (minsRaw > 480) {
                if (errEl) { errEl.textContent = 'Break cannot exceed 480 minutes (8 hours).'; errEl.classList.add('visible'); }
                minsEl.classList.add('input-error');
                valid = false;
                breakError = true;
                return;
            }

            const name = (nameEl.value.trim() || 'Break');
            totalBreakMins += minsRaw;
            breakSummary.push({ name, mins: minsRaw });
        });

        // Early exit if hard validation failed
        if (!valid) return { valid: false, errors };

        // --- Cross-field: shift duration
        let shiftMins = endMins - startMins;
        if (shiftMins < 0) shiftMins += 1440; // overnight
        if (shiftMins === 0) {
            setErr('err-end', 'Shift end time cannot equal start time.');
            markInput(elEnd, true);
            return { valid: false, errors: ['Shift start and end times are the same.'] };
        }

        // --- Cross-field: breaks must not meet or exceed shift length
        if (totalBreakMins >= shiftMins) {
            errors.push(
                `Total break time (${totalBreakMins} min) equals or exceeds shift length (${shiftMins} min). ` +
                `Reduce your breaks or extend your shift.`
            );
            return { valid: false, errors };
        }

        return {
            valid: true,
            errors: [],
            data: {
                startMins,
                endMins,
                shiftMins,
                totalBreakMins,
                breakSummary,
                netMins: shiftMins - totalBreakMins,
                otThreshMins,
                rate
            }
        };
    }

    // ─── Render result ───────────────────────────────────────────────────────

    function renderResult(d) {
        const { shiftMins, totalBreakMins, netMins, otThreshMins, rate, breakSummary } = d;
        const overtimeMins = netMins - otThreshMins;  // can be negative (under target)
        const isOT = overtimeMins > 0;

        const otBadge = isOT
            ? `<span class="ot-badge over">▲ +${fmtHM(overtimeMins)} OT</span>`
            : `<span class="ot-badge under">✓ Within target</span>`;

        const breakDetail = breakSummary.length
            ? breakSummary.map(b => `${b.name} (${b.mins} min)`).join(', ')
            : 'No breaks';

        // OT/under stat — show signed distance from target clearly
        const otStatVal  = isOT ? `+${fmtHM(overtimeMins)}` : `−${fmtHM(Math.abs(overtimeMins))}`;
        const otStatLbl  = isOT ? 'Overtime' : 'Under target';
        const otStatColor = isOT ? 'positive' : 'negative';

        // Pay row — only shown when rate is provided and valid
        const payHTML = (rate !== null)
            ? `<div class="pay-bar">
                <span class="pay-lbl">Estimated pay — ${fmtDec(netMins)} hrs × $${rate.toFixed(2)}/hr</span>
                <span class="pay-val">$${(netMins / 60 * rate).toFixed(2)}</span>
               </div>`
            : '';

        elPanel.innerHTML = `
            <div class="net-hero${isOT ? ' is-ot' : ''}">
                <div class="net-label">Net hours worked ${otBadge}</div>
                <div class="net-time">${fmtHM(netMins)}</div>
                <div class="net-sub">${fmtDec(netMins)} decimal hours &nbsp;·&nbsp; ${totalBreakMins} min in breaks</div>
            </div>

            <div class="stats-grid">
                <div class="stat-cell">
                    <div class="stat-val">${fmtHM(shiftMins)}</div>
                    <div class="stat-lbl">Gross shift</div>
                </div>
                <div class="stat-cell">
                    <div class="stat-val">${totalBreakMins} min</div>
                    <div class="stat-lbl">Total breaks</div>
                </div>
                <div class="stat-cell">
                    <div class="stat-val ${otStatColor}">${otStatVal}</div>
                    <div class="stat-lbl">${otStatLbl}</div>
                </div>
            </div>

            ${payHTML}

            <div class="breakdown">
                <span class="breakdown-title">Breakdown</span>
                <strong style="color:#94a3b8;">${elStart.value}</strong> → <strong style="color:#94a3b8;">${elEnd.value}</strong>
                &nbsp;|&nbsp; ${breakDetail}
            </div>

            <div class="action-row">
                <button class="btn-action primary" id="btnCopy">Copy summary</button>
                <button class="btn-action" id="btnReset">✕ Reset</button>
            </div>
        `;

        elPanel.classList.add('visible');

        // Bind result buttons
        document.getElementById('btnCopy').addEventListener('click', () => copyResult(d));
        document.getElementById('btnReset').addEventListener('click', () => applyPreset('reset'));
    }

    function renderErrors(errors) {
        elPanel.innerHTML = `<div class="error-banner">${errors.map(e => `• ${e}`).join('<br>')}</div>`;
        elPanel.classList.add('visible');
    }

    // ─── Main calculate ──────────────────────────────────────────────────────

    function calculate() {
        const result = validate();
        if (!result.valid) {
            if (result.errors && result.errors.length) {
                renderErrors(result.errors);
            } else {
                // Field-level errors already shown inline; clear any old panel content
                elPanel.classList.remove('visible');
                elPanel.innerHTML = '';
            }
            return;
        }
        renderResult(result.data);
    }

    // ─── Copy summary ────────────────────────────────────────────────────────
    // Reads from already-computed data — does NOT re-run math.

    function copyResult(d) {
        const { shiftMins, totalBreakMins, netMins, otThreshMins, rate, breakSummary } = d;
        const overtimeMins = netMins - otThreshMins;
        const otLine = overtimeMins > 0
            ? `+${fmtHM(overtimeMins)}`
            : `None (${fmtHM(Math.abs(overtimeMins))} under target)`;
        const payLine = (rate !== null)
            ? `\nEstimated pay:   $${(netMins / 60 * rate).toFixed(2)}`
            : '';
        const breakLines = breakSummary.map(b => `  ${b.name}: ${b.mins} min`).join('\n');

        const text =
`Break Time Report
=================
Shift:           ${elStart.value} → ${elEnd.value}
Gross time:      ${fmtHM(shiftMins)}
Total breaks:    ${totalBreakMins} min
${breakLines}

Net worked:      ${fmtHM(netMins)} (${fmtDec(netMins)} hrs)
Overtime:        ${otLine}${payLine}`;

        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('btnCopy');
            if (btn) {
                btn.textContent = '✓ Copied!';
                setTimeout(() => { btn.textContent = 'Copy summary'; }, 2000);
            }
        }).catch(() => {
            const btn = document.getElementById('btnCopy');
            if (btn) btn.textContent = 'Copy failed — try again';
        });
    }

    // ─── Add / remove break rows ─────────────────────────────────────────────

    function addBreak(defaultMins, defaultName) {
        const id = ++breakIdCounter;
        const div = document.createElement('div');
        div.className = 'break-row';
        div.id = `break-${id}`;
        div.innerHTML = `
            <div>
                <label class="field-label" for="bn-${id}">Break name</label>
                <input class="break-name" type="text" id="bn-${id}" placeholder="e.g. Lunch" value="${defaultName || ''}">
            </div>
            <div>
                <label class="field-label" for="bm-${id}">Duration (minutes)</label>
                <input class="break-mins" type="number" id="bm-${id}" min="1" max="480" value="${defaultMins || ''}">
            </div>
            <button class="btn-remove" type="button" aria-label="Remove this break" data-id="${id}">✕</button>
            <div class="break-field-error field-error"></div>
        `;
        elBreakList.appendChild(div);
        div.querySelector('.break-mins').addEventListener('input', calculate);
        div.querySelector('.break-name').addEventListener('input', calculate);
        div.querySelector('.btn-remove').addEventListener('click', () => {
            div.remove();
            calculate();
        });
    }

    // ─── Presets ─────────────────────────────────────────────────────────────

    function applyPreset(key) {
        // Clear all break rows
        elBreakList.innerHTML = '';
        breakIdCounter = 0;
        elRate.value = '';
        markInput(elRate, false); setErr('err-rate', '');

        if (key === '9to5') {
            elStart.value = '09:00'; elEnd.value = '17:00';
            elOT.value = '8';
            addBreak(60, 'Lunch');
        } else if (key === 'nightshift') {
            elStart.value = '22:00'; elEnd.value = '06:00';
            elOT.value = '8';
            addBreak(30, 'Break');
        } else if (key === 'halfday') {
            elStart.value = '09:00'; elEnd.value = '13:00';
            elOT.value = '4';
            addBreak(15, 'Coffee');
        } else if (key === 'retail') {
            elStart.value = '10:00'; elEnd.value = '18:00';
            elOT.value = '8';
            addBreak(30, 'Lunch');
            addBreak(15, 'Tea break');
        } else {
            // reset
            elStart.value = '09:00'; elEnd.value = '17:00';
            elOT.value = '8';
            addBreak(30, 'Lunch');
        }

        // Clear all field errors
        ['err-start','err-end','err-ot','err-rate'].forEach(id => setErr(id, ''));
        [elStart, elEnd, elOT, elRate].forEach(el => markInput(el, false));
        elPanel.classList.remove('visible');
        elPanel.innerHTML = '';
        calculate();
    }

    // ─── Event wiring ────────────────────────────────────────────────────────

    elStart.addEventListener('input',  calculate);
    elEnd.addEventListener('input',    calculate);
    elOT.addEventListener('input',     calculate);
    elRate.addEventListener('input',   calculate);

    document.getElementById('btnAddBreak').addEventListener('click', () => {
        addBreak('', '');
        calculate();
    });

    document.querySelectorAll('.pill').forEach(pill => {
        pill.addEventListener('click', () => applyPreset(pill.dataset.preset));
    });

    // ─── Init ─────────────────────────────────────────────────────────────────
    applyPreset('reset');

})();
</script>
<script src="../nav.js"></script>
</body>
</html>
